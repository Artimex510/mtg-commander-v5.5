                   <input type="number" inputMode="numeric" min="0" value={cmcVal} onChange={e => setCmcVal(e.target.value)} className="w-16 bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm font-bold text-center outline-none" />
                   <label className="ml-auto flex items-center gap-1 text-xs text-yellow-500 font-bold bg-yellow-900/30 px-2 py-2 rounded border border-yellow-700 cursor-pointer"><input type="checkbox" checked={isCommanderOnly} onChange={e=>setIsCommanderOnly(e.target.checked)} className="accent-yellow-500" /> ⭐ Solo Cmdr</label>
                 </div>

                 <div className="flex gap-2">
                   <button onClick={() => searchCard(null)} className="flex-1 bg-blue-600 hover:bg-blue-700 font-bold py-3 rounded text-white shadow-lg transition-colors">
                     {loading ? "Cerco..." : "Cerca Carte"}
                   </button>
                   <button onClick={loadMyProxies} className="flex-1 bg-purple-600 hover:bg-purple-700 font-bold py-3 rounded text-white shadow-lg transition-colors">✨ Mie Proxy</button>
                 </div>
                 
                 <div className="grid grid-cols-2 gap-2 mt-4">
                     <button onClick={() => setShowImport(!showImport)} className="bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 rounded-lg text-sm shadow transition-colors">
                         📥 Importa (Testo)
                     </button>
                     <button onClick={() => setShowAiCrafter(true)} className="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-black py-2 rounded-lg text-[11px] shadow-lg flex items-center justify-center gap-1 active:scale-95 transition-all">
                         ✨ AI DECK CRAFTER
                     </button>
                 </div>

                 {showAiCrafter && ReactDOM.createPortal(
                     <div className="fixed inset-0 bg-black/90 z-[9999] flex items-center justify-center p-4 animate-fade overflow-y-auto">
                         <div className="bg-gray-800 border-2 border-purple-500 rounded-xl p-6 w-full max-w-md shadow-2xl relative mt-10">
                             <button onClick={() => setShowAiCrafter(false)} className="absolute top-2 right-3 text-gray-400 hover:text-white text-xl font-black">✕</button>
                             <h3 className="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-indigo-400 mb-2 drop-shadow-md">✨ The Forge AI</h3>
                             <p className="text-gray-300 text-xs font-bold mb-6 border-b border-gray-700 pb-4">Il tuo Master Deckbuilder personale. L'IA analizzerà il meta, troverà combo e tech segrete per creare una lista da 100 carte perfetta.</p>
                             
                             <form className="space-y-4">
                                 <div>
                                     <label className="text-gray-400 text-xs font-bold block mb-1">Chi è il Comandante?*</label>
                                     <input type="text" placeholder="es. Edgar Markov" value={aiCmdr} onChange={e=>setAiCmdr(e.target.value)} className="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white font-bold outline-none focus:border-purple-500 shadow-inner" required />
                                 </div>
                                 <div>
                                     <label className="text-gray-400 text-xs font-bold block mb-1">Livello di Potenza (Bracket)</label>
                                     <select value={aiBracket} onChange={e=>setAiBracket(e.target.value)} className="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white text-sm font-bold outline-none focus:border-purple-500 shadow-inner">
                                         <option value="2">Bracket 2 (Casual, No Combo/Gamechanger)</option>
                                         <option value="3">Bracket 3 (High Power, Max 3 Gamechanger)</option>
                                         <option value="4">Bracket 4 (cEDH/Estremo, Nessun limite)</option>
                                     </select>
                                 </div>
                                 <div>
                                     <label className="text-gray-400 text-xs font-bold block mb-1">Stile di Gioco / Tema (Opzionale)</label>
                                     <input type="text" placeholder="es. Aggro, Tribale, Control..." value={aiStrategy} onChange={e=>setAiStrategy(e.target.value)} className="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white text-sm outline-none focus:border-purple-500 shadow-inner" />
                                 </div>
                                 <div>
                                     <label className="text-gray-400 text-xs font-bold block mb-1">Carte Obbligatorie (Opzionale)</label>
                                     <input type="text" placeholder="es. Smothering Tithe..." value={aiInclude} onChange={e=>setAiInclude(e.target.value)} className="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white text-sm outline-none focus:border-purple-500 shadow-inner" />
                                 </div>
                                 
                                 <div className="flex gap-2 pt-2">
                                     <button onClick={generateAiDeck} disabled={isAiDrafting || !aiCmdr.trim()} className="flex-1 bg-purple-600 hover:bg-purple-500 disabled:opacity-50 text-white font-black py-3 rounded-xl shadow-lg transition-all active:scale-95 text-xs sm:text-sm">
                                         {isAiDrafting ? "⏳ FORGIO..." : "✨ FORGIA MAZZO IN-APP"}
                                     </button>
                                     <button onClick={copyAiPrompt} disabled={!aiCmdr.trim()} className="flex-1 bg-gray-700 hover:bg-gray-600 disabled:opacity-50 text-white font-bold py-3 rounded-xl shadow transition-all active:scale-95 text-[10px] sm:text-xs">
                                         📋 COPIA PROMPT ESTERNO
                                     </button>
                                 </div>
                             </form>
                         </div>
                     </div>
                 , document.body)}

                 {showImport && (
                   <div className="mt-2 animate-fade">
                     <textarea value={importText} onChange={e => setImportText(e.target.value)} placeholder="1 Sol Ring&#10;1 Command Tower" className="w-full h-24 bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm mb-2 outline-none"></textarea>
                     <button onClick={handleImport} className="w-full bg-green-600 hover:bg-green-700 p-2 rounded text-white font-bold transition-colors">{loading ? 'Importo...' : 'Aggiungi Carte'}</button>
                   </div>
                 )}
              </div>

              {allResults.length > 0 && (
                <div className="bg-gray-800/90 p-4 rounded-xl border border-gray-600 backdrop-blur-sm animate-fade">
                  <div className="flex justify-between items-center mb-3 border-b border-gray-700 pb-2">
                     <h3 className="text-gray-300 text-sm font-bold">Risultati:</h3>
                     <div className="flex items-center gap-2 bg-gray-900 p-1 rounded-lg border border-gray-700">
                        <button onClick={goToPrevPage} disabled={localPage === 0} className={`w-8 h-8 rounded font-bold text-lg flex items-center justify-center ${localPage === 0 ? 'bg-gray-700 text-gray-500' : 'bg-blue-600 text-white shadow transition-colors'}`}>⬅</button>
                        <span className="text-xs font-bold text-white px-2">Pag {localPage + 1} di {maxLocalPages||1}</span>
                        <button onClick={goToNextPage} disabled={localPage + 1 >= maxLocalPages && !nextScryfallUrl} className={`w-8 h-8 rounded font-bold text-lg flex items-center justify-center ${(localPage + 1 >= maxLocalPages && !nextScryfallUrl) ? 'bg-gray-700 text-gray-500' : 'bg-blue-600 text-white shadow transition-colors'}`}>➡</button>
                     </div>
                  </div>
                  <div className="grid grid-cols-3 gap-2">
                    {currentResults.map((card, i) => (
                      <div key={i} className="relative cursor-pointer hover:ring-2 ring-blue-500 rounded shadow-md" onClick={() => openSubView(setSelectedCard, card, setAddQty, 1)}>
                        <img src={card.proxyImage || card.image || "mtg-bg.jpg"} alt={card.name} className="w-full rounded" />
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {Object.keys(groupedByCategory).some(cat => groupedByCategory[cat].length > 0) && (
                <div className="bg-gray-800/90 p-3 rounded-xl border border-gray-600 shadow-md backdrop-blur-sm animate-fade">
                  <h3 className="font-bold text-white mb-3 pl-2">La tua Lista:</h3>
                  <div className="space-y-4">
                    {categoriesOrder.map(cat => {
                       const cardsInCat = groupedByCategory[cat];
                       if(cardsInCat.length === 0) return null;
                       return (
                          <div key={cat} className="space-y-2">
                             <h4 className={`text-xs font-black border-b pb-1 uppercase ${cat === 'Sideboard' ? 'text-indigo-400 border-indigo-700' : (cat === 'Companion' ? 'text-pink-400 border-pink-700' : 'text-gray-400 border-gray-700')}`}>
                                {cat} ({cardsInCat.reduce((acc,c)=>acc+c.count,0)})
                             </h4>
                             {cardsInCat.map((card, index) => (
                               <div key={index} className={`flex gap-2 bg-gray-900 p-2 rounded-lg border ${card.isCmdrFlag ? 'border-yellow-500 shadow-[0_0_10px_rgba(234,179,8,0.3)]' : (card.isCompFlag ? 'border-pink-500 shadow-[0_0_10px_rgba(236,72,153,0.3)]' : (card.isSideboard ? 'border-indigo-500' : 'border-gray-700'))}`}>
                                 <div className="relative cursor-pointer shrink-0" onClick={() => openSubView(setManagingCard, card, setManageQty, card.count)}>
                                     <img src={card.proxyImage || card.image || "mtg-bg.jpg"} alt={card.name} className="w-14 rounded object-cover shadow border border-gray-600" />
                                     <div className="absolute -top-2 -right-2 bg-blue-600 text-white font-black text-xs w-6 h-6 flex items-center justify-center rounded-full shadow border border-blue-400">{card.count}</div>
                                 </div>
                                 <div className="flex-1 text-sm flex flex-col justify-between pt-1 overflow-hidden">
                                   <h4 className="font-bold text-gray-200 text-xs leading-tight truncate pr-1 cursor-pointer" onClick={() => openSubView(setManagingCard, card, setManageQty, card.count)}>{card.name}</h4>
                                   <div className="flex items-center justify-between mt-1">
                                     <div className="flex items-center gap-2">
                                       {deckFormat === 'commander' && !card.isSideboard && !card.isCompFlag && (
                                         <label className="flex items-center gap-1 text-yellow-500 text-[10px] font-bold cursor-pointer">
                                           <input type="checkbox" checked={card.isCmdrFlag} onChange={() => toggleGroupCommander(buildCardKey(card))} className="accent-yellow-500" /> Cmdr
                                         </label>
                                       )}
                                       {!card.isCmdrFlag && !card.isSideboard && (
                                         <label className="flex items-center gap-1 text-pink-500 text-[10px] font-bold cursor-pointer">
                                           <input type="checkbox" checked={card.isCompFlag} onChange={() => toggleGroupCompanion(buildCardKey(card))} className="accent-pink-500" /> Comp
                                         </label>
                                       )}
                                     </div>
                                     <div className="flex gap-1 ml-auto">
                                       <button onClick={() => openSubView(setEditingProxyCard, deck.find(c => buildCardKey(c) === buildCardKey(card)))} className="text-[10px] bg-purple-700 hover:bg-purple-600 text-white font-bold px-2 py-1 rounded shadow transition-colors">🎨 Proxy</button>
                                     </div>
                                   </div>
                                 </div>
                               </div>
                             ))}
                          </div>
                       )
                    })}
                  </div>
                </div>
              )}
              <button onClick={saveDeck} className="w-full bg-green-600 hover:bg-green-500 text-white font-black py-4 rounded-xl shadow-[0_0_15px_rgba(22,163,74,0.5)] sticky bottom-4 z-40 transition-colors mt-4">SALVA MAZZO</button>
          </div>
        </div>
      );
    };

    // --- VISUALIZZATORE MAZZI (SOLO LETTURA E TRADUZIONE + REGOLE) ---
    const DeckViewer = ({deck, navigate}) => {
      const [viewingCard, setViewingCard] = useState(null);
      const [itaImg, setItaImg] = useState(null);
      const [itaImgBack, setItaImgBack] = useState(null);
      const [showIta, setShowIta] = useState(false);
      const [showBack, setShowBack] = useState(false);
      const [translating, setTranslating] = useState(false);
      const [savedScroll, setSavedScroll] = useState(0);
      const [printsList, setPrintsList] = useState([]);
      const [loadingPrints, setLoadingPrints] = useState(false);

      if(!deck) return null;

      const deckMap = {};
      deck.cards.forEach(c => {
         const key = buildCardKey(c); 
         if(!deckMap[key]) { deckMap[key] = { ...c, count: 1 }; } 
         else { deckMap[key].count++; }
      });
      const groupedByCategory = { "Comandante": [], "Companion": [], "Creature": [], "Planeswalker": [], "Istantanei": [], "Stregonerie": [], "Artefatti": [], "Incantesimi": [], "Terre": [], "Altro": [], "Sideboard": [] };
      Object.values(deckMap).forEach(c => { groupedByCategory[getCardCategory(c)].push(c); });
      Object.keys(groupedByCategory).forEach(k => { groupedByCategory[k].sort((a,b) => a.name.localeCompare(b.name)); });

      const openViewer = (c) => { 
          setSavedScroll(window.scrollY);
          setItaImg(null); setItaImgBack(null); setShowIta(false); setShowBack(false); setPrintsList([]);
          setViewingCard(c); window.scrollTo(0,0); 
      };
      
      const closeViewer = () => { 
          setViewingCard(null); 
          setTimeout(() => window.scrollTo(0, savedScroll), 10);
      };

      const fetchOtherPrints = (card) => {
          if(!card.printsUrl) return alert("Questa carta non ha altre stampe disponibili sul database.");
          setLoadingPrints(true);
          fetch(card.printsUrl)
            .then(res => res.json())
            .then(data => {
                if(data.data && data.data.length > 0) {
                    const mapped = data.data.filter(c => c.image_uris || (c.card_faces && c.card_faces.length > 0 && c.card_faces[0].image_uris)).map(c => {
                         let iImg = ""; let iImgBack = null;
                         if (c.image_uris && c.image_uris.normal) iImg = c.image_uris.normal;
                         else if (c.card_faces && c.card_faces.length > 0) {
                             if (c.card_faces[0].image_uris && c.card_faces[0].image_uris.normal) iImg = c.card_faces[0].image_uris.normal;
                             if (c.card_faces.length > 1 && c.card_faces[1].image_uris && c.card_faces[1].image_uris.normal) iImgBack = c.card_faces[1].image_uris.normal;
                         }
                         return { ...card, id: c.id, image: iImg, imageBack: iImgBack, rarity: c.rarity || "common", setCode: c.set || "", setName: c.set_name || "", prices: c.prices || {} };
                        });
                        setPrintsList(mapped);
                } else { alert("Nessun'altra stampa trovata."); }
                setLoadingPrints(false);
            }).catch(e => { console.error(e); setLoadingPrints(false); });
      };

      const translateCard = (card) => {
        if (card.isCustom) return alert("Le carte Proxy non possono essere tradotte dal database.");
        if (itaImg) { setShowIta(!showIta); return; } 
        setTranslating(true);
        fetch(`https://api.scryfall.com/cards/search?q=!"${card.name}"+lang:it`)
          .then(res => res.json())
          .then(data => {
             if (data.data && data.data.length > 0) {
                 const itCard = data.data[0];
                 let iImg = null; let iImgBack = null;
                 if (itCard.image_uris && itCard.image_uris.normal) { iImg = itCard.image_uris.normal; } 
                 else if (itCard.card_faces && itCard.card_faces.length > 0) {
                     if (itCard.card_faces[0].image_uris) iImg = itCard.card_faces[0].image_uris.normal;
                     if (itCard.card_faces.length > 1 && itCard.card_faces[1].image_uris) iImgBack = itCard.card_faces[1].image_uris.normal;
                 }
                 if (iImg) { setItaImg(iImg); setItaImgBack(iImgBack); setShowIta(true); }
                 else alert("Immagine italiana non trovata.");
             } else { alert("Traduzione ufficiale italiana non stampata per questa carta."); }
             setTranslating(false);
          }).catch(e => { alert("Errore di connessione."); setTranslating(false); });
      };

      const defFront = viewingCard ? (viewingCard.proxyImage || viewingCard.image || "mtg-bg.jpg") : "";
      const defBack = viewingCard ? viewingCard.imageBack : null;
      const currentFront = showIta && itaImg ? itaImg : defFront;
      const currentBack = showIta && itaImgBack ? itaImgBack : defBack;
      const displayImg = showBack && currentBack ? currentBack : currentFront;

      return (
        <div className="max-w-2xl mx-auto relative z-10 w-full">
           {viewingCard && (
             <div className="w-full flex flex-col animate-fade pb-10">
               <div className="flex items-center justify-between p-4 bg-gray-800 border-b border-gray-700 sticky top-0 z-50 shadow-md mb-6">
                 <button onClick={closeViewer} className="text-blue-400 font-bold flex items-center gap-1 text-lg"><Icons.Back /> Indietro</button>
                 <h2 className="ml-4 font-bold text-white truncate max-w-[50%]">{viewingCard.name}</h2>
                 <div className="w-8"></div>
               </div>
               
               <div className="flex-1 flex flex-col items-center justify-start p-2">
                 <img src={displayImg} alt={viewingCard.name} className="w-auto max-h-[60vh] object-contain rounded-xl mb-4 shadow-2xl" />
                 
                 {(itaImgBack || viewingCard.imageBack) && !viewingCard.isCustom && (
                    <button onClick={() => setShowBack(!showBack)} className="w-full max-w-sm bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 rounded-lg shadow-md border border-gray-500 mb-4 transition-colors">
                       🔄 {showBack ? "Vedi Fronte" : "Vedi Retro"}
                    </button>
                 )}

                 <div className="w-full max-w-sm mb-4 flex gap-2">
                    <button onClick={() => translateCard(viewingCard)} disabled={translating} className="flex-1 bg-indigo-700 hover:bg-indigo-600 text-white font-bold py-3 rounded-xl shadow-[0_0_15px_rgba(67,56,202,0.4)] border border-indigo-500 transition-all text-xs">
                      {translating ? "Traduco..." : (showIta ? "🇬🇧 Torna in Inglese" : "🇮🇹 Tenta Traduzione")}
                    </button>
                    {!viewingCard.isCustom && viewingCard.printsUrl && (
                        <button onClick={() => fetchOtherPrints(viewingCard)} disabled={loadingPrints} className="flex-1 bg-orange-600 hover:bg-orange-500 text-white font-bold py-3 rounded-xl shadow-lg border border-orange-500 transition-all text-xs">
                          {loadingPrints ? "Cerco..." : "🖼️ Altre Stampe"}
                        </button>
                    )}
                 </div>

                 {printsList.length > 0 && (
                    <div className="w-full max-w-sm mb-4 bg-gray-800 p-2 rounded-xl border border-gray-600 shadow-md animate-fade">
                       <p className="text-xs text-gray-300 font-bold mb-2">Questa è la modalità lettura. La stampa non verrà salvata nel mazzo.</p>
                       <div className="flex overflow-x-auto gap-2 pb-2">
                           {printsList.map(p => (
                              <img key={p.id} src={p.image} className="w-20 rounded cursor-pointer border-2 border-transparent hover:border-blue-500 shadow-sm shrink-0" 
                                 onClick={() => { setViewingCard({...viewingCard, id: p.id, image: p.image, imageBack: p.imageBack, rarity: p.rarity, setCode: p.setCode, setName: p.setName, prices: p.prices}); setPrintsList([]); setShowIta(false); }} />  
                           ))}
                        </div>
                    </div>
                 )}
                 
                 {/* REGOLE E LEGALITA ANCHE NEL VISUALIZZATORE */}
                 {!viewingCard.isCustom && <CardDetailsTabs card={viewingCard} />}

               </div>
             </div>
           )}

           <div className={viewingCard ? "hidden" : "space-y-4"}>
             <button onClick={() => navigate('mydecks')} className="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded font-bold mb-2 shadow transition-colors">⬅ Indietro ai Mazzi</button>
             <div className="bg-gray-800/90 p-6 rounded-xl border border-gray-600 shadow-xl backdrop-blur-sm">
                <div className="flex justify-between items-start mb-1">
                   <h2 className="text-3xl font-black text-white drop-shadow-md truncate pr-2">{deck.name}</h2>
                   <div className="bg-emerald-900/80 px-3 py-1 rounded-lg border border-emerald-500 shadow-lg text-right shrink-0">
                       <p className="text-[10px] text-emerald-300 font-bold uppercase tracking-wider mb-[-2px]">Valore Stimato</p>
                       <p className="text-xl font-black text-white">€ {deck.cards.reduce((acc, c) => acc + (parseFloat((c.prices && c.prices.eur) ? c.prices.eur : 0) || 0), 0).toFixed(2)}</p>
                   </div>
                </div>
                <p className="text-gray-300 font-bold mb-4 mt-2">Clicca su una carta per ingrandirla e tradurla!</p>
                <div className="space-y-4">
                  {categoriesOrder.map(cat => {
                     const cardsInCat = groupedByCategory[cat];
                     if(cardsInCat.length === 0) return null;
                     return (
                        <div key={cat} className="space-y-2">
                           <h4 className={`text-xs font-black border-b pb-1 uppercase ${cat === 'Sideboard' ? 'text-indigo-400 border-indigo-700' : (cat === 'Companion' ? 'text-pink-400 border-pink-700' : 'text-gray-400 border-gray-700')}`}>
                              {cat} ({cardsInCat.reduce((acc,c)=>acc+c.count,0)})
                           </h4>
                           {cardsInCat.map((card, index) => (
                             <div key={index} className={`flex gap-2 bg-gray-900 p-2 rounded-lg border ${card.isCmdrFlag ? 'border-yellow-500 shadow-[0_0_10px_rgba(234,179,8,0.3)]' : (card.isCompFlag ? 'border-pink-500 shadow-[0_0_10px_rgba(236,72,153,0.3)]' : (card.isSideboard ? 'border-indigo-500' : 'border-gray-700'))} cursor-pointer hover:bg-gray-800 transition-colors`} onClick={() => openViewer(card)}>
                               <div className="relative shrink-0">
                                   <img src={card.proxyImage || card.image || "mtg-bg.jpg"} alt={card.name} className="w-14 rounded object-cover shadow border border-gray-600" />
                                   <div className="absolute -top-2 -right-2 bg-blue-600 text-white font-black text-xs w-6 h-6 flex items-center justify-center rounded-full shadow border border-blue-400">
                                      {card.count}
                                   </div>
                               </div>
                               <div className="flex-1 text-sm flex flex-col justify-center overflow-hidden pl-2">
                                 <h4 className="font-bold text-gray-200 text-sm leading-tight truncate">{card.name}</h4>
                                 <p className="text-[10px] text-gray-500 truncate">{card.type}</p>
                               </div>
                             </div>
                           ))}
                        </div>
                     )
                  })}
                </div>
             </div>
           </div>
        </div>
      );
    };

    // --- COMPONENTE NUMERI FLUTTUANTI SULLA VITA ---
    const FloatingNumber = ({ val }) => {
        const [active, setActive] = useState(false);
        useEffect(() => {
            requestAnimationFrame(() => setActive(true));
        }, []);
        return (
            <div className={`absolute pointer-events-none text-5xl md:text-6xl font-black drop-shadow-[0_4px_4px_rgba(0,0,0,1)] transition-all duration-700 ease-out z-50 flex items-center justify-center ${active ? 'opacity-0 -translate-y-16 scale-125' : 'opacity-100 translate-y-0 scale-75'} ${val > 0 ? 'text-green-400' : 'text-red-500'}`}>
                {val > 0 ? `+${val}` : val}
            </div>
        );
    };

    // --- CARTELLA GIOCATORE (LA PLANCIA) ---
    const PlayerCard = ({ player, updateStat, onOpenModal, updatePlayerConfig, isArchenemy, opponents, isCloud }) => {
      const [showOpponents, setShowOpponents] = useState(false);
      const [floatingNums, setFloatingNums] = useState([]);
      const floatCounter = useRef(0);

      let isDead = false;
      if (!player.immune) {
         if (player.life <= 0) isDead = true; if (player.poison >= (player.maxPoison || 10)) isDead = true;
         if (player.cmdDmg) { Object.keys(player.cmdDmg).forEach(key => { if (player.cmdDmg[key] >= 21) isDead = true; }); }
      }

      // Funzione che aggiorna la vita e crea il numero volante
      const changeLife = (amount) => {
          updateStat(player.id, 'life', amount);
          const id = floatCounter.current++;
          setFloatingNums(prev => [...prev, { id, val: amount }]);
          setTimeout(() => {
              setFloatingNums(prev => prev.filter(f => f.id !== id));
          }, 700);
      };

      return (
        <React.Fragment>
          {/* L'immagine ora ha object-top per centrare meglio le facce dei Comandanti */}
          {player.bgUrl && <img src={player.bgUrl} className="absolute inset-0 w-full h-full object-cover object-top opacity-40 pointer-events-none" />}
          
          {isDead && <div className="absolute inset-0 flex items-center justify-center text-8xl opacity-50 pointer-events-none z-10">💀</div>}
          {player.immune && <div className="absolute inset-0 flex items-center justify-center text-8xl opacity-30 pointer-events-none text-blue-500 drop-shadow-lg z-10">🛡️</div>}
          
          <div className="relative flex justify-between items-center bg-black/50 p-2 z-30 border-b border-gray-700 h-[25%] min-h-[50px] w-full px-2 md:px-4 shrink-0">
            
            <div className={`flex ${isCloud ? 'flex-row gap-3' : 'flex-col gap-1'} z-30 shrink-0 items-center justify-center`}>
                <button onClick={() => onOpenModal('search')} className="text-gray-400 hover:text-white transition-transform active:scale-90" title="Imposta Sfondo"><span className="text-xl">🖼️</span></button>
                <button onClick={() => onOpenModal('cmdrSelect')} className="text-yellow-500 hover:text-yellow-400 transition-transform active:scale-90 drop-shadow-[0_0_5px_rgba(234,179,8,0.5)]" title="Centro di Comando"><span className="text-xl">👑</span></button>
            </div>
            
            <div className="flex flex-col items-center justify-center overflow-hidden z-20 flex-1 px-1">
               <span onClick={() => onOpenModal('editName')} className="font-bold text-white text-sm md:text-lg drop-shadow-md truncate cursor-pointer text-center w-full">
                   {isArchenemy && <span className="mr-1 drop-shadow-[0_0_8px_rgba(220,38,38,0.8)]" title="Archenemy">👿</span>}
                   {player.name} ✎
               </span>
               <button onClick={() => setShowOpponents(!showOpponents)} className={`mt-1 bg-indigo-700/80 hover:bg-indigo-600 text-white font-bold rounded shadow border border-indigo-400 flex items-center justify-center gap-1 active:scale-95 transition-transform shrink-0 ${isCloud ? 'px-4 py-1.5 text-xs' : 'px-2 py-0.5 text-[10px]'}`}>
                   👁️ Avversari
               </button>
               <div className="flex gap-1 mt-1 justify-center flex-wrap">
                  {player.poison > 0 && <span className="text-green-400 text-[10px] md:text-xs font-black drop-shadow-md">💧{player.poison}</span>}
                  {player.cmdCasts > 0 && <span className="text-gray-300 text-[10px] md:text-xs font-black drop-shadow-md">⚔️{player.cmdCasts}</span>}
                  {player.emblems > 0 && <span className="text-purple-400 text-[10px] md:text-xs font-black drop-shadow-md">🛡️{player.emblems}</span>}
                  {player.rad > 0 && <span className="text-lime-400 text-[10px] md:text-xs font-black drop-shadow-md">☢️{player.rad}</span>}
                  {player.energy > 0 && <span className="text-blue-400 text-[10px] md:text-xs font-black drop-shadow-md">⚡{player.energy}</span>}
                  {player.exp > 0 && <span className="text-yellow-400 text-[10px] md:text-xs font-black drop-shadow-md">✨{player.exp}</span>}
                  {player.ticket > 0 && <span className="text-orange-400 text-[10px] md:text-xs font-black drop-shadow-md">🎫{player.ticket}</span>}
                  {player.monarch && <span className="text-yellow-500 text-[10px] md:text-xs font-black drop-shadow-md">👑</span>}
                  {player.initiative && <span className="text-red-400 text-[10px] md:text-xs font-black drop-shadow-md">🗡️</span>}
                  {player.blessing && <span className="text-yellow-100 text-[10px] md:text-xs font-black drop-shadow-md">🏛️</span>}
               </div>
            </div>
            
            <div className={`flex ${isCloud ? 'flex-row gap-2' : 'flex-col gap-1'} z-30 shrink-0`}>
               <button onClick={() => onOpenModal('mana')} className={`rounded shadow-lg font-bold bg-emerald-700 text-white hover:bg-emerald-600 transition-colors ${isCloud ? 'px-5 py-3 text-sm border border-emerald-500' : 'px-2 py-1 text-[10px]'}`}>Mana</button>
               <button onClick={() => onOpenModal('stats')} className={`rounded shadow-lg font-bold bg-gray-700 text-white hover:bg-gray-600 transition-colors ${isCloud ? 'px-5 py-3 text-sm border border-gray-500' : 'px-2 py-1 text-[10px]'}`}>Stats</button>
            </div>
          </div>

        {/* --- MINI TABELLA AVVERSARI IN DIRETTA --- */}
        {showOpponents && (
            <div className="absolute top-12 left-2 right-2 bg-gray-900/98 border-2 border-indigo-500 rounded-xl p-3 z-[100] shadow-2xl animate-fade backdrop-blur-md">
                <div className="flex justify-between items-center mb-3 border-b border-gray-700 pb-2">
                    <h3 className="text-white font-black text-xs sm:text-sm">👁️ Avversari <span className="text-gray-400 font-semibold">(Tu: ❤️ {player.life})</span></h3>
                    <button onClick={() => setShowOpponents(false)} className="bg-red-600 text-white px-3 py-1 rounded font-bold text-xs shadow active:scale-95">Chiudi</button>
                </div>
                <div className="flex flex-col gap-2 overflow-y-auto max-h-[50cqh] pr-1">
                    {(opponents || []).map(opp => (
                        <div key={opp.id} className="bg-black/60 p-2 rounded-lg border border-gray-700 flex justify-between items-center shadow-inner">
                            <span className="text-white font-bold text-xs truncate max-w-[35%] pr-1">{opp.name}</span>
                            <div className="flex gap-2 text-xs font-black">
                                <span className="bg-red-900/50 text-red-300 px-1.5 py-0.5 rounded border border-red-800" title="Punti Vita attuali">❤️ {opp.life}</span>
                                
                                {opp.poison > 0 && (
                                    <span className="bg-green-900/50 text-green-300 px-1.5 py-0.5 rounded border border-green-800" title="Segnalini Veleno">💧 {opp.poison}</span>
                                )}
                                
                                {/* Danni Comandante SUBITI (Arancione/Rosso) */}
                                {player.cmdDmg && player.cmdDmg[opp.id] > 0 && (
                                    <span className="bg-orange-900/50 text-orange-300 px-1.5 py-0.5 rounded border border-orange-800" title={`Danni Comandante che HAI SUBÌTO da ${opp.name}`}>
                                        🩸⚔️ {player.cmdDmg[opp.id]}
                                    </span>
                                )}

                                {/* Danni Comandante INFLITTI (Verde Smeraldo) */}
                                {opp.cmdDmg && opp.cmdDmg[player.id] > 0 && (
                                    <span className="bg-emerald-900/50 text-emerald-300 px-1.5 py-0.5 rounded border border-emerald-500" title={`Danni Comandante che HAI INFLITTO a ${opp.name}`}>
                                        🎯⚔️ {opp.cmdDmg[player.id]}
                                    </span>
                                )}
                            </div>
                        </div>
                    ))}
                    {(!opponents || opponents.length === 0) && (
                        <p className="text-gray-500 text-xs text-center font-bold">Nessun avversario rilevato.</p>
                    )}
                </div>
            </div>
        )}

          <div className="flex-1 flex items-center justify-between px-2 z-20 h-[75%] w-full relative">
            <button onClick={() => changeLife(-1)} className="w-1/4 h-full flex items-center justify-center text-5xl md:text-6xl font-bold text-red-500 active:bg-red-500/20 rounded-l-xl transition-colors drop-shadow-md">-</button>
            <div className="w-2/4 h-full relative flex justify-center items-center">
               <div className="text-center text-5xl md:text-6xl lg:text-7xl font-black text-white drop-shadow-[0_5px_8px_rgba(0,0,0,1)] truncate absolute z-10">
                   {player.life}
               </div>
               {/* Numeri Volanti */}
               {floatingNums.map(f => <FloatingNumber key={f.id} val={f.val} />)}
            </div>
            <button onClick={() => changeLife(1)} className="w-1/4 h-full flex items-center justify-center text-5xl md:text-6xl font-bold text-green-500 active:bg-green-500/20 rounded-r-xl transition-colors drop-shadow-md">+</button>
            
            {/* Tasto Pedine Fluttuante in Basso al Centro */}
            <button onClick={() => onOpenModal('tokens')} className={`absolute left-1/2 transform -translate-x-1/2 rounded-full shadow-lg font-bold bg-emerald-800/90 text-emerald-100 hover:bg-emerald-700 transition-colors border border-emerald-500 flex items-center gap-1 z-30 ${isCloud ? 'bottom-3 px-6 py-2 text-sm' : 'bottom-1 md:bottom-2 px-3 py-1 text-[10px] md:text-xs'}`}>
                ♟️ Pedine
            </button>
          </div>
        </React.Fragment>
      );
    };

    const PlaytesterSandbox = ({view, setView, navigate}) => {
       const [decks, setDecks] = useState([]);
       const [selectedDeckId, setSelectedDeckId] = useState("");
       const [gameState, setGameState] = useState(null); 
       const [showCardModal, setShowCardModal] = useState(null);
       const [browsingZone, setBrowsingZone] = useState(null);

       useEffect(() => { setDecks(JSON.parse(localStorage.getItem('mtg_decks') || '[]')); }, []);

       const startPlaytest = () => {
          if(!selectedDeckId) return alert("Seleziona un mazzo!");
          const d = decks.find(x => x.id.toString() === selectedDeckId);
          if(!d) return;

          let initialLibrary = []; let initialCmdZone = [];
          
          d.cards.forEach(c => {
             if(c.isSideboard && !c.isCompanion) return; 
             if(c.isCommander || c.isCompanion) {
                initialCmdZone.push({...c, uid: Math.random()});
             } else {
                initialLibrary.push({...c, uid: Math.random()});
             }
          });

          for (let i = initialLibrary.length - 1; i > 0; i--) {
             const j = Math.floor(Math.random() * (i + 1));
             [initialLibrary[i], initialLibrary[j]] = [initialLibrary[j], initialLibrary[i]];
          }

          setGameState({
             deckName: d.name, isCommander: d.format === 'commander', mulliganCount: 0, turn: 1,
             library: initialLibrary, hand: [], battlefield: [], graveyard: [], exile: [], commandZone: initialCmdZone
          });

          setView('playtester_active');
          setTimeout(() => doDraw(7, initialLibrary, []), 100);
       };

       const doDraw = (amount, currentLib, currentHand) => {
          let newLib = [...currentLib]; let newHand = [...currentHand];
          for(let i=0; i<amount; i++) { if(newLib.length > 0) newHand.push(newLib.shift()); }
          setGameState(prev => ({...prev, library: newLib, hand: newHand}));
       };

       const drawOne = () => { if(!gameState || gameState.library.length === 0) return; doDraw(1, gameState.library, gameState.hand); };
       
       const passTurn = () => { if(!gameState) return; setGameState(prev => ({ ...prev, turn: prev.turn + 1 })); drawOne(); };

       const untapAll = () => { 
           if(!gameState) return; 
           setGameState(prev => ({ ...prev, battlefield: prev.battlefield.map(c => ({...c, isTapped: false})) })); 
       };

       const millCards = () => {
           if(!gameState || gameState.library.length === 0) return;
           const amount = parseInt(window.prompt("Quante carte vuoi millare?", "1"));
           if(isNaN(amount) || amount <= 0) return;
           
           setGameState(prev => {
              let newLib = [...prev.library];
              let newGrave = [...prev.graveyard];
              const actualAmount = Math.min(amount, newLib.length);
              for(let i=0; i<actualAmount; i++) { newGrave.push(newLib.shift()); }
              return { ...prev, library: newLib, graveyard: newGrave };
           });
       };

       const mulligan = () => {
          if(!gameState) return;
          let allCards = [...gameState.library, ...gameState.hand, ...gameState.battlefield, ...gameState.graveyard, ...gameState.exile];
          for (let i = allCards.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [allCards[i], allCards[j]] = [allCards[j], allCards[i]]; }
          let newMull = gameState.mulliganCount + 1;
          let cardsToBottom = gameState.isCommander ? (newMull > 1 ? newMull - 1 : 0) : newMull;

          setGameState(prev => ({ ...prev, mulliganCount: newMull, library: allCards, hand: [], battlefield: [], graveyard: [], exile: [] }));
          setTimeout(() => { doDraw(7, allCards, []); if(cardsToBottom > 0) alert(`Mulligan a 7 effettuato. Metti ${cardsToBottom} carte in fondo al mazzo!`); }, 100);
       };

       const shuffleLibrary = () => {
          if(!gameState) return;
          let lib = [...gameState.library];
          for (let i = lib.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [lib[i], lib[j]] = [lib[j], lib[i]]; }
          setGameState(prev => ({...prev, library: lib})); alert("Mazzo mischiato!");
       };

       const moveCard = (uid, sourceZone, destZone) => {
          if(!gameState) return; let cardToMove = null;
          let newSource = gameState[sourceZone].filter(c => { if(c.uid === uid) { cardToMove = c; return false; } return true; });
          if(!cardToMove) return; cardToMove.isTapped = false;
          let newGameState = { ...gameState, [sourceZone]: newSource };

          if(destZone === 'libraryBottom') {
             let lib = sourceZone === 'library' ? [...newSource] : [...gameState.library]; lib.push(cardToMove); newGameState.library = lib;
          } else if(destZone === 'libraryTop') {
             let lib = sourceZone === 'library' ? [...newSource] : [...gameState.library]; lib.unshift(cardToMove); newGameState.library = lib;
          } else {
             let newDest = sourceZone === destZone ? [...newSource] : [...gameState[destZone]]; newDest.push(cardToMove); newGameState[destZone] = newDest;
          }
          setGameState(newGameState); setShowCardModal(null); setBrowsingZone(null);
       };

       const toggleTap = (uid) => { if(!gameState) return; setGameState(prev => ({ ...prev, battlefield: prev.battlefield.map(c => c.uid === uid ? {...c, isTapped: !c.isTapped} : c) })); };

       if(view === 'playtester') {
          return (
             <div className="max-w-md mx-auto bg-gray-800/90 p-6 rounded-xl shadow-lg border border-gray-600 mt-4 backdrop-blur-sm space-y-6 animate-fade">
               <h2 className="text-3xl font-black text-center text-blue-400 drop-shadow-md">Tavolo Virtuale</h2>
               <p className="text-xs text-center text-gray-300 font-bold mb-4 bg-gray-900 p-2 rounded border border-gray-700">📱 Sandbox manuale per testare le aperture del mazzo.</p>
               {decks.length === 0 ? ( <p className="text-red-400 font-bold text-center">Nessun mazzo salvato.</p> ) : (
                  <div className="space-y-4">
                     <select value={selectedDeckId} onChange={e => setSelectedDeckId(e.target.value)} className="w-full bg-gray-900 border border-gray-600 rounded p-3 text-white font-bold outline-none">
                        <option value="">Seleziona un Mazzo...</option>{decks.map(d => <option key={d.id} value={d.id}>{d.name} ({d.format})</option>)}
                     </select>
                     <button onClick={startPlaytest} className="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-xl shadow-[0_0_15px_rgba(37,99,235,0.5)] transition-all">AVVIA SIMULATORE</button>
                  </div>
               )}
             </div>
          );
       }
       if(!gameState) return null;

       return (
          <div className="fixed inset-0 z-[200] bg-green-900 flex flex-col h-[100dvh] w-full animate-fade">
             {browsingZone && (
                <div className="fixed inset-0 bg-gray-900 z-[250] flex flex-col animate-fade pb-10">
                   <div className="flex justify-between items-center p-4 bg-gray-800 border-b border-gray-700 shadow-md">
                      <h2 className="text-xl font-bold text-white uppercase">{browsingZone === 'library' ? 'Mazzo' : (browsingZone === 'graveyard' ? 'Cimitero' : 'Esilio')} ({gameState[browsingZone].length})</h2>
                      <div className="flex gap-2">
                         {browsingZone === 'library' && ( <button onClick={shuffleLibrary} className="bg-blue-600 px-3 py-1 rounded text-white font-bold text-sm shadow">Mischia</button> )}
                         <button onClick={() => setBrowsingZone(null)} className="bg-red-600 px-3 py-1 rounded text-white font-bold shadow">Chiudi</button>
                      </div>
                   </div>
                   <div className="flex-1 overflow-y-auto p-4 grid grid-cols-3 sm:grid-cols-4 gap-3 content-start">
                      {gameState[browsingZone].map(c => ( <img key={c.uid} src={c.proxyImage || c.image || "mtg-bg.jpg"} onClick={() => setShowCardModal({card: c, zone: browsingZone})} className="w-full rounded shadow-lg cursor-pointer border border-gray-600 active:scale-95 transition-transform" /> ))}
                      {gameState[browsingZone].length === 0 && <p className="col-span-3 text-center text-gray-500 font-bold mt-10">Nessuna carta qui.</p>}
                   </div>
                </div>
             )}
             {showCardModal && (
                <div className="fixed inset-0 bg-black/90 z-[300] flex flex-col items-center justify-center p-4 animate-fade" onClick={() => setShowCardModal(null)}>
                   <div onClick={e => e.stopPropagation()} className="w-full max-w-sm flex flex-col items-center">
                      <img src={showCardModal.card.proxyImage || showCardModal.card.image || "mtg-bg.jpg"} className="w-auto h-[45vh] rounded-xl shadow-2xl mb-6 border border-gray-600" />
                      <div className="grid grid-cols-2 gap-2 w-full bg-gray-900 p-4 rounded-xl border border-gray-700">
                         {showCardModal.zone === 'hand' && ( <button onClick={() => moveCard(showCardModal.card.uid, 'hand', 'battlefield')} className="col-span-2 bg-green-600 text-white font-bold py-3 rounded shadow">👇 Gioca sul Campo</button> )}
                         {showCardModal.zone === 'commandZone' && ( <button onClick={() => moveCard(showCardModal.card.uid, 'commandZone', 'battlefield')} className="col-span-2 bg-yellow-600 text-white font-bold py-3 rounded shadow">👇 Lancia da Cmd Zone</button> )}
                         {showCardModal.zone === 'battlefield' && ( <button onClick={() => moveCard(showCardModal.card.uid, 'battlefield', 'hand')} className="col-span-2 bg-blue-600 text-white font-bold py-3 rounded shadow">👆 Riprendi in Mano</button> )}
                         {(showCardModal.zone === 'graveyard' || showCardModal.zone === 'exile' || showCardModal.zone === 'library') && (
                            <React.Fragment>
                               <button onClick={() => moveCard(showCardModal.card.uid, showCardModal.zone, 'hand')} className="bg-blue-600 text-white font-bold py-3 rounded text-sm shadow">🖐 Mano</button>
                               <button onClick={() => moveCard(showCardModal.card.uid, showCardModal.zone, 'battlefield')} className="bg-green-600 text-white font-bold py-3 rounded text-sm shadow">👇 Campo</button>
                            </React.Fragment>
                         )}
                         <button onClick={() => moveCard(showCardModal.card.uid, showCardModal.zone, 'graveyard')} className="bg-gray-600 text-white font-bold py-2 rounded text-xs">💀 Cimitero</button>
                         <button onClick={() => moveCard(showCardModal.card.uid, showCardModal.zone, 'exile')} className="bg-gray-400 text-black font-bold py-2 rounded text-xs">🌌 Esilio</button>
                         <button onClick={() => moveCard(showCardModal.card.uid, showCardModal.zone, 'libraryTop')} className="bg-indigo-700 text-white font-bold py-2 rounded text-xs">Cima Mazzo</button>
                         <button onClick={() => moveCard(showCardModal.card.uid, showCardModal.zone, 'libraryBottom')} className="bg-indigo-900 text-white font-bold py-2 rounded text-xs">Fondo Mazzo</button>
                         <button onClick={() => setShowCardModal(null)} className="col-span-2 bg-red-600 text-white font-bold py-2 rounded mt-2 shadow">❌ Annulla</button>
                      </div>
                   </div>
                </div>
             )}
             <div className="bg-black/80 text-white p-2 flex justify-between items-center border-b border-green-700 shadow-md h-[10dvh]">
                <button onClick={() => setView('playtester')} className="bg-red-600 px-3 py-1 rounded font-bold text-xs shadow">Esci</button>
                <div className="text-center"><h3 className="font-black text-sm uppercase text-yellow-500">Turno {gameState.turn}</h3></div>
                <div className="flex gap-1 overflow-x-auto">
                    <button onClick={untapAll} className="bg-emerald-600 px-2 py-1 rounded font-bold text-[10px] shadow whitespace-nowrap">Stappa</button>
                    <button onClick={mulligan} className="bg-orange-600 px-2 py-1 rounded font-bold text-[10px] shadow whitespace-nowrap">Mulligan</button>
                    <button onClick={passTurn} className="bg-blue-600 px-2 py-1 rounded font-bold text-[10px] shadow whitespace-nowrap">Passa</button>
                </div>
             </div>
             <div className="bg-black/50 p-2 flex justify-between items-center h-[12dvh] overflow-x-auto gap-2">
                <div className="flex gap-2 border-r border-green-800 pr-2 h-full items-center">
                   {gameState.commandZone.map(c => ( <img key={c.uid} src={c.proxyImage || c.image || "mtg-bg.jpg"} onClick={() => setShowCardModal({card: c, zone: 'commandZone'})} className="h-full rounded border border-yellow-500 shadow-lg cursor-pointer" /> ))}
                </div>
                <div className="flex gap-2 pl-1 overflow-x-auto h-full items-center">
                   <button onClick={drawOne} className="h-full bg-indigo-900/80 rounded border border-indigo-500 flex items-center justify-center px-3 font-black shadow shrink-0">PESCA</button>
                   <button onClick={millCards} className="h-full bg-purple-900/80 rounded border border-purple-500 flex items-center justify-center px-2 font-bold text-xs text-purple-200 shadow shrink-0">MILLA</button>
                   <div className="h-full bg-blue-900 rounded border border-blue-500 flex flex-col items-center justify-center px-2 cursor-pointer shrink-0 shadow-lg" onClick={() => setBrowsingZone('library')}><span className="text-[10px] font-bold text-blue-300">Mazzo</span><span className="font-black text-white">{gameState.library.length}</span></div>
                   <div className="h-full bg-gray-800 rounded border border-gray-500 flex flex-col items-center justify-center px-2 cursor-pointer shrink-0 shadow-lg" onClick={() => setBrowsingZone('graveyard')}><span className="text-[10px] font-bold text-gray-400">Cimitero</span><span className="font-black text-white">{gameState.graveyard.length}</span></div>
                   {gameState.exile.length > 0 && (<div className="h-full bg-gray-300 rounded border border-gray-500 flex flex-col items-center justify-center px-2 cursor-pointer shrink-0 shadow-lg" onClick={() => setBrowsingZone('exile')}><span className="text-[10px] font-bold text-gray-700">Esilio</span><span className="font-black text-black">{gameState.exile.length}</span></div>)}
                </div>
             </div>
             <div className="flex-1 bg-green-900/50 p-2 overflow-y-auto relative shadow-[inset_0_0_20px_rgba(0,0,0,0.5)]">
                {gameState.battlefield.length === 0 && <div className="absolute inset-0 flex items-center justify-center text-green-700/50 font-black text-2xl uppercase pointer-events-none">Tavolo di Gioco</div>}
                <div className="flex flex-wrap gap-3 content-start">
                   {gameState.battlefield.map(c => (
                      <div key={c.uid} className="relative w-20 sm:w-24">
                         <img src={c.proxyImage || c.image || "mtg-bg.jpg"} onClick={() => toggleTap(c.uid)} className={`w-full rounded shadow-md cursor-pointer transition-transform duration-200 border border-black ${c.isTapped ? 'rotate-90 opacity-80' : 'rotate-0'}`} />
                         <button onClick={(e) => { e.stopPropagation(); setShowCardModal({card: c, zone: 'battlefield'}) }} className="absolute -top-2 -right-2 bg-black/80 text-white rounded-full w-6 h-6 flex items-center justify-center text-[10px] font-bold border border-gray-500 shadow">⚙️</button>
                      </div>
                   ))}
                </div>
             </div>
             <div className="h-[25dvh] bg-black/90 p-2 overflow-x-auto flex items-end gap-[-20px] pb-4 shadow-[0_-5px_15px_rgba(0,0,0,0.5)] z-10 pl-4">
                {gameState.hand.map((c, i) => ( <img key={c.uid} src={c.proxyImage || c.image || "mtg-bg.jpg"} onClick={() => setShowCardModal({card: c, zone: 'hand'})} className="h-full rounded-lg shadow-xl cursor-pointer hover:-translate-y-4 hover:z-20 transition-all border border-gray-700" style={{ marginLeft: i === 0 ? '0' : '-30px', transformOrigin: 'bottom center' }} /> ))}
             </div>
          </div>
       );
    };

    const DiceRoller = () => {
      const [numPlayers, setNumPlayers] = useState(4);
      const [results, setResults] = useState([]);
      const [winnerMessage, setWinnerMessage] = useState("");

      const rollDice = () => {
        let rolls = []; let max = 0;
        for(let i=1; i<=numPlayers; i++) { const roll = Math.floor(Math.random() * 20) + 1; rolls.push({ player: `Player ${i}`, roll: roll }); if(roll > max) max = roll; }
        setResults(rolls);
        const winners = rolls.filter(r => r.roll === max);
        if(winners.length === 1) setWinnerMessage(`🎉 Inizia: ${winners[0].player}!`); else setWinnerMessage(`Pareggio tra: ${winners.map(w=>w.player).join(', ')}. Ritirate!`);
      };

      return (
        <div className="max-w-md mx-auto bg-gray-800/90 p-6 rounded-xl border border-gray-600 mt-10 backdrop-blur-sm shadow-xl">
          <h2 className="text-3xl font-black mb-6 text-center text-purple-500 drop-shadow-md">Tira il Dado (D20)</h2>
          <label className="block text-gray-300 font-bold mb-2">Numero Giocatori</label>
          <input type="number" min="2" max="6" value={numPlayers} onChange={e => setNumPlayers(parseInt(e.target.value))} className="w-full bg-gray-900 border border-gray-600 rounded p-3 text-white text-center mb-6 font-bold text-xl outline-none" />
          <button onClick={rollDice} className="w-full bg-purple-600 hover:bg-purple-500 text-white font-black py-4 rounded-xl text-xl mb-6 shadow-[0_0_15px_rgba(147,51,234,0.5)] transition-all">TIRA IL DADO</button>
          {results.length > 0 && (
            <div className="space-y-2 animate-fade">
              {results.map((r, i) => (
                <div key={i} className="flex justify-between p-3 bg-gray-900 rounded border border-gray-700 shadow-inner">
                  <span className="font-bold text-gray-300 text-lg">{r.player}</span><span className={`font-black text-xl ${r.roll === 20 ? 'text-green-400' : (r.roll === 1 ? 'text-red-400' : 'text-white')}`}>{r.roll}</span>
                </div>
              ))}
              <div className="mt-4 p-4 bg-green-900/40 border border-green-500 rounded-lg text-center font-bold text-green-400 text-lg shadow-md">{winnerMessage}</div>
            </div>
          )}
        </div>
      );
    };

    const RulesAI = () => {
      const [question, setQuestion] = useState("");
      const searchRuling = () => { if(question) window.open(`https://www.google.com/search?q=MTG+Ruling+${encodeURIComponent(question)}`, '_blank'); };
      return (
        <div className="max-w-md mx-auto space-y-4">
          <div className="bg-gray-800/90 p-6 rounded-xl border border-gray-600 mt-4 text-center backdrop-blur-sm shadow-xl">
            <h2 className="text-3xl font-black mb-4 text-green-500 drop-shadow-md">Judge Desk</h2>
            <p className="text-sm text-gray-300 mb-6 font-semibold">Cerca il tuo dubbio tra i Ruling Ufficiali o contatta un Arbitro vero.</p>
            <textarea className="w-full h-24 bg-gray-900 border border-gray-600 rounded p-3 text-white mb-4 font-semibold outline-none focus:border-blue-500" placeholder="Scrivi il tuo dubbio sulla combo..." value={question} onChange={(e) => setQuestion(e.target.value)}></textarea>
            <button onClick={searchRuling} className="w-full bg-green-600 hover:bg-green-500 text-white font-black py-4 rounded-xl shadow-lg mb-6 flex justify-center items-center gap-2 transition-all">🔍 Cerca Ruling Online</button>
            <div className="border-t border-gray-700 pt-6 space-y-3">
               <a href="https://magic.wizards.com/en/rules" target="_blank" className="block w-full bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 rounded-lg shadow border border-gray-600 transition-colors">📖 PDF Regole Ufficiali</a>
               <a href="https://chat.magicjudges.org/mtgrules/" target="_blank" className="block w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg shadow border border-blue-500 transition-colors">💬 Chat Live Judge DCI (24/7)</a>
            </div>
          </div>
        </div>
      );
    };

    // --- GIOCA ONLINE (ENDSTEP HUB) ---
    const PlayOnlineView = ({navigate}) => {
       const [decks, setDecks] = useState([]);
       const [selectedDeckId, setSelectedDeckId] = useState("");

       useEffect(() => { 
           setDecks(JSON.parse(localStorage.getItem('mtg_decks') || '[]')); 
       }, []);

       const handlePlay = () => {
          if(!selectedDeckId) return alert("Seleziona un mazzo dalla tendina prima di continuare!");
          const d = decks.find(x => x.id.toString() === selectedDeckId);
          if(!d) return;

          // Raggruppa le carte per nome e conta le quantità per formattare la lista
          const deckMap = {};
          d.cards.forEach(c => {
              const key = c.name;
              deckMap[key] = (deckMap[key] || 0) + 1;
          });
          const listText = Object.keys(deckMap).map(name => `${deckMap[name]} ${name}`).join('\n');

          navigator.clipboard.writeText(listText);
          alert(`Lista del mazzo "${d.name}" copiata negli appunti!\n\nOra verrai reindirizzato su Endstep.cc.\nFai il Login e fai "Incolla" per importare il tuo mazzo in un secondo!`);
          window.open("https://endstep.cc", "_blank");
       };

       return (
          <div className="max-w-md mx-auto bg-gray-800/90 p-6 rounded-xl shadow-lg border border-gray-600 mt-4 backdrop-blur-sm space-y-6 animate-fade">
             <div className="text-center">
                <h2 className="text-3xl font-black text-indigo-400 drop-shadow-md mb-2">Gioca Online</h2>
                <p className="text-xs text-gray-300 font-bold bg-gray-900 p-3 rounded border border-gray-700 shadow-inner">
                   Sfida altri giocatori importando il tuo mazzo direttamente su <b className="text-indigo-400">Endstep.cc</b>!
                </p>
             </div>

             {decks.length === 0 ? (
                <p className="text-red-400 font-bold text-center bg-red-900/30 p-3 rounded">Nessun mazzo salvato. Creane uno nel Deckbuilder prima di giocare!</p>
             ) : (
                <div className="space-y-4">
                   <label className="block text-gray-300 font-bold text-sm">1. Seleziona il Mazzo da esportare:</label>
                   <select value={selectedDeckId} onChange={e => setSelectedDeckId(e.target.value)} className="w-full bg-gray-900 border border-gray-600 rounded p-4 text-white font-bold outline-none shadow-inner">
                      <option value="">Scegli un Mazzo...</option>
                      {decks.map(d => <option key={d.id} value={d.id}>{d.name} ({d.format})</option>)}
                   </select>

                   <button onClick={handlePlay} className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-4 rounded-xl shadow-[0_0_15px_rgba(79,70,229,0.5)] transition-all flex justify-center items-center gap-2">
                      📋 COPIA LISTA E VAI SU ENDSTEP
                   </button>
                </div>
             )}

             <div className="border-t border-gray-700 pt-6 space-y-3 mt-4">
                <p className="text-center text-gray-400 text-xs font-bold mb-2">Non hai ancora un account su Endstep?</p>
                <button onClick={() => window.open("https://endstep.cc", "_blank")} className="w-full bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 rounded-lg shadow border border-gray-600 transition-colors">
                   🌐 Apri Sito per Registrarti
                </button>
             </div>
          </div>
       );
    };

    // --- TAVERNA MTG (ROUND FINALE: INVITI FANTASMA + NICKNAME PRIVACY) ---
    const TavernaChat = ({ navigate }) => {
        const user = auth.currentUser;
        const [messages, setMessages] = useState([]);
        const [newMessage, setNewMessage] = useState("");
        const [currentRoom, setCurrentRoom] = useState("global");
        const [roomInput, setRoomInput] = useState("");
        
        // NUOVO: Stato per il Nickname (Salvataggio in memoria locale)
        const [nickname, setNickname] = useState(localStorage.getItem('chat_nickname') || "");
        const messagesEndRef = useRef(null);

        // Inizializza il nome al primo caricamento se non c'è un nickname salvato
        useEffect(() => {
            if (user && !nickname) {
                const defaultName = user.displayName || (user.email ? user.email.split('@')[0] : "Planeswalker");
                setNickname(defaultName);
            }
        }, [user, nickname]);

        useEffect(() => {
            if (!user) return;
            const collectionPath = currentRoom === 'global' ? db.collection('global_chat') : db.collection('chat_rooms').doc(currentRoom).collection('messages');

            if (currentRoom === 'global') {
                const dueGiorniFa = Date.now() - (48 * 60 * 60 * 1000);
                try {
                    collectionPath.where('timestamp', '<', dueGiorniFa).get().then(snap => {
                        snap.forEach(doc => doc.ref.delete());
                    });
                } catch(e) { console.log("Pulizia saltata"); }
            }

            const unsubscribe = collectionPath
                .orderBy('timestamp', 'desc')
                .limit(50)
                .onSnapshot(snapshot => {
                    const msgs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).reverse();
                    setMessages(msgs);
                    setTimeout(() => { if (messagesEndRef.current) messagesEndRef.current.scrollIntoView({ behavior: "smooth" }); }, 100);
                });

            return () => unsubscribe();
        }, [user, currentRoom]);

        const changeNickname = () => {
            const newNick = window.prompt("Inserisci il tuo nuovo Nickname per la Taverna:", nickname);
            if (newNick && newNick.trim() !== "") {
                const finalNick = newNick.trim();
                setNickname(finalNick);
                localStorage.setItem('chat_nickname', finalNick);
            }
        };

        const sendMessage = async (e) => {
            e.preventDefault();
            if (!newMessage.trim() || !user) return;
            const text = newMessage.trim();
            setNewMessage(""); 
            
            try {
                const collectionPath = currentRoom === 'global' ? db.collection('global_chat') : db.collection('chat_rooms').doc(currentRoom).collection('messages');
                await collectionPath.add({
                    type: 'text',
                    text: text,
                    uid: user.uid,
                    author: nickname,
                    timestamp: Date.now()
                });
            } catch (err) { alert("Errore nell'invio."); }
        };

        const inviteUser = async (targetUid, targetName) => {
            if (targetUid === user.uid) return;
            const confirm = window.confirm(`Vuoi invitare ${targetName} in una stanza privata per uno scambio?`);
            if (!confirm) return;

            const secretRoom = `TRADE-${Math.random().toString(36).substring(2, 8).toUpperCase()}`;

            try {
                await db.collection('global_chat').add({
                    type: 'invite',
                    roomCode: secretRoom,
                    uid: user.uid,
                    author: nickname,
                    targetUid: targetUid,
                    targetName: targetName,
                    timestamp: Date.now()
                });
                setCurrentRoom(secretRoom);
            } catch (err) { alert("Errore nell'invito."); }
        };

        const joinPrivateRoom = (e) => {
            e.preventDefault();
            if(!roomInput.trim()) return;
            setCurrentRoom(roomInput.trim().toUpperCase());
            setRoomInput("");
        };

        const sendPayPalLink = async () => {
            let pp = localStorage.getItem('my_paypal_link');
            if(!pp) {
                pp = window.prompt("Inserisci il tuo link PayPal (es. https://paypal.me/tuonome).\nVerrà salvato sul tuo dispositivo.");
                if(!pp) return;
                localStorage.setItem('my_paypal_link', pp);
            }
            await db.collection('chat_rooms').doc(currentRoom).collection('messages').add({
                type: 'text',
                text: `💸 Ciao! Ecco il mio link per il pagamento sicuro: ${pp}`,
                uid: user.uid,
                author: nickname,
                timestamp: Date.now()
            });
        };

        const openShippingService = () => {
            alert("Verrai reindirizzato a Packlink.it per confrontare i corrieri.");
            window.open('https://www.packlink.it/', '_blank');
        };

        const renderMessageText = (text) => {
            if (!text) return ""; 
            const parts = text.split(/\[\[(.*?)\]\]/g);
            return parts.map((part, i) => {
                if (i % 2 === 1) { 
                    return (
                        <span key={i} className="block mt-2 mb-1">
                            <img src={`https://api.scryfall.com/cards/named?fuzzy=${encodeURIComponent(part)}&format=image`} alt={part} onError={(e) => { e.target.style.display = 'none'; e.target.insertAdjacentHTML('afterend', `<span class="text-red-400 font-bold italic">[Carta non trovata: ${part}]</span>`); }} className="w-48 max-w-full rounded-xl shadow-lg border-2 border-gray-500" />
                        </span>
                    );
                } else {
                    const urlRegex = /(https?:\/\/[^\s]+)/g;
                    const textParts = part.split(urlRegex);
                    return textParts.map((t, j) => {
                        if (t.match(urlRegex)) return <a key={j} href={t} target="_blank" rel="noopener noreferrer" className="text-blue-300 font-bold underline hover:text-blue-200">{t}</a>;
                        return <span key={j}>{t}</span>;
                    });
                }
            });
        };

        if (!user) return (
            <div className="flex flex-col items-center justify-center mt-20 p-6 bg-gray-800/90 rounded-xl border border-gray-600 shadow-xl max-w-md mx-auto text-center animate-fade">
                <span className="text-6xl mb-4">🍻</span>
                <h2 className="text-2xl font-black text-white mb-2">La Taverna MTG</h2>
                <button onClick={()=>navigate('backup')} className="w-full mt-4 bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-xl shadow-lg">VAI AL LOGIN</button>
            </div>
        );

        return (
            <div className="flex flex-col h-[calc(100vh-100px)] max-w-2xl mx-auto bg-gray-900 rounded-xl border border-gray-700 mt-2 overflow-hidden shadow-2xl animate-fade relative z-10">
                
                <div className="bg-gray-800 p-4 border-b border-gray-700 shadow-md z-20">
                    <div className="flex justify-between items-center mb-2">
                        {currentRoom === 'global' ? (
                            <h2 className="text-2xl font-black text-emerald-400 drop-shadow-md">🍻 Taverna Globale</h2>
                        ) : (
                            <div className="flex items-center gap-2 w-full">
                                <button onClick={() => setCurrentRoom('global')} className="bg-gray-700 hover:bg-gray-600 text-white px-3 py-1 rounded shadow text-sm font-bold">⬅ Esci</button>
                                <h2 className="text-lg font-black text-yellow-500 truncate">Stanza: {currentRoom}</h2>
                            </div>
                        )}
                        
                        <button onClick={changeNickname} className="ml-2 bg-gray-700 hover:bg-emerald-600 text-white px-3 py-1 rounded-full shadow text-[10px] font-bold border border-gray-500 truncate max-w-[120px] transition-colors" title="Cambia Nickname">
                            👤 {nickname}
                        </button>
                    </div>

                    {currentRoom === 'global' && (
                        <form onSubmit={joinPrivateRoom} className="flex gap-2 mt-2">
                            <input type="text" value={roomInput} onChange={e=>setRoomInput(e.target.value)} placeholder="Inventa un codice (es. SCAMBIO1)..." className="flex-1 bg-gray-900 border border-gray-600 rounded px-3 py-2 text-white font-bold text-sm outline-none focus:border-yellow-500" />
                            <button type="submit" disabled={!roomInput.trim()} className="bg-yellow-600 hover:bg-yellow-500 disabled:opacity-50 text-white font-bold px-4 rounded shadow transition-colors text-sm">Entra</button>
                        </form>
                    )}

                    {currentRoom !== 'global' && (
                        <div className="flex gap-2 mt-3 pt-3 border-t border-gray-700">
                            <button onClick={sendPayPalLink} className="flex-1 bg-[#003087] hover:bg-[#001c52] text-white font-black py-2 rounded shadow text-xs flex items-center justify-center border border-[#0079C1]">💸 Invia PayPal</button>
                            <button onClick={openShippingService} className="flex-1 bg-orange-600 hover:bg-orange-500 text-white font-black py-2 rounded shadow text-xs flex items-center justify-center">📦 Spedizioni</button>
                        </div>
                    )}
                </div>

                <div className="flex-1 overflow-y-auto p-4 space-y-4 flex flex-col bg-black/40 shadow-[inset_0_0_20px_rgba(0,0,0,0.5)]">
                    {messages.length === 0 && <p className="text-center text-gray-500 font-bold mt-10">Nessun messaggio.</p>}
                    
                    {messages.map(m => {
                        if (m.type === 'invite') {
                            if (m.uid !== user.uid && m.targetUid !== user.uid) return null;

                            return (
                                <div key={m.id} className="flex flex-col w-full items-center my-4 animate-fade">
                                    <div className="bg-yellow-900/90 border border-yellow-500 p-4 rounded-xl text-center w-full max-w-[90%] shadow-[0_0_15px_rgba(234,179,8,0.3)]">
                                        <span className="text-3xl block mb-2">📨</span>
                                        <p className="text-white font-bold text-sm">
                                            {m.uid === user.uid ? `Hai invitato ${m.targetName} in privato.` : `${m.author} ti ha invitato in una stanza privata!`}
                                        </p>
                                        <button onClick={() => setCurrentRoom(m.roomCode)} className="mt-3 bg-yellow-500 hover:bg-yellow-400 text-black font-black py-2 px-6 rounded-lg shadow-lg active:scale-95 transition-all">
                                            ENTRA NELLA STANZA
                                        </button>
                                    </div>
                                </div>
                            );
                        }

                        const isMe = m.uid === user.uid;
                        return (
                            <div key={m.id} className={`flex flex-col max-w-[85%] ${isMe ? 'self-end items-end' : 'self-start items-start'} animate-fade`}>
                                <span 
                                    onClick={() => (currentRoom === 'global' && !isMe) ? inviteUser(m.uid, m.author) : null}
                                    className={`text-[10px] text-gray-400 font-bold mb-1 ml-1 ${currentRoom === 'global' && !isMe ? 'cursor-pointer hover:text-yellow-400 hover:underline' : ''}`}
                                    title={currentRoom === 'global' && !isMe ? `Clicca per invitare ${m.author} in privato` : ""}
                                >
                                    {m.author || 'Anonimo'}
                                </span>
                                
                                <div className={`p-3 rounded-2xl shadow-lg font-semibold text-sm ${isMe ? 'bg-emerald-700 text-white rounded-tr-none' : 'bg-gray-800 border border-gray-700 text-gray-100 rounded-tl-none'}`}>
                                    {renderMessageText(m.text)}
                                </div>
                            </div>
                        );
                    })}
                    <div ref={messagesEndRef} />
                </div>

                <div className="bg-gray-900 border-t border-gray-700 p-2 px-4 text-center">
                    <p className="text-[10px] text-gray-400 font-bold uppercase tracking-wide">
                        ⚠️ Info Chat: Scrivi le carte tra parentesi (es. <span className="text-emerald-400">[[Sol Ring]]</span>). <br/>
                        <span className="text-yellow-400">💡 NOVITÀ: Clicca sul nome di un utente per invitarlo in privato!</span>
                    </p>
                </div>

                <form onSubmit={sendMessage} className="p-3 bg-gray-800 border-t border-gray-700 flex gap-2 z-20">
                    <input type="text" value={newMessage} onChange={e=>setNewMessage(e.target.value)} placeholder="Scrivi messaggio o [[Carta]]..." className="flex-1 bg-gray-900 border border-gray-600 rounded-full px-5 text-white font-bold outline-none focus:border-emerald-500 shadow-inner" />
                    <button type="submit" disabled={!newMessage.trim()} className="bg-emerald-600 hover:bg-emerald-500 disabled:bg-gray-600 disabled:opacity-50 w-12 h-12 rounded-full flex items-center justify-center text-white font-black shadow-lg transition-all active:scale-95">➤</button>
                </form>
            </div>
        );
    }

    // --- STRUMENTI PRO: BUDGETIZZATORE E COMBO FINDER MANUALE ---
    const ProTools = ({ navigate }) => {
        const [targetCard, setTargetCard] = useState("");
        const [budgetResults, setBudgetResults] = useState([]);
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState("");
        
        // STATO PER LA LISTA INCOLLATA MANUALMENTE
        const [manualDeckList, setManualDeckList] = useState("");

        const findCombosManual = () => {
            if (!manualDeckList.trim()) {
                alert("Incolla una lista di carte nel riquadro prima di cercare le combo!");
                return;
            }
            navigator.clipboard.writeText(manualDeckList).then(() => {
                alert("🪄 Lista copiata negli appunti!\n\nTi sto portando su Commander Spellbook. Fai 'Incolla' nel loro box di ricerca per scoprire se in questa lista ci sono combo infinite.");
                window.open('https://commanderspellbook.com/find-my-combos/', '_blank');
            }).catch(err => alert("Errore nel copiare la lista. Riprova."));
        };

        const findCheapAlternatives = async (e) => {
            e.preventDefault();
            if (!targetCard.trim()) return;
            setLoading(true);
            setError("");
            setBudgetResults([]);

            try {
                const res = await fetch(`https://api.scryfall.com/cards/named?fuzzy=${encodeURIComponent(targetCard)}`);
                if (!res.ok) throw new Error("Carta non trovata. Scrivi il nome in inglese correttamente.");
                const cardData = await res.json();

                const typeLine = cardData.type_line || "";
                let typeQuery = "";
                if (typeLine.includes("Creature")) typeQuery = "t:creature";
                else if (typeLine.includes("Enchantment")) typeQuery = "t:enchantment";
                else if (typeLine.includes("Artifact")) typeQuery = "t:artifact";
                else if (typeLine.includes("Instant")) typeQuery = "t:instant";
                else if (typeLine.includes("Sorcery")) typeQuery = "t:sorcery";
                else if (typeLine.includes("Planeswalker")) typeQuery = "t:planeswalker";
                else typeQuery = "t:land";

                const colorQuery = cardData.colors && cardData.colors.length > 0 ? `c<=${cardData.colors.join('')}` : "c:c";

                const searchQ = `${typeQuery} ${colorQuery} eur<3 -name:"${cardData.name}" sort:edhrec`;
                const altRes = await fetch(`https://api.scryfall.com/cards/search?q=${encodeURIComponent(searchQ)}`);
                if (!altRes.ok) throw new Error("Nessuna alternativa economica trovata per questi parametri.");
                const altData = await altRes.json();
                
                setBudgetResults(altData.data.slice(0, 5));
            } catch (err) {
                setError(err.message);
            }
            setLoading(false);
        };

        return (
            <div className="flex flex-col h-[calc(100vh-100px)] max-w-2xl mx-auto bg-gray-900 rounded-xl border border-gray-700 mt-2 overflow-y-auto shadow-2xl animate-fade relative z-10 p-4 space-y-8">
                
                <div className="text-center border-b border-gray-700 pb-4">
                    <h2 className="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-emerald-500 drop-shadow-md">🛠️ Strumenti Pro</h2>
                    <p className="text-gray-400 text-sm font-bold mt-1">Sblocca il vero potenziale del tuo deckbuilding.</p>
                </div>

                {/* SEZIONE 1: COMBO FINDER MANUALE */}
                <div className="bg-gray-800 rounded-xl p-5 border border-gray-600 shadow-lg">
                    <div className="flex items-center gap-3 mb-3">
                        <span className="text-3xl">♾️</span>
                        <h3 className="text-xl font-black text-white">Combo Checker Universale</h3>
                    </div>
                    <p className="text-gray-300 text-sm font-semibold mb-4">Incolla qui una lista presa da Moxfield, Deckstats o mandata da un amico. Scopri subito se contiene combo infinite.</p>
                    
                    <textarea
