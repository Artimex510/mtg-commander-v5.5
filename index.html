<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MTG Commander Companion</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-storage-compat.js"></script>

  <style>
    body { -webkit-font-smoothing: antialiased; overflow-x: hidden; user-select: none; -webkit-touch-callout: none; background-color: #000; }
    .animate-fade { animation: fadeIn 0.2s ease-in-out; forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
    button { touch-action: manipulation; }
    
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

    @media print {
      body { background: white !important; color: black; }
      .no-print { display: none !important; }
      .print-grid { display: grid; grid-template-columns: repeat(3, 63mm); gap: 2mm; justify-content: center; }
      .print-card { width: 63mm; height: 88mm; object-fit: cover; border-radius: 3mm; margin-bottom: 2mm; page-break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyBKfSnZ7ujw5uYZ_RnlM034exD28jfMunQ",
      authDomain: "mtg-for-fun-bf36b.firebaseapp.com",
      projectId: "mtg-for-fun-bf36b",
      storageBucket: "mtg-for-fun-bf36b.firebasestorage.app",
      messagingSenderId: "742946721330",
      appId: "1:742946721330:web:3cb566ddd6c8b9ada7362b"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();

    const syncToCloud = async (uid) => {
      try {
        let rawDecks = [];
        try { rawDecks = JSON.parse(localStorage.getItem('mtg_decks')) || []; } catch(e){}
        if (!Array.isArray(rawDecks)) rawDecks = [];

        const cleanCard = (c) => { 
            if (!c) return c;
            let newC = { ...c };
            if (newC.isCustom || 
               (typeof newC.proxyImage === 'string' && newC.proxyImage.startsWith('data:image')) || 
               (typeof newC.image === 'string' && newC.image.startsWith('data:image')) ||
               (typeof newC.imageBack === 'string' && newC.imageBack.startsWith('data:image'))) { 
                newC.proxyImage = ""; 
                newC.image = ""; 
                newC.imageBack = "";
            } 
            return newC; 
        };
        
        const decksToCloud = rawDecks.map(deck => ({ ...deck, cards: (deck.cards || []).map(cleanCard) }));
        
        let rawCart = { singles: [], decks: [], lastUpdated: Date.now() };
        try { 
            const parsedCart = JSON.parse(localStorage.getItem('mtg_cart'));
            if (parsedCart && typeof parsedCart === 'object') rawCart = { ...rawCart, ...parsedCart };
        } catch(e){}
        
        const cartToCloud = { 
            ...rawCart, 
            singles: (rawCart.singles || []).map(cleanCard), 
            decks: (rawCart.decks || []).map(d => ({ ...d, cards: (d.cards || []).map(cleanCard) })) 
        };

        await db.collection('users').doc(uid).set({ 
            decks: decksToCloud, 
            cart: cartToCloud, 
            lastSync: new Date().toISOString() 
        }, { merge: true });

      } catch (err) { 
          console.error("Errore salvataggio Firebase:", err);
          alert("Firebase ha bloccato il salvataggio!\nMotivo: " + err.message); 
      }
    };

    const syncFromCloud = async (uid) => {
      try {
          const doc = await db.collection('users').doc(uid).get();
          if(doc.exists) {
            const data = doc.data();
            if(data.decks) localStorage.setItem('mtg_decks', JSON.stringify(data.decks));
            if(data.cart) localStorage.setItem('mtg_cart', JSON.stringify(data.cart));
            return true;
          }
          return false;
      } catch(err) { console.error("Errore syncFromCloud:", err); return false; }
    };

    const syncSingleProxyToCloud = async (uid, proxy) => {};
    const deleteProxyFromCloud = async (uid, proxyId) => {};

    const Icons = {
      Menu: () => <svg className="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16"/></svg>,
      Home: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 001 1m-6 0h6"/></svg>,
      Back: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
    };

    const ManaColors = [
      { id: 'W', color: 'bg-yellow-100 text-yellow-900', label: 'W' },
      { id: 'U', color: 'bg-blue-500 text-white', label: 'U' },
      { id: 'B', color: 'bg-gray-800 text-white', label: 'B' },
      { id: 'R', color: 'bg-red-500 text-white', label: 'R' },
      { id: 'G', color: 'bg-green-500 text-white', label: 'G' },
      { id: 'C', color: 'bg-gray-400 text-gray-900', label: 'C' }
    ];

    const getCardCategory = (card) => {
        if (card.isSideboard) return "Sideboard";
        if (card.isCompanion || card.isCompFlag) return "Companion"; 
        if (card.isCmdrFlag || card.isCommander) return "Comandante";
        const t = (card.type || "").toLowerCase();
        if (t.includes("creature")) return "Creature";
        if (t.includes("planeswalker")) return "Planeswalker";
        if (t.includes("instant")) return "Istantanei";
        if (t.includes("sorcery")) return "Stregonerie";
        if (t.includes("artifact")) return "Artefatti";
        if (t.includes("enchantment")) return "Incantesimi";
        if (t.includes("land")) return "Terre";
        return "Altro";
    };
    const categoriesOrder = ["Comandante", "Companion", "Creature", "Planeswalker", "Istantanei", "Stregonerie", "Artefatti", "Incantesimi", "Terre", "Altro", "Sideboard"];

    const buildCardKey = (c) => c.name + (c.isCustom ? c.proxyImage : "") + c.id + !!c.isSideboard + !!c.isCommander + !!c.isCompanion;
    
    const addToCart = (type, item) => {
        let cart = JSON.parse(localStorage.getItem('mtg_cart') || '{"singles":[], "decks":[], "lastUpdated":0}');
        if (!cart.singles) cart.singles = [];
        if (!cart.decks) cart.decks = [];
        
        if (type === 'single') {
            cart.singles.push(item);
            alert(`${item.name} aggiunto al Carrello!`);
        } else {
            cart.decks.push(item);
            alert(`Mazzo "${item.name}" aggiunto al Carrello!`);
        }
        
        cart.lastUpdated = Date.now();
        localStorage.setItem('mtg_cart', JSON.stringify(cart));
        
        const user = firebase.auth().currentUser;
        if (user) syncToCloud(user.uid).catch(e => console.error("Errore Sync Carrello:", e));
    };

    const TradeEvaluator = ({ setView }) => {
        const [leftCards, setLeftCards] = useState([]);
        const [rightCards, setRightCards] = useState([]);
        const [searchQ, setSearchQ] = useState("");
        const [searchResults, setSearchResults] = useState([]);
        const [activeSide, setActiveSide] = useState(null);

        const searchCardForTrade = (e) => {
            e.preventDefault();
            if (!searchQ.trim()) return;
            fetch(`https://api.scryfall.com/cards/search?q=${encodeURIComponent(searchQ.trim())}`)
                .then(res => res.json())
                .then(data => {
                    if (data && data.data) { setSearchResults(data.data.slice(0, 10)); } 
                    else { setSearchResults([]); }
                }).catch(() => setSearchResults([]));
        };

        const addCardToTrade = (card) => {
            let price = 0;
            if (card && card.prices && typeof card.prices === 'object' && card.prices.eur) { price = parseFloat(card.prices.eur) || 0; }
            let imgUrl = "";
            if (card && card.image_uris && card.image_uris.normal) {
                imgUrl = card.image_uris.normal;
            } else if (card && card.card_faces && card.card_faces.length > 0 && card.card_faces[0].image_uris && card.card_faces[0].image_uris.normal) {
                imgUrl = card.card_faces[0].image_uris.normal;
            }
            const tradeCard = { id: (card && card.id ? card.id : 'trade') + Math.random(), name: card && card.name ? card.name : "Sconosciuta", price: price, img: imgUrl };
            if (activeSide === 'left') setLeftCards([...leftCards, tradeCard]);
            if (activeSide === 'right') setRightCards([...rightCards, tradeCard]);
            setSearchResults([]); setSearchQ(""); setActiveSide(null);
        };

        const removeCard = (id, side) => {
            if (side === 'left') setLeftCards(leftCards.filter(c => c.id !== id));
            if (side === 'right') setRightCards(rightCards.filter(c => c.id !== id));
        };

        const leftTotal = leftCards.reduce((acc, c) => acc + c.price, 0);
        const rightTotal = rightCards.reduce((acc, c) => acc + c.price, 0);
        const diff = Math.abs(leftTotal - rightTotal).toFixed(2);
        
        let verdict = "SCAMBIO EQUO ⚖️"; let verdictColor = "text-yellow-400";
        if (leftTotal > rightTotal + 0.5) { verdict = "TU CI PERDI 📉"; verdictColor = "text-red-500"; }
        if (rightTotal > leftTotal + 0.5) { verdict = "TU CI GUADAGNI 📈"; verdictColor = "text-green-500"; }

        return (
            <div className="max-w-4xl mx-auto space-y-4 p-4 text-white animate-fade">
                <button onClick={() => setView('home')} className="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded font-bold mb-2">⬅ Torna Indietro</button>
                <div className="bg-gray-800 p-6 rounded-xl border-2 border-orange-500 shadow-2xl">
                    <h2 className="text-3xl font-black text-white text-center mb-6">⚖️ Bilancia Scambi</h2>
                    <div className="bg-gray-900 p-4 rounded-xl text-center border border-gray-600 mb-6">
                        <p className="text-gray-400 text-sm font-bold uppercase mb-1">Valutazione Scambio</p>
                        <p className={`text-3xl font-black ${verdictColor}`}>{verdict}</p>
                        {diff > 0 && <p className="text-white font-bold mt-2">Differenza di valore: <span className="text-orange-400">€{diff}</span></p>}
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="bg-gray-900 p-4 rounded-xl border border-blue-500 flex flex-col">
                            <h3 className="text-xl font-black text-blue-400 text-center mb-2">IO DO</h3>
                            <p className="text-4xl font-black text-white text-center mb-4">€{leftTotal.toFixed(2)}</p>
                            <button onClick={() => setActiveSide('left')} className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded-lg mb-4">+ Aggiungi Carta</button>
                            <div className="space-y-2 flex-1">
                                {leftCards.map(c => (
                                    <div key={c.id} className="flex justify-between items-center bg-gray-800 p-2 rounded border border-gray-600">
                                        <span className="text-white font-bold text-sm truncate flex-1">{c.name}</span>
                                        <span className="text-emerald-400 font-black mx-2">€{c.price.toFixed(2)}</span>
                                        <button onClick={() => removeCard(c.id, 'left')} className="text-red-500 font-black px-2">X</button>
                                    </div>
                                ))}
                            </div>
                        </div>
                        <div className="bg-gray-900 p-4 rounded-xl border border-red-500 flex flex-col">
                            <h3 className="text-xl font-black text-red-400 text-center mb-2">TU DAI</h3>
                            <p className="text-4xl font-black text-white text-center mb-4">€{rightTotal.toFixed(2)}</p>
                            <button onClick={() => setActiveSide('right')} className="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-2 rounded-lg mb-4">+ Aggiungi Carta</button>
                            <div className="space-y-2 flex-1">
                                {rightCards.map(c => (
                                    <div key={c.id} className="flex justify-between items-center bg-gray-800 p-2 rounded border border-gray-600">
                                        <span className="text-white font-bold text-sm truncate flex-1">{c.name}</span>
                                        <span className="text-emerald-400 font-black mx-2">€{c.price.toFixed(2)}</span>
                                        <button onClick={() => removeCard(c.id, 'right')} className="text-red-500 font-black px-2">X</button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
                {activeSide && (
                    <div className="fixed inset-0 bg-black/90 flex items-center justify-center z-[9999] p-4">
                        <div className="bg-gray-800 p-6 rounded-xl w-full max-w-md border border-gray-600 shadow-2xl">
                            <div className="flex justify-between items-center mb-4">
                                <h3 className="text-white font-bold text-xl">Cerca Carta per Scambio</h3>
                                <button onClick={() => setActiveSide(null)} className="text-gray-400 text-2xl font-black">✕</button>
                            </div>
                            <form onSubmit={searchCardForTrade} className="flex gap-2 mb-4">
                                <input type="text" value={searchQ} onChange={e=>setSearchQ(e.target.value)} placeholder="Nome carta..." className="flex-1 bg-gray-900 text-white p-3 rounded-lg outline-none border border-gray-700" autoFocus />
                                <button type="submit" className="bg-orange-600 hover:bg-orange-500 text-white font-bold px-4 rounded-lg">Cerca</button>
                            </form>
                            <div className="max-h-64 overflow-y-auto space-y-2">
                                {searchResults.map(res => {
                                    let p = (res && res.prices && typeof res.prices === 'object' && res.prices.eur) ? res.prices.eur : "0.00";
                                    return (
                                        <div key={res.id} onClick={() => addCardToTrade(res)} className="bg-gray-900 p-3 rounded border border-gray-700 flex justify-between items-center cursor-pointer hover:border-orange-500">
                                            <span className="text-white font-bold text-sm">{res.name}</span>
                                            <span className="text-emerald-400 font-black text-xs">€{p}</span>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                )}
            </div>
        );
    };

    const ProxyPrintArea = ({ printQueue, setPrintQueue, setView }) => {
        useEffect(() => {
            const style = document.createElement('style');
            style.innerHTML = `
                @media print {
                    body * { visibility: hidden; }
                    #print-area, #print-area * { visibility: visible; }
                    #print-area { position: absolute; left: 0; top: 0; width: 210mm; margin: 0; padding: 0; }
                    .no-print { display: none !important; }
                    @page { margin: 5mm; }
                }
            `;
            document.head.appendChild(style);
            return () => document.head.removeChild(style);
        }, []);

        const removeFromQueue = (index) => { const newQ = [...printQueue]; newQ.splice(index, 1); setPrintQueue(newQ); };
        const clearQueue = () => { if(window.confirm("Vuoi svuotare tutta l'area di stampa?")) setPrintQueue([]); };

        return (
            <div className="max-w-4xl mx-auto p-4 text-white animate-fade">
                <div className="no-print flex flex-wrap justify-between items-center mb-6 bg-gray-800 p-4 rounded-xl border border-gray-600 shadow-xl">
                    <button onClick={() => setView('home')} className="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded font-bold">⬅ Torna Indietro</button>
                    <div className="text-center">
                        <h2 className="text-2xl font-black text-white">🖨️ Area di Stampa Proxy</h2>
                        <p className="text-gray-400 text-sm font-bold">{printQueue.length} carte in coda</p>
                    </div>
                    <div className="flex gap-2">
                        <button onClick={clearQueue} className="bg-red-700 hover:bg-red-600 text-white px-4 py-2 rounded font-bold">Svuota</button>
                        <button onClick={() => window.print()} className="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2 rounded-lg font-black shadow-lg">STAMPA FOGLIO A4</button>
                    </div>
                </div>
                <div id="print-area" className="bg-white mx-auto flex flex-wrap content-start p-4" style={{ width: '210mm', minHeight: '297mm' }}>
                    {printQueue.map((card, idx) => (
                        <div key={idx} className="relative group" style={{ width: '63.5mm', height: '88.9mm', margin: '1.5mm' }}>
                            <img src={card.img} alt={card.name} className="w-full h-full object-cover rounded-[3mm] border border-black" />
                            <button onClick={() => removeFromQueue(idx)} className="no-print absolute top-2 right-2 bg-red-600 text-white font-black w-8 h-8 rounded-full opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center shadow-lg">X</button>
                        </div>
                    ))}
                    {printQueue.length === 0 && <p className="no-print text-gray-500 text-xl font-bold w-full text-center mt-20">L'area di stampa è vuota.</p>}
                </div>
            </div>
        );
    };

    const CollectionBinder = ({ navigate, collection, setCollection, mtgSets }) => {
        const [searchQ, setSearchQ] = useState("");
        const [activeFolder, setActiveFolder] = useState("Tutte");
        const [colorFilter, setColorFilter] = useState([]);
        const [typeFilter, setTypeFilter] = useState("");
        const [rarityFilter, setRarityFilter] = useState("");
        const [expFilter, setExpFilter] = useState("");
        const [viewMode, setViewMode] = useState("album");
        const [albumPage, setAlbumPage] = useState(0);

        const folders = ["Tutte", "Generale", "Scambi", "Di Valore", "Da Vendere"];
        const toggleColor = (m) => setColorFilter(colorFilter.includes(m) ? colorFilter.filter(x => x !== m) : [...colorFilter, m]);

        const updateCard = (id, newQty, newFolder) => {
            if (newQty <= 0) {
                if(window.confirm("Rimuovere questa carta dal raccoglitore?")) setCollection((collection || []).filter(c => c.id !== id));
            } else {
                setCollection((collection || []).map(c => c.id === id ? { ...c, qty: newQty, folder: newFolder } : c));
            }
        };

        const rarityVal = { "mythic": 4, "rare": 3, "uncommon": 2, "common": 1 };
        const colorVal = (colors) => {
            if (!colors || colors.length === 0) return 6;
            if (colors.length > 1) return 7;
            const order = { 'W':1, 'U':2, 'B':3, 'R':4, 'G':5 };
            return order[colors[0]] || 8;
        };

        let processedCollection = [...(collection || [])].sort((a, b) => {
            if (colorVal(a.colors) !== colorVal(b.colors)) return colorVal(a.colors) - colorVal(b.colors);
            const tA = (a.type || "").split(' ')[0]; const tB = (b.type || "").split(' ')[0];
            if (tA !== tB) return tA.localeCompare(tB);
            const rA = rarityVal[a.rarity] || 0; const rB = rarityVal[b.rarity] || 0;
            if (rA !== rB) return rB - rA; 
            const sA = a.setName || ""; const sB = b.setName || "";
            if (sA !== sB) return sA.localeCompare(sB);
            return (a.name || "").localeCompare(b.name || "");
        });

        processedCollection = processedCollection.filter(c => {
            const matchName = (c.name || "").toLowerCase().includes(searchQ.toLowerCase()) || (c.setName || "").toLowerCase().includes(searchQ.toLowerCase());
            const matchFolder = activeFolder === "Tutte" || c.folder === activeFolder;
            let matchColor = true;
            if (colorFilter.length > 0) {
                if (!c.colors || c.colors.length === 0) matchColor = colorFilter.includes('C');
                else matchColor = colorFilter.some(col => c.colors.includes(col));
            }
            const matchType = typeFilter === "" || (c.type || "").toLowerCase().includes(typeFilter.toLowerCase());
            const matchRarity = rarityFilter === "" || (c.rarity || "") === rarityFilter;
            const matchExp = expFilter === "" || (c.setCode || "") === expFilter;
            return matchName && matchFolder && matchColor && matchType && matchRarity && matchExp;
        });

        useEffect(() => { setAlbumPage(0); }, [searchQ, activeFolder, colorFilter, typeFilter, rarityFilter, expFilter, viewMode]);

        const exportCollection = () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(collection));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "mtg_collection_backup.json");
            document.body.appendChild(downloadAnchorNode); downloadAnchorNode.click(); downloadAnchorNode.remove();
        };

        const importCollection = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const imported = JSON.parse(event.target.result);
                    if (Array.isArray(imported)) { setCollection(imported); alert("✅ Collezione importata con successo!"); } else { alert("❌ File non valido."); }
                } catch (err) { alert("❌ Errore nella lettura del file."); }
            };
            reader.readAsText(file);
        };

        const totalValue = processedCollection.reduce((acc, c) => acc + ((c.price || 0) * (c.qty || 1)), 0);
        const totalCards = processedCollection.reduce((acc, c) => acc + (c.qty || 1), 0);
        const CARDS_PER_PAGE = 9;
        const totalPages = Math.max(1, Math.ceil(processedCollection.length / CARDS_PER_PAGE));
        const currentAlbumCards = processedCollection.slice(albumPage * CARDS_PER_PAGE, (albumPage + 1) * CARDS_PER_PAGE);

        return (
            <div className="max-w-4xl mx-auto space-y-4 p-4 text-white animate-fade pb-20">
                <div className="bg-gray-800 p-6 rounded-xl border border-gray-600 shadow-xl">
                    <div className="flex justify-between items-center mb-6 border-b border-gray-700 pb-4">
                        <button onClick={() => navigate('home')} className="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded font-bold shadow">⬅ Home</button>
                        <h2 className="text-3xl font-black text-emerald-400 drop-shadow-md text-center hidden md:block">📚 La Mia Collezione</h2>
                        <div className="flex gap-2">
                            <button onClick={()=>setViewMode('album')} className={`px-3 py-2 rounded font-black text-lg ${viewMode==='album' ? 'bg-indigo-600 text-white shadow-lg' : 'bg-gray-900 text-gray-500 border border-gray-600'}`}>📖</button>
                            <button onClick={()=>setViewMode('list')} className={`px-3 py-2 rounded font-black text-lg ${viewMode==='list' ? 'bg-indigo-600 text-white shadow-lg' : 'bg-gray-900 text-gray-500 border border-gray-600'}`}>📄</button>
                        </div>
                    </div>
                    <div className="grid grid-cols-2 gap-4 mb-4">
                        <div className="bg-gray-900 p-3 rounded-xl border border-gray-700 text-center shadow-inner"><p className="text-gray-400 text-xs font-bold uppercase mb-1">Carte Visibili</p><p className="text-2xl font-black text-white">{totalCards}</p></div>
                        <div className="bg-gray-900 p-3 rounded-xl border border-emerald-500 text-center shadow-[inset_0_0_15px_rgba(16,185,129,0.2)]"><p className="text-emerald-400 text-xs font-bold uppercase mb-1">Valore Stimato</p><p className="text-2xl font-black text-white">€ {totalValue.toFixed(2)}</p></div>
                    </div>
                    <div className="flex flex-wrap gap-2 mb-6">
                        <button onClick={() => navigate('cardsearch')} className="flex-1 min-w-[200px] bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3 px-4 rounded-xl shadow-lg border border-emerald-400 flex items-center justify-center gap-2 text-lg active:scale-95 transition-all">➕ Aggiungi Carte</button>
                        <button onClick={exportCollection} className="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-4 rounded-xl shadow border border-indigo-400 flex items-center gap-2 active:scale-95 transition-all" title="Scarica Backup">💾</button>
                        <label className="bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 px-4 rounded-xl shadow border border-gray-500 flex items-center gap-2 cursor-pointer active:scale-95 transition-all" title="Importa Backup">📂<input type="file" accept=".json" onChange={importCollection} className="hidden" /></label>
                    </div>
                    <div className="bg-gray-900 p-4 rounded-xl border border-gray-700 mb-6 shadow-md space-y-4">
                        <div className="flex overflow-x-auto gap-2 pb-2">
                            {folders.map(f => (<button key={f} onClick={() => setActiveFolder(f)} className={`px-4 py-1 rounded-lg font-bold text-sm shrink-0 transition-colors shadow ${activeFolder === f ? 'bg-emerald-600 text-white' : 'bg-gray-700 text-gray-300'}`}>{f}</button>))}
                        </div>
                        <div className="flex gap-2">
                            <input type="text" placeholder="Cerca carta o espansione..." value={searchQ} onChange={e=>setSearchQ(e.target.value)} className="flex-1 bg-gray-800 border border-gray-600 rounded p-2 text-white font-bold outline-none focus:border-emerald-500 text-sm" />
                            <select value={expFilter} onChange={e => setExpFilter(e.target.value)} className="w-1/3 bg-gray-800 border border-gray-600 rounded p-2 text-white text-sm outline-none focus:border-emerald-500 truncate font-bold">
                                <option value="">Tutte le Espansioni</option>{(mtgSets || []).map(set => (<option key={set.code} value={set.code}>{set.name}</option>))}
                            </select>
                        </div>
                        <div className="flex gap-2 overflow-x-auto pb-1 items-center">
                            {ManaColors.map(m => (<button key={m.id} onClick={() => toggleColor(m.id)} className={`w-8 h-8 shrink-0 rounded-full flex items-center justify-center font-bold border-2 ${colorFilter.includes(m.id) ? 'border-white scale-110 shadow-[0_0_10px_rgba(255,255,255,0.5)]' : 'border-transparent opacity-40'} ${m.color}`}>{m.id}</button>))}
                            <div className="w-px h-6 bg-gray-700 mx-2 shrink-0"></div>
                            <select value={typeFilter} onChange={e=>setTypeFilter(e.target.value)} className="bg-gray-800 text-white text-xs font-bold p-2 rounded border border-gray-600 outline-none shrink-0"><option value="">Tutti i Tipi</option><option value="creature">Creature</option><option value="artifact">Artefatti</option><option value="enchantment">Incantesimi</option><option value="instant">Istantanei</option><option value="sorcery">Stregonerie</option><option value="planeswalker">Planeswalker</option><option value="land">Terre</option></select>
                            <select value={rarityFilter} onChange={e=>setRarityFilter(e.target.value)} className="bg-gray-800 text-white text-xs font-bold p-2 rounded border border-gray-600 outline-none shrink-0"><option value="">Tutte Rarità</option><option value="mythic">Mitiche</option><option value="rare">Rare</option><option value="uncommon">Non Comuni</option><option value="common">Comuni</option></select>
                        </div>
                    </div>
                    {viewMode === 'album' && (
                        <div className="animate-fade">
                            <div className="bg-black/60 p-4 sm:p-8 rounded-2xl shadow-[inset_0_0_30px_rgba(0,0,0,0.8)] border border-gray-700 mb-4 min-h-[50vh] flex flex-col justify-between" style={{ backgroundImage: "url('https://www.transparenttextures.com/patterns/black-scales.png')" }}>
                                {currentAlbumCards.length === 0 ? (
                                    <div className="flex-1 flex items-center justify-center"><p className="text-gray-500 font-black text-xl py-12">Pagina Vuota</p></div>
                                ) : (
                                    <div className="grid grid-cols-3 gap-2 sm:gap-4 md:gap-6 mx-auto w-full">
                                        {currentAlbumCards.map(c => (
                                            <div key={c.id} className="relative group perspective-1000">
                                                <img src={c.img || "mtg-bg.jpg"} className="w-full rounded-lg shadow-[0_5px_15px_rgba(0,0,0,0.8)] border border-black/50 transition-transform group-hover:scale-105 group-hover:z-10" />
                                                <div className="absolute -bottom-3 -right-2 bg-blue-600 text-white font-black text-xs w-7 h-7 flex items-center justify-center rounded-full border-2 border-black shadow-lg z-20">{c.qty}</div>
                                                <div className="absolute inset-0 bg-black/90 opacity-0 group-hover:opacity-100 transition-opacity rounded-lg z-30 flex flex-col justify-center items-center p-2 text-center border border-gray-500 backdrop-blur-sm">
                                                    <p className="text-yellow-400 font-black text-lg drop-shadow-md">€ {((c.price||0)*c.qty).toFixed(2)}</p>
                                                    <p className="text-[10px] text-gray-300 truncate w-full uppercase mb-2">{c.setName || "Set"}</p>
                                                    <div className="flex gap-4 mt-4 bg-gray-900/80 p-2 rounded-xl border border-gray-600">
                                                        <button onClick={()=>updateCard(c.id, c.qty-1, c.folder)} className="w-10 h-10 bg-red-600 text-white font-black rounded-lg text-xl hover:bg-red-500 active:scale-90">-</button>
                                                        <button onClick={()=>updateCard(c.id, c.qty+1, c.folder)} className="w-10 h-10 bg-green-600 text-white font-black rounded-lg text-xl hover:bg-green-500 active:scale-90">+</button>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                            <div className="flex items-center justify-center gap-6 bg-gray-900 p-3 rounded-full border border-gray-700 w-max mx-auto shadow-xl">
                                <button onClick={()=>setAlbumPage(Math.max(0, albumPage-1))} disabled={albumPage === 0} className="w-12 h-12 bg-indigo-600 disabled:bg-gray-700 text-white font-black rounded-full shadow-lg text-xl active:scale-90 flex items-center justify-center transition-all">⬅</button>
                                <span className="font-black text-gray-300 tracking-widest text-lg">PAG {albumPage + 1} / {totalPages}</span>
                                <button onClick={()=>setAlbumPage(Math.min(totalPages-1, albumPage+1))} disabled={albumPage >= totalPages-1} className="w-12 h-12 bg-indigo-600 disabled:bg-gray-700 text-white font-black rounded-full shadow-lg text-xl active:scale-90 flex items-center justify-center transition-all">➡</button>
                            </div>
                        </div>
                    )}
                    {viewMode === 'list' && (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3 animate-fade">
                            {processedCollection.length === 0 ? ( <p className="text-gray-500 text-center col-span-full py-10 font-bold">Nessuna carta corrisponde ai filtri.</p> ) : (
                                processedCollection.map(c => (
                                    <div key={c.id} className="bg-gray-900 flex gap-3 p-2 rounded-xl border border-gray-700 shadow relative overflow-hidden group">
                                        <div className={`absolute left-0 top-0 bottom-0 w-1 ${c.rarity==='mythic' ? 'bg-orange-500' : (c.rarity==='rare' ? 'bg-yellow-500' : (c.rarity==='uncommon' ? 'bg-gray-400' : 'bg-black'))}`}></div>
                                        <img src={c.img || "mtg-bg.jpg"} className="w-16 rounded object-cover shadow-md border border-black ml-2" />
                                        <div className="flex-1 flex flex-col justify-between py-1 overflow-hidden pr-2">
                                            <div>
                                                <h4 className="font-bold text-white text-sm truncate pr-1">{c.name}</h4>
                                                <div className="flex justify-between items-center mt-1">
                                                    <p className="text-[10px] text-gray-400 truncate uppercase w-2/3" title={c.setName}>{c.setName || "Set Sconosciuto"}</p>
                                                    <p className="text-emerald-400 font-black text-xs">€ {((c.price || 0) * c.qty).toFixed(2)}</p>
                                                </div>
                                            </div>
                                            <div className="flex justify-between items-end mt-2">
                                                <select value={c.folder} onChange={(e) => updateCard(c.id, c.qty, e.target.value)} className="bg-gray-800 border border-gray-600 text-gray-300 text-[10px] rounded p-1 outline-none font-bold">
                                                    {folders.filter(f=>f!=="Tutte").map(f => <option key={f} value={f}>{f}</option>)}
                                                </select>
                                                <div className="flex items-center bg-gray-800 rounded px-1 border border-gray-600 shadow-inner">
                                                    <button onClick={() => updateCard(c.id, c.qty - 1, c.folder)} className="text-red-500 font-black text-lg px-3 py-1 active:scale-90">-</button>
                                                    <span className="font-black text-white w-6 text-center">{c.qty}</span>
                                                    <button onClick={() => updateCard(c.id, c.qty + 1, c.folder)} className="text-green-500 font-black text-lg px-3 py-1 active:scale-90">+</button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>
                    )}
                </div>
            </div>
        );
    };

    const CardDetailsTabs = ({ card }) => {
        const [activeTab, setActiveTab] = useState('legalita');
        const [rulings, setRulings] = useState([]);
        const [loading, setLoading] = useState(false);

        const formatsToShow = ['standard', 'pioneer', 'modern', 'legacy', 'vintage', 'commander', 'pauper'];

        useEffect(() => {
            if (activeTab === 'regolamento' && rulings.length === 0 && card && !card.isCustom) {
                const scryfallId = card.scryfallId || card.id;
                if(scryfallId && !scryfallId.toString().startsWith('coll-') && !scryfallId.toString().startsWith('tok-') && !scryfallId.toString().startsWith('trade-')) {
                    setLoading(true);
                    fetch(`https://api.scryfall.com/cards/${scryfallId}/rulings`)
                        .then(res => res.json())
                        .then(data => setRulings(data.data || []))
                        .catch(() => setRulings([]))
                        .finally(() => setLoading(false));
                }
            }
        }, [activeTab, card]);

        if (!card || card.isCustom) return null;

        return (
            <div className="w-full max-w-sm mt-4 bg-gray-900 rounded-xl border border-gray-700 overflow-hidden shadow-inner shrink-0 mb-4">
                <div className="flex bg-gray-950 p-1 rounded-t-xl">
                    <button onClick={() => setActiveTab('legalita')} className={`flex-1 py-2 text-sm font-black rounded-lg transition-all ${activeTab === 'legalita' ? 'bg-indigo-500 text-white shadow-md' : 'text-gray-400 hover:text-white'}`}>Legalità</button>
                    <button onClick={() => setActiveTab('regolamento')} className={`flex-1 py-2 text-sm font-black rounded-lg transition-all ${activeTab === 'regolamento' ? 'bg-indigo-500 text-white shadow-md' : 'text-gray-400 hover:text-white'}`}>FAQ & Regole</button>
                </div>
                {activeTab === 'legalita' && (
                    <div className="p-4 grid grid-cols-2 gap-3 max-h-[35vh] overflow-y-auto">
                        {formatsToShow.map(fmt => {
                            const status = card.legalities ? card.legalities[fmt] : 'not_legal';
                            const isLegal = status === 'legal' || status === 'restricted';
                            return (
                                <div key={fmt} className="flex items-center gap-2 text-xs sm:text-sm">
                                    {isLegal ? ( <span className="bg-green-500 text-black rounded-full w-4 h-4 flex items-center justify-center text-[10px] font-black shrink-0">✓</span> ) : ( <span className="text-gray-500 font-black w-4 text-center shrink-0">-</span> )}
                                    <span className="text-gray-300 capitalize truncate">{fmt}</span>
                                </div>
                            );
                        })}
                    </div>
                )}
                {activeTab === 'regolamento' && (
                    <div className="p-4 max-h-[35vh] overflow-y-auto space-y-4">
                        {loading ? ( <p className="text-center text-yellow-500 font-bold py-4">Ricerca regole su Scryfall...</p> ) : rulings.length > 0 ? (
                            rulings.map((r, i) => (
                                <div key={i} className="text-xs sm:text-sm border-b border-gray-800 pb-2">
                                    <p className="text-gray-200 mb-1 leading-relaxed">{r.comment}</p>
                                    <p className="text-gray-500 text-[10px] font-bold mt-1">{r.published_at}</p>
                                </div>
                            ))
                        ) : ( <p className="text-center text-gray-500 font-bold py-4">Nessuna FAQ trovata per questa carta.</p> )}
                    </div>
                )}
            </div>
        );
    };

    const DeckViewer = ({deck, navigate}) => {
      const [viewingCard, setViewingCard] = useState(null);
      const [itaImg, setItaImg] = useState(null);
      const [itaImgBack, setItaImgBack] = useState(null);
      const [showIta, setShowIta] = useState(false);
      const [showBack, setShowBack] = useState(false);
      const [translating, setTranslating] = useState(false);
      const [savedScroll, setSavedScroll] = useState(0);
      const [printsList, setPrintsList] = useState([]);
      const [loadingPrints, setLoadingPrints] = useState(false);

      if(!deck) return null;

      const deckMap = {};
      deck.cards.forEach(c => {
         const key = buildCardKey(c); 
         if(!deckMap[key]) { deckMap[key] = { ...c, count: 1 }; } else { deckMap[key].count++; }
      });
      const groupedByCategory = { "Comandante": [], "Companion": [], "Creature": [], "Planeswalker": [], "Istantanei": [], "Stregonerie": [], "Artefatti": [], "Incantesimi": [], "Terre": [], "Altro": [], "Sideboard": [] };
      Object.values(deckMap).forEach(c => { groupedByCategory[getCardCategory(c)].push(c); });
      Object.keys(groupedByCategory).forEach(k => { groupedByCategory[k].sort((a,b) => a.name.localeCompare(b.name)); });

      const openViewer = (c) => { 
          setSavedScroll(window.scrollY); setItaImg(null); setItaImgBack(null); setShowIta(false); setShowBack(false); setPrintsList([]);
          setViewingCard(c); window.scrollTo(0,0); 
      };
      const closeViewer = () => { setViewingCard(null); setTimeout(() => window.scrollTo(0, savedScroll), 10); };

      const fetchOtherPrints = (card) => {
          if(!card.printsUrl) return alert("Questa carta non ha altre stampe disponibili sul database.");
          setLoadingPrints(true);
          fetch(card.printsUrl).then(res => res.json()).then(data => {
                if(data.data && data.data.length > 0) {
                    const mapped = data.data.filter(c => c.image_uris || (c.card_faces && c.card_faces.length > 0 && c.card_faces[0].image_uris)).map(c => {
                         let iImg = ""; let iImgBack = null;
                         if (c.image_uris && c.image_uris.normal) iImg = c.image_uris.normal;
                         else if (c.card_faces && c.card_faces.length > 0) {
                             if (c.card_faces[0].image_uris && c.card_faces[0].image_uris.normal) iImg = c.card_faces[0].image_uris.normal;
                             if (c.card_faces.length > 1 && c.card_faces[1].image_uris && c.card_faces[1].image_uris.normal) iImgBack = c.card_faces[1].image_uris.normal;
                         }
                         return { ...card, id: c.id, image: iImg, imageBack: iImgBack, rarity: c.rarity || "common", setCode: c.set || "", setName: c.set_name || "", prices: c.prices || {} };
                        });
                        setPrintsList(mapped);
                } else { alert("Nessun'altra stampa trovata."); }
                setLoadingPrints(false);
            }).catch(e => { console.error(e); setLoadingPrints(false); });
      };

      const translateCard = (card) => {
        if (card.isCustom) return alert("Le carte Proxy non possono essere tradotte dal database.");
        if (itaImg) { setShowIta(!showIta); return; } 
        setTranslating(true);
        fetch(`https://api.scryfall.com/cards/search?q=!"${card.name}"+lang:it`).then(res => res.json()).then(data => {
             if (data.data && data.data.length > 0) {
                 const itCard = data.data[0]; let iImg = null; let iImgBack = null;
                 if (itCard.image_uris && itCard.image_uris.normal) { iImg = itCard.image_uris.normal; } 
                 else if (itCard.card_faces && itCard.card_faces.length > 0) {
                     if (itCard.card_faces[0].image_uris) iImg = itCard.card_faces[0].image_uris.normal;
                     if (itCard.card_faces.length > 1 && itCard.card_faces[1].image_uris) iImgBack = itCard.card_faces[1].image_uris.normal;
                 }
                 if (iImg) { setItaImg(iImg); setItaImgBack(iImgBack); setShowIta(true); } else alert("Immagine italiana non trovata.");
             } else { alert("Traduzione ufficiale italiana non stampata per questa carta."); }
             setTranslating(false);
          }).catch(e => { alert("Errore di connessione."); setTranslating(false); });
      };

      const formatEdhrec = (name) => name.toLowerCase().replace(/[^a-z0-9\s-]/g, '').trim().replace(/\s+/g, '-');
      const openEdhrec = (card) => {
          const isCmdr = card.type.toLowerCase().includes('legendary') && (card.type.toLowerCase().includes('creature') || card.type.toLowerCase().includes('planeswalker'));
          const urlType = isCmdr ? 'commanders' : 'cards';
          window.open(`https://edhrec.com/${urlType}/${formatEdhrec(card.name)}`, '_blank');
      };

      const defFront = viewingCard ? (viewingCard.proxyImage || viewingCard.image || "mtg-bg.jpg") : "";
      const defBack = viewingCard ? viewingCard.imageBack : null;
      const currentFront = showIta && itaImg ? itaImg : defFront;
      const currentBack = showIta && itaImgBack ? itaImgBack : defBack;
      const displayImg = showBack && currentBack ? currentBack : currentFront;

      return (
        <div className="max-w-2xl mx-auto relative z-10 w-full">
           {viewingCard && (
             <div className="w-full flex flex-col animate-fade pb-10">
               <div className="flex items-center justify-between p-4 bg-gray-800 border-b border-gray-700 sticky top-0 z-50 shadow-md mb-6">
                 <button onClick={closeViewer} className="text-indigo-400 font-bold flex items-center gap-1 text-lg"><Icons.Back /> Indietro</button>
                 <h2 className="ml-4 font-bold text-white truncate max-w-[50%]">{viewingCard.name}</h2><div className="w-8"></div>
               </div>
               
               <div className="flex-1 flex flex-col items-center justify-start p-2">
                 <img src={displayImg} alt={viewingCard.name} className="w-auto max-h-[50vh] object-contain rounded-xl mb-4 shadow-2xl" />
                 
                 {(itaImgBack || viewingCard.imageBack) && !viewingCard.isCustom && (
                    <button onClick={() => setShowBack(!showBack)} className="w-full max-w-sm bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 rounded-lg shadow-md border border-gray-500 mb-4 transition-colors">🔄 {showBack ? "Vedi Fronte" : "Vedi Retro"}</button>
                 )}

                 <div className="w-full max-w-sm mb-4 flex gap-2">
                    <button onClick={() => translateCard(viewingCard)} disabled={translating} className="flex-1 bg-indigo-700 hover:bg-indigo-600 text-white font-bold py-3 rounded-xl shadow-[0_0_15px_rgba(67,56,202,0.4)] border border-indigo-500 transition-all text-xs">
                      {translating ? "Traduco..." : (showIta ? "🇬🇧 Torna in Inglese" : "🇮🇹 Tenta Traduzione")}
                    </button>
                    {!viewingCard.isCustom && viewingCard.printsUrl && (
                        <button onClick={() => fetchOtherPrints(viewingCard)} disabled={loadingPrints} className="flex-1 bg-orange-600 hover:bg-orange-500 text-white font-bold py-3 rounded-xl shadow-lg border border-orange-500 transition-all text-xs">🖼️ Altre Stampe</button>
                    )}
                 </div>

                 {printsList.length > 0 && (
                    <div className="w-full max-w-sm mb-4 bg-gray-800 p-2 rounded-xl border border-gray-600 shadow-md animate-fade">
                       <p className="text-xs text-gray-300 font-bold mb-2">Modalità lettura:</p>
                       <div className="flex overflow-x-auto gap-2 pb-2">
                           {printsList.map(p => (
                              <img key={p.id} src={p.image} className="w-20 rounded cursor-pointer border-2 border-transparent hover:border-blue-500 shadow-sm shrink-0" onClick={() => { setViewingCard({...viewingCard, id: p.id, image: p.image, imageBack: p.imageBack, rarity: p.rarity, setCode: p.setCode, setName: p.setName, prices: p.prices}); setPrintsList([]); setShowIta(false); }} />  
                           ))}
                        </div>
                    </div>
                 )}
                 <CardDetailsTabs card={viewingCard} />
               </div>
             </div>
           )}

           <div className={viewingCard ? "hidden" : "space-y-4"}>
             <button onClick={() => navigate('mydecks')} className="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded font-bold mb-2 shadow transition-colors">⬅ Indietro ai Mazzi</button>
             <div className="bg-gray-800/90 p-6 rounded-xl border border-gray-600 shadow-xl backdrop-blur-sm">
                <div className="flex justify-between items-start mb-1">
                   <h2 className="text-3xl font-black text-white drop-shadow-md truncate pr-2">{deck.name}</h2>
                   <div className="bg-emerald-900/80 px-3 py-1 rounded-lg border border-emerald-500 shadow-lg text-right shrink-0">
                       <p className="text-[10px] text-emerald-300 font-bold uppercase tracking-wider mb-[-2px]">Valore Stimato</p>
                       <p className="text-xl font-black text-white">€ {deck.cards.reduce((acc, c) => acc + (parseFloat((c.prices && c.prices.eur) ? c.prices.eur : 0) || 0), 0).toFixed(2)}</p>
                   </div>
                </div>
                <p className="text-gray-300 font-bold mb-4 mt-2">Clicca su una carta per ingrandirla e tradurla!</p>
                <div className="space-y-4">
                  {categoriesOrder.map(cat => {
                     const cardsInCat = groupedByCategory[cat];
                     if(cardsInCat.length === 0) return null;
                     return (
                        <div key={cat} className="space-y-2">
                           <h4 className={`text-xs font-black border-b pb-1 uppercase ${cat === 'Sideboard' ? 'text-indigo-400 border-indigo-700' : (cat === 'Companion' ? 'text-pink-400 border-pink-700' : 'text-gray-400 border-gray-700')}`}>{cat} ({cardsInCat.reduce((acc,c)=>acc+c.count,0)})</h4>
                           {cardsInCat.map((card, index) => (
                             <div key={index} className={`flex gap-2 bg-gray-900 p-2 rounded-lg border ${card.isCmdrFlag ? 'border-yellow-500 shadow-[0_0_10px_rgba(234,179,8,0.3)]' : (card.isCompFlag ? 'border-pink-500 shadow-[0_0_10px_rgba(236,72,153,0.3)]' : (card.isSideboard ? 'border-indigo-500' : 'border-gray-700'))} cursor-pointer hover:bg-gray-800 transition-colors`} onClick={() => openViewer(card)}>
                               <div className="relative shrink-0">
                                   <img src={card.proxyImage || card.image || "mtg-bg.jpg"} alt={card.name} className="w-14 rounded object-cover shadow border border-gray-600" />
                                   <div className="absolute -top-2 -right-2 bg-blue-600 text-white font-black text-xs w-6 h-6 flex items-center justify-center rounded-full shadow border border-blue-400">{card.count}</div>
                               </div>
                               <div className="flex-1 text-sm flex flex-col justify-center overflow-hidden pl-2">
                                 <h4 className="font-bold text-gray-200 text-sm leading-tight truncate">{card.name}</h4>
                                 <p className="text-[10px] text-gray-500 truncate">{card.type}</p>
                               </div>
                             </div>
                           ))}
                        </div>
                     )
                  })}
                </div>
             </div>
           </div>
        </div>
      );
    };

    const MatchStatistics = ({ navigate }) => {
        const [history, setHistory] = useState([]);
        const [loading, setLoading] = useState(true);

        useEffect(() => {
            db.collection('match_history').orderBy('date', 'desc').get().then(snap => {
                const data = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                setHistory(data); setLoading(false);
            }).catch(() => setLoading(false));
        }, []);

        const totalMatches = history.length;
        const winsByPlayer = {}; const winsByCmdr = {};
        history.forEach(m => {
            winsByPlayer[m.winnerName] = (winsByPlayer[m.winnerName] || 0) + 1;
            if (m.winnerCommander) winsByCmdr[m.winnerCommander] = (winsByCmdr[m.winnerCommander] || 0) + 1;
        });

        return (
            <div className="max-w-2xl mx-auto space-y-4 p-4 animate-fade">
                <button onClick={() => navigate('game')} className="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded font-bold mb-2 shadow transition-colors">⬅ Torna al Tavolo</button>
                <div className="bg-gray-800/90 p-6 rounded-xl border border-gray-600 shadow-xl backdrop-blur-sm">
                    <h2 className="text-3xl font-black text-center text-purple-400 drop-shadow-md mb-6">📊 Hall of Fame</h2>
                    {loading ? <p className="text-center text-white">Caricamento statistiche...</p> : totalMatches === 0 ? <p className="text-center text-gray-400">Nessuna partita registrata. Gioca e dichiara un vincitore!</p> : (
                        <div className="space-y-6">
                            <div className="bg-gray-900 p-4 rounded-xl border border-gray-700 text-center shadow-inner">
                                <p className="text-gray-400 text-sm font-bold uppercase">Partite Totali Giocate</p><p className="text-4xl font-black text-white">{totalMatches}</p>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div className="bg-gray-900 p-4 rounded-xl border border-gray-700 shadow-inner">
                                    <h3 className="text-emerald-400 font-black mb-3 border-b border-gray-700 pb-2">🏆 Vittorie per Giocatore</h3>
                                    {Object.entries(winsByPlayer).sort((a,b)=>b[1]-a[1]).map(([name, wins]) => (
                                        <div key={name} className="flex justify-between items-center mb-2"><span className="text-white font-bold">{name}</span><span className="bg-emerald-800 text-emerald-200 px-2 py-1 rounded text-xs font-black">{wins} Vittorie ({((wins/totalMatches)*100).toFixed(0)}%)</span></div>
                                    ))}
                                </div>
                                <div className="bg-gray-900 p-4 rounded-xl border border-gray-700 shadow-inner">
                                    <h3 className="text-orange-400 font-black mb-3 border-b border-gray-700 pb-2">👑 Comandanti più Letali</h3>
                                    {Object.entries(winsByCmdr).filter(([name])=>name!=="Sconosciuto").sort((a,b)=>b[1]-a[1]).map(([cmdr, wins]) => (
                                        <div key={cmdr} className="flex justify-between items-center mb-2"><span className="text-white font-bold text-sm truncate pr-2">{cmdr}</span><span className="bg-orange-800 text-orange-200 px-2 py-1 rounded text-xs font-black">{wins} Vittorie</span></div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            </div>
        );
    };

    function App() {
      const [introState, setIntroState] = useState('initial');
      const [currentUser, setCurrentUser] = useState(null);
      const [view, setView] = useState('home');
      const [menuOpen, setMenuOpen] = useState(false);
      const [activeDeck, setActiveDeck] = useState(null);
      const videoRef = useRef(null);
      const [printQueue, setPrintQueue] = useState([]);
      const [collection, setCollection] = useState([]);
      const [mtgSets, setMtgSets] = useState([]); 

      useEffect(() => {
          const savedPrint = localStorage.getItem('mtg_printQueue'); const savedColl = localStorage.getItem('mtg_collection');
          if (savedPrint) { try { setPrintQueue(JSON.parse(savedPrint)); } catch(e){} }
          if (savedColl) { try { setCollection(JSON.parse(savedColl)); } catch(e){} }
          fetch('https://api.scryfall.com/sets').then(res => res.json()).then(data => {
                  if (data && data.data) {
                      const validSetTypes = ["core", "expansion", "masters", "masterpiece", "commander", "draft_innovation", "vanguard", "funny", "starter", "box", "promo", "arsenal"];
                      const filteredSets = data.data.filter(s => validSetTypes.includes(s.set_type)).map(s => ({ code: s.code, name: s.name })).sort((a, b) => a.name.localeCompare(b.name));
                      setMtgSets(filteredSets);
                  }
              }).catch(e => console.error("Errore caricamento set:", e));
      }, []);

      useEffect(() => {
          localStorage.setItem('mtg_printQueue', JSON.stringify(printQueue));
          localStorage.setItem('mtg_collection', JSON.stringify(collection));
      }, [printQueue, collection]);

      useEffect(() => {
          if (!window.history.state || !window.history.state.view) { window.history.replaceState({ view: 'home' }, ''); }
          const handleBackButton = (event) => { if (event.state && event.state.view) { setView(event.state.view); } else { setView('home'); } };
          window.addEventListener('popstate', handleBackButton); return () => window.removeEventListener('popstate', handleBackButton);
      }, []);

      useEffect(() => {
          if (view !== 'game_active') { if (!window.history.state || window.history.state.view !== view) { window.history.pushState({ view: view }, ''); } }
      }, [view]);
      
      useEffect(() => {
        let unsubscribeSnapshot = null;
        const unsubscribeAuth = auth.onAuthStateChanged(u => {
          setCurrentUser(u);
          if (u) {
            unsubscribeSnapshot = db.collection('users').doc(u.uid).onSnapshot(doc => {
              if (doc.exists) {
                const data = doc.data();
                if (data.decks) {
                   const localProxies = JSON.parse(localStorage.getItem('mtg_proxies') || '[]');
                   const enrichedDecks = data.decks.map(d => ({ ...d, cards: d.cards.map(c => { if (c.isCustom) { const p = localProxies.find(x => x.id === c.id); if (p) return { ...c, proxyImage: p.proxyImage || p.image, image: p.image || p.proxyImage }; } return c; }) }));
                   localStorage.setItem('mtg_decks', JSON.stringify(enrichedDecks)); window.dispatchEvent(new Event("cloud_sync_update"));
                }
                if (data.cart) { localStorage.setItem('mtg_cart', JSON.stringify(data.cart)); window.dispatchEvent(new Event("cloud_cart_update")); }
                if (data.proxies && Array.isArray(data.proxies)) {
                   let localProxies = JSON.parse(localStorage.getItem('mtg_proxies') || '[]'); let updated = false;
                   data.proxies.forEach(cp => {
                      if (!cp || !cp.id) return; const existingIndex = localProxies.findIndex(p => p && p.id === cp.id);
                      if (existingIndex === -1) { localProxies.push(cp); updated = true; } else {
                          const localProxy = localProxies[existingIndex];
                          const localImg = (localProxy && typeof localProxy.proxyImage === 'string') ? localProxy.proxyImage : "";
                          const cloudImg = (cp && typeof cp.proxyImage === 'string') ? cp.proxyImage : "";
                          if (localImg.startsWith('data:image') && cloudImg.startsWith('http')) { localProxies[existingIndex] = cp; updated = true; }
                      }
                   });
                   if(updated) { localStorage.setItem('mtg_proxies', JSON.stringify(localProxies)); window.dispatchEvent(new Event("cloud_proxies_update")); }
                }
              }
            }, (error) => { console.error("Errore Snapshot:", error); });
          } else { if (unsubscribeSnapshot) unsubscribeSnapshot(); }
        });
        return () => { unsubscribeAuth(); if (unsubscribeSnapshot) unsubscribeSnapshot(); };
      }, []);
      
      const navigate = (newView, deck = null) => { setActiveDeck(deck); setView(newView); setMenuOpen(false); };

      const handlePlayIntro = () => {
         if(videoRef.current) { const playPromise = videoRef.current.play(); if (playPromise !== undefined) { playPromise.then(() => { setIntroState('playing'); }).catch(e => { console.error("Errore video:", e); setIntroState('finished'); }); }
         } else { setIntroState('finished'); }
      };

      const finishIntro = () => { if(videoRef.current) videoRef.current.pause(); setIntroState('finished'); };

      return (
        <div className="min-h-screen flex flex-col text-gray-100 bg-cover bg-center bg-fixed" style={{ backgroundImage: "url('mtg-bg.jpg')" }}>
          {introState !== 'finished' && (
             <div className="fixed inset-0 z-[200] bg-black flex flex-col items-center justify-center overflow-hidden">
                <video ref={videoRef} playsInline onEnded={finishIntro} onError={finishIntro} className={`absolute inset-0 w-full h-full object-cover transition-opacity duration-500 ${introState === 'playing' ? 'opacity-100 z-10' : 'opacity-0 z-[-1]'}`}>
                   <source src="intro.mp4" type="video/mp4" />
                </video>
                {introState === 'initial' && (
                   <div className="absolute inset-0 flex flex-col items-center justify-center bg-black/80 animate-fade z-20">
                      <img src="mtg-bg.jpg" className="absolute inset-0 w-full h-full object-cover opacity-30 pointer-events-none" />
                      <h2 className="relative z-10 text-4xl font-black text-white drop-shadow-[0_5px_5px_rgba(0,0,0,1)] tracking-widest mb-10">MTG <span className="text-red-500">FOR FUN</span></h2>
                      <button onClick={handlePlayIntro} className="relative z-10 bg-red-600 hover:bg-red-500 text-white font-black text-3xl py-5 px-12 rounded-full shadow-[0_0_40px_rgba(220,38,38,0.8)] animate-pulse border-2 border-red-400 transition-all active:scale-95">▶ START</button>
                      <button onClick={finishIntro} className="relative z-10 mt-8 text-gray-400 font-bold underline px-6 py-2">Skip Intro</button>
                   </div>
                )}
                {introState === 'playing' && ( <button onClick={finishIntro} className="absolute top-8 right-6 z-[210] bg-black/60 text-white px-4 py-2 rounded-full font-bold border border-white/30 shadow-lg backdrop-blur-sm active:scale-95 animate-fade">Skip ⏭</button> )}
             </div>
          )}

          {introState === 'finished' && (
            <div className="min-h-screen bg-gray-900/85 backdrop-blur-sm flex flex-col animate-fade">
              {(view !== 'game_active' && view !== 'playtester_active') && (
                <header className="bg-gray-900/95 border-b border-gray-700 p-4 flex justify-between items-center fixed top-0 w-full z-50 shadow-md no-print">
                  <button onClick={() => setMenuOpen(true)} className="text-gray-300 hover:text-white"><Icons.Menu /></button>
                  <h1 className="text-lg font-bold tracking-widest text-white">MTG <span className="text-red-500">FOR FUN</span></h1>
                  <button onClick={() => navigate('home')} className="text-gray-300 hover:text-white"><Icons.Home /></button>
                </header>
              )}

              {menuOpen && (
                <div className="fixed inset-0 bg-black/80 z-50 no-print animate-fade" onClick={() => setMenuOpen(false)}>
                  <div className="w-64 bg-gray-900 h-full p-6 shadow-2xl border-r border-gray-700 overflow-y-auto" onClick={e => e.stopPropagation()}>
                    <h2 className="text-2xl font-bold mb-6 border-b border-gray-700 pb-2">Menu</h2>
                    <nav className="space-y-4">
                      <MenuBtn icon={<Icons.Home/>} text="Home" onClick={() => navigate('home')} />
                      <MenuBtn icon="🔍" text="Database & Scan" onClick={() => navigate('cardsearch')} />
                      <MenuBtn icon="🎴" text="Deckbuilding" onClick={() => navigate('deckbuilder')} />
                      <MenuBtn icon="⚖️" text="Bilancia Scambi (Trade)" onClick={() => navigate('trade')} />
                      <MenuBtn icon="🖨️" text={`Area Stampa Proxy (${printQueue.length})`} onClick={() => navigate('print')} />
                      <MenuBtn icon="🛠️" text="Strumenti Pro" onClick={() => navigate('protools')} />
                      <MenuBtn icon="📚" text="I Miei Mazzi" onClick={() => navigate('mydecks')} />
                      <MenuBtn icon="📁" text={`Raccoglitore (${(collection || []).reduce((a,c)=>a+(c.qty||1),0)})`} onClick={() => navigate('collection')} />
                      <MenuBtn icon="🛒" text="Carrello" onClick={() => navigate('cart')} />
                      <MenuBtn icon="🌐" text="Gioca Online" onClick={() => navigate('playonline')} />
                      <MenuBtn icon="🃏" text="Testa Mazzo" onClick={() => navigate('playtester')} />
                      <MenuBtn icon="🍻" text="La Taverna (Chat)" onClick={() => navigate('taverna')} />
                      <MenuBtn icon="✨" text="Proxy Creator" onClick={() => navigate('proxycreator')} />
                      <MenuBtn icon="🖼️" text="Le Mie Proxy" onClick={() => navigate('myproxies')} />
                      <MenuBtn icon="⚔️" text="Life Tracker" onClick={() => navigate('game')} />
                      <MenuBtn icon="🎲" text="Lancia Dado" onClick={() => navigate('dice')} />
                      <MenuBtn icon="⚖️" text="Regole & Judge" onClick={() => navigate('rules')} />
                      
                      <div className="pt-4 mt-4 border-t border-gray-700">
                         <MenuBtn icon="💾" text="Backup & Sync" onClick={() => navigate('backup')} />
                      </div>
                      <div className="pt-2 mt-2 border-t border-gray-700">
                         <p className="text-xs text-gray-500 font-bold mb-3 uppercase tracking-wider">🌐 Import / Siti Esterni</p>
                         <MenuBtn icon="M" text="Moxfield" onClick={() => window.open('https://www.moxfield.com', '_blank')} />
                         <MenuBtn icon="D" text="Deckstats" onClick={() => window.open('https://deckstats.net', '_blank')} />
                         <MenuBtn icon="E" text="EDHREC" onClick={() => window.open('https://edhrec.com', '_blank')} />
                     </div>
                     <div className="pt-4 mt-4 border-t border-gray-700">
                        <button onClick={() => window.open('https://ko-fi.com/artimex', '_blank')} className="w-full flex items-center justify-center gap-2 bg-yellow-600 hover:bg-yellow-500 text-white font-black p-3 rounded-lg shadow-[0_0_15px_rgba(202,138,4,0.4)] transition-all">☕ Sostieni l'App</button>
                     </div>
                    </nav>
                  </div>
                </div>
              )}

              <main className={`${(view !== 'game_active' && view !== 'playtester_active') ? 'pt-20 px-2 pb-10' : ''} flex-1 relative z-10`}>
                {view === 'home' && <HomeView navigate={navigate} />}
                {view === 'deckbuilder' && <DeckBuilder navigate={navigate} activeDeck={activeDeck} mtgSets={mtgSets} />}
                {view === 'cardsearch' && <CardSearchExplorer navigate={navigate} printQueue={printQueue} setPrintQueue={setPrintQueue} collection={collection} setCollection={setCollection} mtgSets={mtgSets} />}
                {view === 'mydecks' && <MyDecks navigate={navigate} />}
                {view === 'collection' && <CollectionBinder navigate={navigate} collection={collection} setCollection={setCollection} mtgSets={mtgSets} />}
                {view === 'cart' && <CartView navigate={navigate} />}
                {view === 'trade' && <TradeEvaluator setView={setView} />}
                {view === 'print' && <ProxyPrintArea printQueue={printQueue} setPrintQueue={setPrintQueue} setView={setView} />}
                {view === 'myproxies' && <MyProxies navigate={navigate} printQueue={printQueue} setPrintQueue={setPrintQueue} />}
                {view === 'viewdeck' && <DeckViewer deck={activeDeck} navigate={navigate} />}
                {view === 'analysis' && <DeckAnalysis deck={activeDeck} navigate={navigate} />}
                {view === 'statistics' && <MatchStatistics navigate={navigate} />}
                {view === 'proxycreator' && <ProxyEditor isStandalone={true} />}
                {view === 'printview' && <PrintView deck={activeDeck} navigate={navigate} />}
                {view === 'backup' && <BackupView navigate={navigate} />}
                {(view === 'game' || view === 'game_active') && <GameUtility view={view} setView={setView} />}
                {(view === 'playtester' || view === 'playtester_active') && <PlaytesterSandbox view={view} setView={setView} navigate={navigate} />}
                {view === 'dice' && <DiceRoller />}
                {view === 'rules' && <RulesAI />}
                {view === 'playonline' && <PlayOnlineView navigate={navigate} />}
                {view === 'taverna' && <TavernaChat navigate={navigate} />}
                {view === 'protools' && <ProTools navigate={navigate} activeDeck={activeDeck} />}
              </main>
            </div>
          )}
        </div>
      );
    }

    const MenuBtn = ({icon, text, onClick}) => (
      <button onClick={onClick} className="w-full flex items-center space-x-3 text-gray-300 hover:text-white p-2 rounded hover:bg-gray-800 transition-colors">
        <span className="flex items-center justify-center w-6 h-6">{icon}</span> <span className="font-semibold text-sm">{text}</span>
      </button>
    );

    const HomeView = ({navigate}) => (
      <div className="flex flex-col items-center justify-center pt-8">
        <div className="mb-12 text-center">
          <h2 className="text-5xl font-black text-white drop-shadow-[0_5px_5px_rgba(0,0,0,1)] tracking-widest">FOR FUN</h2>
          <h3 className="text-3xl font-black text-red-500 drop-shadow-md">EDITION</h3>
          <p className="text-gray-400 mt-2 font-semibold">Your Ultimate Commander Companion</p>
        </div>
        <div className="grid grid-cols-2 gap-4 w-full max-w-md">
          <ActionCard icon="🎴" text="Crea Mazzo" onClick={() => navigate('deckbuilder')} color="bg-blue-900/80 hover:bg-blue-800" />
          <ActionCard icon="📚" text="I Miei Mazzi" onClick={() => navigate('mydecks')} color="bg-emerald-900/80 hover:bg-emerald-800" />
          <ActionCard icon="🔍" text="Scan Carte" onClick={() => navigate('cardsearch')} color="bg-indigo-900/80 hover:bg-indigo-800" />
          <ActionCard icon="⚔️" text="Life Tracker" onClick={() => navigate('game')} color="bg-red-900/80 hover:bg-red-800" />
        </div>
        <div className="w-full max-w-md mt-8 animate-fade">
           <button onClick={() => window.open('https://ko-fi.com/artimex', '_blank')} className="w-full bg-yellow-600 hover:bg-yellow-500 text-white font-black py-4 rounded-xl shadow-[0_0_20px_rgba(202,138,4,0.4)] flex items-center justify-center gap-2 transition-all border border-yellow-400 active:scale-95">☕ SOSTIENI L'APP</button>
        </div>
      </div>
    );

    const CartView = ({navigate}) => {
      const [cart, setCart] = useState({singles: [], decks: [], lastUpdated: 0});
      const [tab, setTab] = useState('singles');

      const checkAndLoadCart = () => {
         let c = JSON.parse(localStorage.getItem('mtg_cart') || '{"singles":[], "decks":[], "lastUpdated":0}');
         if (!c.singles) c.singles = []; if (!c.decks) c.decks = [];
         if (!c.lastUpdated) c.lastUpdated = Date.now();
         const QUINDICI_GIORNI = 15 * 24 * 60 * 60 * 1000;
         if ((Date.now() - c.lastUpdated > QUINDICI_GIORNI) && (c.singles.length > 0 || c.decks.length > 0)) {
            c = { singles: [], decks: [], lastUpdated: Date.now() };
            localStorage.setItem('mtg_cart', JSON.stringify(c));
            const user = firebase.auth().currentUser;
            if (user) syncToCloud(user.uid);
            alert("🧹 Il carrello è stato svuotato automaticamente perché è rimasto inattivo per oltre 15 giorni.");
         }
         setCart(c);
      };

      useEffect(() => { 
         checkAndLoadCart();
         window.addEventListener("cloud_cart_update", checkAndLoadCart);
         return () => window.removeEventListener("cloud_cart_update", checkAndLoadCart);
      }, []);

      const remove = (type, index) => {
         let newCart = {...cart}; newCart[type].splice(index, 1); newCart.lastUpdated = Date.now(); setCart(newCart); 
         localStorage.setItem('mtg_cart', JSON.stringify(newCart));
         const user = firebase.auth().currentUser;
         if (user) syncToCloud(user.uid);
      };

      const checkoutSingles = () => {
         if(cart.singles.length === 0) return alert("Carrello vuoto!");
         const counts = {}; cart.singles.forEach(c => { counts[c.name] = (counts[c.name] || 0) + 1; });
         const list = Object.keys(counts).map(name => `${counts[name]} ${name}`).join('\n');
         navigator.clipboard.writeText(list);
         alert("Lista copiata negli appunti!\nTi porto su CardTrader: clicca su 'Incolla testo' (lo trovi sulla destra) e fai Incolla per caricare le carte.");
         window.open("https://www.cardtrader.com/it/wishlists/new", "_blank");
      };

      const checkoutDeck = (deck) => {
         const counts = {}; deck.cards.forEach(c => { counts[c.name] = (counts[c.name] || 0) + 1; });
         const list = Object.keys(counts).map(name => `${counts[name]} ${name}`).join('\n');
         navigator.clipboard.writeText(list);
         alert(`Mazzo "${deck.name}" copiato!\nTi porto su CardTrader: clicca su 'Incolla testo' (lo trovi sulla destra) e fai Incolla per caricare le carte.`);
         window.open("https://www.cardtrader.com/it/wishlists/new", "_blank");
      };

      return (
        <div className="max-w-md mx-auto bg-gray-800/90 p-6 rounded-xl shadow-lg border border-gray-600 mt-4 backdrop-blur-sm animate-fade">
          <h2 className="text-3xl font-black text-center text-yellow-500 drop-shadow-md mb-6">🛒 Carrello</h2>
          <div className="flex gap-2 mb-6">
             <button onClick={()=>setTab('singles')} className={`flex-1 font-black py-2 rounded-lg transition-colors ${tab==='singles'?'bg-yellow-600 text-white shadow-lg':'bg-gray-700 text-gray-400'}`}>Carte Singole ({cart.singles.length})</button>
             <button onClick={()=>setTab('decks')} className={`flex-1 font-black py-2 rounded-lg transition-colors ${tab==='decks'?'bg-yellow-600 text-white shadow-lg':'bg-gray-700 text-gray-400'}`}>Mazzi Interi ({cart.decks.length})</button>
          </div>
          {tab === 'singles' && (
             <div className="space-y-4 animate-fade">
                {cart.singles.length === 0 ? <p className="text-center text-gray-400 font-bold">Nessuna carta singola.</p> : (
                   <React.Fragment>
                     <div className="bg-gray-900 p-2 rounded-lg border border-gray-700 max-h-64 overflow-y-auto space-y-2">
                        {cart.singles.map((c, i) => (
                           <div key={i} className="flex justify-between items-center bg-gray-800 p-2 rounded shadow">
                              <span className="font-bold text-sm text-white truncate w-2/3">{c.name}</span>
                              <div className="flex items-center gap-3">
                                 <span className="text-yellow-400 font-black text-sm">{c.prices && c.prices.eur ? `€${c.prices.eur}` : 'N/D'}</span>
                                 <button onClick={()=>remove('singles', i)} className="text-red-500 font-black text-lg w-6 h-6 flex items-center justify-center bg-red-900/30 rounded">✖</button>
                              </div>
                           </div>
                        ))}
                     </div>
                     <div className="flex flex-col gap-2 mt-4">
                       <button onClick={checkoutSingles} className="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-3 rounded-xl shadow transition-all">🛒 CARDTRADER</button>
                       <button onClick={() => {
                           if(cart.singles.length === 0) return alert("Carrello vuoto!");
                           const counts = {}; cart.singles.forEach(c => { counts[c.name] = (counts[c.name] || 0) + 1; });
                           const list = Object.keys(counts).map(name => `${counts[name]} ${name}`).join('\n');
                           navigator.clipboard.writeText(list);
                           alert("Lista copiata!\n\nTi porto su Cardmarket: vai su 'Wants' (Liste dei Desideri), crea una nuova lista e usa la funzione 'Importa'.");
                           window.open("https://www.cardmarket.com/it/Magic/Wants", "_blank");
                       }} className="w-full bg-[#1e4174] hover:bg-[#153059] text-white font-black py-3 rounded-xl shadow transition-all">🛒 CARDMARKET</button>
                     </div>
