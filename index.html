<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MTG Commander Companion</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-storage-compat.js"></script>

  <style>
    body { -webkit-font-smoothing: antialiased; overflow-x: hidden; user-select: none; -webkit-touch-callout: none; background-color: #000; }
    .animate-fade { animation: fadeIn 0.2s ease-in-out; forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
    button { touch-action: manipulation; }
    
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

    @media print {
      body { background: white !important; color: black; }
      .no-print { display: none !important; }
      .print-grid { display: grid; grid-template-columns: repeat(3, 63mm); gap: 2mm; justify-content: center; }
      .print-card { width: 63mm; height: 88mm; object-fit: cover; border-radius: 3mm; margin-bottom: 2mm; page-break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyBKfSnZ7ujw5uYZ_RnlM034exD28jfMunQ",
      authDomain: "mtg-for-fun-bf36b.firebaseapp.com",
      projectId: "mtg-for-fun-bf36b",
      storageBucket: "mtg-for-fun-bf36b.firebasestorage.app",
      messagingSenderId: "742946721330",
      appId: "1:742946721330:web:3cb566ddd6c8b9ada7362b"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();

    const syncToCloud = async (uid) => {
      try {
        let rawDecks = [];
        try { rawDecks = JSON.parse(localStorage.getItem('mtg_decks')) || []; } catch(e){}
        if (!Array.isArray(rawDecks)) rawDecks = [];

        // Filtro sicuro per togliere il peso dalle proxy senza errori
        const cleanCard = (c) => { 
            if (!c) return c;
            let newC = { ...c };
            if (newC.isCustom || 
               (typeof newC.proxyImage === 'string' && newC.proxyImage.startsWith('data:image')) || 
               (typeof newC.image === 'string' && newC.image.startsWith('data:image')) ||
               (typeof newC.imageBack === 'string' && newC.imageBack.startsWith('data:image'))) { 
                newC.proxyImage = ""; 
                newC.image = ""; 
                newC.imageBack = "";
            } 
            return newC; 
        };
        
        const decksToCloud = rawDecks.map(deck => ({ ...deck, cards: (deck.cards || []).map(cleanCard) }));
        
        let rawCart = { singles: [], decks: [], lastUpdated: Date.now() };
        try { 
            const parsedCart = JSON.parse(localStorage.getItem('mtg_cart'));
            if (parsedCart && typeof parsedCart === 'object') rawCart = { ...rawCart, ...parsedCart };
        } catch(e){}
        
        const cartToCloud = { 
            ...rawCart, 
            singles: (rawCart.singles || []).map(cleanCard), 
            decks: (rawCart.decks || []).map(d => ({ ...d, cards: (d.cards || []).map(cleanCard) })) 
        };

        // SALVATAGGIO IMMEDIATO DI MAZZI E CARRELLO (Niente più blocco Storage!)
        await db.collection('users').doc(uid).set({ 
            decks: decksToCloud, 
            cart: cartToCloud, 
            lastSync: new Date().toISOString() 
        }, { merge: true });

      } catch (err) { 
          console.error("Errore salvataggio Firebase:", err);
          alert("Firebase ha bloccato il salvataggio!\nMotivo: " + err.message); 
      }
    };

    const syncFromCloud = async (uid) => {
      try {
          const doc = await db.collection('users').doc(uid).get();
          if(doc.exists) {
            const data = doc.data();
            if(data.decks) localStorage.setItem('mtg_decks', JSON.stringify(data.decks));
            if(data.cart) localStorage.setItem('mtg_cart', JSON.stringify(data.cart));
            return true;
          }
          return false;
      } catch(err) { console.error("Errore syncFromCloud:", err); return false; }
    };

    // --- FUNZIONI STORAGE DISATTIVATE ---
    // Le svuotiamo per ingannare l'app: crederà di aver salvato/eliminato 
    // la proxy nel cloud, ma l'operazione avverrà solo sul tuo telefono locale.
    
    const syncSingleProxyToCloud = async (uid, proxy) => {
        // Disattivato: Proxy 100% locali
    };

    const deleteProxyFromCloud = async (uid, proxyId) => {
        // Disattivato: Proxy 100% locali
    };

    const Icons = {
      Menu: () => <svg className="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16"/></svg>,
      Home: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 001 1m-6 0h6"/></svg>,
      Back: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
    };

    const ManaColors = [
      { id: 'W', color: 'bg-yellow-100 text-yellow-900', label: 'W' },
      { id: 'U', color: 'bg-blue-500 text-white', label: 'U' },
      { id: 'B', color: 'bg-gray-800 text-white', label: 'B' },
      { id: 'R', color: 'bg-red-500 text-white', label: 'R' },
      { id: 'G', color: 'bg-green-500 text-white', label: 'G' },
      { id: 'C', color: 'bg-gray-400 text-gray-900', label: 'C' }
    ];

    const getCardCategory = (card) => {
        if (card.isSideboard) return "Sideboard";
        if (card.isCompanion || card.isCompFlag) return "Companion"; 
        if (card.isCmdrFlag || card.isCommander) return "Comandante";
        const t = (card.type || "").toLowerCase();
        if (t.includes("creature")) return "Creature";
        if (t.includes("planeswalker")) return "Planeswalker";
        if (t.includes("instant")) return "Istantanei";
        if (t.includes("sorcery")) return "Stregonerie";
        if (t.includes("artifact")) return "Artefatti";
        if (t.includes("enchantment")) return "Incantesimi";
        if (t.includes("land")) return "Terre";
        return "Altro";
    };
    const categoriesOrder = ["Comandante", "Companion", "Creature", "Planeswalker", "Istantanei", "Stregonerie", "Artefatti", "Incantesimi", "Terre", "Altro", "Sideboard"];

    const buildCardKey = (c) => c.name + (c.isCustom ? c.proxyImage : "") + c.id + !!c.isSideboard + !!c.isCommander + !!c.isCompanion;
    
    const addToCart = (type, item) => {
        let cart = JSON.parse(localStorage.getItem('mtg_cart') || '{"singles":[], "decks":[], "lastUpdated":0}');
        if (!cart.singles) cart.singles = [];
        if (!cart.decks) cart.decks = [];
        
        if (type === 'single') {
            cart.singles.push(item);
            alert(`${item.name} aggiunto al Carrello!`);
        } else {
            cart.decks.push(item);
            alert(`Mazzo "${item.name}" aggiunto al Carrello!`);
        }
        
        cart.lastUpdated = Date.now();
        localStorage.setItem('mtg_cart', JSON.stringify(cart));
        
        const user = firebase.auth().currentUser;
        if (user) syncToCloud(user.uid).catch(e => console.error("Errore Sync Carrello:", e));
    };

    function App() {
      const [introState, setIntroState] = useState('initial');
      const [currentUser, setCurrentUser] = useState(null);
      const [view, setView] = useState('home');
      const [menuOpen, setMenuOpen] = useState(false);
      const [activeDeck, setActiveDeck] = useState(null);
      const videoRef = useRef(null);

      useEffect(() => {
        let unsubscribeSnapshot = null;
        const unsubscribeAuth = auth.onAuthStateChanged(u => {
          setCurrentUser(u);
          if (u) {
            unsubscribeSnapshot = db.collection('users').doc(u.uid).onSnapshot(doc => {
              if (doc.exists) {
                const data = doc.data();
                
                if (data.decks) {
                   const localProxies = JSON.parse(localStorage.getItem('mtg_proxies') || '[]');
                   const enrichedDecks = data.decks.map(d => ({ ...d, cards: d.cards.map(c => { if (c.isCustom) { const p = localProxies.find(x => x.id === c.id); if (p) return { ...c, proxyImage: p.proxyImage || p.image, image: p.image || p.proxyImage }; } return c; }) }));
                   localStorage.setItem('mtg_decks', JSON.stringify(enrichedDecks));
                   window.dispatchEvent(new Event("cloud_sync_update"));
                }
                
                if (data.cart) {
                   localStorage.setItem('mtg_cart', JSON.stringify(data.cart));
                   window.dispatchEvent(new Event("cloud_cart_update"));
                }

                if (data.proxies && Array.isArray(data.proxies)) {
                   let localProxies = JSON.parse(localStorage.getItem('mtg_proxies') || '[]');
                   let updated = false;
                   data.proxies.forEach(cp => {
                      if (!cp || !cp.id) return;
                      const existingIndex = localProxies.findIndex(p => p && p.id === cp.id);
                      if (existingIndex === -1) {
                          localProxies.push(cp); 
                          updated = true; 
                      } else {
                          const localProxy = localProxies[existingIndex];
                          const localImg = (localProxy && typeof localProxy.proxyImage === 'string') ? localProxy.proxyImage : "";
                          const cloudImg = (cp && typeof cp.proxyImage === 'string') ? cp.proxyImage : "";
                          
                          if (localImg.startsWith('data:image') && cloudImg.startsWith('http')) {
                              localProxies[existingIndex] = cp; 
                              updated = true; 
                          }
                      }
                   });
                   if(updated) {
                      localStorage.setItem('mtg_proxies', JSON.stringify(localProxies));
                      window.dispatchEvent(new Event("cloud_proxies_update"));
                   }
                }
              }
            }, (error) => { console.error("Errore Snapshot:", error); });
          } else {
            if (unsubscribeSnapshot) unsubscribeSnapshot();
          }
        });
        
        return () => {
          unsubscribeAuth();
          if (unsubscribeSnapshot) unsubscribeSnapshot();
        };
      }, []);
      
      const navigate = (newView, deck = null) => { setActiveDeck(deck); setView(newView); setMenuOpen(false); };

      const handlePlayIntro = () => {
         if(videoRef.current) {
             const playPromise = videoRef.current.play();
             if (playPromise !== undefined) {
                 playPromise.then(() => { setIntroState('playing'); }).catch(e => { console.error("Errore video:", e); setIntroState('finished'); });
             }
         } else { setIntroState('finished'); }
      };

      const finishIntro = () => {
         if(videoRef.current) videoRef.current.pause();
         setIntroState('finished');
      };

      return (
        <div className="min-h-screen flex flex-col text-gray-100 bg-cover bg-center bg-fixed" style={{ backgroundImage: "url('mtg-bg.jpg')" }}>
          
          {introState !== 'finished' && (
             <div className="fixed inset-0 z-[200] bg-black flex flex-col items-center justify-center overflow-hidden">
                <video ref={videoRef} playsInline onEnded={finishIntro} onError={finishIntro} className={`absolute inset-0 w-full h-full object-cover transition-opacity duration-500 ${introState === 'playing' ? 'opacity-100 z-10' : 'opacity-0 z-[-1]'}`}>
                   <source src="intro.mp4" type="video/mp4" />
                </video>

                {introState === 'initial' && (
                   <div className="absolute inset-0 flex flex-col items-center justify-center bg-black/80 animate-fade z-20">
                      <img src="mtg-bg.jpg" className="absolute inset-0 w-full h-full object-cover opacity-30 pointer-events-none" />
                      <h2 className="relative z-10 text-4xl font-black text-white drop-shadow-[0_5px_5px_rgba(0,0,0,1)] tracking-widest mb-10">MTG <span className="text-red-500">FOR FUN</span></h2>
                      <button onClick={handlePlayIntro} className="relative z-10 bg-red-600 hover:bg-red-500 text-white font-black text-3xl py-5 px-12 rounded-full shadow-[0_0_40px_rgba(220,38,38,0.8)] animate-pulse border-2 border-red-400 transition-all active:scale-95">▶ START</button>
                      <button onClick={finishIntro} className="relative z-10 mt-8 text-gray-400 font-bold underline px-6 py-2">Skip Intro</button>
                   </div>
                )}
                
                {introState === 'playing' && (
                   <button onClick={finishIntro} className="absolute top-8 right-6 z-[210] bg-black/60 text-white px-4 py-2 rounded-full font-bold border border-white/30 shadow-lg backdrop-blur-sm active:scale-95 animate-fade">Skip ⏭</button>
                )}
             </div>
          )}

          {introState === 'finished' && (
            <div className="min-h-screen bg-gray-900/85 backdrop-blur-sm flex flex-col animate-fade">
              
              {(view !== 'game_active' && view !== 'playtester_active') && (
                <header className="bg-gray-900/95 border-b border-gray-700 p-4 flex justify-between items-center fixed top-0 w-full z-50 shadow-md no-print">
                  <button onClick={() => setMenuOpen(true)} className="text-gray-300 hover:text-white"><Icons.Menu /></button>
                  <h1 className="text-lg font-bold tracking-widest text-white">MTG <span className="text-red-500">FOR FUN</span></h1>
                  <button onClick={() => navigate('home')} className="text-gray-300 hover:text-white"><Icons.Home /></button>
                </header>
              )}

              {menuOpen && (
                <div className="fixed inset-0 bg-black/80 z-50 no-print animate-fade" onClick={() => setMenuOpen(false)}>
                  <div className="w-64 bg-gray-900 h-full p-6 shadow-2xl border-r border-gray-700 overflow-y-auto" onClick={e => e.stopPropagation()}>
                    <h2 className="text-2xl font-bold mb-6 border-b border-gray-700 pb-2">Menu</h2>
                    <nav className="space-y-4">
                      <MenuBtn icon={<Icons.Home/>} text="Home" onClick={() => navigate('home')} />
                      <MenuBtn icon="🔍" text="Database & Scan" onClick={() => navigate('cardsearch')} />
                      <MenuBtn icon="🎴" text="Deckbuilding" onClick={() => navigate('deckbuilder')} />
                      <MenuBtn icon="🛠️" text="Strumenti Pro" onClick={() => navigate('protools')} />
                      <MenuBtn icon="📚" text="I Miei Mazzi" onClick={() => navigate('mydecks')} />
                      <MenuBtn icon="🛒" text="Carrello" onClick={() => navigate('cart')} />
                      <MenuBtn icon="🌐" text="Gioca Online" onClick={() => navigate('playonline')} />
                      <MenuBtn icon="🃏" text="Testa Mazzo" onClick={() => navigate('playtester')} />
                      <MenuBtn icon="🍻" text="La Taverna (Chat)" onClick={() => navigate('taverna')} />
                      <MenuBtn icon="✨" text="Proxy Creator" onClick={() => navigate('proxycreator')} />
                      <MenuBtn icon="🖼️" text="Le Mie Proxy" onClick={() => navigate('myproxies')} />
                      <MenuBtn icon="⚔️" text="Life Tracker" onClick={() => navigate('game')} />
                      <MenuBtn icon="🎲" text="Lancia Dado" onClick={() => navigate('dice')} />
                      <MenuBtn icon="⚖️" text="Regole & Judge" onClick={() => navigate('rules')} />
                      
                      <div className="pt-4 mt-4 border-t border-gray-700">
                         <MenuBtn icon="💾" text="Backup & Sync" onClick={() => navigate('backup')} />
                      </div>

                      <div className="pt-2 mt-2 border-t border-gray-700">
                         <p className="text-xs text-gray-500 font-bold mb-3 uppercase tracking-wider">🌐 Import / Siti Esterni</p>
                         <MenuBtn icon="M" text="Moxfield" onClick={() => window.open('https://www.moxfield.com', '_blank')} />
                         <MenuBtn icon="D" text="Deckstats" onClick={() => window.open('https://deckstats.net', '_blank')} />
                         <MenuBtn icon="E" text="EDHREC" onClick={() => window.open('https://edhrec.com', '_blank')} />
                     </div>

                     {/* Pulsante Donazione Ko-fi Isolato a fine menu - Artimex Hub */}
                     <div className="pt-4 mt-4 border-t border-gray-700">
                        <button onClick={() => window.open('https://ko-fi.com/artimex', '_blank')} className="w-full flex items-center justify-center gap-2 bg-yellow-600 hover:bg-yellow-500 text-white font-black p-3 rounded-lg shadow-[0_0_15px_rgba(202,138,4,0.4)] transition-all">
                           ☕ Sostieni l'App
                        </button>
                     </div>
                    </nav>
                  </div>
                </div>
              )}

              <main className={`${(view !== 'game_active' && view !== 'playtester_active') ? 'pt-20 px-2 pb-10' : ''} flex-1 relative z-10`}>
                {view === 'home' && <HomeView navigate={navigate} />}
                {view === 'deckbuilder' && <DeckBuilder navigate={navigate} activeDeck={activeDeck} />}
                {view === 'cardsearch' && <CardSearchExplorer navigate={navigate} />}
                {view === 'mydecks' && <MyDecks navigate={navigate} />}
                {view === 'cart' && <CartView navigate={navigate} />}
                {view === 'myproxies' && <MyProxies navigate={navigate} />}
                {view === 'viewdeck' && <DeckViewer deck={activeDeck} navigate={navigate} />}
                {view === 'analysis' && <DeckAnalysis deck={activeDeck} navigate={navigate} />}
                {view === 'proxycreator' && <ProxyEditor isStandalone={true} />}
                {view === 'printview' && <PrintView deck={activeDeck} navigate={navigate} />}
                {view === 'backup' && <BackupView navigate={navigate} />}
                {(view === 'game' || view === 'game_active') && <GameUtility view={view} setView={setView} />}
                {(view === 'playtester' || view === 'playtester_active') && <PlaytesterSandbox view={view} setView={setView} navigate={navigate} />}
                {view === 'dice' && <DiceRoller />}
                {view === 'rules' && <RulesAI />}
                {view === 'playonline' && <PlayOnlineView navigate={navigate} />}
                {view === 'taverna' && <TavernaChat navigate={navigate} />}
                {view === 'protools' && <ProTools navigate={navigate} activeDeck={activeDeck} />}
              </main>
            </div>
          )}
        </div>
      );
    }

    const MenuBtn = ({icon, text, onClick}) => (
      <button onClick={onClick} className="w-full flex items-center space-x-3 text-gray-300 hover:text-white p-2 rounded hover:bg-gray-800 transition-colors">
        <span className="flex items-center justify-center w-6 h-6">{icon}</span> <span className="font-semibold text-sm">{text}</span>
      </button>
    );
    const HomeView = ({navigate}) => (
      <div className="flex flex-col items-center justify-center pt-8">
        <div className="mb-12 text-center">
          <h2 className="text-5xl font-black text-white drop-shadow-[0_5px_5px_rgba(0,0,0,1)] tracking-widest">FOR FUN</h2>
          <h3 className="text-3xl font-black text-red-500 drop-shadow-md">EDITION</h3>
          <p className="text-gray-400 mt-2 font-semibold">Your Ultimate Commander Companion</p>
        </div>
        
        {/* I 4 Pulsanti Principali */}
        <div className="grid grid-cols-2 gap-4 w-full max-w-md">
          <ActionCard icon="🎴" text="Crea Mazzo" onClick={() => navigate('deckbuilder')} color="bg-blue-900/80 hover:bg-blue-800" />
          <ActionCard icon="📚" text="I Miei Mazzi" onClick={() => navigate('mydecks')} color="bg-emerald-900/80 hover:bg-emerald-800" />
          <ActionCard icon="🔍" text="Scan Carte" onClick={() => navigate('cardsearch')} color="bg-indigo-900/80 hover:bg-indigo-800" />
          <ActionCard icon="⚔️" text="Life Tracker" onClick={() => navigate('game')} color="bg-red-900/80 hover:bg-red-800" />
        </div>

        {/* 5° Tasto: Donazione Ko-fi */}
        <div className="w-full max-w-md mt-8 animate-fade">
           <button onClick={() => window.open('https://ko-fi.com/artimex', '_blank')} className="w-full bg-yellow-600 hover:bg-yellow-500 text-white font-black py-4 rounded-xl shadow-[0_0_20px_rgba(202,138,4,0.4)] flex items-center justify-center gap-2 transition-all border border-yellow-400 active:scale-95">
              ☕ SOSTIENI L'APP
           </button>
        </div>
      </div>
    );

    const CartView = ({navigate}) => {
      const [cart, setCart] = useState({singles: [], decks: [], lastUpdated: 0});
      const [tab, setTab] = useState('singles');

      const checkAndLoadCart = () => {
         let c = JSON.parse(localStorage.getItem('mtg_cart') || '{"singles":[], "decks":[], "lastUpdated":0}');
         if (!c.singles) c.singles = []; if (!c.decks) c.decks = [];
         
         if (!c.lastUpdated) c.lastUpdated = Date.now();
         
         const QUINDICI_GIORNI = 15 * 24 * 60 * 60 * 1000;
         
         if ((Date.now() - c.lastUpdated > QUINDICI_GIORNI) && (c.singles.length > 0 || c.decks.length > 0)) {
            c = { singles: [], decks: [], lastUpdated: Date.now() };
            localStorage.setItem('mtg_cart', JSON.stringify(c));
            const user = firebase.auth().currentUser;
            if (user) syncToCloud(user.uid);
            alert("🧹 Il carrello è stato svuotato automaticamente perché è rimasto inattivo per oltre 15 giorni.");
         }
         setCart(c);
      };

      useEffect(() => { 
         checkAndLoadCart();
         window.addEventListener("cloud_cart_update", checkAndLoadCart);
         return () => window.removeEventListener("cloud_cart_update", checkAndLoadCart);
      }, []);

      const remove = (type, index) => {
         let newCart = {...cart}; newCart[type].splice(index, 1);
         newCart.lastUpdated = Date.now();
         setCart(newCart); 
         localStorage.setItem('mtg_cart', JSON.stringify(newCart));
         
         const user = firebase.auth().currentUser;
         if (user) syncToCloud(user.uid);
      };

      const checkoutSingles = () => {
         if(cart.singles.length === 0) return alert("Carrello vuoto!");
         
         const counts = {};
         cart.singles.forEach(c => { counts[c.name] = (counts[c.name] || 0) + 1; });
         const list = Object.keys(counts).map(name => `${counts[name]} ${name}`).join('\n');
         
         navigator.clipboard.writeText(list);
         alert("Lista copiata negli appunti!\nTi porto su CardTrader: clicca su 'Incolla testo' (lo trovi sulla destra) e fai Incolla per caricare le carte.");
         window.open("https://www.cardtrader.com/it/wishlists/new", "_blank");
      };

      const checkoutDeck = (deck) => {
         const counts = {};
         deck.cards.forEach(c => { counts[c.name] = (counts[c.name] || 0) + 1; });
         const list = Object.keys(counts).map(name => `${counts[name]} ${name}`).join('\n');
         
         navigator.clipboard.writeText(list);
         alert(`Mazzo "${deck.name}" copiato!\nTi porto su CardTrader: clicca su 'Incolla testo' (lo trovi sulla destra) e fai Incolla per caricare le carte.`);
         window.open("https://www.cardtrader.com/it/wishlists/new", "_blank");
      };

      return (
        <div className="max-w-md mx-auto bg-gray-800/90 p-6 rounded-xl shadow-lg border border-gray-600 mt-4 backdrop-blur-sm animate-fade">

             <div className="space-y-4 animate-fade">
                {cart.singles.length === 0 ? <p className="text-center text-gray-400 font-bold">Nessuna carta singola.</p> : (
                   <React.Fragment>
                     <div className="bg-gray-900 p-2 rounded-lg border border-gray-700 max-h-64 overflow-y-auto space-y-2">
                        {cart.singles.map((c, i) => (
                           <div key={i} className="flex justify-between items-center bg-gray-800 p-2 rounded shadow">
                              <span className="font-bold text-sm text-white truncate w-2/3">{c.name}</span>
                              <div className="flex items-center gap-3">
                                 <span className="text-yellow-400 font-black text-sm">{c.prices && c.prices.eur ? `€${c.prices.eur}` : 'N/D'}</span>
                                 <button onClick={()=>remove('singles', i)} className="text-red-500 font-black text-lg w-6 h-6 flex items-center justify-center bg-red-900/30 rounded">✖</button>
                              </div>
                           </div>
                        ))}
                     </div>
                     <div className="flex flex-col gap-2 mt-4">
   <button onClick={checkoutSingles} className="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-3 rounded-xl shadow transition-all">🛒 CARDTRADER</button>
   <button onClick={() => {
       if(cart.singles.length === 0) return alert("Carrello vuoto!");
       const counts = {}; cart.singles.forEach(c => { counts[c.name] = (counts[c.name] || 0) + 1; });
       const list = Object.keys(counts).map(name => `${counts[name]} ${name}`).join('\n');
       navigator.clipboard.writeText(list);
       alert("Lista copiata!\n\nTi porto su Cardmarket: vai su 'Wants' (Liste dei Desideri), crea una nuova lista e usa la funzione 'Importa'.");
       window.open("https://www.cardmarket.com/it/Magic/Wants", "_blank");
   }} className="w-full bg-[#1e4174] hover:bg-[#153059] text-white font-black py-3 rounded-xl shadow transition-all">🛒 CARDMARKET</button>
</div>
                   </React.Fragment>
                )}
             </div>
          )}

          {tab === 'decks' && (
             <div className="space-y-4 animate-fade">
                {cart.decks.length === 0 ? <p className="text-center text-gray-400 font-bold">Nessun mazzo nel carrello.</p> : (
                   <div className="space-y-4">
                      {cart.decks.map((d, i) => (
                         <div key={i} className="bg-gray-900 p-3 rounded-xl border border-gray-700 shadow-inner">
                            <div className="flex justify-between items-center mb-3">
                               <h3 className="font-black text-white text-lg truncate w-3/4">{d.name}</h3>
                               <button onClick={()=>remove('decks', i)} className="text-red-500 font-black text-lg bg-red-900/30 px-3 py-1 rounded">✖</button>
                            </div>
                            <div className="flex gap-2 mt-2">
   <button onClick={()=>checkoutDeck(d)} className="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-black py-2 rounded-lg shadow text-xs transition-all">CARDTRADER</button>
   <button onClick={() => {
       const counts = {}; d.cards.forEach(c => { counts[c.name] = (counts[c.name] || 0) + 1; });
       const list = Object.keys(counts).map(name => `${counts[name]} ${name}`).join('\n');
       navigator.clipboard.writeText(list);
       alert(`Mazzo "${d.name}" copiato!\n\nTi porto su Cardmarket: vai su 'Wants', crea una nuova lista e 'Importa'.`);
       window.open("https://www.cardmarket.com/it/Magic/Wants", "_blank");
   }} className="flex-1 bg-[#1e4174] hover:bg-[#153059] text-white font-black py-2 rounded-lg shadow text-xs transition-all">CARDMARKET</button>
</div>
                         </div>
                      ))}

                )}
             </div>
