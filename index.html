                   </React.Fragment>
                )}
             </div>
          )}
          {tab === 'decks' && (
             <div className="space-y-4 animate-fade">
                {cart.decks.length === 0 ? <p className="text-center text-gray-400 font-bold">Nessun mazzo nel carrello.</p> : (
                   <div className="space-y-4">
                      {cart.decks.map((d, i) => (
                         <div key={i} className="bg-gray-900 p-3 rounded-xl border border-gray-700 shadow-inner">
                            <div className="flex justify-between items-center mb-3">
                               <h3 className="font-black text-white text-lg truncate w-3/4">{d.name}</h3>
                               <button onClick={()=>remove('decks', i)} className="text-red-500 font-black text-lg bg-red-900/30 px-3 py-1 rounded">✖</button>
                            </div>
                            <div className="flex gap-2 mt-2">
                               <button onClick={()=>checkoutDeck(d)} className="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-black py-2 rounded-lg shadow text-xs transition-all">CARDTRADER</button>
                               <button onClick={() => {
                                   const counts = {}; d.cards.forEach(c => { counts[c.name] = (counts[c.name] || 0) + 1; });
                                   const list = Object.keys(counts).map(name => `${counts[name]} ${name}`).join('\n');
                                   navigator.clipboard.writeText(list);
                                   alert(`Mazzo "${d.name}" copiato!\n\nTi porto su Cardmarket: vai su 'Wants', crea una nuova lista e 'Importa'.`);
                                   window.open("https://www.cardmarket.com/it/Magic/Wants", "_blank");
                               }} className="flex-1 bg-[#1e4174] hover:bg-[#153059] text-white font-black py-2 rounded-lg shadow text-xs transition-all">CARDMARKET</button>
                            </div>
                         </div>
                      ))}
                   </div>
                )}
             </div>
          )}
        </div>
      );
    };

    const ActionCard = ({icon, text, onClick, color}) => (
      <button onClick={onClick} className={`${color} p-6 rounded-xl flex flex-col items-center justify-center border border-gray-600 shadow-xl active:scale-95 transition-all backdrop-blur-md`}>
        <div className="text-4xl mb-2 drop-shadow-md">{icon}</div>
        <span className="font-bold text-sm tracking-wide">{text}</span>
      </button>
    );

    const BackupView = ({navigate}) => {
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [loading, setLoading] = useState(false);
      const user = auth.currentUser; 

      const handleAuth = async (isSignUp) => {
        if(!email || password.length < 6) return alert("Inserisci un'email valida e una password di almeno 6 caratteri.");
        setLoading(true);
        try {
          if(isSignUp) { await auth.createUserWithEmailAndPassword(email, password); alert("Account creato con successo!"); } 
          else { await auth.signInWithEmailAndPassword(email, password); alert("Bentornato!"); }
        } catch(err) { alert("Errore: " + err.message); }
        setLoading(false);
      };

      const handleGoogleLogin = async () => {
        setLoading(true);
        try {
          const provider = new firebase.auth.GoogleAuthProvider();
          await auth.signInWithPopup(provider); alert("Accesso con Google completato!");
        } catch(err) { alert("Errore Google Login: " + err.message); }
        setLoading(false);
      };

      const forceSyncUp = async () => {
        if(!user) return; setLoading(true);
        try { await syncToCloud(user.uid); alert("Mazzi salvati nel Cloud con successo!"); } catch(err) { alert("Errore durante il salvataggio sul Cloud."); }
        setLoading(false);
      };

      const forceSyncDown = async () => {
        if(!user) return;
        if(!confirm("ATTENZIONE: Stai per sovrascrivere i mazzi di questo dispositivo con quelli del Cloud. Procedere?")) return;
        setLoading(true);
        try {
          const success = await syncFromCloud(user.uid);
          if(success) alert("Mazzi ripristinati dal Cloud!"); else alert("Nessun mazzo trovato sul Cloud per questo account.");
        } catch(err) { alert("Errore durante il ripristino."); }
        setLoading(false);
      };

      const handleManualExport = () => {
        const dataToExport = { decks: JSON.parse(localStorage.getItem('mtg_decks') || '[]'), proxies: JSON.parse(localStorage.getItem('mtg_proxies') || '[]') };
        const dataStr = JSON.stringify(dataToExport); const blob = new Blob([dataStr], { type: "application/json" });
        const url = URL.createObjectURL(blob); const a = document.createElement('a');
        a.href = url; a.download = `MTG_Companion_Backup_${new Date().toISOString().split('T')[0]}.json`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
      };

      const handleManualImport = (e) => {
        const file = e.target.files[0]; if (!file) return;
        if (!confirm("ATTENZIONE: Importando questo file sovrascriverai i mazzi e le proxy attualmente salvati su questo dispositivo. Sei sicuro?")) { e.target.value = null; return; }
        const reader = new FileReader();
        reader.onload = (event) => {
           try {
              const importedData = JSON.parse(event.target.result);
              if (importedData.decks) { localStorage.setItem('mtg_decks', JSON.stringify(importedData.decks)); window.dispatchEvent(new Event("cloud_sync_update")); }
              if (importedData.proxies) { localStorage.setItem('mtg_proxies', JSON.stringify(importedData.proxies)); window.dispatchEvent(new Event("cloud_proxies_update")); }
              alert("Dati ripristinati con successo dal file locale!");
           } catch (err) { alert("Errore nella lettura del file. Assicurati che sia un backup valido."); }
        };
        reader.readAsText(file);
      };

      return (
        <div className="max-w-md mx-auto bg-gray-800/90 p-6 rounded-xl shadow-lg border border-gray-600 mt-4 backdrop-blur-sm space-y-6 animate-fade">
          <h2 className="text-3xl font-black text-center text-blue-400 drop-shadow-md">Cloud Sync</h2>
          <p className="text-gray-300 text-sm font-semibold text-center leading-snug">L'app salva tutto automaticamente offline in locale. Usa questa cassaforte per fare il backup dei tuoi mazzi online.</p>
          {!user ? (
            <div className="bg-gray-900 p-4 rounded-xl border border-gray-700 shadow-inner space-y-3">
              <button onClick={handleGoogleLogin} disabled={loading} className="w-full bg-white hover:bg-gray-100 text-black font-black py-3 rounded-lg shadow flex items-center justify-center gap-2 transition-colors mb-4">
                <svg className="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg> Accedi con Google
              </button>
              <div className="flex items-center gap-2 mb-4"><div className="h-px bg-gray-700 flex-1"></div><span className="text-gray-500 text-xs font-bold uppercase">Oppure</span><div className="h-px bg-gray-700 flex-1"></div></div>
              <input type="email" placeholder="La tua Email" value={email} onChange={e=>setEmail(e.target.value)} className="w-full bg-gray-800 border border-gray-600 rounded p-3 text-white font-bold outline-none" />
              <input type="password" placeholder="Password (min 6 car.)" value={password} onChange={e=>setPassword(e.target.value)} className="w-full bg-gray-800 border border-gray-600 rounded p-3 text-white font-bold outline-none" />
              <div className="flex gap-2 pt-2">
                <button onClick={()=>handleAuth(false)} disabled={loading} className="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-black py-3 rounded-lg shadow transition-colors">ACCEDI</button>
                <button onClick={()=>handleAuth(true)} disabled={loading} className="flex-1 bg-gray-600 hover:bg-gray-500 text-white font-black py-3 rounded-lg shadow transition-colors">REGISTRATI</button>
              </div>
            </div>
          ) : (
            <div className="bg-gray-900 p-4 rounded-xl border border-gray-700 shadow-inner text-center">
              <p className="text-sm text-green-400 font-bold mb-1">🟢 Connesso come</p>
              <p className="text-white font-black truncate mb-6 text-lg">{user.email || user.displayName || "Utente Google"}</p>
              <div className="space-y-4">
                <button onClick={forceSyncUp} disabled={loading} className="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-xl shadow-[0_0_15px_rgba(37,99,235,0.4)] transition-all">☁️ SALVA MAZZI NEL CLOUD</button>
                <button onClick={forceSyncDown} disabled={loading} className="w-full bg-green-600 hover:bg-green-500 text-white font-black py-4 rounded-xl shadow-[0_0_15px_rgba(22,163,74,0.4)] transition-all">📥 RECUPERA MAZZI DAL CLOUD</button>
                <button onClick={() => auth.signOut()} className="w-full bg-red-800 hover:bg-red-700 text-white font-bold py-2 rounded-lg mt-4 transition-colors">Disconnetti Account</button>
              </div>
            </div>
          )}
          <div className="pt-6 border-t border-gray-700 mt-6">
             <h3 className="text-xl font-black text-center text-emerald-400 drop-shadow-md mb-2">Backup Manuale Offline</h3>
             <p className="text-gray-400 text-xs text-center font-bold mb-4">Salva mazzi e proxy in un file sul tuo dispositivo, utile se non hai connessione o non vuoi registrarti.</p>
             <div className="flex gap-2">
               <button onClick={handleManualExport} className="flex-1 bg-emerald-700 hover:bg-emerald-600 text-white font-black py-3 rounded-xl shadow transition-colors">📦 ESPORTA</button>
               <label className="flex-1 bg-gray-700 hover:bg-gray-600 text-white font-black py-3 rounded-xl shadow transition-colors cursor-pointer text-center flex items-center justify-center">📂 IMPORTA<input type="file" accept=".json" className="hidden" onChange={handleManualImport} /></label>
             </div>
          </div>
        </div>
      );
    };

    const MyProxies = ({navigate, printQueue, setPrintQueue}) => {
      const [proxies, setProxies] = useState([]);
      useEffect(() => { 
         const loadProxies = () => setProxies(JSON.parse(localStorage.getItem('mtg_proxies') || '[]'));
         loadProxies(); window.addEventListener("cloud_proxies_update", loadProxies); return () => window.removeEventListener("cloud_proxies_update", loadProxies);
      }, []);

      const deleteProxy = (id) => {
         if(confirm("Vuoi eliminare questa Proxy? Verrà rimossa dal database (ma resterà nei mazzi dove l'hai già applicata finché non li modifichi).")) {
             const newProxies = proxies.filter(p => p.id !== id);
             localStorage.setItem('mtg_proxies', JSON.stringify(newProxies)); setProxies(newProxies);
             if (auth.currentUser) { deleteProxyFromCloud(auth.currentUser.uid, id); }
         }
      };

      if (proxies.length === 0) return (
         <div className="max-w-md mx-auto mt-10">
            <div className="bg-gray-800/90 p-6 rounded-xl border border-gray-700 text-center shadow-lg">
               <p className="text-gray-400 font-bold mb-4">Non hai ancora creato nessuna Proxy.</p>
               <button onClick={() => navigate('proxycreator')} className="bg-purple-600 hover:bg-purple-500 text-white font-bold py-2 px-6 rounded shadow transition-colors">Crea Proxy</button>
            </div>
         </div>
      );

      return (
         <div className="max-w-3xl mx-auto space-y-4 animate-fade">
           <div className="bg-gray-800/90 p-4 rounded-xl border border-gray-600 shadow-md backdrop-blur-sm flex justify-between items-center mt-4">
              <h2 className="text-xl font-bold text-purple-400">Le Mie Proxy ({proxies.length})</h2>
              <button onClick={() => navigate('proxycreator')} className="bg-purple-600 px-3 py-1 rounded text-white font-bold shadow text-sm">+ Crea</button>
           </div>
           <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
              {proxies.map(p => (
                 <div key={p.id} className="bg-gray-800 rounded-xl border border-gray-600 overflow-hidden shadow-xl flex flex-col relative">
                    <img src={p.proxyImage} className="w-full object-contain" style={{ aspectRatio: '63/88' }} />
                    <button onClick={() => deleteProxy(p.id)} className="absolute top-2 right-2 bg-red-600/90 text-white w-8 h-8 rounded-full font-black shadow-lg flex items-center justify-center backdrop-blur hover:bg-red-500 active:scale-95 transition-all">✖</button>
                    <button onClick={() => { setPrintQueue([...(printQueue || []), {img: p.proxyImage, name: p.name}]); alert("Proxy in coda di stampa!"); }} className="absolute top-2 left-2 bg-cyan-600/90 text-white w-8 h-8 rounded-full font-black shadow-lg flex items-center justify-center backdrop-blur hover:bg-cyan-500 active:scale-95 transition-all">🖨️</button>
                    <div className="bg-gray-900 p-2 text-center text-xs font-bold text-gray-300 truncate">{p.name}</div>
                 </div>
              ))}
           </div>
         </div>
      );
    };

    const ProxyEditor = ({card, onClose, onSave, isStandalone}) => {
      const [baseQuery, setBaseQuery] = useState("");
      const [baseCard, setBaseCard] = useState(card ? {name: card.name, type: card.type, img: card.image, cmc: card.cmc} : null);
      const [customName, setCustomName] = useState(""); const [customImg, setCustomImg] = useState("");
      const [zoom, setZoom] = useState(1); const [posX, setPosX] = useState(50); const [posY, setPosY] = useState(50);
      const [maskTop, setMaskTop] = useState(11.5); const [maskHeight, setMaskHeight] = useState(44); 
      const [maskLeft, setMaskLeft] = useState(8.2); const [maskWidth, setMaskWidth] = useState(83.6);
      const [isGenerating, setIsGenerating] = useState(false);

      const searchBase = () => {
        if(!baseQuery.trim()) return;
        fetch(`https://api.scryfall.com/cards/named?fuzzy=${encodeURIComponent(baseQuery.trim())}`).then(res => res.json()).then(c => {
             try {
                 if(c.id) {
                   let imgUrl = "";
                   if (c.image_uris && c.image_uris.normal) imgUrl = c.image_uris.normal; else if (c.card_faces && c.card_faces.length > 0 && c.card_faces[0].image_uris) imgUrl = c.card_faces[0].image_uris.normal;
                   setBaseCard({ name: c.name || "Sconosciuta", type: c.type_line || "", img: imgUrl, cmc: c.cmc || 0 }); setCustomName(""); setCustomImg(""); setZoom(1); setPosX(50); setPosY(50); setMaskTop(11.5); setMaskHeight(44); setMaskLeft(8.2); setMaskWidth(83.6);
                 } else { alert("Carta non trovata"); }
             } catch(err) { console.error("Errore", err); }
          }).catch(e => { console.error("Rete", e); });
      };

      const handleImage = (e) => { const file = e.target.files[0]; if(file) { const r = new FileReader(); r.onload = (ev) => setCustomImg(ev.target.result); r.readAsDataURL(file); } };

      const eseguiSalvataggio = () => {
        const proxyAttuali = JSON.parse(localStorage.getItem('mtg_proxies') || '[]');
        if (proxyAttuali.length >= 20) { return alert("Limite raggiunto! Puoi avere al massimo 20 Proxy contemporaneamente. Eliminane qualcuna per crearne di nuove."); }
        if(!baseCard || !customImg) return alert("Carica un'immagine!");
        setIsGenerating(true);
        const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
        const bImg = new Image(); bImg.crossOrigin = "anonymous"; bImg.src = baseCard.img;

        bImg.onload = () => {
          canvas.width = bImg.width; canvas.height = bImg.height; ctx.drawImage(bImg, 0, 0, canvas.width, canvas.height);
          const uImg = new Image(); uImg.src = customImg;
          uImg.onload = () => {
             const artX = canvas.width * (maskLeft / 100); const artW = canvas.width * (maskWidth / 100); const artY = canvas.height * (maskTop / 100); const artH = canvas.height * (maskHeight / 100);
             ctx.save(); ctx.beginPath(); ctx.rect(artX, artY, artW, artH); ctx.clip(); 
             const boxAspect = artW / artH; const imgAspect = uImg.width / uImg.height; let baseW, baseH;
             if (imgAspect > boxAspect) { baseH = artH; baseW = uImg.width * (artH / uImg.height); } else { baseW = artW; baseH = uImg.height * (artW / uImg.width); }
             const finalW = baseW * zoom; const finalH = baseH * zoom; const offsetX = finalW * ((posX - 50) / 100); const offsetY = finalH * ((posY - 50) / 100);
             const imgX = artX + (artW / 2) - (finalW / 2) + offsetX; const imgY = artY + (artH / 2) - (finalH / 2) + offsetY;
             ctx.drawImage(uImg, imgX, imgY, finalW, finalH); ctx.restore();

             if (customName) {
                const tx = canvas.width * 0.07; const ty = canvas.height * 0.045; const tw = canvas.width * 0.65; const th = canvas.height * 0.055;
                ctx.fillStyle = "#1a1a1a"; ctx.fillRect(tx, ty, tw, th); ctx.strokeStyle = "#555"; ctx.strokeRect(tx, ty, tw, th);
                ctx.fillStyle = "white"; ctx.font = `bold ${canvas.height * 0.025}px Georgia, serif`; ctx.fillText(customName, tx + 10, ty + (th/1.8));
                ctx.fillStyle = "#aaa"; ctx.font = `italic ${canvas.height * 0.015}px Georgia, serif`; ctx.fillText(baseCard.name, tx + 10, ty + (th/1.1));
             }
             const finalDataUrl = canvas.toDataURL("image/jpeg", 0.9);
             const newProxy = { id: 'proxy-' + Date.now(), name: customName || baseCard.name, image: finalDataUrl, proxyImage: finalDataUrl, imageBack: null, type: baseCard.type, cmc: baseCard.cmc || 0, colors: card ? (card.colors || []) : [], isCommander: false, isCustom: true };
             let savedProxies = JSON.parse(localStorage.getItem('mtg_proxies') || '[]'); savedProxies.push(newProxy); localStorage.setItem('mtg_proxies', JSON.stringify(savedProxies));
             if (auth.currentUser) { syncSingleProxyToCloud(auth.currentUser.uid, newProxy); }
             setIsGenerating(false);
             if(isStandalone) { alert("Proxy Salvata nel Database!"); } else { onSave({...card, proxyImage: finalDataUrl, name: customName || card.name, isCustom: true}); }
          };
        };
      };

      const editorUI = (
        <div className="w-full max-w-md bg-gray-800 p-4 rounded-xl border border-gray-600 shadow-2xl space-y-4 mx-auto animate-fade">
          <div className="flex justify-between items-center mb-2 border-b border-gray-700 pb-2"><h2 className="text-xl font-bold text-purple-400">Proxy Creator</h2>{!isStandalone && <button onClick={onClose} className="bg-gray-600 px-3 py-1 rounded text-white font-bold">✖</button>}</div>
          {isStandalone && ( <div className="flex gap-2 mb-4"><input type="text" placeholder="Originale (es. Sol Ring)" value={baseQuery} onChange={e => setBaseQuery(e.target.value)} className="flex-1 bg-gray-900 border border-gray-600 p-2 rounded text-white outline-none" /><button onClick={searchBase} className="bg-purple-600 px-3 rounded text-white font-bold">Cerca</button></div> )}
          {baseCard && (
           <div className="animate-fade space-y-3">
             <input type="text" placeholder="Nuovo Titolo (Opzionale)" value={customName} onChange={e => setCustomName(e.target.value)} className="w-full bg-gray-900 border border-gray-600 p-2 rounded text-white font-bold outline-none" />
             <label className="block w-full bg-gray-700 hover:bg-gray-600 text-center py-2 rounded cursor-pointer font-bold text-sm text-white shadow border border-gray-500 transition-colors">📸 Carica Immagine <input type="file" accept="image/*" className="hidden" onChange={handleImage} /></label>
             {customImg && (
                 <div className="bg-gray-900 p-3 rounded-lg border border-gray-700 space-y-3">
                    <div className="space-y-1">
                      <p className="text-[10px] font-bold text-blue-400 uppercase">Cornice Riquadro</p>
                      <div className="flex items-center gap-2"><span className="text-[10px] w-10 text-white font-bold">Su</span><input type="range" min="0" max="30" step="0.5" value={maskTop} onChange={e=>setMaskTop(e.target.value)} className="w-full accent-blue-500" /></div>
                      <div className="flex items-center gap-2"><span className="text-[10px] w-10 text-white font-bold">Alt.</span><input type="range" min="20" max="100" step="0.5" value={maskHeight} onChange={e=>setMaskHeight(e.target.value)} className="w-full accent-blue-500" /></div>
                      <div className="flex items-center gap-2"><span className="text-[10px] w-10 text-white font-bold">Sx</span><input type="range" min="0" max="20" step="0.2" value={maskLeft} onChange={e=>setMaskLeft(e.target.value)} className="w-full accent-blue-500" /></div>
                      <div className="flex items-center gap-2"><span className="text-[10px] w-10 text-white font-bold">Largh.</span><input type="range" min="50" max="100" step="0.5" value={maskWidth} onChange={e=>setMaskWidth(e.target.value)} className="w-full accent-blue-500" /></div>
                    </div>
                    <div className="space-y-1 pt-2 border-t border-gray-700">
                      <p className="text-[10px] font-bold text-purple-400 uppercase">Foto Interna</p>
                      <div className="flex items-center gap-2"><span className="text-[10px] w-10 text-white font-bold">Zoom</span><input type="range" min="1" max="3" step="0.1" value={zoom} onChange={e=>setZoom(e.target.value)} className="w-full accent-purple-500" /></div>
                      <div className="flex items-center gap-2"><span className="text-[10px] w-10 text-white font-bold">Orizz</span><input type="range" min="0" max="100" value={posX} onChange={e=>setPosX(e.target.value)} className="w-full accent-purple-500" /></div>
                      <div className="flex items-center gap-2"><span className="text-[10px] w-10 text-white font-bold">Vert</span><input type="range" min="0" max="100" value={posY} onChange={e=>setPosY(e.target.value)} className="w-full accent-purple-500" /></div>
                    </div>
                 </div>
             )}
             <div className="relative w-full rounded-xl overflow-hidden shadow-2xl bg-black border border-gray-600 mt-4" style={{ aspectRatio: '63/88' }}>
                 <img src={baseCard.img} className="absolute inset-0 w-full h-full pointer-events-none" />
                 {customImg && ( <div className="absolute bg-black z-10 overflow-hidden shadow-[inset_0_0_15px_rgba(0,0,0,0.8)] border border-black/50" style={{ top: `${maskTop}%`, left: `${maskLeft}%`, width: `${maskWidth}%`, height: `${maskHeight}%` }}><img src={customImg} style={{ position: 'absolute', top: 0, left: 0, width: '100%', height: '100%', objectFit: 'cover', transform: `translate(${posX - 50}%, ${posY - 50}%) scale(${zoom})` }} /></div> )}
                 {customName && ( <div className="absolute z-20 flex items-center px-3" style={{ top: '4.8%', left: '7.5%', width: '65%', height: '4.5%' }}><span className="text-white tracking-wider truncate" style={{ fontFamily: "Georgia, serif", fontSize: '16px', fontWeight: '900', textShadow: '2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000' }}>{customName}</span></div> )}
             </div>
             <button onClick={eseguiSalvataggio} disabled={isGenerating} className="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-4 rounded-lg shadow-[0_0_15px_rgba(22,163,74,0.5)] mt-4 transition-all">
                 {isGenerating ? 'Attendere...' : (isStandalone ? '💾 Crea & Salva Database' : '💾 Applica Proxy al Mazzo')}
             </button>
           </div>
          )}
        </div>
      );
      if (isStandalone) return <div className="max-w-md mx-auto pt-4 pb-10 relative z-20">{editorUI}</div>;
      
      return (
        <div className="fixed inset-0 bg-gray-900 z-[9999] h-[100dvh] w-full flex flex-col animate-fade overflow-y-auto">
           <div className="flex items-center justify-between p-4 bg-gray-800 border-b border-gray-700 sticky top-0 z-50 shadow-md">
             <button onClick={onClose} className="text-blue-400 font-bold flex items-center gap-1"><Icons.Back /> Indietro</button><h2 className="text-lg font-bold text-white truncate text-center">Proxy Editor</h2><div className="w-8"></div>
           </div>
           <div className="flex-1 p-4 flex flex-col items-center pb-20">{editorUI}</div>
        </div>
      );
    };

    const CardSearchExplorer = ({navigate, printQueue, setPrintQueue, collection, setCollection, mtgSets}) => {
      const [query, setQuery] = useState("");
      const [oracleText, setOracleText] = useState("");
      const [mana, setMana] = useState([]);
      const [colorMatchType, setColorMatchType] = useState('include'); 
      const [isMulticolorOnly, setIsMulticolorOnly] = useState(false);
      const [isCommanderOnly, setIsCommanderOnly] = useState(false);

      const [superType, setSuperType] = useState(""); const [cardType, setCardType] = useState("");
      const [cardType2, setCardType2] = useState(""); const [subType, setSubType] = useState("");
      const [rarity, setRarity] = useState(""); const [cmcOp, setCmcOp] = useState("="); const [cmcVal, setCmcVal] = useState("");
      const [expFilter, setExpFilter] = useState(""); 
      
      const [allResults, setAllResults] = useState([]);
      const [localPage, setLocalPage] = useState(0);
      const [nextScryfallUrl, setNextScryfallUrl] = useState(null);
      const [loading, setLoading] = useState(false);
      
      const [isScanning, setIsScanning] = useState(false);
      const [scanProgress, setScanProgress] = useState("");

      const [viewingCard, setViewingCard] = useState(null);
      const [itaImg, setItaImg] = useState(null); const [itaImgBack, setItaImgBack] = useState(null);
      const [showIta, setShowIta] = useState(false); const [showBack, setShowBack] = useState(false);
      const [translating, setTranslating] = useState(false);
      const [printsList, setPrintsList] = useState([]); const [loadingPrints, setLoadingPrints] = useState(false);
      const [savedScroll, setSavedScroll] = useState(0);

      const ManaColors = [ { id: 'W', color: 'bg-yellow-100 text-yellow-900', label: 'W' }, { id: 'U', color: 'bg-blue-500 text-white', label: 'U' }, { id: 'B', color: 'bg-gray-800 text-white', label: 'B' }, { id: 'R', color: 'bg-red-500 text-white', label: 'R' }, { id: 'G', color: 'bg-green-500 text-white', label: 'G' }, { id: 'C', color: 'bg-gray-400 text-gray-900', label: 'C' } ];

      const toggleMana = (m) => setMana(mana.includes(m) ? mana.filter(x => x !== m) : [...mana, m]);

      const eseguiRicerca = (url, isNewSearch = false) => {
        setLoading(true);
        fetch(url).then(res => res.json()).then(data => {
            if (data.data && Array.isArray(data.data)) {
               const cards = data.data.filter(c => c.image_uris || (c.card_faces && c.card_faces.length > 0 && c.card_faces[0].image_uris)).map(c => {
                 let img = ""; let imgBack = null; let oracle_text = c.oracle_text || ""; let mana_cost = c.mana_cost || "";
                 if (c.image_uris && c.image_uris.normal) { img = c.image_uris.normal; } 
                 else if (c.card_faces && c.card_faces.length > 0) {
                     if (c.card_faces[0].image_uris && c.card_faces[0].image_uris.normal) img = c.card_faces[0].image_uris.normal;
                     if (c.card_faces.length > 1 && c.card_faces[1].image_uris && c.card_faces[1].image_uris.normal) imgBack = c.card_faces[1].image_uris.normal;
                     if (!oracle_text) oracle_text = c.card_faces.map(f=>f.oracle_text).join(' ');
                         if (!mana_cost) mana_cost = c.card_faces[0].mana_cost;
                     }
                     return { 
                         id: c.id, name: c.name, image: img, imageBack: imgBack, type: c.type_line || "", 
                         cmc: c.cmc || 0, colors: c.color_identity || [], legalities: c.legalities || {}, 
                         printsUrl: c.prints_search_uri || null, oracle_text: oracle_text, mana_cost: mana_cost, 
                         prices: c.prices || {}, rarity: c.rarity || "common", setCode: c.set || "", setName: c.set_name || "",
                         collector_number: c.collector_number || "" 
                     };
                   });
               if(isNewSearch) { setAllResults(cards); setLocalPage(0); } else { setAllResults(prev => [...prev, ...cards]); }
               setNextScryfallUrl(data.has_more ? data.next_page : null);
            } else { if(isNewSearch) { setAllResults([]); alert("Nessuna carta trovata."); } }
            setLoading(false);
          }).catch(e => { console.error("Rete", e); setLoading(false); });
      };

      const searchCard = (forceQuery = null) => {
        const q = forceQuery !== null ? forceQuery : query;
        let searchQuery = q ? `${q} ` : "";
        if (oracleText) searchQuery += `o:"${oracleText}" `; if (rarity) searchQuery += `r:${rarity} `;
        if (expFilter) searchQuery += `e:${expFilter} `; 
        if (mana.length > 0) {
           let mStr = mana.join('');
           if (colorMatchType === 'exact') searchQuery += cardType === 'land' ? `id=${mStr} ` : `c=${mStr} `; else searchQuery += cardType === 'land' ? `id>=${mStr} ` : `c>=${mStr} `;
        }
        if (isMulticolorOnly) searchQuery += `c>1 `; if (isCommanderOnly) searchQuery += `is:commander `;
        if (superType) searchQuery += `t:${superType} `; if (cardType) searchQuery += `t:${cardType} `; if (cardType2) searchQuery += `t:${cardType2} `;
        if (subType) searchQuery += `t:${subType} `; if (cmcVal !== "") searchQuery += `cmc${cmcOp}${cmcVal} `;
        if(!searchQuery.trim()) return alert("Inserisci almeno un parametro di ricerca!");
        eseguiRicerca(`https://api.scryfall.com/cards/search?q=${encodeURIComponent(searchQuery.trim())}`, true);
      };

      const handleGeminiScan = (e) => {
          const fileInput = e.target; 
          const file = fileInput.files[0];
          if (!file) return;
          let apiKey = localStorage.getItem('gemini_api_key');
          if (!apiKey) {
              apiKey = window.prompt("Per usare lo Scanner IA serve una API Key gratuita.\n\nPuoi ottenerla in 1 minuto su: https://aistudio.google.com/\n\nIncolla qui la tua API Key (verrà salvata in modo sicuro solo su questo dispositivo):");
              if (!apiKey) return;
              localStorage.setItem('gemini_api_key', apiKey);
          }
          setIsScanning(true); setScanProgress("IA in elaborazione...");
          const reader = new FileReader();
          
          reader.onloadend = async () => {
              const base64data = reader.result.split(',')[1];
              try {
                  const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
                      method: 'POST', headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({ contents: [{ parts: [{ text: "Sei un esperto di Magic: The Gathering. Guarda questa carta. Rispondi SOLO ed ESCLUSIVAMENTE con il nome esatto della carta in INGLESE. Non aggiungere punteggiatura, spiegazioni o altro testo." }, { inline_data: { mime_type: file.type, data: base64data } } ] }] })
                  });
                  const data = await response.json();
                  if (data.error) throw new Error(data.error.message);
                  const cardName = data.candidates[0].content.parts[0].text.trim();
                  setQuery(cardName); searchCard(cardName);
              } catch (err) { alert("Errore durante la scansione. Controlla la API Key o riprova."); } finally { setIsScanning(false); setScanProgress(""); fileInput.value = ''; }
          };
          reader.readAsDataURL(file);
      };
      
      const maxLocalPages = allResults.length > 0 ? Math.ceil(allResults.length / 15) : 0;
      const currentResults = allResults.length > 0 ? allResults.slice(localPage * 15, (localPage + 1) * 15) : [];
      const goToNextPage = () => { if (localPage + 1 < maxLocalPages) { setLocalPage(localPage + 1); } else if (nextScryfallUrl) { eseguiRicerca(nextScryfallUrl, false); setLocalPage(localPage + 1); } };
      const goToPrevPage = () => { if (localPage > 0) setLocalPage(localPage - 1); };

      const openViewer = (c) => { setSavedScroll(window.scrollY); setItaImg(null); setItaImgBack(null); setShowIta(false); setShowBack(false); setPrintsList([]); setViewingCard(c); window.scrollTo(0,0); };
      const closeViewer = () => { setViewingCard(null); setTimeout(() => window.scrollTo(0, savedScroll), 10); };

      const fetchOtherPrints = (card) => {
          if(!card.printsUrl) return alert("Nessun'altra stampa disponibile.");
          setLoadingPrints(true);
          fetch(card.printsUrl).then(res => res.json()).then(data => {
                if(data.data && data.data.length > 0) {
                    const mapped = data.data.filter(c => c.image_uris || (c.card_faces && c.card_faces.length > 0 && c.card_faces[0].image_uris)).map(c => {
                         let iImg = ""; let iImgBack = null;
                         if (c.image_uris && c.image_uris.normal) iImg = c.image_uris.normal;
                         else if (c.card_faces && c.card_faces.length > 0) {
                             if (c.card_faces[0].image_uris && c.card_faces[0].image_uris.normal) iImg = c.card_faces[0].image_uris.normal;
                             if (c.card_faces.length > 1 && c.card_faces[1].image_uris && c.card_faces[1].image_uris.normal) iImgBack = c.card_faces[1].image_uris.normal;
                         }
                         return { ...card, id: c.id, image: iImg, imageBack: iImgBack, rarity: c.rarity || "common", setCode: c.set || "", setName: c.set_name || "", collector_number: c.collector_number || "", prices: c.prices || {} };
                        });
                        setPrintsList(mapped);
                }
                setLoadingPrints(false);
            }).catch(e => { console.error(e); setLoadingPrints(false); });
      };

      const translateCard = (card) => {
        if (itaImg) { setShowIta(!showIta); return; } 
        setTranslating(true);
        fetch(`https://api.scryfall.com/cards/search?q=!"${card.name}"+lang:it`).then(res => res.json()).then(data => {
             if (data.data && data.data.length > 0) {
                 const itCard = data.data[0]; let iImg = null; let iImgBack = null;
                 if (itCard.image_uris && itCard.image_uris.normal) { iImg = itCard.image_uris.normal; } 
                 else if (itCard.card_faces && itCard.card_faces.length > 0) {
                     if (itCard.card_faces[0].image_uris) iImg = itCard.card_faces[0].image_uris.normal;
                     if (itCard.card_faces.length > 1 && itCard.card_faces[1].image_uris) iImgBack = itCard.card_faces[1].image_uris.normal;
                 }
                 if (iImg) { setItaImg(iImg); setItaImgBack(iImgBack); setShowIta(true); } else alert("Immagine italiana non trovata.");
             } else { alert("Traduzione ufficiale italiana non stampata."); }
             setTranslating(false);
          }).catch(e => { setTranslating(false); });
      };

      const formatEdhrec = (name) => name.toLowerCase().replace(/[^a-z0-9\s-]/g, '').trim().replace(/\s+/g, '-');
      const openEdhrec = (card) => {
          const isCmdr = card.type.toLowerCase().includes('legendary') && (card.type.toLowerCase().includes('creature') || card.type.toLowerCase().includes('planeswalker'));
          const urlType = isCmdr ? 'commanders' : 'cards';
          window.open(`https://edhrec.com/${urlType}/${formatEdhrec(card.name)}`, '_blank');
      };

      const defFront = viewingCard ? (viewingCard.image || "mtg-bg.jpg") : "";
      const defBack = viewingCard ? viewingCard.imageBack : null;
      const currentFront = showIta && itaImg ? itaImg : defFront;
      const currentBack = showIta && itaImgBack ? itaImgBack : defBack;
      const displayImg = showBack && currentBack ? currentBack : currentFront;

      return (
        <div className="max-w-2xl mx-auto relative z-10 w-full space-y-4">
          {viewingCard && (
             <div className="w-full flex flex-col animate-fade pb-10">
               <div className="flex items-center justify-between p-4 bg-gray-800 border-b border-gray-700 sticky top-0 z-50 shadow-md mb-6">
                 <button onClick={closeViewer} className="text-indigo-400 font-bold flex items-center gap-1 text-lg"><Icons.Back /> Indietro</button>
                 <h2 className="ml-4 font-bold text-white truncate max-w-[50%]">{viewingCard.name}</h2><div className="w-8"></div>
               </div>
               <div className="flex-1 flex flex-col items-center justify-start p-2">
                 <img src={displayImg} alt={viewingCard.name} className="w-auto max-h-[50vh] object-contain rounded-xl mb-4 shadow-2xl" />
                 {(itaImgBack || viewingCard.imageBack) && ( <button onClick={() => setShowBack(!showBack)} className="w-full max-w-sm bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 rounded-lg shadow-md border border-gray-500 mb-4 transition-colors">🔄 {showBack ? "Vedi Fronte" : "Vedi Retro"}</button> )}
                 <div className="w-full max-w-sm bg-gray-900 p-3 rounded-xl border border-gray-700 flex justify-between items-center mb-4 shadow-inner">
                    <div className="flex flex-col"><span className="text-gray-400 text-[10px] font-bold uppercase">Prezzo Scryfall</span><span className="text-yellow-400 font-black text-lg">{(viewingCard.prices && viewingCard.prices.eur) ? `€ ${viewingCard.prices.eur}` : ((viewingCard.prices && viewingCard.prices.usd) ? `$ ${viewingCard.prices.usd}` : "N/D")}</span></div>
                    <div className="flex gap-2">
                       <button onClick={() => { 
                           const priceStr = (viewingCard.prices && viewingCard.prices.eur) ? viewingCard.prices.eur : "0";
                           const priceNum = parseFloat(priceStr) || 0; const currentColl = collection || [];
                           const existingIndex = currentColl.findIndex(c => c.scryfallId === viewingCard.id);
                           let newColl = [...currentColl];
                           if(existingIndex >= 0) { newColl[existingIndex].qty += 1; } else { 
                               newColl.push({ id: 'coll-' + Math.random(), scryfallId: viewingCard.id, name: viewingCard.name, img: displayImg, colors: viewingCard.colors || [], price: priceNum, qty: 1, folder: 'Generale', type: viewingCard.type || "", rarity: viewingCard.rarity || "common", setName: viewingCard.setName || "Set Base", setCode: viewingCard.setCode || "" }); 
                           }
                           setCollection(newColl); alert("Aggiunta a La Mia Collezione!"); 
                       }} className="bg-emerald-600 hover:bg-emerald-500 text-white font-black px-3 py-2 rounded-lg shadow active:scale-95 text-xl" title="Aggiungi al Raccoglitore">📁</button>
                       <button onClick={() => {
                           let cart = JSON.parse(localStorage.getItem('mtg_cart') || '{"singles":[], "decks":[], "lastUpdated":0}');
                           cart.singles.push({ id: 'cart-' + Math.random(), name: viewingCard.name, prices: viewingCard.prices }); cart.lastUpdated = Date.now(); localStorage.setItem('mtg_cart', JSON.stringify(cart)); alert(`${viewingCard.name} aggiunto al Carrello!`);
                       }} className="bg-yellow-600 hover:bg-yellow-500 text-white font-black px-3 py-2 rounded-lg shadow active:scale-95 text-xl" title="Aggiungi al Carrello">🛒</button>
                       <button onClick={() => { setPrintQueue([...(printQueue || []), { img: displayImg, name: viewingCard.name }]); alert("Aggiunta alla coda di stampa!"); }} className="bg-cyan-600 hover:bg-cyan-500 text-white font-black px-3 py-2 rounded-lg shadow active:scale-95 text-xl" title="Stampa Proxy">🖨️</button>
                       <button onClick={() => openEdhrec(viewingCard)} className="bg-[#1c2127] hover:bg-[#2d3748] text-white font-black px-3 py-2 rounded-lg shadow active:scale-95 text-xl" title="Vedi su EDHREC">📈</button>
                    </div>
                 </div>
                 <div className="w-full max-w-sm mb-4 flex gap-2">
                    <button onClick={() => translateCard(viewingCard)} disabled={translating} className="flex-1 bg-indigo-700 hover:bg-indigo-600 text-white font-bold py-3 rounded-xl shadow-[0_0_15px_rgba(67,56,202,0.4)] border border-indigo-500 transition-all text-xs">{translating ? "Traduco..." : (showIta ? "🇬🇧 Torna in Inglese" : "🇮🇹 Tenta Traduzione")}</button>
                    {viewingCard.printsUrl && ( <button onClick={() => fetchOtherPrints(viewingCard)} disabled={loadingPrints} className="flex-1 bg-orange-600 hover:bg-orange-500 text-white font-bold py-3 rounded-xl shadow-lg border border-orange-500 transition-all text-xs">{loadingPrints ? "Cerco..." : "🖼️ Altre Stampe"}</button> )}
                 </div>
                 {printsList.length > 0 && (
                    <div className="w-full max-w-sm mb-4 bg-gray-800 p-2 rounded-xl border border-gray-600 shadow-md animate-fade">
                       <p className="text-xs text-gray-300 font-bold mb-2">Seleziona una Stampa / Secret Lair:</p>
                       <div className="flex overflow-x-auto gap-2 pb-2">
                          {printsList.map(p => (<img key={p.id} src={p.image} className="w-20 rounded cursor-pointer border-2 border-transparent hover:border-blue-500 shadow-sm shrink-0" onClick={() => { setViewingCard({...viewingCard, id: p.id, image: p.image, imageBack: p.imageBack, rarity: p.rarity, setCode: p.setCode, setName: p.setName, collector_number: p.collector_number, prices: p.prices}); setPrintsList([]); setShowIta(false); }} />))}
                       </div>
                    </div>
                 )}
                 <CardDetailsTabs card={viewingCard} />
               </div>
             </div>
          )}

          <div className={viewingCard ? "hidden" : "space-y-4"}>
              <div className="bg-gray-800/90 p-4 rounded-xl border border-gray-600 shadow-md backdrop-blur-sm mt-4">
                 <h2 className="text-3xl font-black text-center text-indigo-400 drop-shadow-md mb-2">Ricerca Carte</h2>
                 <p className="text-xs text-center text-gray-300 font-bold mb-4 bg-gray-900 p-2 rounded border border-gray-700">Scannerizza una carta reale con l'IA o cerca nel database globale di MTG.</p>
                 <div className="mb-6 relative">
                     {isScanning && (<div className="absolute inset-0 bg-black/80 z-10 flex items-center justify-center rounded-xl backdrop-blur-sm border border-emerald-500"><p className="text-emerald-400 font-black animate-pulse">{scanProgress}</p></div>)}
                     <label className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-4 rounded-xl shadow-[0_0_15px_rgba(16,185,129,0.5)] transition-all cursor-pointer flex justify-center items-center gap-2 text-lg active:scale-95">📸 SCANNERIZZA CARTA (IA)<input type="file" accept="image/*" capture="environment" onChange={handleGeminiScan} className="hidden" /></label>
                 </div>
                 <p className="text-[10px] text-gray-400 mb-2 text-center uppercase tracking-wider font-bold">🇺🇸 Oppure cerca manualmente in Inglese</p>
                 <div className="flex gap-2 mb-2"><input type="text" placeholder="Nome della carta..." value={query} onChange={e => setQuery(e.target.value)} onKeyPress={e => e.key === 'Enter' && searchCard(null)} className="flex-1 bg-gray-900 border border-gray-600 rounded p-3 text-white outline-none focus:border-indigo-500" /></div>
                 <div className="flex gap-2 mb-3">
                     <input type="text" placeholder="Testo Abilità" value={oracleText} onChange={e => setOracleText(e.target.value)} onKeyPress={e => e.key === 'Enter' && searchCard(null)} className="flex-1 bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm outline-none focus:border-indigo-500" />
                     <select value={expFilter} onChange={e => setExpFilter(e.target.value)} className="w-1/3 bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm outline-none focus:border-indigo-500 truncate"><option value="">Espansione...</option>{Array.isArray(mtgSets) && mtgSets.map((set, i) => (<option key={set.code || i} value={set.code || ""}>{set.name || ""}</option>))}</select>
                 </div>
                 <div className="flex flex-col gap-2 mb-3 bg-gray-900 p-2 rounded border border-gray-700">
                    <div className="flex gap-2 overflow-x-auto pb-1 justify-center">{ManaColors.map(m => (<button key={m.id} onClick={() => toggleMana(m.id)} className={`w-8 h-8 shrink-0 rounded-full flex items-center justify-center font-bold border-2 ${mana.includes(m.id) ? 'border-white scale-110' : 'border-transparent opacity-50'} ${m.color}`}>{m.label}</button>))}</div>
                    <div className="flex items-center justify-center gap-2"><select value={colorMatchType} onChange={e => setColorMatchType(e.target.value)} className="bg-gray-800 border border-gray-600 rounded p-1 text-white text-xs outline-none"><option value="include">Contiene questi colori</option><option value="exact">Esattamente questi colori</option></select><label className="flex items-center gap-1 text-xs text-purple-300 font-bold bg-purple-900/30 px-2 py-1 rounded border border-purple-700 cursor-pointer"><input type="checkbox" checked={isMulticolorOnly} onChange={e=>setIsMulticolorOnly(e.target.checked)} className="accent-purple-500" /> Solo Multi</label></div>
                 </div>
                 <div className="grid grid-cols-2 gap-2 mb-3">
                   <select value={superType} onChange={e => setSuperType(e.target.value)} className="bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm outline-none"><option value="">Supertipo...</option><option value="legendary">Legendary</option><option value="basic">Basic</option><option value="snow">Snow</option></select>
                   <select value={rarity} onChange={e => setRarity(e.target.value)} className="bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm outline-none"><option value="">Rarità...</option><option value="c">Comune</option><option value="u">Non Comune</option><option value="r">Rara</option><option value="m">Mitica</option></select>
                   <select value={cardType} onChange={e => setCardType(e.target.value)} className="bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm outline-none"><option value="">Tipo 1...</option><option value="creature">Creatura</option><option value="artifact">Artefatto</option><option value="enchantment">Incantesimo</option><option value="instant">Istantaneo</option><option value="sorcery">Stregoneria</option><option value="land">Terra</option><option value="planeswalker">Planeswalker</option></select>
                   <select value={cardType2} onChange={e => setCardType2(e.target.value)} className="bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm outline-none"><option value="">Tipo 2...</option><option value="creature">Creatura</option><option value="artifact">Artefatto</option><option value="enchantment">Incantesimo</option><option value="land">Terra</option></select>
                   <input type="text" placeholder="Sottotipo (es. Goblin)" value={subType} onChange={e => setSubType(e.target.value)} className="col-span-2 bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm outline-none" />
                 </div>
                 <div className="flex gap-2 mb-4 items-center">
                   <span className="text-gray-300 text-sm font-bold">Costo:</span><select value={cmcOp} onChange={e => setCmcOp(e.target.value)} className="bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm font-bold outline-none"><option value="=">=</option><option value=">">&gt;</option><option value="<">&lt;</option></select><input type="number" inputMode="numeric" min="0" value={cmcVal} onChange={e => setCmcVal(e.target.value)} className="w-16 bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm font-bold text-center outline-none" /><label className="ml-auto flex items-center gap-1 text-xs text-yellow-500 font-bold bg-yellow-900/30 px-2 py-2 rounded border border-yellow-700 cursor-pointer"><input type="checkbox" checked={isCommanderOnly} onChange={e=>setIsCommanderOnly(e.target.checked)} className="accent-yellow-500" /> ⭐ Solo Cmdr</label>
                 </div>
                 <button onClick={() => searchCard(null)} disabled={loading} className="w-full bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 font-black py-4 rounded-xl text-white shadow-lg transition-colors active:scale-95 text-lg">{loading ? "Cerco nel DB..." : "CERCA CARTE"}</button>
              </div>
              {allResults.length > 0 && (
                <div className="bg-gray-800/90 p-4 rounded-xl border border-gray-600 backdrop-blur-sm animate-fade pb-20">
                  <div className="flex justify-between items-center mb-3 border-b border-gray-700 pb-2">
                     <h3 className="text-gray-300 text-sm font-bold">Risultati Database:</h3>
                     <div className="flex items-center gap-2 bg-gray-900 p-1 rounded-lg border border-gray-700">
                        <button onClick={goToPrevPage} disabled={localPage === 0} className={`w-8 h-8 rounded font-bold text-lg flex items-center justify-center ${localPage === 0 ? 'bg-gray-700 text-gray-500' : 'bg-indigo-600 text-white shadow transition-colors'}`}>⬅</button>

                        <button onClick={goToNextPage} disabled={localPage + 1 >= maxLocalPages && !nextScryfallUrl} className={`w-8 h-8 rounded font-bold text-lg flex items-center justify-center ${(localPage + 1 >= maxLocalPages && !nextScryfallUrl) ? 'bg-gray-700 text-gray-500' : 'bg-indigo-600 text-white shadow transition-colors'}`}>➡</button>

                  <div className="grid grid-cols-2 md:grid-cols-3 gap-3">

                      <div key={i} className="relative cursor-pointer hover:ring-2 ring-indigo-500 rounded shadow-md group" onClick={() => openViewer(card)}>
                        <img src={card.image || "mtg-bg.jpg"} alt={card.name} className="w-full rounded" />
                        <div className="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity rounded flex items-center justify-center"><span className="text-white font-bold text-sm bg-indigo-600/90 px-3 py-1 rounded-full shadow-lg">Vedi</span></div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
          </div>
