                      <p className="text-[10px] font-bold text-blue-400 uppercase">Cornice Riquadro</p>
                      <div className="flex items-center gap-2"><span className="text-[10px] w-10 text-white font-bold">Su</span><input type="range" min="0" max="30" step="0.5" value={maskTop} onChange={e=>setMaskTop(e.target.value)} className="w-full" /></div>
                      <div className="flex items-center gap-2"><span className="text-[10px] w-10 text-white font-bold">Alt.</span><input type="range" min="20" max="100" step="0.5" value={maskHeight} onChange={e=>setMaskHeight(e.target.value)} className="w-full" /></div>
                      <div className="flex items-center gap-2"><span className="text-[10px] w-10 text-white font-bold">Sx</span><input type="range" min="0" max="20" step="0.2" value={maskLeft} onChange={e=>setMaskLeft(e.target.value)} className="w-full" /></div>
                      <div className="flex items-center gap-2"><span className="text-[10px] w-10 text-white font-bold">Largh.</span><input type="range" min="50" max="100" step="0.5" value={maskWidth} onChange={e=>setMaskWidth(e.target.value)} className="w-full" /></div>
                    </div>
                    <div className="space-y-1 pt-2 border-t border-gray-700">
                      <p className="text-[10px] font-bold text-purple-400 uppercase">Foto Interna</p>
                      <div className="flex items-center gap-2"><span className="text-[10px] w-10 text-white font-bold">Zoom</span><input type="range" min="1" max="3" step="0.1" value={zoom} onChange={e=>setZoom(e.target.value)} className="w-full" /></div>
                      <div className="flex items-center gap-2"><span className="text-[10px] w-10 text-white font-bold">Orizz</span><input type="range" min="0" max="100" value={posX} onChange={e=>setPosX(e.target.value)} className="w-full" /></div>
                      <div className="flex items-center gap-2"><span className="text-[10px] w-10 text-white font-bold">Vert</span><input type="range" min="0" max="100" value={posY} onChange={e=>setPosY(e.target.value)} className="w-full" /></div>
                    </div>
                 </div>
             )}
             <div className="relative w-full rounded-xl overflow-hidden shadow-2xl bg-black border border-gray-600 mt-4" style={{ aspectRatio: '63/88' }}>
                  <img src={baseCard.img} className="absolute inset-0 w-full h-full pointer-events-none" />
                  {customImg && ( <div className="absolute bg-black z-10 overflow-hidden shadow border border-black/50" style={{ top: `${maskTop}%`, left: `${maskLeft}%`, width: `${maskWidth}%`, height: `${maskHeight}%` }}><img src={customImg} style={{ position: 'absolute', top: 0, left: 0, width: '100%', height: '100%', objectFit: 'cover', transform: `translate(${posX - 50}%, ${posY - 50}%) scale(${zoom})` }} /></div> )}
             </div>
             <button onClick={eseguiSalvataggio} disabled={isGenerating} className="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-4 rounded-lg shadow mt-4">
                  {isGenerating ? 'Attendere...' : '💾 Salva Proxy'}
             </button>
           </div>
          )}
        </div>
      );
      if (isStandalone) return <div className="max-w-md mx-auto pt-4 pb-10 relative z-20">{editorUI}</div>;
      return <div className="fixed inset-0 bg-gray-900 z-[9999] h-[100dvh] w-full flex flex-col overflow-y-auto"><div className="p-4 bg-gray-800"><button onClick={onClose} className="text-blue-400 font-bold">Indietro</button></div><div className="flex-1 p-4 flex flex-col items-center">{editorUI}</div></div>;
    };
    // --- DECKBUILDER ---
    const DeckBuilder = ({navigate, activeDeck}) => {
      const [deckName, setDeckName] = useState(activeDeck ? activeDeck.name : "");
      const [deckFormat, setDeckFormat] = useState(activeDeck ? (activeDeck.format || 'commander') : 'commander');
      const [deck, setDeck] = useState(activeDeck ? activeDeck.cards.map(c => ({...c, oracle_text: c.oracle_text || "", mana_cost: c.mana_cost || "", isCompanion: c.isCompanion || false})) : []);
      const [rulebreaker, setRulebreaker] = useState(activeDeck ? (activeDeck.rulebreaker || false) : false);
      const [addToSideboard, setAddToSideboard] = useState(false);
      
      const [query, setQuery] = useState("");
      const [oracleText, setOracleText] = useState("");
      const [mana, setMana] = useState([]);
      const [colorMatchType, setColorMatchType] = useState('include'); 
      const [isMulticolorOnly, setIsMulticolorOnly] = useState(false);
      const [isCommanderOnly, setIsCommanderOnly] = useState(false);

      const [superType, setSuperType] = useState(""); const [cardType, setCardType] = useState("");
      const [cardType2, setCardType2] = useState(""); const [subType, setSubType] = useState("");
      const [rarity, setRarity] = useState(""); const [cmcOp, setCmcOp] = useState("="); const [cmcVal, setCmcVal] = useState("");
      
      const [allResults, setAllResults] = useState([]);
      const [localPage, setLocalPage] = useState(0);
      const [nextScryfallUrl, setNextScryfallUrl] = useState(null);
      const [loading, setLoading] = useState(false);
      
      const [isScanning, setIsScanning] = useState(false);
      const [scanProgress, setScanProgress] = useState("");

      const [selectedCard, setSelectedCard] = useState(null); const [addQty, setAddQty] = useState(1); 
      const [managingCard, setManagingCard] = useState(null); const [manageQty, setManageQty] = useState(0);
      const [editingProxyCard, setEditingProxyCard] = useState(null);
      const [importText, setImportText] = useState(""); const [showImport, setShowImport] = useState(false);
      
      const [savedScroll, setSavedScroll] = useState(0);
      const [itaImg, setItaImg] = useState(null); const [itaImgBack, setItaImgBack] = useState(null);
      const [showIta, setShowIta] = useState(false); const [showBack, setShowBack] = useState(false);
      const [translating, setTranslating] = useState(false);
      const [printsList, setPrintsList] = useState([]); const [loadingPrints, setLoadingPrints] = useState(false);

      const openSubView = (setter, data, qtySetter = null, qtyVal = 1) => {
         setSavedScroll(window.scrollY); setter(data); if(qtySetter) qtySetter(qtyVal);
         setItaImg(null); setItaImgBack(null); setShowIta(false); setShowBack(false); setPrintsList([]); window.scrollTo(0, 0);
      };
      const closeSubView = (setter) => { setter(null); setTimeout(() => window.scrollTo(0, savedScroll), 10); };

      const fetchOtherPrints = (card) => {
          if(!card.printsUrl) return alert("Questa carta non ha altre stampe disponibili sul database.");
          setLoadingPrints(true);
          fetch(card.printsUrl).then(res => res.json()).then(data => {
                if(data.data && data.data.length > 0) {
                    const mapped = data.data.filter(c => c.image_uris || (c.card_faces && c.card_faces.length > 0 && c.card_faces[0].image_uris)).map(c => {
                         let iImg = ""; let iImgBack = null;
                         if (c.image_uris && c.image_uris.normal) iImg = c.image_uris.normal;
                         else if (c.card_faces && c.card_faces.length > 0) {
                             if (c.card_faces[0].image_uris && c.card_faces[0].image_uris.normal) iImg = c.card_faces[0].image_uris.normal;
                             if (c.card_faces.length > 1 && c.card_faces[1].image_uris && c.card_faces[1].image_uris.normal) iImgBack = c.card_faces[1].image_uris.normal;
                         }
                         return { ...card, id: c.id, image: iImg, imageBack: iImgBack };
                    });
                    setPrintsList(mapped);
                } else { alert("Nessun'altra stampa trovata."); }
                setLoadingPrints(false);
            }).catch(e => { console.error(e); setLoadingPrints(false); });
      };

      const changeArtOfExistingCard = (newImg, newImgBack) => {
         if (!managingCard) return;
         const cardKey = buildCardKey(managingCard);
         setDeck(deck.map(c => {
             if (buildCardKey(c) === cardKey) return { ...c, image: newImg, imageBack: newImgBack };
             return c;
         }));
         setManagingCard({...managingCard, image: newImg, imageBack: newImgBack});
         setPrintsList([]); setShowIta(false); alert("Immagine aggiornata con successo per tutte le copie!");
      };

      const translateCard = (card) => {
        if (card.isCustom) return alert("Le carte Proxy non possono essere tradotte dal database.");
        if (itaImg) { setShowIta(!showIta); return; } 
        setTranslating(true);
        fetch(`https://api.scryfall.com/cards/search?q=!"${card.name}"+lang:it`).then(res => res.json()).then(data => {
             if (data.data && data.data.length > 0) {
                 const itCard = data.data[0]; let iImg = null; let iImgBack = null;
                 if (itCard.image_uris && itCard.image_uris.normal) { iImg = itCard.image_uris.normal; } 
                 else if (itCard.card_faces && itCard.card_faces.length > 0) {
                     if (itCard.card_faces[0].image_uris) iImg = itCard.card_faces[0].image_uris.normal;
                     if (itCard.card_faces.length > 1 && itCard.card_faces[1].image_uris) iImgBack = itCard.card_faces[1].image_uris.normal;
                 }
                 if (iImg) { setItaImg(iImg); setItaImgBack(iImgBack); setShowIta(true); } else alert("Immagine italiana non trovata.");
             } else { alert("Traduzione ufficiale italiana non stampata per questa carta."); }
             setTranslating(false);
          }).catch(e => { alert("Errore di connessione."); setTranslating(false); });
      };

      const toggleMana = (m) => setMana(mana.includes(m) ? mana.filter(x => x !== m) : [...mana, m]);

      const eseguiRicerca = (url, isNewSearch = false) => {
        setLoading(true);
        fetch(url).then(res => res.json()).then(data => {
            try {
                if (data.data && Array.isArray(data.data)) {
                   const cards = data.data.filter(c => c.image_uris || (c.card_faces && c.card_faces.length > 0 && c.card_faces[0].image_uris)).map(c => {
                     let img = ""; let imgBack = null; let oracle_text = c.oracle_text || ""; let mana_cost = c.mana_cost || "";
                     if (c.image_uris && c.image_uris.normal) { img = c.image_uris.normal; } 
                     else if (c.card_faces && c.card_faces.length > 0) {
                         if (c.card_faces[0].image_uris && c.card_faces[0].image_uris.normal) img = c.card_faces[0].image_uris.normal;
                         if (c.card_faces.length > 1 && c.card_faces[1].image_uris && c.card_faces[1].image_uris.normal) imgBack = c.card_faces[1].image_uris.normal;
                         if (!oracle_text) oracle_text = c.card_faces.map(f=>f.oracle_text).join(' ');
                         if (!mana_cost) mana_cost = c.card_faces[0].mana_cost;
                     }
                     return { id: c.id || Math.random().toString(), name: c.name || "Sconosciuta", image: img, imageBack: imgBack, type: c.type_line || "", cmc: c.cmc || 0, colors: c.color_identity || [], legalities: c.legalities || {}, printsUrl: c.prints_search_uri || null, isCommander: false, isCompanion: false, oracle_text: oracle_text, mana_cost: mana_cost, prices: c.prices || {} };
                   });
                   if(isNewSearch) { setAllResults(cards); setLocalPage(0); } else { setAllResults(prev => [...prev, ...cards]); }
                   setNextScryfallUrl(data.has_more ? data.next_page : null);
                } else { if(isNewSearch) { setAllResults([]); alert("Nessuna carta trovata."); } }
            } catch (err) { console.error("Errore lettura", err); }
            setLoading(false);
          }).catch(e => { console.error("Rete", e); setLoading(false); });
      };

      const searchCard = () => {
        let searchQuery = query ? `${query} ` : "";
        if (oracleText) searchQuery += `o:"${oracleText}" `; if (rarity) searchQuery += `r:${rarity} `;
        if (mana.length > 0) {
           let mStr = mana.join('');
           if (colorMatchType === 'exact') searchQuery += cardType === 'land' ? `id=${mStr} ` : `c=${mStr} `; else searchQuery += cardType === 'land' ? `id>=${mStr} ` : `c>=${mStr} `;
        }
        if (isMulticolorOnly) searchQuery += `c>1 `; if (isCommanderOnly) searchQuery += `is:commander `;
        if (superType) searchQuery += `t:${superType} `; if (cardType) searchQuery += `t:${cardType} `; if (cardType2) searchQuery += `t:${cardType2} `;
        if (subType) searchQuery += `t:${subType} `; if (cmcVal !== "") searchQuery += `cmc${cmcOp}${cmcVal} `;
        if(!searchQuery.trim()) return alert("Inser অন্তত un parametro di ricerca!");
        eseguiRicerca(`https://api.scryfall.com/cards/search?q=${encodeURIComponent(searchQuery.trim())}`, true);
      };

      // --- SCANNER IA (GEMINI 3.6 FLASH) ---
      const handleGeminiScan = (e) => {
          const file = e.target.files[0];
          if (!file) return;

          let apiKey = localStorage.getItem('gemini_api_key');
          if (!apiKey) {
              apiKey = window.prompt("Per usare lo Scanner IA serve una API Key gratuita.\n\nPuoi ottenerla in 1 minuto su: https://aistudio.google.com/\n\nIncolla qui la tua API Key (verrà salvata in modo sicuro solo su questo dispositivo):");
              if (!apiKey) return;
              localStorage.setItem('gemini_api_key', apiKey);
          }

          setIsScanning(true);
          setScanProgress("IA in elaborazione...");
          const reader = new FileReader();
          
          reader.onloadend = async () => {
              const base64data = reader.result.split(',')[1];
              
              try {
                  const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({
                          contents: [{
                              parts: [
                                  { text: "Sei un esperto di Magic: The Gathering. Guarda questa carta. Rispondi SOLO ed ESCLUSIVAMENTE con il nome esatto della carta in INGLESE. Non aggiungere punteggiatura, spiegazioni o altro testo." },
                                  { inline_data: { mime_type: file.type, data: base64data } }
                              ]
                          }]
                      })
                  });

                  const data = await response.json();
                  if (data.error) throw new Error(data.error.message);
                  
                  const cardName = data.candidates[0].content.parts[0].text.trim();
                  
                  // Inserisce il nome nella barra di ricerca ed esegue la ricerca automatica
                  setQuery(cardName);
                  searchCard(cardName); // La ricerca manuale viene triggerata
                  
              } catch (err) {
                  console.error("Errore Gemini:", err);
                  alert("Errore durante la scansione. Controlla la API Key o riprova.");
              } finally {
                  setIsScanning(false);
                  setScanProgress("");
                  e.target.value = ''; 
              }
          };
          reader.readAsDataURL(file);
      };

      const loadMyProxies = () => {
        const proxies = JSON.parse(localStorage.getItem('mtg_proxies') || '[]');
        if (proxies.length === 0) return alert("Non hai ancora creato nessuna Proxy! Vai in Proxy Lair.");
        setAllResults(proxies.map(p => ({...p, oracle_text: "", mana_cost: "", isCompanion: false})));
        setLocalPage(0); setNextScryfallUrl(null);
      };

      const maxLocalPages = allResults.length > 0 ? Math.ceil(allResults.length / 15) : 0;
      const currentResults = allResults.length > 0 ? allResults.slice(localPage * 15, (localPage + 1) * 15) : [];
      const goToNextPage = () => { if (localPage + 1 < maxLocalPages) { setLocalPage(localPage + 1); } else if (nextScryfallUrl) { eseguiRicerca(nextScryfallUrl, false); setLocalPage(localPage + 1); } };
      const goToPrevPage = () => { if (localPage > 0) setLocalPage(localPage - 1); };

      const addToDeckMulti = () => {
        let newCards = [];
        for(let i=0; i<addQty; i++) { newCards.push({...selectedCard, deckId: 'card-' + Date.now() + '-' + i + '-' + Math.random(), isCommander: false, isSideboard: addToSideboard, isCompanion: false}); }
        setDeck([...deck, ...newCards]); closeSubView(setSelectedCard);
      };

      const saveDeck = () => {
        if(!deckName) return alert("Dai un nome al mazzo!");
        let savedDecks = JSON.parse(localStorage.getItem('mtg_decks') || '[]');
        const newDeckObj = { id: activeDeck ? activeDeck.id : Date.now(), name: deckName, format: deckFormat, cards: deck, rulebreaker: rulebreaker, date: new Date().toLocaleDateString() };
        if(activeDeck) savedDecks = savedDecks.map(d => d.id === activeDeck.id ? newDeckObj : d); else savedDecks.push(newDeckObj);
        localStorage.setItem('mtg_decks', JSON.stringify(savedDecks));
        
        if (auth.currentUser) {
            syncToCloud(auth.currentUser.uid).catch(e => console.error("Errore Cloud:", e));
        }
        
        alert("Mazzo Salvato con successo!"); navigate('mydecks');
      };

      const handleImport = () => {
        if(!importText.trim()) return; setLoading(true); const lines = importText.split('\n'); let promises = [];
        for (let i = 0; i < lines.length; i++) {
          let line = lines[i].trim(); if(!line) continue;
          const match = line.match(/^(\d+)?\s*(.*)$/); let qty = match[1] ? parseInt(match[1]) : 1; let name = match[2];
          let p = fetch(`https://api.scryfall.com/cards/named?exact=${encodeURIComponent(name)}`).then(res => { if(res.ok) return res.json(); throw new Error('Not found'); }).then(c => {
               let arr = [];
               for(let j=0; j<qty; j++) {
                 let img = ""; let imgBack = null; let oracle_text = c.oracle_text || ""; let mana_cost = c.mana_cost || "";
                 if (c.image_uris && c.image_uris.normal) { img = c.image_uris.normal; } 
                 else if (c.card_faces && c.card_faces.length > 0) {
                     if (c.card_faces[0].image_uris && c.card_faces[0].image_uris.normal) img = c.card_faces[0].image_uris.normal;
                     if (c.card_faces.length > 1 && c.card_faces[1].image_uris && c.card_faces[1].image_uris.normal) imgBack = c.card_faces[1].image_uris.normal;
                     if (!oracle_text) oracle_text = c.card_faces.map(f=>f.oracle_text).join(' ');
                     if (!mana_cost) mana_cost = c.card_faces[0].mana_cost;
                 }
                 arr.push({ id: c.id || Math.random().toString(), deckId: 'import-' + Date.now() + '-' + Math.random() + '-' + j, name: c.name || "Sconosciuta", image: img, imageBack: imgBack, type: c.type_line || "", cmc: c.cmc || 0, colors: c.color_identity || [], legalities: c.legalities || {}, printsUrl: c.prints_search_uri || null, isCommander: false, isSideboard: addToSideboard, isCompanion: false, oracle_text: oracle_text, mana_cost: mana_cost, prices: c.prices || {} });
               } return arr;
            }).catch(e => { return []; });
          promises.push(p);
        }
        Promise.all(promises).then(resultsArray => {
           let newCards = []; resultsArray.forEach(arr => { newCards = newCards.concat(arr); });
           setDeck(prev => prev.concat(newCards)); setShowImport(false); setImportText(""); setLoading(false);
        });
      };

      const saveInlineProxy = (updatedCard) => { setDeck(deck.map(c => c.deckId === updatedCard.deckId ? updatedCard : c)); closeSubView(setEditingProxyCard); };

      const deckMap = {};
      deck.forEach(c => {
         const key = buildCardKey(c); 
         if(!deckMap[key]) { deckMap[key] = { ...c, count: 1, isCmdrFlag: c.isCommander, isCompFlag: c.isCompanion }; } 
         else { deckMap[key].count++; if(c.isCommander) deckMap[key].isCmdrFlag = true; if(c.isCompanion) deckMap[key].isCompFlag = true; }
      });
      const groupedByCategory = { "Comandante": [], "Companion": [], "Creature": [], "Planeswalker": [], "Istantanei": [], "Stregonerie": [], "Artefatti": [], "Incantesimi": [], "Terre": [], "Altro": [], "Sideboard": [] };
      Object.values(deckMap).forEach(c => { groupedByCategory[getCardCategory(c)].push(c); });
      Object.keys(groupedByCategory).forEach(k => { groupedByCategory[k].sort((a,b) => a.name.localeCompare(b.name)); });

      const applyManageQty = () => {
         const cardKey = buildCardKey(managingCard); let newDeck = deck.filter(c => buildCardKey(c) !== cardKey);
         for(let i=0; i<manageQty; i++) { newDeck.push({...managingCard, deckId: 'card-' + Date.now() + '-' + i + '-' + Math.random(), isCommander: managingCard.isCommander || managingCard.isCmdrFlag || false, isCompanion: managingCard.isCompanion || managingCard.isCompFlag || false}); }
         setDeck(newDeck); closeSubView(setManagingCard);
      };

      const toggleGroupCommander = (cardKey) => { setDeck(deck.map(c => { if (buildCardKey(c) === cardKey) return {...c, isCommander: !c.isCommander}; return c; })); };
      const toggleGroupCompanion = (cardKey) => { setDeck(deck.map(c => { if (buildCardKey(c) === cardKey) return {...c, isCompanion: !c.isCompanion}; return c; })); };

      let warnings = [];
      const commanders = deck.filter(c => c.isCommander && !c.isSideboard && !c.isCompanion);
      const companions = deck.filter(c => c.isCompanion);
      const mainDeckCards = deck.filter(c => !c.isSideboard && !c.isCompanion);
      const sideCards = deck.filter(c => c.isSideboard || c.isCompanion);
      const cmdColors = new Set();
      commanders.forEach(c => { if (c.colors) c.colors.forEach(col => cmdColors.add(col)); });

      if (!rulebreaker) {
         if (deckFormat === 'premodern' && companions.length > 0) warnings.push("I Companion non sono ammessi nel formato PREMODERN (1995-2003).");
         if (deckFormat === 'commander') {
             if (mainDeckCards.length !== 100) warnings.push(`Commander: il mazzo deve avere 100 carte esatte (ora ${mainDeckCards.length}).`);
             if (sideCards.filter(c=>!c.isCompanion).length > 0) warnings.push(`Commander non prevede una Sideboard (eccetto il Companion).`);
             if (commanders.length === 0) warnings.push("Commander: Manca il Comandante.");
             else if (commanders.length > 2) warnings.push("Commander: Non puoi avere più di 2 Comandanti.");
             else if (commanders.length === 2) {
                 const partnerRegex = /partner|friends forever|choose a background|doctor's companion/i;
                 const bothHavePartner = commanders.every(c => c.oracle_text && partnerRegex.test(c.oracle_text));
                 if (!bothHavePartner) warnings.push("Commander: Hai 2 Comandanti, ma non hanno abilità legali per esserlo assieme (Partner, Background, ecc.).");
             }
             if (commanders.length > 0 && commanders.some(c => c.type && !c.type.toLowerCase().includes("legendary") && !c.type.toLowerCase().includes("planeswalker"))) warnings.push("Il Comandante dev'essere una Creatura Leggendaria o Planeswalker valido.");
         } else {
             if (mainDeckCards.length < 60) warnings.push(`${deckFormat.toUpperCase()}: minimo 60 carte (ora ${mainDeckCards.length}).`);
             if (sideCards.length > 15) warnings.push(`La Sideboard può avere massimo 15 carte (incluso Companion). (Ora ${sideCards.length}).`);
         }

         const validCompanions = ["gyruda", "jegantha", "kaheera", "keruga", "lurrus", "lutri", "obosh", "umori", "yorion", "zirda"];
         companions.forEach(comp => { if (!validCompanions.some(vc => comp.name.toLowerCase().includes(vc))) warnings.push(`La carta "${comp.name}" non è un Companion valido (solo i 10 di Ikoria possono esserlo).`); });

         if (companions.length > 1) warnings.push("Puoi avere al massimo 1 Companion in totale.");
         if (companions.length === 1) {
             const comp = companions[0]; const compName = comp.name.toLowerCase(); const deckToCheck = deck.filter(c => !c.isSideboard && !c.isCompanion); 
             if (deckFormat === 'commander' && commanders.length > 0) {
                 let compInvalidColor = false;
                 if (comp.colors) { comp.colors.forEach(col => { if (!cmdColors.has(col)) compInvalidColor = true; }); }
                 if (compInvalidColor) warnings.push(`Il Companion "${comp.name}" non rispetta l'identità di colore del Comandante.`);
             }
             if (compName.includes("kaheera")) { if (deckToCheck.some(c => c.type && c.type.toLowerCase().includes("creature") && !/cat|elemental|nightmare|dinosaur|beast/i.test(c.type.toLowerCase()))) warnings.push("Kaheera: Tutte le creature del mazzo devono essere Gatti, Elementali, Incubi, Dinosauri o Bestie."); }
             if (compName.includes("gyruda")) { if (deckToCheck.some(c => (c.cmc || 0) % 2 !== 0)) warnings.push("Gyruda: Tutte le carte del mazzo devono avere Costo Pari."); }
             if (compName.includes("obosh")) { if (deckToCheck.some(c => (c.cmc || 0) > 0 && (c.cmc || 0) % 2 === 0 && !c.type.toLowerCase().includes("land"))) warnings.push("Obosh: Tutte le carte non-terra del mazzo devono avere Costo Dispari."); }
             if (compName.includes("lurrus")) { if (deckToCheck.some(c => (c.cmc || 0) > 2 && !c.type.toLowerCase().includes("instant") && !c.type.toLowerCase().includes("sorcery") && !c.type.toLowerCase().includes("land"))) warnings.push("Lurrus: Tutti i permanenti devono avere Costo 2 o inferiore."); }
             if (compName.includes("keruga")) { if (deckToCheck.some(c => (c.cmc || 0) < 3 && !c.type.toLowerCase().includes("land"))) warnings.push("Keruga: Tutte le carte non-terra devono avere Costo 3 o superiore."); }
             if (compName.includes("jegantha")) {
                 if (deckToCheck.some(c => {
                    if (!c.mana_cost) return false; const matches = c.mana_cost.match(/\{[WUBRG]\}/g) || []; const counts = {}; matches.forEach(m => counts[m] = (counts[m] || 0) + 1); return Object.values(counts).some(v => v > 1);
                 })) warnings.push("Jegantha: Nessuna carta può avere simboli di mana doppi nel costo.");
             }
             if (compName.includes("yorion")) {
                 if (deckFormat === 'commander') warnings.push("Yorion non è un Companion legale in Commander.");
                 else if (mainDeckCards.length < 80) warnings.push("Yorion: Il mazzo principale deve avere almeno 80 carte.");
             }
             if (compName.includes("umori")) {
                 const nonLands = deckToCheck.filter(c => !c.type.toLowerCase().includes("land")); const types = new Set();
                 nonLands.forEach(c => { const tl = c.type.toLowerCase(); if(tl.includes("creature")) types.add("creature"); else if(tl.includes("artifact")) types.add("artifact"); else if(tl.includes("enchantment")) types.add("enchantment"); else if(tl.includes("planeswalker")) types.add("planeswalker"); else if(tl.includes("instant")) types.add("instant"); else if(tl.includes("sorcery")) types.add("sorcery"); else if(tl.includes("battle")) types.add("battle"); });
                 if (types.size > 1) warnings.push("Umori: Tutte le carte non-terra devono condividere lo stesso tipo di carta.");
             }
             if (compName.includes("zirda")) {
                 if (deckToCheck.some(c => {
                    const tl = c.type.toLowerCase(); if(tl.includes("instant") || tl.includes("sorcery") || tl.includes("basic land") || tl.includes("planeswalker")) return false; 
                    if(tl.includes("land") && !c.oracle_text) return false; 
                    return !/:|Equip|Cycling|Scavenge|Unearth|Outlast|Ninjutsu|Transfigure|Fortify|Bloodrush|Megamorph|Monstrosity|Adapt|Awaken|Exert|Embalm|Eternalize|Crew|Level Up/i.test(c.oracle_text || "");
                 })) warnings.push("Zirda: Ogni permanente nel mazzo deve avere un'abilità attivata.");
             }
             if (compName.includes("lutri") && deckFormat === 'commander') warnings.push("Lutri è BANNATO in Commander.");
         }

         let hasIllegalColor = false; let nameCounts = {};
         const multiCopyAllowed = ["relentless rats", "rat colony", "shadowborn apostle", "persistent petitioners", "dragon's approach", "slime against humanity", "nazgûl"];

         deck.forEach(c => {
            if (c.legalities && c.legalities[deckFormat] !== 'legal' && c.legalities[deckFormat] !== 'restricted') {
                if(!warnings.includes(`La carta "${c.name}" è BANNATA/ILLEGALE in ${deckFormat.toUpperCase()}.`)) warnings.push(`La carta "${c.name}" è BANNATA/ILLEGALE in ${deckFormat.toUpperCase()}.`);
            }
            if (deckFormat === 'commander' && !c.isCommander && !c.isCompanion && c.colors && c.colors.length > 0) {
               if (cmdColors.size === 0) hasIllegalColor = true; else c.colors.forEach(col => { if (!cmdColors.has(col)) hasIllegalColor = true; });
            }
            let nLower = c.name ? c.name.toLowerCase() : ""; let isBasic = c.type && c.type.toLowerCase().includes("basic"); let canBypassCount = isBasic || multiCopyAllowed.includes(nLower); nameCounts[c.name] = (nameCounts[c.name] || 0) + 1;
            
            if (!canBypassCount) {
               if (deckFormat === 'commander' && nameCounts[c.name] > 1 && !c.isCompanion) {
                  if(!warnings.includes(`Singleton violata: troppe copie di "${c.name}".`)) warnings.push(`Singleton violata: troppe copie di "${c.name}".`);
               } else if (deckFormat === 'vintage' && c.legalities && c.legalities.vintage === 'restricted' && nameCounts[c.name] > 1) {
                  if(!warnings.includes(`VINTAGE RESTRICTED: massimo 1 copia di "${c.name}".`)) warnings.push(`VINTAGE RESTRICTED: massimo 1 copia di "${c.name}".`);
               } else if (deckFormat !== 'commander' && nameCounts[c.name] > 4) {
                  if(!warnings.includes(`Massimo 4 copie superato per "${c.name}".`)) warnings.push(`Massimo 4 copie superato per "${c.name}".`);
               }
            }
         });
         if (hasIllegalColor) warnings.push("Hai inserito carte fuori dall'Identità di Colore del Comandante.");
      }

      const totalCMC = deck.filter(c => !c.isSideboard && !c.isCompanion).reduce((acc, c) => acc + (c.cmc || 0), 0);
      const avgCMC = mainDeckCards.length > 0 ? (totalCMC / mainDeckCards.length).toFixed(2) : 0;
      const isSubViewActive = selectedCard || managingCard || editingProxyCard;

      const RenderModaleCarta = ({ targetCard, setterState, qtyVal, setQtyVal, actionLabel, actionFunc, closeFunc }) => {
         const defFront = targetCard.proxyImage || targetCard.image || "mtg-bg.jpg"; const defBack = targetCard.imageBack;
         const currentFront = showIta && itaImg ? itaImg : defFront; const currentBack = showIta && itaImgBack ? itaImgBack : defBack;
         const displayImg = showBack && currentBack ? currentBack : currentFront;

         return (
            <div className="w-full flex flex-col animate-fade pb-10 text-white">
               <div className="flex items-center justify-between p-4 bg-gray-800 border-b border-gray-700 sticky top-0 z-50 shadow-md mb-6">
                 <button onClick={() => closeSubView(closeFunc)} className="text-blue-400 font-bold flex items-center gap-1 text-lg"><Icons.Back /> Indietro</button>
                 <h2 className="ml-4 font-bold text-white truncate max-w-[50%]">{targetCard.name}</h2><div className="w-8"></div>
               </div>
               <div className="flex-1 flex flex-col items-center justify-start p-2">
                 <img src={displayImg} alt={targetCard.name} className="w-auto max-h-[50vh] object-contain rounded-xl mb-4 shadow-2xl" />
                 {currentBack && !targetCard.isCustom && ( <button onClick={() => setShowBack(!showBack)} className="w-full max-w-sm bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 rounded-lg shadow-md border border-gray-500 mb-4 transition-colors">🔄 {showBack ? "Vedi Fronte" : "Vedi Retro"}</button> )}
                 <div className="w-full max-w-sm mb-4 flex gap-2">
                    <button onClick={() => translateCard(targetCard)} disabled={translating} className="flex-1 bg-indigo-700 hover:bg-indigo-600 text-white font-bold py-3 rounded-xl shadow-[0_0_15px_rgba(67,56,202,0.4)] border border-indigo-500 transition-all text-xs">
                      {translating ? "Traduco..." : (showIta ? "🇬🇧 Torna in Inglese" : "🇮🇹 Tenta Traduzione")}
                    </button>
                    {!targetCard.isCustom && targetCard.printsUrl && (
                        <button onClick={() => fetchOtherPrints(targetCard)} disabled={loadingPrints} className="flex-1 bg-orange-600 hover:bg-orange-500 text-white font-bold py-3 rounded-xl shadow-lg border border-orange-500 transition-all text-xs">🖼️ Altre Stampe</button>
                    )}
                 </div>
                 {printsList.length > 0 && (
                    <div className="w-full max-w-sm mb-4 bg-gray-800 p-2 rounded-xl border border-gray-600 shadow-md animate-fade">
                       <p className="text-xs text-gray-300 font-bold mb-2">Seleziona una Stampa / Secret Lair:</p>
                       <div className="flex overflow-x-auto gap-2 pb-2">
                          {printsList.map(p => (
                             <div key={p.id} className="flex flex-col items-center shrink-0">
                               <img src={p.image} className="w-20 rounded cursor-pointer border-2 border-transparent hover:border-blue-500 shadow-sm" onClick={() => { setterState({...targetCard, image: p.image, imageBack: p.imageBack}); setShowIta(false); }} />
                               {actionLabel === "Gestisci" && ( <button onClick={() => changeArtOfExistingCard(p.image, p.imageBack)} className="mt-1 text-[8px] bg-blue-600 text-white px-1 rounded hover:bg-blue-500 font-bold">APPLICA</button> )}
                             </div>
                          ))}
                       </div>
                    </div>
                 )}
                 <div className="bg-gray-800 rounded-xl w-full max-w-sm p-4 flex flex-col gap-4 shadow-xl border border-gray-600">
                    <div className="flex justify-between items-center bg-gray-900 rounded-lg p-3 border border-gray-700">
                       <span className="text-gray-400 font-bold px-2">{actionLabel === "Aggiungi" ? "Aggiungi Copie:" : "Copie Totali:"}</span>
                       <div className="flex items-center gap-3">
                          <button onClick={()=>setQtyVal(Math.max(actionLabel==="Aggiungi"?1:0, Number(qtyVal)-1))} className="w-12 h-12 bg-red-600 hover:bg-red-500 rounded-lg font-bold text-2xl text-white shadow transition-colors">-</button>
                           <input 
                             key={`qty-input-${qtyVal}`}
                             type="number" 
                             inputMode="numeric" 
                             min={actionLabel==="Aggiungi"?"1":"0"} 
                             max="999" 
                             defaultValue={qtyVal} 
                             onBlur={e => {
                                 let val = parseInt(e.target.value);
                                 if (isNaN(val) || val < 0) val = actionLabel==="Aggiungi" ? 1 : 0;
                                 if (val !== qtyVal) setQtyVal(val);
                             }}
                             onKeyDown={e => e.key === 'Enter' && e.target.blur()}
                             className="w-16 h-12 bg-gray-900 border border-gray-600 rounded-lg text-white text-center text-2xl font-black outline-none focus:border-blue-500 transition-colors" 
                           />
                           <button onClick={()=>setQtyVal(Number(qtyVal)+1)} className="w-12 h-12 bg-green-600 hover:bg-green-500 rounded-lg font-bold text-2xl text-white shadow transition-colors">+</button>
                        </div>
                     </div>
                     <button 
                        onMouseEnter={() => {
                            const inp = document.querySelector('input[type="number"]');
                            if(inp && parseInt(inp.value) !== qtyVal) setQtyVal(parseInt(inp.value) || 0);
                        }}
                        onTouchStart={() => {
                            const inp = document.querySelector('input[type="number"]');
                            if(inp && parseInt(inp.value) !== qtyVal) setQtyVal(parseInt(inp.value) || 0);
                        }}
                        onClick={actionFunc} 
                        className="w-full bg-blue-600 hover:bg-blue-500 text-white font-black text-lg py-4 rounded-xl shadow-[0_0_15px_rgba(37,99,235,0.4)] transition-all">
                        {actionLabel === "Aggiungi" ? "+ AGGIUNGI AL MAZZO" : "CONFERMA MODIFICHE"}
                     </button>
                 </div>
              </div>
            </div>
         );
      };

      return (
        <div className="max-w-2xl mx-auto relative z-10 w-full text-white">
          {selectedCard && <RenderModaleCarta targetCard={selectedCard} setterState={setSelectedCard} qtyVal={addQty} setQtyVal={setAddQty} actionLabel="Aggiungi" actionFunc={addToDeckMulti} closeFunc={setSelectedCard} />}
          {managingCard && <RenderModaleCarta targetCard={managingCard} setterState={setManagingCard} qtyVal={manageQty} setQtyVal={setManageQty} actionLabel="Gestisci" actionFunc={applyManageQty} closeFunc={setManagingCard} />}
          
          {editingProxyCard && (
            <div className="w-full flex flex-col animate-fade pb-10">
               <div className="flex items-center justify-between p-4 bg-gray-800 border-b border-gray-700 sticky top-0 z-50 shadow-md mb-6">
                 <button onClick={() => closeSubView(setEditingProxyCard)} className="text-blue-400 font-bold flex items-center gap-1 text-lg"><Icons.Back /> Indietro</button>
                 <h2 className="ml-4 font-bold text-white truncate max-w-[50%]">Proxy Editor</h2><div className="w-8"></div>
               </div>
               <ProxyEditor card={editingProxyCard} onClose={() => closeSubView(setEditingProxyCard)} onSave={saveInlineProxy} isStandalone={false} />
            </div>
          )}

          <div className={isSubViewActive ? "hidden" : "space-y-4"}>
              <div className="bg-gray-800/90 p-4 rounded-xl border border-gray-600 shadow-md backdrop-blur-sm mt-4">
                <input type="text" placeholder="Nome del Mazzo" value={deckName} onChange={e => setDeckName(e.target.value)} className="w-full bg-gray-900 border border-gray-600 rounded p-3 text-white text-xl font-bold mb-4 outline-none" />
                <div className="flex justify-between items-center bg-gray-900 p-2 rounded border border-gray-700 mb-3">
                  <span className="text-gray-400 text-sm font-bold ml-2">Formato:</span>
                  <select value={deckFormat} onChange={e => setDeckFormat(e.target.value)} className="bg-gray-800 text-white p-2 rounded font-bold border border-gray-600 outline-none">
                     <option value="commander">Commander</option><option value="standard">Standard</option><option value="pioneer">Pioneer</option>
                     <option value="modern">Modern</option><option value="legacy">Legacy</option><option value="vintage">Vintage</option>
                     <option value="pauper">Pauper</option><option value="premodern">Premodern</option>
                  </select>
                </div>
                <div className="flex justify-between items-center text-sm mb-2">
                  <div className="flex gap-2">
                     <span className={`px-2 py-1 rounded font-bold ${((deckFormat === 'commander' && mainDeckCards.length === 100) || (deckFormat !== 'commander' && mainDeckCards.length >= 60)) ? 'bg-green-600' : 'bg-red-600'}`}>Main: {mainDeckCards.length}</span>
                     {deckFormat !== 'commander' && ( <span className={`px-2 py-1 rounded font-bold ${(sideCards.length <= 15) ? 'bg-indigo-600' : 'bg-red-600'}`}>Side: {sideCards.length}</span> )}
                  </div>
                  <span className="bg-blue-600 px-2 py-1 rounded font-bold">Avg CMC: {avgCMC}</span>
                </div>
                {!rulebreaker && warnings.length > 0 && (
                   <div className="bg-red-900/80 border border-red-500 rounded p-3 mt-3 shadow-inner">
                      <p className="text-red-300 font-bold text-[10px] mb-1 uppercase tracking-wide">⚠️ Controllo Legalità {deckFormat.toUpperCase()}:</p>
                      <ul className="text-[11px] text-white list-disc list-inside space-y-1 font-semibold pl-1">
                         {warnings.map((w,i) => <li key={i}>{w}</li>)}
                      </ul>
                   </div>
                )}
                <label className="flex items-center gap-2 text-sm text-yellow-500 font-bold bg-yellow-900/30 p-2 rounded border border-yellow-700 cursor-pointer justify-center mt-3">
                  <input type="checkbox" checked={rulebreaker} onChange={e => setRulebreaker(e.target.checked)} className="accent-yellow-500 w-4 h-4" /> Attiva "Rulebreaker"
                </label>
              </div>

              <div className="bg-gray-800/90 p-4 rounded-xl border border-gray-600 shadow-md backdrop-blur-sm">
                 <h3 className="font-bold text-blue-400 mb-2 border-b border-gray-700 pb-1 flex justify-between">
                    Ricerca Carte
                    {deckFormat !== 'commander' && (
                       <label className="flex items-center gap-1 text-xs text-indigo-300 bg-indigo-900/50 px-2 py-1 rounded border border-indigo-500 cursor-pointer">
                          <input type="checkbox" checked={addToSideboard} onChange={e=>setAddToSideboard(e.target.checked)} className="accent-indigo-500" /> + In Sideboard
                       </label>
                    )}
                 </h3>
                 <p className="text-[10px] text-gray-400 mb-3 text-center uppercase tracking-wider font-bold">🇺🇸 Cerca in Inglese (es. "Plains", "Angel")</p>
                 <div className="flex gap-2 mb-2"><input type="text" placeholder="Nome della carta..." value={query} onChange={e => setQuery(e.target.value)} onKeyPress={e => e.key === 'Enter' && searchCard()} className="flex-1 bg-gray-900 border border-gray-600 rounded p-3 text-white outline-none" /></div>
                 <div className="flex gap-2 mb-3"><input type="text" placeholder="Testo Abilità (es. Landfall, Deathtouch)" value={oracleText} onChange={e => setOracleText(e.target.value)} onKeyPress={e => e.key === 'Enter' && searchCard()} className="flex-1 bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm outline-none" /></div>
                 
                 <div className="flex flex-col gap-2 mb-3 bg-gray-900 p-2 rounded border border-gray-700">
                    <div className="flex gap-2 overflow-x-auto pb-1 justify-center">
                      {ManaColors.map(m => (<button key={m.id} onClick={() => toggleMana(m.id)} className={`w-8 h-8 shrink-0 rounded-full flex items-center justify-center font-bold border-2 ${mana.includes(m.id) ? 'border-white scale-110' : 'border-transparent opacity-50'} ${m.color}`}>{m.label}</button>))}
                    </div>
                    <div className="flex items-center justify-center gap-2">
                       <select value={colorMatchType} onChange={e => setColorMatchType(e.target.value)} className="bg-gray-800 border border-gray-600 rounded p-1 text-white text-xs outline-none">
                          <option value="include">Contiene questi colori</option><option value="exact">Esattamente questi colori</option>
                       </select>
                       <label className="flex items-center gap-1 text-xs text-purple-300 font-bold bg-purple-900/30 px-2 py-1 rounded border border-purple-700 cursor-pointer">
                          <input type="checkbox" checked={isMulticolorOnly} onChange={e=>setIsMulticolorOnly(e.target.checked)} className="accent-purple-500" /> Solo Multi
                       </label>
                    </div>
                 </div>

                 <div className="grid grid-cols-2 gap-2 mb-3">
                   <select value={superType} onChange={e => setSuperType(e.target.value)} className="bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm outline-none"><option value="">Supertipo...</option><option value="legendary">Legendary</option><option value="basic">Basic</option><option value="snow">Snow</option></select>
                   <select value={rarity} onChange={e => setRarity(e.target.value)} className="bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm outline-none"><option value="">Rarità...</option><option value="c">Comune</option><option value="u">Non Comune</option><option value="r">Rara</option><option value="m">Mitica</option></select>
                   <select value={cardType} onChange={e => setCardType(e.target.value)} className="bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm outline-none"><option value="">Tipo 1...</option><option value="creature">Creatura</option><option value="artifact">Artefatto</option><option value="enchantment">Incantesimo</option><option value="instant">Istantaneo</option><option value="sorcery">Stregoneria</option><option value="land">Terra</option><option value="planeswalker">Planeswalker</option></select>
                   <select value={cardType2} onChange={e => setCardType2(e.target.value)} className="bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm outline-none"><option value="">Tipo 2...</option><option value="creature">Creatura</option><option value="artifact">Artefatto</option><option value="enchantment">Incantesimo</option><option value="land">Terra</option></select>
                   <input type="text" placeholder="Sottotipo (Goblin)" value={subType} onChange={e => setSubType(e.target.value)} className="col-span-2 bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm outline-none" />
                 </div>

                 <div className="flex gap-2 mb-4 items-center">
                   <span className="text-gray-300 text-sm font-bold">Costo:</span>
                   <select value={cmcOp} onChange={e => setCmcOp(e.target.value)} className="bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm font-bold outline-none"><option value="=">=</option><option value=">">&gt;</option><option value="<">&lt;</option></select>
                   <input type="number" inputMode="numeric" min="0" value={cmcVal} onChange={e => setCmcVal(e.target.value)} className="w-16 bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm font-bold text-center outline-none" />
                   <label className="ml-auto flex items-center gap-1 text-xs text-yellow-500 font-bold bg-yellow-900/30 px-2 py-2 rounded border border-yellow-700 cursor-pointer"><input type="checkbox" checked={isCommanderOnly} onChange={e=>setIsCommanderOnly(e.target.checked)} className="accent-yellow-500" /> ⭐ Solo Cmdr</label>
                 </div>

                 <div className="flex gap-2">
                   <button onClick={searchCard} className="flex-1 bg-blue-600 hover:bg-blue-700 font-bold py-3 rounded text-white shadow-lg transition-colors">
                     {loading ? "Cerco..." : "Cerca Carte"}
                   </button>
                   <button onClick={loadMyProxies} className="flex-1 bg-purple-600 hover:bg-purple-700 font-bold py-3 rounded text-white shadow-lg transition-colors">✨ Mie Proxy</button>
                 </div>
                 
                 <button onClick={() => setShowImport(!showImport)} className="text-sm text-blue-400 hover:text-blue-300 underline mt-4 block text-center w-full transition-colors">📥 Importa da Testo (Es. Moxfield)</button>
                 {showImport && (
                   <div className="mt-2 animate-fade">
                     <textarea value={importText} onChange={e => setImportText(e.target.value)} placeholder="1 Sol Ring&#10;1 Command Tower" className="w-full h-24 bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm mb-2 outline-none"></textarea>
                     <button onClick={handleImport} className="w-full bg-green-600 hover:bg-green-700 p-2 rounded text-white font-bold transition-colors">{loading ? 'Importo...' : 'Aggiungi Carte'}</button>
                   </div>
                 )}
              </div>

              {allResults.length > 0 && (
                <div className="bg-gray-800/90 p-4 rounded-xl border border-gray-600 backdrop-blur-sm animate-fade">
                  <div className="flex justify-between items-center mb-3 border-b border-gray-700 pb-2">
                     <h3 className="text-gray-300 text-sm font-bold">Risultati:</h3>
                     <div className="flex items-center gap-2 bg-gray-900 p-1 rounded-lg border border-gray-700">
                        <button onClick={goToPrevPage} disabled={localPage === 0} className={`w-8 h-8 rounded font-bold text-lg flex items-center justify-center ${localPage === 0 ? 'bg-gray-700 text-gray-500' : 'bg-blue-600 text-white shadow transition-colors'}`}>⬅</button>
                        <span className="text-xs font-bold text-white px-2">Pag {localPage + 1} di {maxLocalPages||1}</span>
                        <button onClick={goToNextPage} disabled={localPage + 1 >= maxLocalPages && !nextScryfallUrl} className={`w-8 h-8 rounded font-bold text-lg flex items-center justify-center ${(localPage + 1 >= maxLocalPages && !nextScryfallUrl) ? 'bg-gray-700 text-gray-500' : 'bg-blue-600 text-white shadow transition-colors'}`}>➡</button>
                     </div>
                  </div>
                  <div className="grid grid-cols-3 gap-2">
                    {currentResults.map((card, i) => (
                      <div key={i} className="relative cursor-pointer hover:ring-2 ring-blue-500 rounded shadow-md" onClick={() => openSubView(setSelectedCard, card, setAddQty, 1)}>
                        <img src={card.proxyImage || card.image || "mtg-bg.jpg"} alt={card.name} className="w-full rounded" />
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {Object.keys(groupedByCategory).some(cat => groupedByCategory[cat].length > 0) && (
                <div className="bg-gray-800/90 p-3 rounded-xl border border-gray-600 shadow-md backdrop-blur-sm animate-fade">
                  <h3 className="font-bold text-white mb-3 pl-2">La tua Lista:</h3>
                  <div className="space-y-4">
                    {categoriesOrder.map(cat => {
                       const cardsInCat = groupedByCategory[cat];
                       if(cardsInCat.length === 0) return null;
                       return (
                          <div key={cat} className="space-y-2">
                             <h4 className={`text-xs font-black border-b pb-1 uppercase ${cat === 'Sideboard' ? 'text-indigo-400 border-indigo-700' : (cat === 'Companion' ? 'text-pink-400 border-pink-700' : 'text-gray-400 border-gray-700')}`}>
                                {cat} ({cardsInCat.reduce((acc,c)=>acc+c.count,0)})
                             </h4>
                             {cardsInCat.map((card, index) => (
                               <div key={index} className={`flex gap-2 bg-gray-900 p-2 rounded-lg border ${card.isCmdrFlag ? 'border-yellow-500 shadow-[0_0_10px_rgba(234,179,8,0.3)]' : (card.isCompFlag ? 'border-pink-500 shadow-[0_0_10px_rgba(236,72,153,0.3)]' : (card.isSideboard ? 'border-indigo-500' : 'border-gray-700'))}`}>
                                 <div className="relative cursor-pointer shrink-0" onClick={() => openSubView(setManagingCard, card, setManageQty, card.count)}>
                                     <img src={card.proxyImage || card.image || "mtg-bg.jpg"} alt={card.name} className="w-14 rounded object-cover shadow border border-gray-600" />
                                     <div className="absolute -top-2 -right-2 bg-blue-600 text-white font-black text-xs w-6 h-6 flex items-center justify-center rounded-full shadow border border-blue-400">{card.count}</div>
                                 </div>
                                 <div className="flex-1 text-sm flex flex-col justify-between pt-1 overflow-hidden">
                                   <h4 className="font-bold text-gray-200 text-xs leading-tight truncate pr-1 cursor-pointer" onClick={() => openSubView(setManagingCard, card, setManageQty, card.count)}>{card.name}</h4>
                                   <div className="flex items-center justify-between mt-1">
                                     <div className="flex items-center gap-2">
                                       {deckFormat === 'commander' && !card.isSideboard && !card.isCompFlag && (
                                         <label className="flex items-center gap-1 text-yellow-500 text-[10px] font-bold cursor-pointer">
                                           <input type="checkbox" checked={card.isCmdrFlag} onChange={() => toggleGroupCommander(buildCardKey(card))} className="accent-yellow-500" /> Cmdr
                                         </label>
                                       )}
                                       {!card.isCmdrFlag && !card.isSideboard && (
                                         <label className="flex items-center gap-1 text-pink-500 text-[10px] font-bold cursor-pointer">
                                           <input type="checkbox" checked={card.isCompFlag} onChange={() => toggleGroupCompanion(buildCardKey(card))} className="accent-pink-500" /> Comp
                                         </label>
                                       )}
                                     </div>
                                     <div className="flex gap-1 ml-auto">
                                       <button onClick={() => openSubView(setEditingProxyCard, deck.find(c => buildCardKey(c) === buildCardKey(card)))} className="text-[10px] bg-purple-700 hover:bg-purple-600 text-white font-bold px-2 py-1 rounded shadow transition-colors">🎨 Proxy</button>
                                     </div>
                                   </div>
                                 </div>
                               </div>
                             ))}
                          </div>
                       )
                    })}
                  </div>
                </div>
              )}
              <button onClick={saveDeck} className="w-full bg-green-600 hover:bg-green-500 text-white font-black py-4 rounded-xl shadow-[0_0_15px_rgba(22,163,74,0.5)] sticky bottom-4 z-40 transition-colors mt-4">SALVA MAZZO</button>
          </div>
        </div>
      );
    };
    // --- VISUALIZZATORE MAZZI (SOLO LETTURA E TRADUZIONE) ---
    const DeckViewer = ({deck, navigate}) => {
      const [viewingCard, setViewingCard] = useState(null);
      const [itaImg, setItaImg] = useState(null);
      const [itaImgBack, setItaImgBack] = useState(null);
      const [showIta, setShowIta] = useState(false);
      const [showBack, setShowBack] = useState(false);
      const [translating, setTranslating] = useState(false);
      const [savedScroll, setSavedScroll] = useState(0);
      const [printsList, setPrintsList] = useState([]);
      const [loadingPrints, setLoadingPrints] = useState(false);

      if(!deck) return null;

      const deckMap = {};
      deck.cards.forEach(c => {
         const key = buildCardKey(c); 
         if(!deckMap[key]) { deckMap[key] = { ...c, count: 1 }; } 
         else { deckMap[key].count++; }
      });
      const groupedByCategory = { "Comandante": [], "Companion": [], "Creature": [], "Planeswalker": [], "Istantanei": [], "Stregonerie": [], "Artefatti": [], "Incantesimi": [], "Terre": [], "Altro": [], "Sideboard": [] };
      Object.values(deckMap).forEach(c => { groupedByCategory[getCardCategory(c)].push(c); });
      Object.keys(groupedByCategory).forEach(k => { groupedByCategory[k].sort((a,b) => a.name.localeCompare(b.name)); });

      const openViewer = (c) => { 
          setSavedScroll(window.scrollY);
          setItaImg(null); setItaImgBack(null); setShowIta(false); setShowBack(false); setPrintsList([]);
          setViewingCard(c); window.scrollTo(0,0); 
      };
      
      const closeViewer = () => { 
          setViewingCard(null); 
          setTimeout(() => window.scrollTo(0, savedScroll), 10);
      };

      const fetchOtherPrints = (card) => {
          if(!card.printsUrl) return alert("Questa carta non ha altre stampe disponibili sul database.");
          setLoadingPrints(true);
          fetch(card.printsUrl)
            .then(res => res.json())
            .then(data => {
                if(data.data && data.data.length > 0) {
                    const mapped = data.data.filter(c => c.image_uris || (c.card_faces && c.card_faces.length > 0 && c.card_faces[0].image_uris)).map(c => {
                         let iImg = ""; let iImgBack = null;
                         if (c.image_uris && c.image_uris.normal) iImg = c.image_uris.normal;
                         else if (c.card_faces && c.card_faces.length > 0) {
                             if (c.card_faces[0].image_uris && c.card_faces[0].image_uris.normal) iImg = c.card_faces[0].image_uris.normal;
                             if (c.card_faces.length > 1 && c.card_faces[1].image_uris && c.card_faces[1].image_uris.normal) iImgBack = c.card_faces[1].image_uris.normal;
                         }
                         return { ...card, id: c.id, image: iImg, imageBack: iImgBack };
                    });
                    setPrintsList(mapped);
                } else { alert("Nessun'altra stampa trovata."); }
                setLoadingPrints(false);
            }).catch(e => { console.error(e); setLoadingPrints(false); });
      };

      const translateCard = (card) => {
        if (card.isCustom) return alert("Le carte Proxy non possono essere tradotte dal database.");
        if (itaImg) { setShowIta(!showIta); return; } 
        setTranslating(true);
        fetch(`https://api.scryfall.com/cards/search?q=!"${card.name}"+lang:it`)
          .then(res => res.json())
          .then(data => {
             if (data.data && data.data.length > 0) {
                 const itCard = data.data[0];
                 let iImg = null; let iImgBack = null;
                 if (itCard.image_uris && itCard.image_uris.normal) { iImg = itCard.image_uris.normal; } 
                 else if (itCard.card_faces && itCard.card_faces.length > 0) {
                     if (itCard.card_faces[0].image_uris) iImg = itCard.card_faces[0].image_uris.normal;
                     if (itCard.card_faces.length > 1 && itCard.card_faces[1].image_uris) iImgBack = itCard.card_faces[1].image_uris.normal;
                 }
                 if (iImg) { setItaImg(iImg); setItaImgBack(iImgBack); setShowIta(true); }
                 else alert("Immagine italiana non trovata.");
             } else { alert("Traduzione ufficiale italiana non stampata per questa carta."); }
             setTranslating(false);
          }).catch(e => { alert("Errore di connessione."); setTranslating(false); });
      };

      const defFront = viewingCard ? (viewingCard.proxyImage || viewingCard.image || "mtg-bg.jpg") : "";
      const defBack = viewingCard ? viewingCard.imageBack : null;
      const currentFront = showIta && itaImg ? itaImg : defFront;
      const currentBack = showIta && itaImgBack ? itaImgBack : defBack;
      const displayImg = showBack && currentBack ? currentBack : currentFront;

      return (
        <div className="max-w-2xl mx-auto relative z-10 w-full space-y-4">
          
          {viewingCard && (
             <div className="w-full flex flex-col animate-fade pb-10">
               <div className="flex items-center justify-between p-4 bg-gray-800 border-b border-gray-700 sticky top-0 z-50 shadow-md mb-6">
                 <button onClick={closeViewer} className="text-indigo-400 font-bold flex items-center gap-1 text-lg"><Icons.Back /> Indietro</button>
                 <h2 className="ml-4 font-bold text-white truncate max-w-[50%]">{viewingCard.name}</h2><div className="w-8"></div>
               </div>
               <div className="flex-1 flex flex-col items-center justify-start p-2">
                 <img src={displayImg} alt={viewingCard.name} className="w-auto max-h-[50vh] object-contain rounded-xl mb-4 shadow-2xl" />
                 
                 {(itaImgBack || viewingCard.imageBack) && !viewingCard.isCustom && (
                    <button onClick={() => setShowBack(!showBack)} className="w-full max-w-sm bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 rounded-lg shadow-md border border-gray-500 mb-4 transition-colors">
                       🔄 {showBack ? "Vedi Fronte" : "Vedi Retro"}
                    </button>
                 )}

                 <div className="w-full max-w-sm mb-4 flex gap-2">
                    <button onClick={() => translateCard(viewingCard)} disabled={translating} className="flex-1 bg-indigo-700 hover:bg-indigo-600 text-white font-bold py-3 rounded-xl shadow-[0_0_15px_rgba(67,56,202,0.4)] border border-indigo-500 transition-all text-xs">
                      {translating ? "Traduco..." : (showIta ? "🇬🇧 Torna in Inglese" : "🇮🇹 Tenta Traduzione")}
                    </button>
                    {!viewingCard.isCustom && viewingCard.printsUrl && (
                        <button onClick={() => fetchOtherPrints(viewingCard)} disabled={loadingPrints} className="flex-1 bg-orange-600 hover:bg-orange-500 text-white font-bold py-3 rounded-xl shadow-lg border border-orange-500 transition-all text-xs">
                          {loadingPrints ? "Cerco..." : "🖼️ Altre Stampe"}
                        </button>
                    )}
                 </div>

                 {printsList.length > 0 && (
                    <div className="w-full max-w-sm mb-4 bg-gray-800 p-2 rounded-xl border border-gray-600 shadow-md animate-fade">
                       <p className="text-xs text-gray-300 font-bold mb-2">Questa è la modalità lettura. La stampa non verrà salvata nel mazzo.</p>
                       <div className="flex overflow-x-auto gap-2 pb-2">
                          {printsList.map(p => (
                             <div key={p.id} className="flex flex-col items-center shrink-0">
                               <img src={p.image} className="w-20 rounded cursor-pointer border-2 border-transparent hover:border-blue-500 shadow-sm" onClick={() => { setViewingCard({...viewingCard, image: p.image, imageBack: p.imageBack}); setPrintsList([]); setShowIta(false); }} />
                             </div>
                          ))}
                       </div>
                    </div>
                 )}
               </div>
             </div>
          )}

          <div className={viewingCard ? "hidden" : "space-y-4"}>
             <button onClick={() => navigate('mydecks')} className="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded font-bold mb-2 shadow transition-colors">⬅ Indietro ai Mazzi</button>
             <div className="bg-gray-800/90 p-6 rounded-xl border border-gray-600 shadow-xl backdrop-blur-sm">
                <h2 className="text-3xl font-black text-white mb-1 drop-shadow-md">{deck.name}</h2>
                <p className="text-gray-300 font-bold mb-4">Clicca su una carta per ingrandirla e tradurla!</p>
                <div className="space-y-4">
                  {categoriesOrder.map(cat => {
                     const cardsInCat = groupedByCategory[cat];
                     if(cardsInCat.length === 0) return null;
                     return (
                        <div key={cat} className="space-y-2">
                           <h4 className={`text-xs font-black border-b pb-1 uppercase ${cat === 'Sideboard' ? 'text-indigo-400 border-indigo-700' : (cat === 'Companion' ? 'text-pink-400 border-pink-700' : 'text-gray-400 border-gray-700')}`}>
                              {cat} ({cardsInCat.reduce((acc,c)=>acc+c.count,0)})
                           </h4>
                           {cardsInCat.map((card, index) => (
                             <div key={index} className={`flex gap-2 bg-gray-900 p-2 rounded-lg border ${card.isCmdrFlag ? 'border-yellow-500 shadow-[0_0_10px_rgba(234,179,8,0.3)]' : (card.isCompFlag ? 'border-pink-500 shadow-[0_0_10px_rgba(236,72,153,0.3)]' : (card.isSideboard ? 'border-indigo-500' : 'border-gray-700'))} cursor-pointer hover:bg-gray-800 transition-colors`} onClick={() => openViewer(card)}>
                               <div className="relative shrink-0">
                                   <img src={card.proxyImage || card.image || "mtg-bg.jpg"} alt={card.name} className="w-14 rounded object-cover shadow border border-gray-600" />
                                   <div className="absolute -top-2 -right-2 bg-blue-600 text-white font-black text-xs w-6 h-6 flex items-center justify-center rounded-full shadow border border-blue-400">
                                      {card.count}
                                   </div>
                               </div>
                               <div className="flex-1 text-sm flex flex-col justify-center overflow-hidden pl-2">
                                 <h4 className="font-bold text-gray-200 text-sm leading-tight truncate">{card.name}</h4>
                                 <p className="text-[10px] text-gray-500 truncate">{card.type}</p>
                               </div>
                             </div>
                           ))}
                        </div>
                     )
                  })}
                </div>
             </div>
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
