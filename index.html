    };

    const PlayerCard = ({ player, updateStat, onOpenModal, updatePlayerConfig, isArchenemy, opponents, isCloud }) => {
      const [showOpponents, setShowOpponents] = useState(false);
      let isDead = false;
      if (!player.immune) {
         if (player.life <= 0) isDead = true; if (player.poison >= (player.maxPoison || 10)) isDead = true;
         if (player.cmdDmg) { Object.keys(player.cmdDmg).forEach(key => { if (player.cmdDmg[key] >= 21) isDead = true; }); }
      }

      return (
        <React.Fragment>
          {player.bgUrl && <img src={player.bgUrl} className="absolute inset-0 w-full h-full object-contain object-top opacity-30 pointer-events-none" />}
          {isDead && <div className="absolute inset-0 flex items-center justify-center text-8xl opacity-50 pointer-events-none z-10">💀</div>}
          {player.immune && <div className="absolute inset-0 flex items-center justify-center text-8xl opacity-30 pointer-events-none text-blue-500 drop-shadow-lg z-10">🛡️</div>}
          
          <div className="relative flex justify-between items-center bg-black/50 p-2 z-30 border-b border-gray-700 h-[25%] min-h-[50px] w-full px-2 md:px-4 shrink-0">
            <div className={`flex ${isCloud ? 'flex-row gap-3' : 'flex-col gap-1'} z-30 shrink-0 items-center justify-center`}>
                <button onClick={() => onOpenModal('search')} className="text-gray-400 hover:text-white transition-transform active:scale-90" title="Imposta Sfondo"><span className="text-xl">🖼️</span></button>
                <button onClick={() => onOpenModal('cmdrSelect')} className="text-yellow-500 hover:text-yellow-400 transition-transform active:scale-90 drop-shadow-[0_0_5px_rgba(234,179,8,0.5)]" title="Centro di Comando"><span className="text-xl">👑</span></button>
            </div>
            
            <div className="flex flex-col items-center justify-center overflow-hidden z-20 flex-1 px-1">
               <span onClick={() => onOpenModal('editName')} className="font-bold text-white text-sm md:text-lg drop-shadow-md truncate cursor-pointer text-center w-full">
                   {isArchenemy && <span className="mr-1 drop-shadow-[0_0_8px_rgba(220,38,38,0.8)]" title="Archenemy">👿</span>}
                   {player.name} ✎
               </span>
               <button onClick={() => setShowOpponents(!showOpponents)} className={"mt-1 font-bold rounded shadow flex items-center justify-center gap-1 active:scale-95 transition-transform shrink-0 " + (isCloud ? "bg-indigo-700 hover:bg-indigo-600 text-white px-6 py-3 text-lg border-2 border-indigo-400" : "bg-indigo-700/80 hover:bg-indigo-600 text-white px-2 py-0.5 text-[10px] border border-indigo-400")}>
                   {isCloud ? "👁️ Avversari" : "👁️ Avv"}
               </button>
               <div className="flex gap-1 mt-1 justify-center flex-wrap">
                  {player.poison > 0 && <span className="text-green-400 text-[10px] md:text-xs font-black drop-shadow-md">💧{player.poison}</span>}
                  {player.cmdCasts > 0 && <span className="text-gray-300 text-[10px] md:text-xs font-black drop-shadow-md">⚔️{player.cmdCasts}</span>}
                  {player.emblems > 0 && <span className="text-purple-400 text-[10px] md:text-xs font-black drop-shadow-md">🛡️{player.emblems}</span>}
                  {player.rad > 0 && <span className="text-lime-400 text-[10px] md:text-xs font-black drop-shadow-md">☢️{player.rad}</span>}
                  {player.energy > 0 && <span className="text-blue-400 text-[10px] md:text-xs font-black drop-shadow-md">⚡{player.energy}</span>}
                  {player.exp > 0 && <span className="text-yellow-400 text-[10px] md:text-xs font-black drop-shadow-md">✨{player.exp}</span>}
                  {player.ticket > 0 && <span className="text-orange-400 text-[10px] md:text-xs font-black drop-shadow-md">🎫{player.ticket}</span>}
                  {player.monarch && <span className="text-yellow-500 text-[10px] md:text-xs font-black drop-shadow-md">👑</span>}
                  {player.initiative && <span className="text-red-400 text-[10px] md:text-xs font-black drop-shadow-md">🗡️</span>}
                  {player.blessing && <span className="text-yellow-100 text-[10px] md:text-xs font-black drop-shadow-md">🏛️</span>}
               </div>
            </div>
            
            <div className={`flex ${isCloud ? 'flex-row gap-2' : 'flex-col gap-1'} z-30 shrink-0`}>
               <button onClick={() => onOpenModal('mana')} className={"rounded shadow-lg font-bold transition-colors " + (isCloud ? "bg-emerald-700 hover:bg-emerald-600 text-white px-6 py-4 text-xl border-2 border-emerald-500" : "bg-emerald-700 text-white hover:bg-emerald-600 px-2 py-1 text-[10px]")}>Mana</button>
               <button onClick={() => onOpenModal('stats')} className={"rounded shadow-lg font-bold transition-colors " + (isCloud ? "bg-gray-700 hover:bg-gray-600 text-white px-6 py-4 text-xl border-2 border-gray-500" : "bg-gray-700 text-white hover:bg-gray-600 px-2 py-1 text-[10px]")}>Stats</button>
            </div>
          </div>

        {showOpponents && (
            <div className="absolute top-12 left-2 right-2 bg-gray-900/98 border-2 border-indigo-500 rounded-xl p-3 z-[100] shadow-2xl animate-fade backdrop-blur-md">
                <div className="flex justify-between items-center mb-3 border-b border-gray-700 pb-2">
                    <h3 className="text-white font-black text-lg sm:text-xl">👁️ Stato Avversari <span className="text-yellow-400 font-bold ml-2">(Tu: ❤️ {player.life})</span></h3>
                    <button onClick={() => setShowOpponents(false)} className="bg-red-600 text-white px-4 py-2 rounded font-bold text-sm shadow active:scale-95">Chiudi</button>
                </div>
                <div className="flex flex-col gap-3 overflow-y-auto max-h-[50cqh] pr-1">
                    {(opponents || []).map(opp => (
                        <div key={opp.id} className="bg-black/80 p-3 rounded-lg border border-gray-600 flex justify-between items-center shadow-inner">
                            <span className="text-white font-bold text-sm sm:text-base truncate max-w-[30%] pr-1">{opp.name}</span>
                            <div className="flex gap-3 text-sm sm:text-base font-black">
                                <span className="bg-red-900/60 text-red-300 px-2 py-1 rounded border border-red-700">❤️ {opp.life}</span>
                                {opp.poison > 0 && <span className="bg-green-900/60 text-green-300 px-2 py-1 rounded border border-green-700">💧 {opp.poison}</span>}
                                {player.cmdDmg && player.cmdDmg[opp.id] > 0 && <span className="bg-orange-900/60 text-orange-300 px-2 py-1 rounded border border-orange-700" title={`Danni Comandante che HAI SUBÌTO da ${opp.name}`}>🩸⚔️ {player.cmdDmg[opp.id]}</span>}
                                {opp.cmdDmg && opp.cmdDmg[player.id] > 0 && <span className="bg-emerald-900/60 text-emerald-300 px-2 py-1 rounded border border-emerald-500" title={`Danni Comandante che HAI INFLITTO a ${opp.name}`}>🎯⚔️ {opp.cmdDmg[player.id]}</span>}
                            </div>
                        </div>
                    ))}
                    {(!opponents || opponents.length === 0) && <p className="text-gray-500 text-sm text-center font-bold">Nessun avversario rilevato.</p>}
                </div>
            </div>
        )}

          <div className="flex-1 flex items-center justify-between px-2 z-20 h-[75%] w-full relative">
            <button onClick={() => updateStat(player.id, 'life', -1)} className="w-1/4 h-full flex items-center justify-center text-5xl md:text-6xl font-bold text-red-500 active:bg-red-500/20 rounded-l-xl transition-colors drop-shadow-md">-</button>
            <div className="w-2/4 text-center text-5xl md:text-6xl lg:text-7xl font-black text-white drop-shadow-[0_5px_8px_rgba(0,0,0,1)] truncate">{player.life}</div>
            <button onClick={() => updateStat(player.id, 'life', 1)} className="w-1/4 h-full flex items-center justify-center text-5xl md:text-6xl font-bold text-green-500 active:bg-green-500/20 rounded-r-xl transition-colors drop-shadow-md">+</button>
            <button onClick={() => onOpenModal('tokens')} className={`absolute left-1/2 transform -translate-x-1/2 rounded-full shadow-lg font-bold bg-emerald-800/90 text-emerald-100 hover:bg-emerald-700 transition-colors border border-emerald-500 flex items-center gap-1 z-30 ${isCloud ? 'bottom-3 px-6 py-2 text-sm' : 'bottom-1 md:bottom-2 px-3 py-1 text-[10px] md:text-xs'}`}>♟️ Pedine</button>
          </div>
        </React.Fragment>
      );
    };

  // --- GAME UTILITY E ARCHENEMY CON BLOCCO SCHERMO INTELLIGENTE E WAKE LOCK ---
    const GameUtility = ({view, setView}) => {
      const [setup, setSetup] = useState(true);
      const [numPlayers, setNumPlayers] = useState(4);
      const [startLife, setStartLife] = useState(40);
      const [teamMode, setTeamMode] = useState(false);
      const [players, setPlayers] = useState([]);

      // --- STATI LOBBY MULTIPLAYER ---
      const [lobbyMode, setLobbyMode] = useState('local');
      const [joinCode, setJoinCode] = useState("");
      const [inCloudRoom, setInCloudRoom] = useState(false);
      const [roomCode, setRoomCode] = useState("");
      const [isHost, setIsHost] = useState(false);
      const [myPlayerId, setMyPlayerId] = useState(null);
      
      const [showDice, setShowDice] = useState(false);
      const [diceResult, setDiceResult] = useState(null);
      const [activeModal, setActiveModal] = useState(null); 
      
      const [archenemy, setArchenemy] = useState({
          active: false, playerId: null, schemes: [], ongoing: [], currentScheme: null, showModal: false, enlargedImage: null
      });
      const [planechase, setPlanechase] = useState({
          active: false, planes: [], currentPlane: null, showModal: false, enlargedImage: null
      });
      const [planarDieResult, setPlanarDieResult] = useState(null);

      // IDENTIFICATORE LOCALE PER IL BLOCCO POSTAZIONE CLOUD
      const localClientId = React.useRef(Math.random().toString(36).substring(2)).current;

      const wakeLockRef = React.useRef(null);
      const stateRef = React.useRef({ numPlayers, archenemy, activeModal, planechase });

      // --- 🛰️ IL RADAR FIREBASE ---
      useEffect(() => {
          if (inCloudRoom && roomCode) {
              const unsubscribe = db.collection('matches').doc(roomCode).onSnapshot(doc => {
                  if (doc.exists) {
                      const data = doc.data();
                      if (data.players) setPlayers(data.players);
                      if (data.archenemy) setArchenemy(prev => ({ ...prev, active: data.archenemy.active, playerId: data.archenemy.playerId, schemes: data.archenemy.schemes, ongoing: data.archenemy.ongoing, currentScheme: data.archenemy.currentScheme }));
                      if (data.planechase) setPlanechase(prev => ({ ...prev, active: data.planechase.active, planes: data.planechase.planes, currentPlane: data.planechase.currentPlane }));
                  }
              });
              return () => unsubscribe();
          }
      }, [inCloudRoom, roomCode]);

      // --- 📡 I TRASMETTITORI FIREBASE ---
      const syncToRoom = (field, payload) => {
          if (inCloudRoom && roomCode) db.collection('matches').doc(roomCode).update({ [field]: payload }).catch(function(){});
      };
      const syncArchenemy = (newState) => {
          if (inCloudRoom && roomCode) db.collection('matches').doc(roomCode).update({ archenemy: { active: newState.active, playerId: newState.playerId, schemes: newState.schemes, ongoing: newState.ongoing, currentScheme: newState.currentScheme } }).catch(function(){});
      };
      const syncPlanechase = (newState) => {
          if (inCloudRoom && roomCode) db.collection('matches').doc(roomCode).update({ planechase: { active: newState.active, planes: newState.planes, currentPlane: newState.currentPlane } }).catch(function(){});
      };
      useEffect(() => { stateRef.current = { numPlayers, archenemy, activeModal, planechase }; }, [numPlayers, archenemy, activeModal, planechase]);

      // SBLOCCO DI SICUREZZA UNIVERSALE
      useEffect(() => {
          if (view !== 'game_active') {
              try {
                  if (document.fullscreenElement && document.exitFullscreen) {
                      document.exitFullscreen().catch(function(){});
                  }
                  if (window.screen && window.screen.orientation && window.screen.orientation.unlock) {
                      window.screen.orientation.unlock();
                  }
                  if (wakeLockRef.current) {
                      wakeLockRef.current.release().catch(function(){});
                      wakeLockRef.current = null;
                  }
              } catch(e) {}
          }
      }, [view]);

      // --- GESTIONE ORIENTAMENTO FIXATA ---
      const applyScreenLock = async (mode = 'auto', playersCount = numPlayers) => {
          try {
              if (document.documentElement.requestFullscreen && !document.fullscreenElement) {
                  document.documentElement.requestFullscreen().catch(function(){});
              }
          } catch (e) {}

          try {
              if (window.screen && window.screen.orientation && window.screen.orientation.lock) {
                  let finalMode = mode;
                  if (mode === 'auto') {
                      finalMode = playersCount <= 2 ? 'portrait' : 'landscape';
                  }
                  window.screen.orientation.lock(finalMode).catch(function(){});
              }
          } catch (e) {}
      };

      const requestWakeLock = async () => {
          try {
              if ('wakeLock' in navigator) {
                  wakeLockRef.current = await navigator.wakeLock.request('screen');
              }
          } catch (err) {}
      };

      useEffect(() => {
          if (view === 'game_active') {
              let lockMode = 'auto';
              if (archenemy.showModal || planechase.showModal || (activeModal && (activeModal.type === 'search' || activeModal.type === 'editName' || activeModal.type === 'cmdrSelect'))) {
                  lockMode = 'portrait';
              } else if (activeModal && activeModal.type === 'tokens') {
                  lockMode = 'landscape';
              }
              
              applyScreenLock(lockMode, numPlayers);
              requestWakeLock();
              
              const handleVisibilityChange = () => {
                  if (document.visibilityState === 'visible' && view === 'game_active') {
                      requestWakeLock();
                      applyScreenLock(lockMode, numPlayers);
                  }
              };
              document.addEventListener('visibilitychange', handleVisibilityChange);
              return () => document.removeEventListener('visibilitychange', handleVisibilityChange);
          }
      }, [view, numPlayers, archenemy.showModal, planechase.showModal, activeModal, lobbyMode, inCloudRoom]);
      
      useEffect(() => {
          if (view === 'game_active') {
              const handlePopState = async (e) => {
                  e.preventDefault();
                  if (window.confirm("Sei sicuro di voler uscire dalla partita e tornare al Menu?")) {
                      setView('game');
                  } else {
                      window.history.pushState(null, "", window.location.href);
                      const curr = stateRef.current;
                      const isPlanechaseOpen = curr.planechase ? curr.planechase.showModal : false;
                      let fallbackMode = 'auto';
                      if (curr.archenemy.showModal || isPlanechaseOpen || (curr.activeModal && (curr.activeModal.type === 'search' || curr.activeModal.type === 'editName' || curr.activeModal.type === 'cmdrSelect'))) {
                          fallbackMode = 'portrait';
                      } else if (curr.activeModal && curr.activeModal.type === 'tokens') {
                          fallbackMode = 'landscape';
                      }
                      applyScreenLock(fallbackMode, curr.numPlayers);
                  }
              };
              window.history.pushState(null, "", window.location.href);
              window.addEventListener('popstate', handlePopState);
              return () => window.removeEventListener('popstate', handlePopState);
          }
      }, [view, setView]);

      useEffect(() => {
          fetch('https://api.scryfall.com/cards/search?q=t:scheme').then(res => res.json()).then(data => {
                  if (data && data.data) {
                      let fetched = data.data.map(c => {
                          let imageUrl = "";
                          if (c.image_uris && c.image_uris.normal) imageUrl = c.image_uris.normal;
                          else if (c.card_faces && c.card_faces.length > 0 && c.card_faces[0].image_uris && c.card_faces[0].image_uris.normal) imageUrl = c.card_faces[0].image_uris.normal;
                          let isOng = false; if (c.type_line && c.type_line.includes("Ongoing")) isOng = true;
                          return { id: c.id, name: c.name, img: imageUrl, isOngoing: isOng };
                      }).filter(c => c.img !== "");
                      setArchenemy(prev => ({ ...prev, schemes: fetched.sort(() => Math.random() - 0.5) }));
                  }
              }).catch(e => console.log("Errore Archenemy"));
              
          fetch('https://api.scryfall.com/cards/search?q=t:plane+OR+t:phenomenon').then(res => res.json()).then(data => {
                  if (data && data.data) {
                      let fetchedPlanes = data.data.map(c => {
                          let imageUrl = "";
                          if (c.image_uris && c.image_uris.normal) imageUrl = c.image_uris.normal;
                          else if (c.card_faces && c.card_faces.length > 0 && c.card_faces[0].image_uris && c.card_faces[0].image_uris.normal) imageUrl = c.card_faces[0].image_uris.normal;
                          return { id: c.id, name: c.name, img: imageUrl };
                      }).filter(c => c.img !== "");
                      setPlanechase(prev => ({ ...prev, planes: fetchedPlanes.sort(() => Math.random() - 0.5) }));
                  }
              }).catch(e => console.log("Errore Planechase"));
      }, []);

      const nextPlane = () => {
          setPlanechase(prev => {
              if (prev.planes.length === 0) return prev;
              let newPlanes = [...prev.planes];
              let next = newPlanes.pop();
              return { ...prev, currentPlane: next, planes: newPlanes };
          });
      };

      const rollPlanarDie = () => {
          const result = Math.floor(Math.random() * 6);
          if (result === 0) { 
              setPlanarDieResult("🌌 PLANESWALK!\nViaggi verso un nuovo piano."); 
              setTimeout(() => { setPlanarDieResult(null); nextPlane(); }, 2500); 
          } else if (result === 1) { 
              setPlanarDieResult("🌀 CAOS!\nInneschi l'abilità Caos del piano attuale."); 
              setTimeout(() => setPlanarDieResult(null), 2500); 
          } else { 
              setPlanarDieResult("✖️ VUOTO.\nNon succede nulla."); 
              setTimeout(() => setPlanarDieResult(null), 1500); 
          }
      };
      
      const rollDice = (max) => {
         const res = Math.floor(Math.random() * max) + 1;
         setDiceResult({ max, val: res });
         setShowDice(false);
         setTimeout(() => setDiceResult(null), 2500);
      };

      // --- LOGICA MULTIPLAYER (CREAZIONE E LOCK POSTAZIONE) ---
      const createCloudRoom = async () => {
          const code = Math.random().toString(36).substring(2, 7).toUpperCase(); 
          
          const initialPlayers = Array.from({ length: numPlayers }).map((_, i) => ({
              id: `P${i + 1}`, teamId: teamMode ? Math.ceil((i + 1)/2) : (i + 1), name: `Player ${i + 1}`, 
              life: startLife, poison: 0, cmdCasts: 0, emblems: 0, rad: 0, energy: 0, exp: 0, ticket: 0,
              cmdDmg: {}, monarch: false, initiative: false, blessing: false, dayNight: 'none', immune: false,
              mana: { W: 0, U: 0, B: 0, R: 0, G: 0, C: 0 }, tokens: [], tokenBg: null, bgUrl: null,
              claimed: false, claimedBy: null
          }));

          try {
              await db.collection('matches').doc(code).set({
                  roomCode: code, numPlayers: numPlayers, startLife: startLife, teamMode: teamMode, players: initialPlayers, createdAt: new Date().toISOString()
              });
              setRoomCode(code); setPlayers(initialPlayers); setIsHost(true); setInCloudRoom(true);
          } catch (err) {
              alert("⚠️ ERRORE FIREBASE:\n" + err.message);
          }
      };

      const joinCloudRoom = async () => {
          if (!joinCode || joinCode.length !== 5) return alert("Inserisci un codice valido di 5 lettere.");
          try {
              const docRef = await db.collection('matches').doc(joinCode).get();
              if (!docRef.exists) return alert("Stanza non trovata! Controlla il codice.");
              
              const data = docRef.data();
              setRoomCode(joinCode); setNumPlayers(data.numPlayers); setStartLife(data.startLife); setTeamMode(data.teamMode || false);
              setPlayers(data.players); setIsHost(false); setInCloudRoom(true);
          } catch (err) {}
      };

      const selectPlayerSlot = (pId) => {
          const target = players.find(p => p.id === pId);
          if (target && target.claimed && target.claimedBy !== localClientId) {
              alert("Postazione già occupata da un altro giocatore!");
              return;
          }
          const newPlayers = players.map(p => {
              if (p.id === pId) return { ...p, claimed: true, claimedBy: localClientId };
              if (p.claimedBy === localClientId) return { ...p, claimed: false, claimedBy: null };
              return p;
          });
          setPlayers(newPlayers);
          setMyPlayerId(pId);
          syncToRoom('players', newPlayers);
      };

      const fallbackToLocal = () => {
          if (window.confirm("Vuoi sganciarti dal Cloud e continuare in Locale su questo telefono?\n\nLa partita non andrà persa: tutti i giocatori (con i loro punti vita e pedine) passeranno su questo schermo.")) {
              setLobbyMode('local');
              setInCloudRoom(false);
              setMyPlayerId(null);
              setRoomCode("");
          }
      };

      // FUNZIONE SALVATAGGIO VITTORIA
      const declareWinner = async (winnerPlayer) => {
          if (!window.confirm(`Dichiarare ${winnerPlayer.name} VINCITORE della partita e salvare le statistiche?`)) return;
          try {
              let winnerCommander = "Sconosciuto";
              if (winnerPlayer.tokens && winnerPlayer.tokens.length > 0) {
                  winnerCommander = winnerPlayer.name; 
              }
              await db.collection('match_history').add({
                  date: new Date().toISOString(),
                  playerCount: players.length,
                  winnerId: winnerPlayer.id,
                  winnerName: winnerPlayer.name,
                  winnerCommander: winnerCommander,
                  teamMode: teamMode
              });
              alert("🏆 Vittoria registrata nelle statistiche!");
              resetGame();
          } catch (err) { alert("Errore nel salvataggio: " + err.message); }
      };
 
      const startGame = () => {
        let newPlayers = [];
        let maxPoison = (startLife === 30 || (startLife === 60 && teamMode)) ? 15 : 10; 
        for(let i=1; i<=numPlayers; i++) {
          let cmdDmg = {}; for(let j=1; j<=numPlayers; j++) { if(i!==j) cmdDmg[`P${j}`] = 0; }
          
          let tId = i;
          if (teamMode) {
              if (numPlayers === 6) {
                  if (i === 1 || i === 2) tId = 1;      
                  else if (i === 3 || i === 6) tId = 2; 
                  else if (i === 4 || i === 5) tId = 3; 
              } else {
                  tId = Math.ceil(i/2);
              }
          }

          newPlayers.push({ 
             id: `P${i}`, teamId: tId, name: `Player ${i}`, life: startLife, poison: 0, maxPoison: maxPoison, cmdCasts: 0, emblems: 0, immune: false, cmdDmg: cmdDmg, bgUrl: null, mana: {W:0, U:0, B:0, R:0, G:0, C:0},
             rad: 0, energy: 0, exp: 0, ticket: 0, monarch: false, initiative: false, blessing: false, dayNight: 'none',
             tokens: [], tokenBg: null
          });
        }
        setPlayers(newPlayers); 
        setView('game_active');
      };

      const resetGame = () => {
          const isConfirmed = window.confirm("Vuoi davvero resettare la partita? Punti vita e segnalini torneranno ai valori iniziali.");
          if (isConfirmed) {
              setArchenemy(prev => ({...prev, active: false, playerId: null, ongoing: [], currentScheme: null}));
              setPlanechase(prev => ({...prev, active: false, currentPlane: null}));
              setPlayers(prev => prev.map(p => {
                  let resetDmg = {}; prev.forEach(op => { if(op.id !== p.id) resetDmg[`${op.id}`] = 0; });
                  return { ...p, life: startLife, poison: 0, cmdCasts: 0, emblems: 0, rad: 0, energy: 0, exp: 0, ticket: 0, cmdDmg: resetDmg, monarch: false, initiative: false, blessing: false, dayNight: 'none', immune: false, mana: {W:0, U:0, B:0, R:0, G:0, C:0}, tokens: [] };
              }));
          }
          let lockMode = 'auto';
          if (activeModal && activeModal.type === 'tokens') lockMode = 'landscape';
          applyScreenLock(lockMode, numPlayers);
      };

      const exitGame = () => {
          if (window.confirm("Sei sicuro di voler uscire e tornare al Menu?")) { 
              setView('game'); 
          } else {
              let lockMode = 'auto';
              if (archenemy.showModal || planechase.showModal || (activeModal && (activeModal.type === 'search' || activeModal.type === 'editName'))) {
                  lockMode = 'portrait';
              } else if (activeModal && activeModal.type === 'tokens') {
                  lockMode = 'landscape';
              }
              applyScreenLock(lockMode, numPlayers);
          }
      };

      const nextScheme = () => {
          setArchenemy(prev => {
              if (prev.schemes.length === 0) return prev;
              let newSchemes = [...prev.schemes];
              let next = newSchemes.pop();
              let newOngoing = [...prev.ongoing];
              if (prev.currentScheme && prev.currentScheme.isOngoing) { newOngoing.push(prev.currentScheme); }
              return { ...prev, currentScheme: next, schemes: newSchemes, ongoing: newOngoing };
          });
      };
      const updateStat = (playerId, stat, amount, opponentId = null) => {
        setPlayers(prev => {
          const targetPlayer = prev.find(p => p.id === playerId);
          if(!targetPlayer) return prev;
          
          const sharedStats = ['life', 'poison', 'energy', 'ticket'];
          const isShared = sharedStats.includes(stat);
          let newState = [];
          
          if (opponentId && stat === 'cmdDmg') {
             let prevVal = targetPlayer.cmdDmg[opponentId] || 0;
             let newVal = Math.max(0, prevVal + amount);
             let diff = newVal - prevVal;
             newState = prev.map(p => {
                if (p.id === playerId) return { ...p, cmdDmg: { ...p.cmdDmg, [opponentId]: newVal }, life: Math.max(0, p.life - diff) };
                if (p.teamId === targetPlayer.teamId && p.id !== playerId) return { ...p, cmdDmg: { ...p.cmdDmg, [opponentId]: newVal }, life: Math.max(0, p.life - diff) }; 
                return p;
             });
          } else {
             newState = prev.map(p => {
                 if (isShared && p.teamId === targetPlayer.teamId) return { ...p, [stat]: Math.max(0, p[stat] + amount) }; 
                 else if (!isShared && p.id === playerId) return { ...p, [stat]: Math.max(0, p[stat] + amount) }; 
                 return p;
             });
          }
          syncToRoom('players', newState); 
          return newState;
        });
      };

      const updateMana = (playerId, color, amount) => {
        setPlayers(prev => {
            const newState = prev.map(p => {
               if(p.id !== playerId) return p;
               let newMana = {...p.mana}; newMana[color] = Math.max(0, newMana[color] + amount);
               return {...p, mana: newMana};
            });
            syncToRoom('players', newState); 
            return newState;
        });
      };

      const updatePlayerConfig = (id, key, val) => { 
          setPlayers(prev => { const n = prev.map(p => p.id === id ? { ...p, [key]: val } : p); syncToRoom('players', n); return n; }); 
      };
      
      const toggleImmunity = (playerId) => { 
          setPlayers(prev => { const n = prev.map(p => p.id === playerId ? { ...p, immune: !p.immune } : p); syncToRoom('players', n); return n; }); 
      };

      if (view === 'game') return (
        <div className="max-w-md mx-auto bg-gray-800/90 p-6 rounded-xl shadow-lg border border-gray-600 mt-4 backdrop-blur-sm animate-fade">
          <h2 className="text-3xl font-black mb-4 text-center text-red-500 drop-shadow-md">Setup Partita</h2>
          
          <button onClick={() => setView('statistics')} className="w-full mb-6 bg-purple-700 hover:bg-purple-600 text-white font-black py-3 rounded-lg shadow-lg border border-purple-500 flex items-center justify-center gap-2 transition-all">
              📊 VEDI STATISTICHE PARTITE
          </button>
        
          <div className="flex gap-2 mb-6 bg-gray-900 p-1 rounded-lg border border-gray-700">
             <button onClick={()=>setLobbyMode('local')} className={`flex-1 font-bold py-2 rounded transition-colors ${lobbyMode==='local'?'bg-red-600 text-white shadow':'text-gray-400 hover:text-white'}`}>Tavolo Locale</button>
             <button onClick={()=>setLobbyMode('cloud')} className={`flex-1 font-bold py-2 rounded transition-colors ${lobbyMode==='cloud'?'bg-blue-600 text-white shadow':'text-gray-400 hover:text-white'}`}>☁️ Rete Cloud</button>
          </div>

          {lobbyMode === 'local' && (
             <div className="animate-fade">
                <div className="bg-blue-900/50 border border-blue-500 rounded-lg p-4 mb-6 shadow-inner text-center">
                   <p className="text-blue-200 text-sm font-bold uppercase tracking-wider mb-2">Posizione del Telefono:</p>
                   <p className="text-white text-xs font-semibold">2 Giocatori ➡️ Tieni in Verticale<br/>3 - 6 Giocatori ➡️ Tieni in Orizzontale al centro</p>
                </div>
                <div className="mb-4">
                  <label className="block text-gray-300 font-bold mb-2">Numero Giocatori (1-6)</label>
                  <input type="number" min="1" max="6" value={numPlayers} onChange={e => setNumPlayers(parseInt(e.target.value))} className="w-full bg-gray-900 border border-gray-600 rounded p-3 text-white text-center text-xl font-bold outline-none" />
                </div>
                <div className="mb-4">
                  <label className="block text-gray-300 font-bold mb-2">Punti Vita Iniziali</label>
                  <select value={startLife} onChange={e => setStartLife(parseInt(e.target.value))} className="w-full bg-gray-900 border border-gray-600 rounded p-3 text-white text-center text-xl font-bold outline-none">
                    <option value={60}>60 (Commander Two-Headed Giant)</option>
                    <option value={40}>40 (Commander Base)</option>
                    <option value={30}>30 (Standard Two-Headed Giant)</option>
                    <option value={20}>20 (Standard Base)</option>
                  </select>
                </div>
                <div className="mb-6">
                   <label className="flex items-center gap-3 text-white font-bold bg-blue-900/40 p-3 rounded-lg border border-blue-500 cursor-pointer shadow-inner">
                     <input type="checkbox" checked={teamMode} onChange={e=>setTeamMode(e.target.checked)} className="w-6 h-6 accent-blue-500" />
                     <span className="text-sm">Abilita Squadre (2HG) <br/><span className="text-[10px] text-blue-300 font-normal">Sincronizza Vita, Veleno, Energia e Ticket a coppie.</span></span>
                   </label>
                </div>
                <button onClick={startGame} className="w-full bg-red-600 hover:bg-red-500 text-white font-black py-4 rounded-xl text-xl shadow-[0_0_15px_rgba(220,38,38,0.5)] transition-all">INIZIA PARTITA</button>
             </div>
          )}

          {lobbyMode === 'cloud' && !inCloudRoom && (
             <div className="space-y-4 animate-fade">
                <div className="bg-blue-900/30 border border-blue-500/50 rounded-lg p-3 mb-4 shadow-inner text-center">
                   <p className="text-blue-300 text-xs font-bold">Collega gli smartphone! Ognuno avrà la plancia a tutto schermo sul proprio dispositivo.</p>
                </div>
                
                <div className="bg-gray-900 p-4 rounded-xl border border-gray-700 shadow-inner">
                   <h3 className="text-white font-black mb-2 text-lg">Sei l'Host?</h3>
                   <p className="text-gray-400 text-xs mb-3 font-bold">Imposta le regole, crea la stanza e fai collegare i tuoi amici.</p>
                   
                   <div className="flex gap-2 mb-3">
                      <select value={numPlayers} onChange={e => setNumPlayers(parseInt(e.target.value))} className="flex-1 bg-gray-800 border border-gray-600 rounded p-2 text-white font-bold outline-none text-sm">
                          <option value={2}>2 Giocatori</option><option value={3}>3 Giocatori</option><option value={4}>4 Giocatori</option><option value={5}>5 Giocatori</option><option value={6}>6 Giocatori</option>
                      </select>
                      <select value={startLife} onChange={e => setStartLife(parseInt(e.target.value))} className="flex-1 bg-gray-800 border border-gray-600 rounded p-2 text-white font-bold outline-none text-sm">
                          <option value={60}>60 PV</option><option value={40}>40 PV</option><option value={30}>30 PV</option><option value={20}>20 PV</option>
                      </select>
                   </div>
                   
                   <div className="mb-3">
                       <label className="flex items-center gap-2 text-white font-bold bg-blue-900/40 p-2 rounded border border-blue-500 cursor-pointer">
                         <input type="checkbox" checked={teamMode} onChange={e=>setTeamMode(e.target.checked)} className="w-5 h-5 accent-blue-500" />
                         <span className="text-xs">Usa Regole Two-Headed Giant</span>
                       </label>
                   </div>

                   <button onClick={createCloudRoom} className="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-3 rounded-lg shadow transition-all flex items-center justify-center gap-2">☁️ CREA STANZA ONLINE</button>
                </div>

                <div className="flex items-center gap-2 my-2">
                   <div className="h-px bg-gray-700 flex-1"></div><span className="text-gray-500 text-xs font-black">OPPURE</span><div className="h-px bg-gray-700 flex-1"></div>
                </div>

                <div className="bg-gray-900 p-4 rounded-xl border border-gray-700 shadow-inner">
                   <h3 className="text-white font-black mb-2 text-lg">Unisciti al Tavolo</h3>
                   <input type="text" placeholder="Codice Stanza (es. MTG5X)" value={joinCode} onChange={e=>setJoinCode(e.target.value.toUpperCase())} maxLength={5} className="w-full bg-gray-800 border border-gray-600 rounded-lg p-3 text-white text-center text-xl font-black outline-none focus:border-green-500 mb-3 tracking-widest uppercase" />
                   <button onClick={joinCloudRoom} disabled={!joinCode || joinCode.length !== 5} className="w-full bg-green-600 hover:bg-green-500 disabled:opacity-50 text-white font-black py-3 rounded-lg shadow transition-all">ENTRA NEL TAVOLO</button>
                </div>
             </div>
          )}

          {lobbyMode === 'cloud' && inCloudRoom && (
             <div className="animate-fade">
                <div className="bg-green-900/30 border border-green-500/50 rounded-lg p-4 mb-6 shadow-inner text-center">
                   <p className="text-green-400 font-black text-sm uppercase mb-1">Sei connesso alla stanza!</p>
                   <p className="text-white text-4xl font-black tracking-widest my-2 drop-shadow-lg">{roomCode}</p>
                   <p className="text-gray-400 text-xs font-bold">Fai inserire questo codice ai tuoi amici</p>
                </div>

                <h3 className="text-white font-black text-center mb-4 text-xl">Scegli la tua postazione:</h3>
                
                <div className="grid grid-cols-2 gap-3 mb-6">
                    {players.map((p, index) => {
                        const isMine = myPlayerId === p.id;
                        const isTaken = p.claimed && p.claimedBy !== localClientId;
                        let btnClass = 'bg-gray-800 border-gray-600 text-gray-400 hover:border-gray-400';
                        if (isMine) btnClass = 'bg-emerald-600 border-emerald-400 text-white scale-105';
                        else if (isTaken) btnClass = 'bg-red-900 border-red-700 text-red-300 opacity-50 cursor-not-allowed';
                        
                        return (
                            <button 
                                key={p.id} 
                                onClick={() => !isTaken && selectPlayerSlot(p.id)}
                                disabled={isTaken}
                                className={`py-4 rounded-xl font-black shadow-lg transition-all border-2 flex flex-col items-center justify-center gap-1 ${btnClass}`}
                            >
                                <span>{teamMode ? `Team ${p.teamId} (G. ${index+1})` : `Giocatore ${index+1}`}</span>
                                {isTaken && <span className="bg-red-600 text-white text-[9px] px-2 py-0.5 rounded shadow">OCCUPATO</span>}
                            </button>
                        )
                    })}
                </div>

                {myPlayerId && (
                   <button onClick={() => setView('game_active')} className="w-full bg-red-600 hover:bg-red-500 text-white font-black py-4 rounded-xl text-xl shadow-[0_0_15px_rgba(220,38,38,0.5)] transition-all animate-pulse">
                      VAI ALLA TUA PLANCIA!
                   </button>
                )}
             </div>
          )}
        </div>
      );

      let gridClass = '';
      if (players.length <= 2) gridClass = 'grid-cols-1 grid-rows-[1fr_55px_1fr]';
      else if (players.length === 3 || players.length === 4) gridClass = 'grid-cols-[1fr_55px_1fr] grid-rows-2';
      else if (players.length === 5) gridClass = 'grid-cols-[1fr_1fr_55px_1.2fr] grid-rows-2';
      else if (players.length === 6) gridClass = 'grid-cols-[1.2fr_1fr_55px_1fr_1.2fr] grid-rows-2';

      let currentArchenemyName = "Sconosciuto";
      if (archenemy.playerId) { const archPlayer = players.find(p => p.id === archenemy.playerId); if (archPlayer) currentArchenemyName = archPlayer.name; }

      const isCloudMode = inCloudRoom && myPlayerId;
      const myPlayer = isCloudMode ? players.find(p => p.id === myPlayerId) : null;
      const isHostOrArch = isHost || (archenemy.playerId === myPlayerId);

      return (
        <div className="fixed inset-0 z-[100] bg-black flex flex-col h-[100dvh] w-[100dvw]">
           {isCloudMode && myPlayer ? (
               // --- PLANCIA PERSONALE CLOUD ---
               <React.Fragment>
                  <div className="flex-1 w-full relative overflow-hidden bg-gray-900 shadow-xl">
                      <PlayerCard isCloud={true} player={myPlayer} updateStat={updateStat} updatePlayerConfig={updatePlayerConfig} rotation={0} isArchenemy={archenemy.playerId === myPlayer.id} onOpenModal={(type) => setActiveModal({type, playerId: myPlayer.id, rotation: 0})} opponents={players.filter(p => p.id !== myPlayerId)} />
                  </div>
                  
                  <div className="h-[75px] bg-gray-950 border-t border-gray-700 flex flex-row items-center justify-around shadow-2xl z-[120] py-2 px-4 w-full shrink-0">
                      <button onClick={exitGame} className="flex flex-col items-center gap-1 text-red-500 font-bold hover:text-red-400 transition-colors" title="Esci dalla Partita">
                          <span className="text-2xl">✖</span> <span className="text-[10px] uppercase">Esci</span>
                      </button>
                      
                      <div className="w-px h-8 bg-gray-700"></div>
                      
                      <button onClick={fallbackToLocal} className="flex flex-col items-center gap-1 text-yellow-500 font-bold hover:text-yellow-400 transition-colors" title="Passa in Modalità Locale">
                          <span className="text-2xl">📱</span> <span className="text-[10px] uppercase">Locale</span>
                      </button>
                      
                      <div className="w-px h-8 bg-gray-700"></div>

                      <button onClick={() => setShowDice(true)} className="flex items-center justify-center bg-gray-800 hover:bg-gray-700 w-12 h-12 rounded-xl shadow-lg border border-gray-600 transform transition-transform active:scale-90" title="Lancia Dadi">
                          <span className="text-2xl drop-shadow-md">🎲</span>
                      </button>
                      {isHostOrArch && (
                          <button onClick={() => setArchenemy(prev => { const n = {...prev, showModal: true}; return n; })} className={`flex items-center justify-center w-12 h-12 rounded-xl shadow-lg border transform transition-transform active:scale-90 ${archenemy.active ? 'bg-red-800 border-red-500 animate-pulse' : 'bg-gray-800 border-gray-600 hover:bg-gray-700'}`} title="Archenemy">
                              <span className="text-2xl drop-shadow-md">👿</span>
                          </button>
                      )}
                      {isHost && (
                          <button onClick={() => setPlanechase(prev => { const n = {...prev, showModal: true}; return n; })} className={`flex items-center justify-center w-12 h-12 rounded-xl shadow-lg border transform transition-transform active:scale-90 ${planechase.active ? 'bg-indigo-800 border-indigo-500 animate-pulse' : 'bg-gray-800 border-gray-600 hover:bg-gray-700'}`} title="Planechase">
                              <span className="text-2xl drop-shadow-md">🌌</span>
                          </button>
                      )}
                  </div>
               </React.Fragment>
           ) : (
               // --- PLANCIA LOCALE TRADIZIONALE ---
               <div className={`flex-1 grid ${gridClass} gap-1 h-full w-full p-1`}>
                 {players.map((p, index) => {
                     let wrapperClass = "relative overflow-hidden rounded-xl border border-gray-600 bg-gray-900 shadow-xl"; 
                     let rotDeg = 0; let rowStart = ""; let colStart = ""; let rowSpan = "";
                     
                     if (players.length <= 2) {
                         if (index === 0) { rowStart = "row-start-1"; colStart = "col-start-1"; rotDeg = 180; }
                         if (index === 1) { rowStart = "row-start-3"; colStart = "col-start-1"; rotDeg = 0; }
                     } else if (players.length === 3) {
                         if (index === 0) { rowStart = "row-start-1"; colStart = "col-start-1"; rotDeg = 180; }
                         if (index === 1) { rowStart = "row-start-2"; colStart = "col-start-1"; rotDeg = 0; }
                         if (index === 2) { rowStart = "row-start-1"; colStart = "col-start-3"; rowSpan = "row-span-2"; rotDeg = -90; }
                     } else if (players.length === 4) {
                         if (index === 0) { rowStart = "row-start-1"; colStart = "col-start-1"; rotDeg = 180; }
                         if (index === 1) { rowStart = "row-start-1"; colStart = "col-start-3"; rotDeg = 180; }
                         if (index === 2) { rowStart = "row-start-2"; colStart = "col-start-1"; rotDeg = 0; }
                         if (index === 3) { rowStart = "row-start-2"; colStart = "col-start-3"; rotDeg = 0; }
                     } else if (players.length === 5) {
                         if (index === 0) { rowStart = "row-start-1"; colStart = "col-start-1"; rotDeg = 180; }
                         if (index === 1) { rowStart = "row-start-1"; colStart = "col-start-2"; rotDeg = 180; }
                         if (index === 2) { rowStart = "row-start-2"; colStart = "col-start-1"; rotDeg = 0; }
                         if (index === 3) { rowStart = "row-start-2"; colStart = "col-start-2"; rotDeg = 0; }
                         if (index === 4) { rowStart = "row-start-1"; colStart = "col-start-4"; rowSpan = "row-span-2"; rotDeg = -90; }
                     } else if (players.length === 6) {
                         if (index === 0) { rowStart = "row-start-1"; colStart = "col-start-1"; rowSpan = "row-span-2"; rotDeg = 90; }
                         if (index === 1) { rowStart = "row-start-1"; colStart = "col-start-2"; rotDeg = 180; }
                         if (index === 2) { rowStart = "row-start-1"; colStart = "col-start-4"; rotDeg = 180; }
                         if (index === 3) { rowStart = "row-start-2"; colStart = "col-start-2"; rotDeg = 0; }
                         if (index === 4) { rowStart = "row-start-2"; colStart = "col-start-4"; rotDeg = 0; }
                         if (index === 5) { rowStart = "row-start-1"; colStart = "col-start-5"; rowSpan = "row-span-2"; rotDeg = -90; }
                     }

                     const isSideways = rotDeg === 90 || rotDeg === -90;
                     return (
                         <div key={p.id} className={`${wrapperClass} ${rowStart} ${colStart} ${rowSpan}`} style={{ containerType: 'size' }}>
                             <div className={`absolute flex flex-col bg-gray-900 shadow-[inset_0_0_20px_rgba(0,0,0,0.8)] ${isSideways ? 'top-1/2 left-1/2' : 'inset-0'}`} 
                                  style={{ width: isSideways ? '100cqh' : '100cqw', height: isSideways ? '100cqw' : '100cqh', transform: isSideways ? `translate(-50%, -50%) rotate(${rotDeg}deg)` : `rotate(${rotDeg}deg)` }}>
                                 <PlayerCard player={p} updateStat={updateStat} updatePlayerConfig={updatePlayerConfig} rotation={rotDeg} isArchenemy={archenemy.playerId === p.id} opponents={players.filter(op => op.id !== p.id)} onOpenModal={(type) => setActiveModal({type, playerId: p.id, rotation: rotDeg})} />
                             </div>
                         </div>
                     );
                 })}

                 {/* BARRA CENTRALE LOCALE */}
                 <div className={
                     players.length <= 2 
                     ? "row-start-2 col-start-1 col-span-full bg-gray-950 border-y border-gray-700 flex flex-row items-center justify-around shadow-2xl z-[120] py-1 px-4"
                     : `row-start-1 row-span-full ${players.length===3 || players.length===4 ? 'col-start-2' : 'col-start-3'} bg-gray-950 border-x border-gray-700 flex flex-col items-center justify-around shadow-2xl z-[120] py-4 px-1`
                 }>
                    <button onClick={exitGame} className="flex flex-col items-center gap-1 text-red-500 font-bold hover:text-red-400 transition-colors" title="Esci dalla Partita">
                        <span className="text-xl">✖</span> <span className="text-[10px] uppercase">Esci</span>
                    </button>
                    <div className={players.length <= 2 ? "w-px h-6 bg-gray-700" : "w-6 h-px bg-gray-700"}></div>
                    <button onClick={() => setShowDice(true)} className="flex items-center justify-center bg-gray-800 hover:bg-gray-700 w-12 h-12 rounded-xl shadow-lg border border-gray-600 transform transition-transform active:scale-90" title="Lancia Dadi">
                        <span className="text-2xl drop-shadow-md">🎲</span>
                    </button>
                    <button onClick={() => setArchenemy(prev => ({...prev, showModal: true}))} className={`flex items-center justify-center w-12 h-12 rounded-xl shadow-lg border transform transition-transform active:scale-90 ${archenemy.active ? 'bg-red-800 border-red-500 animate-pulse' : 'bg-gray-800 border-gray-600 hover:bg-gray-700'}`} title="Archenemy">
                        <span className="text-2xl drop-shadow-md">👿</span>
                    </button>
                    <button onClick={() => setPlanechase(prev => ({...prev, showModal: true}))} className={`flex items-center justify-center w-12 h-12 rounded-xl shadow-lg border transform transition-transform active:scale-90 ${planechase.active ? 'bg-indigo-800 border-indigo-500 animate-pulse' : 'bg-gray-800 border-gray-600 hover:bg-gray-700'}`} title="Planechase">
                        <span className="text-2xl drop-shadow-md">🌌</span>
                    </button>
                    <div className={players.length <= 2 ? "w-px h-6 bg-gray-700" : "w-6 h-px bg-gray-700"}></div>
                    {/* BLOCCO VITTORIA E RESET OTTIMIZZATO */}
                    <div className={players.length <= 2 ? "flex flex-row items-center gap-3" : "flex flex-col items-center gap-3"}>
                        <button onClick={() => {
                            const winnerName = window.prompt("Chi ha vinto? Inserisci il nome del giocatore:");
                            if(winnerName) declareWinner({ id: 'manual', name: winnerName });
                        }} className="flex flex-col items-center gap-1 text-yellow-500 font-bold hover:text-yellow-400 transition-colors" title="Dichiara Vincitore">
                            <span className="text-lg leading-none">🏆</span> <span className="text-[8px] uppercase leading-none">Vittoria</span>
                        </button>
                        <div className={players.length <= 2 ? "w-px h-5 bg-gray-700" : "w-5 h-px bg-gray-700"}></div>
                        <button onClick={resetGame} className="flex flex-col items-center gap-1 text-gray-400 font-bold hover:text-white transition-colors" title="Azzera e Ricomincia">
                            <span className="text-lg leading-none">🔄</span> <span className="text-[8px] uppercase leading-none">Reset</span>
                        </button>
                    </div>
                 </div>
               </div>
           )}

          {/* RENDER MODALI GLOBALI (In comune per Local e Cloud) */}
          {activeModal && ReactDOM.createPortal(
              <PlayerModals type={activeModal.type} player={players.find(p => p.id === activeModal.playerId)} opponents={players.filter(p => p.id !== activeModal.playerId)} onClose={() => setActiveModal(null)} updateStat={updateStat} updateMana={updateMana} toggleImmunity={toggleImmunity} updatePlayerConfig={updatePlayerConfig} rotation={activeModal.rotation} />
          , document.body)}

          {/* MODALE ARCHENEMY */}
          {archenemy.showModal && ReactDOM.createPortal(
             <div className="fixed inset-0 bg-gray-900 z-[9999] flex flex-col p-4 animate-fade overflow-hidden">
                <div className="flex justify-between items-center mb-4 border-b border-gray-700 pb-3 mt-2 shrink-0">
                   <h3 className="text-white font-black text-2xl truncate pr-2 flex items-center gap-2">👿 Archenemy</h3>
                   <button onClick={() => setArchenemy(prev => ({...prev, showModal: false}))} className="bg-gray-600 px-4 py-2 rounded-lg text-white font-bold shadow-lg">Chiudi</button>
                </div>
                
                <div className="flex items-center justify-between bg-gray-800 p-4 rounded-xl border border-gray-600 shadow mb-4 shrink-0">
                   <span className="text-gray-300 font-bold">Stato Archenemy:</span>
                   <button onClick={() => setArchenemy(prev => { const n = {...prev, active: !prev.active}; syncArchenemy(n); return n; })} className={`px-6 py-2 font-black rounded-lg transition-colors ${archenemy.active ? 'bg-red-600 text-white' : 'bg-gray-700 text-gray-400'}`}>
                      {archenemy.active ? 'ACCESO (ON)' : 'SPENTO (OFF)'}
                   </button>
                </div>

                {archenemy.active && (
                   <div className="flex-1 flex flex-col gap-4 overflow-y-auto">
                      {!archenemy.playerId ? (
                         <div className="bg-gray-800 p-4 rounded-xl border border-gray-600 shadow">
                            <h4 className="text-white font-bold mb-3 text-center">Chi è l'Archenemy?</h4>
                            <div className="grid grid-cols-2 gap-2">
                               {players.map(p => (
                                  <button key={p.id} onClick={() => { setArchenemy(prev => { const n = {...prev, playerId: p.id}; syncArchenemy(n); return n; }); nextScheme(); }} className="bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 rounded-lg border border-gray-500 shadow">{p.name}</button>
                               ))}
                            </div>
                         </div>
                      ) : (
                         <div className="flex-1 flex flex-col min-h-0">
                            <p className="text-center text-red-400 font-black mb-2 bg-red-900/30 p-2 rounded border border-red-800 uppercase tracking-widest shrink-0">
                                🔥 {currentArchenemyName} È IL NEMICO 🔥
                            </p>
                            
                            {archenemy.ongoing.length > 0 && (
                               <div className="mb-4 bg-gray-800 p-3 rounded-xl border border-purple-500 shadow-inner shrink-0">
                                  <p className="text-purple-400 text-xs font-bold uppercase mb-2">Schemi Permanenti (Ongoing):</p>
                                  <div className="flex gap-2 overflow-x-auto pb-2">
                                     {archenemy.ongoing.map((s, i) => (
                                        <img key={i} src={s.img} className="w-24 rounded cursor-pointer shadow-lg active:scale-95 border border-purple-500 shrink-0" onClick={() => setArchenemy(prev => ({...prev, enlargedImage: s.img}))} />
                                     ))}
                                  </div>
                               </div>
                            )}

                            <div className="flex-1 flex flex-col items-center justify-center mb-4 min-h-0">
                               {archenemy.currentScheme ? (
                                  <div className="relative group cursor-pointer h-full flex items-center justify-center" onClick={() => setArchenemy(prev => ({...prev, enlargedImage: archenemy.currentScheme.img}))}>
                                     <img src={archenemy.currentScheme.img} className="max-w-full max-h-full object-contain rounded-xl shadow-2xl border-4 border-gray-700" />
                                     <div className="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 bg-black/40 transition-opacity rounded-xl pointer-events-none"><span className="text-4xl">🔍</span></div>
                                  </div>
                               ) : (
                                  <p className="text-gray-500 font-bold">Nessuno schema attivo.</p>
                               )}
                            </div>

                            {(isHost || archenemy.playerId === myPlayerId || !isCloudMode) && (
                                <button onClick={nextScheme} className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-4 rounded-xl text-xl shadow-[0_0_15px_rgba(79,70,229,0.5)] transition-all mt-auto shrink-0 mb-2">
                                    🃏 PROSSIMO SCHEMA
                                </button>
                            )}
                         </div>
                      )}
                   </div>
                )}
             </div>
          , document.body)}

          {archenemy.enlargedImage && ReactDOM.createPortal(
             <div className="fixed inset-0 bg-black/95 z-[10000] flex items-center justify-center p-4 animate-fade" onClick={() => setArchenemy(prev => ({...prev, enlargedImage: null}))}>
                <img src={archenemy.enlargedImage} className="max-w-full max-h-[90vh] rounded-xl shadow-2xl border border-gray-600" />
                <p className="absolute bottom-6 text-gray-400 font-bold text-sm">Tocca per chiudere</p>
             </div>
          , document.body)}

          {/* MODALE PLANECHASE */}
          {planechase.showModal && ReactDOM.createPortal(
             <div className="fixed inset-0 bg-gray-900 z-[9999] flex flex-col p-4 animate-fade overflow-hidden">
                <div className="flex justify-between items-center mb-4 border-b border-gray-700 pb-3 mt-2 shrink-0">
                   <h3 className="text-white font-black text-2xl truncate pr-2 flex items-center gap-2">🌌 Planechase</h3>
                   <button onClick={() => setPlanechase(prev => ({...prev, showModal: false}))} className="bg-gray-600 px-4 py-2 rounded-lg text-white font-bold shadow-lg">Chiudi</button>
                </div>
                
                <div className="flex items-center justify-between bg-gray-800 p-4 rounded-xl border border-gray-600 shadow mb-4 shrink-0">
                   <span className="text-gray-300 font-bold">Stato Planechase:</span>
                   <button onClick={() => { setPlanechase(prev => { const n = {...prev, active: !prev.active}; syncPlanechase(n); return n; }); if(!planechase.currentPlane) nextPlane(); }} className={`px-6 py-2 font-black rounded-lg transition-colors ${planechase.active ? 'bg-indigo-600 text-white' : 'bg-gray-700 text-gray-400'}`}>
                      {planechase.active ? 'ACCESO (ON)' : 'SPENTO (OFF)'}
                   </button>
                </div>

                {planechase.active && (
                   <div className="flex-1 flex flex-col gap-4 overflow-y-auto">
                         <div className="flex-1 flex flex-col items-center justify-center mb-4 min-h-0">
                            {planechase.currentPlane ? (
                               <div className="relative group cursor-pointer h-full w-full flex items-center justify-center" onClick={() => setPlanechase(prev => ({...prev, enlargedImage: planechase.currentPlane.img}))}>
                                  <img src={planechase.currentPlane.img} className="max-w-full max-h-full object-contain rounded-xl shadow-2xl border-4 border-indigo-700" />
                                  <div className="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 bg-black/40 transition-opacity rounded-xl pointer-events-none"><span className="text-4xl">🔍</span></div>
                               </div>
                            ) : (
                               <p className="text-gray-500 font-bold">Nessun piano attivo. Tira il dado per iniziare il viaggio!</p>
                            )}
                         </div>

                         {(isHost || !isCloudMode) && (
                             <div className="flex gap-2 shrink-0 mb-2">
                                 <button onClick={rollPlanarDie} className="flex-1 bg-yellow-600 hover:bg-yellow-500 text-white font-black py-4 rounded-xl text-lg shadow-[0_0_15px_rgba(202,138,4,0.5)] transition-all flex flex-col items-center">
                                     <span className="text-2xl">🎲</span> DADO PLANARE
                                 </button>
                                 <button onClick={nextPlane} className="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-black py-4 rounded-xl text-lg shadow-[0_0_15px_rgba(79,70,229,0.5)] transition-all flex flex-col items-center">
                                     <span className="text-2xl">🌌</span> FORZA VIAGGIO
                                 </button>
                             </div>
                         )}
                   </div>
                )}
             </div>
          , document.body)}

          {planechase.enlargedImage && ReactDOM.createPortal(
             <div className="fixed inset-0 bg-black/95 z-[10000] flex items-center justify-center p-4 animate-fade" onClick={() => setPlanechase(prev => ({...prev, enlargedImage: null}))}>
                <img src={planechase.enlargedImage} className="max-w-[95vw] max-h-[95vh] object-contain rounded-xl shadow-2xl border border-gray-600" />
                <p className="absolute bottom-6 text-gray-400 font-bold text-sm bg-black/50 px-3 py-1 rounded-full">Tocca per chiudere</p>
             </div>
          , document.body)}
          
          {showDice && ReactDOM.createPortal(
             <div className="fixed inset-0 bg-black/80 z-[9999] flex items-center justify-center p-4 animate-fade" onClick={() => setShowDice(false)}>
                <div className="bg-gray-900 border border-purple-500 rounded-2xl p-6 shadow-2xl max-w-sm w-full" onClick={e => e.stopPropagation()}>
                   <h3 className="text-xl font-black text-white mb-4 text-center">🎲 Lancia Dado</h3>
                   <div className="grid grid-cols-2 gap-4">
                      <button onClick={() => rollDice(2)} className="bg-gray-800 hover:bg-gray-700 border border-gray-600 rounded-xl py-6 font-bold text-white shadow-lg active:scale-95 text-lg transition-all">🪙 Moneta (D2)</button>
                      <button onClick={() => rollDice(6)} className="bg-gray-800 hover:bg-gray-700 border border-gray-600 rounded-xl py-6 font-bold text-white shadow-lg active:scale-95 text-lg transition-all">🎲 Dado (D6)</button>
                      <button onClick={() => rollDice(20)} className="col-span-2 bg-purple-700 hover:bg-purple-600 border border-purple-500 rounded-xl py-6 font-black text-white shadow-[0_0_15px_rgba(168,85,247,0.5)] active:scale-95 text-2xl transition-all">✨ Dado Vita (D20)</button>
                   </div>
                   <button onClick={() => setShowDice(false)} className="w-full mt-4 bg-red-600 hover:bg-red-500 py-3 rounded-xl text-white font-bold transition-colors">Chiudi</button>
                </div>
             </div>
          , document.body)}
          
          {diceResult && ReactDOM.createPortal(
             <div className="fixed inset-0 z-[10000] flex items-center justify-center pointer-events-none animate-fade">
                <div className="bg-black/95 border-4 border-purple-500 w-48 h-48 rounded-full shadow-[0_0_60px_rgba(168,85,247,0.9)] flex flex-col items-center justify-center transform scale-150 animate-bounce">
                   <span className="text-purple-400 font-black text-lg uppercase tracking-widest absolute top-6">D{diceResult.max}</span>
                   <span className="text-white font-black text-7xl">{diceResult.val}</span>
                </div>
             </div>
          , document.body)}

          {planarDieResult && ReactDOM.createPortal(
             <div className="fixed inset-0 z-[10000] flex items-center justify-center pointer-events-none animate-fade bg-black/80">
                <div className="bg-gray-900 border-4 border-indigo-500 rounded-xl p-6 shadow-[0_0_60px_rgba(79,70,229,0.9)] flex flex-col items-center justify-center transform scale-110 animate-bounce max-w-sm text-center">
                   <span className="text-white font-black text-xl drop-shadow-md whitespace-pre-wrap leading-relaxed">{planarDieResult}</span>
                </div>
             </div>
          , document.body)}
        </div>
      );
    };
    
    const PlaytesterSandbox = ({view, setView, navigate}) => {
       const [decks, setDecks] = useState([]);
       const [selectedDeckId, setSelectedDeckId] = useState("");
       const [gameState, setGameState] = useState(null); 
       const [showCardModal, setShowCardModal] = useState(null);
       const [browsingZone, setBrowsingZone] = useState(null);

       useEffect(() => { setDecks(JSON.parse(localStorage.getItem('mtg_decks') || '[]')); }, []);

       const startPlaytest = () => {
          if(!selectedDeckId) return alert("Seleziona un mazzo!");
          const d = decks.find(x => x.id.toString() === selectedDeckId);
          if(!d) return;

          let initialLibrary = []; let initialCmdZone = [];
          
          d.cards.forEach(c => {
             if(c.isSideboard && !c.isCompanion) return; 
             if(c.isCommander || c.isCompanion) {
                initialCmdZone.push({...c, uid: Math.random()});
             } else {
                initialLibrary.push({...c, uid: Math.random()});
             }
          });

          for (let i = initialLibrary.length - 1; i > 0; i--) {
             const j = Math.floor(Math.random() * (i + 1));
             [initialLibrary[i], initialLibrary[j]] = [initialLibrary[j], initialLibrary[i]];
          }

          setGameState({
             deckName: d.name, isCommander: d.format === 'commander', mulliganCount: 0, turn: 1,
             library: initialLibrary, hand: [], battlefield: [], graveyard: [], exile: [], commandZone: initialCmdZone
          });

          setView('playtester_active');
          setTimeout(() => doDraw(7, initialLibrary, []), 100);
       };

       const doDraw = (amount, currentLib, currentHand) => {
          let newLib = [...currentLib]; let newHand = [...currentHand];
          for(let i=0; i<amount; i++) { if(newLib.length > 0) newHand.push(newLib.shift()); }
          setGameState(prev => ({...prev, library: newLib, hand: newHand}));
       };

       const drawOne = () => { if(!gameState || gameState.library.length === 0) return; doDraw(1, gameState.library, gameState.hand); };
       
       const passTurn = () => { if(!gameState) return; setGameState(prev => ({ ...prev, turn: prev.turn + 1 })); drawOne(); };

       const untapAll = () => { 
           if(!gameState) return; 
           setGameState(prev => ({ ...prev, battlefield: prev.battlefield.map(c => ({...c, isTapped: false})) })); 
       };

       const millCards = () => {
           if(!gameState || gameState.library.length === 0) return;
           const amount = parseInt(window.prompt("Quante carte vuoi millare?", "1"));
           if(isNaN(amount) || amount <= 0) return;
           
           setGameState(prev => {
              let newLib = [...prev.library];
              let newGrave = [...prev.graveyard];
              const actualAmount = Math.min(amount, newLib.length);
              for(let i=0; i<actualAmount; i++) { newGrave.push(newLib.shift()); }
              return { ...prev, library: newLib, graveyard: newGrave };
           });
       };

       const mulligan = () => {
          if(!gameState) return;
          let allCards = [...gameState.library, ...gameState.hand, ...gameState.battlefield, ...gameState.graveyard, ...gameState.exile];
          for (let i = allCards.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [allCards[i], allCards[j]] = [allCards[j], allCards[i]]; }
          let newMull = gameState.mulliganCount + 1;
          let cardsToBottom = gameState.isCommander ? (newMull > 1 ? newMull - 1 : 0) : newMull;

          setGameState(prev => ({ ...prev, mulliganCount: newMull, library: allCards, hand: [], battlefield: [], graveyard: [], exile: [] }));
          setTimeout(() => { doDraw(7, allCards, []); if(cardsToBottom > 0) alert(`Mulligan a 7 effettuato. Metti ${cardsToBottom} carte in fondo al mazzo!`); }, 100);
       };

       const shuffleLibrary = () => {
          if(!gameState) return;
          let lib = [...gameState.library];
          for (let i = lib.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [lib[i], lib[j]] = [lib[j], lib[i]]; }
          setGameState(prev => ({...prev, library: lib})); alert("Mazzo mischiato!");
       };

       const moveCard = (uid, sourceZone, destZone) => {
          if(!gameState) return; let cardToMove = null;
          let newSource = gameState[sourceZone].filter(c => { if(c.uid === uid) { cardToMove = c; return false; } return true; });
          if(!cardToMove) return; cardToMove.isTapped = false;
          let newGameState = { ...gameState, [sourceZone]: newSource };

          if(destZone === 'libraryBottom') {
             let lib = sourceZone === 'library' ? [...newSource] : [...gameState.library]; lib.push(cardToMove); newGameState.library = lib;
          } else if(destZone === 'libraryTop') {
             let lib = sourceZone === 'library' ? [...newSource] : [...gameState.library]; lib.unshift(cardToMove); newGameState.library = lib;
          } else {
             let newDest = sourceZone === destZone ? [...newSource] : [...gameState[destZone]]; newDest.push(cardToMove); newGameState[destZone] = newDest;
          }
          setGameState(newGameState); setShowCardModal(null); setBrowsingZone(null);
       };

       const toggleTap = (uid) => { if(!gameState) return; setGameState(prev => ({ ...prev, battlefield: prev.battlefield.map(c => c.uid === uid ? {...c, isTapped: !c.isTapped} : c) })); };

       if(view === 'playtester') {
          return (
             <div className="max-w-md mx-auto bg-gray-800/90 p-6 rounded-xl shadow-lg border border-gray-600 mt-4 backdrop-blur-sm space-y-6 animate-fade">
               <h2 className="text-3xl font-black text-center text-blue-400 drop-shadow-md">Tavolo Virtuale</h2>
               <p className="text-xs text-center text-gray-300 font-bold mb-4 bg-gray-900 p-2 rounded border border-gray-700">📱 Sandbox manuale per testare le aperture del mazzo.</p>
               {decks.length === 0 ? ( <p className="text-red-400 font-bold text-center">Nessun mazzo salvato.</p> ) : (
                  <div className="space-y-4">
                     <select value={selectedDeckId} onChange={e => setSelectedDeckId(e.target.value)} className="w-full bg-gray-900 border border-gray-600 rounded p-3 text-white font-bold outline-none">
                        <option value="">Seleziona un Mazzo...</option>{decks.map(d => <option key={d.id} value={d.id}>{d.name} ({d.format})</option>)}
                     </select>
                     <button onClick={startPlaytest} className="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-xl shadow-[0_0_15px_rgba(37,99,235,0.5)] transition-all">AVVIA SIMULATORE</button>
                  </div>
               )}
             </div>
          );
       }
       if(!gameState) return null;

       return (
          <div className="fixed inset-0 z-[200] bg-green-900 flex flex-col h-[100dvh] w-full animate-fade">
             {browsingZone && (
                <div className="fixed inset-0 bg-gray-900 z-[250] flex flex-col animate-fade pb-10">
                   <div className="flex justify-between items-center p-4 bg-gray-800 border-b border-gray-700 shadow-md">
                      <h2 className="text-xl font-bold text-white uppercase">{browsingZone === 'library' ? 'Mazzo' : (browsingZone === 'graveyard' ? 'Cimitero' : 'Esilio')} ({gameState[browsingZone].length})</h2>
                      <div className="flex gap-2">
                         {browsingZone === 'library' && ( <button onClick={shuffleLibrary} className="bg-blue-600 px-3 py-1 rounded text-white font-bold text-sm shadow">Mischia</button> )}
                         <button onClick={() => setBrowsingZone(null)} className="bg-red-600 px-3 py-1 rounded text-white font-bold shadow">Chiudi</button>
                      </div>
                   </div>
                   <div className="flex-1 overflow-y-auto p-4 grid grid-cols-3 sm:grid-cols-4 gap-3 content-start">
                      {gameState[browsingZone].map(c => ( <img key={c.uid} src={c.proxyImage || c.image || "mtg-bg.jpg"} onClick={() => setShowCardModal({card: c, zone: browsingZone})} className="w-full rounded shadow-lg cursor-pointer border border-gray-600 active:scale-95 transition-transform" /> ))}
                      {gameState[browsingZone].length === 0 && <p className="col-span-3 text-center text-gray-500 font-bold mt-10">Nessuna carta qui.</p>}
                   </div>
                </div>
             )}
             {showCardModal && (
                <div className="fixed inset-0 bg-black/90 z-[300] flex flex-col items-center justify-center p-4 animate-fade" onClick={() => setShowCardModal(null)}>
                   <div onClick={e => e.stopPropagation()} className="w-full max-w-sm flex flex-col items-center">
                      <img src={showCardModal.card.proxyImage || showCardModal.card.image || "mtg-bg.jpg"} className="w-auto h-[45vh] rounded-xl shadow-2xl mb-6 border border-gray-600" />
                      <div className="grid grid-cols-2 gap-2 w-full bg-gray-900 p-4 rounded-xl border border-gray-700">
                         {showCardModal.zone === 'hand' && ( <button onClick={() => moveCard(showCardModal.card.uid, 'hand', 'battlefield')} className="col-span-2 bg-green-600 text-white font-bold py-3 rounded shadow">👇 Gioca sul Campo</button> )}
                         {showCardModal.zone === 'commandZone' && ( <button onClick={() => moveCard(showCardModal.card.uid, 'commandZone', 'battlefield')} className="col-span-2 bg-yellow-600 text-white font-bold py-3 rounded shadow">👇 Lancia da Cmd Zone</button> )}
                         {showCardModal.zone === 'battlefield' && ( <button onClick={() => moveCard(showCardModal.card.uid, 'battlefield', 'hand')} className="col-span-2 bg-blue-600 text-white font-bold py-3 rounded shadow">👆 Riprendi in Mano</button> )}
                         {(showCardModal.zone === 'graveyard' || showCardModal.zone === 'exile' || showCardModal.zone === 'library') && (
                            <React.Fragment>
                               <button onClick={() => moveCard(showCardModal.card.uid, showCardModal.zone, 'hand')} className="bg-blue-600 text-white font-bold py-3 rounded text-sm shadow">🖐 Mano</button>
                               <button onClick={() => moveCard(showCardModal.card.uid, showCardModal.zone, 'battlefield')} className="bg-green-600 text-white font-bold py-3 rounded text-sm shadow">👇 Campo</button>
                            </React.Fragment>
                         )}
                         <button onClick={() => moveCard(showCardModal.card.uid, showCardModal.zone, 'graveyard')} className="bg-gray-600 text-white font-bold py-2 rounded text-xs">💀 Cimitero</button>
                         <button onClick={() => moveCard(showCardModal.card.uid, showCardModal.zone, 'exile')} className="bg-gray-400 text-black font-bold py-2 rounded text-xs">🌌 Esilio</button>
                         <button onClick={() => moveCard(showCardModal.card.uid, showCardModal.zone, 'libraryTop')} className="bg-indigo-700 text-white font-bold py-2 rounded text-xs">Cima Mazzo</button>
                         <button onClick={() => moveCard(showCardModal.card.uid, showCardModal.zone, 'libraryBottom')} className="bg-indigo-900 text-white font-bold py-2 rounded text-xs">Fondo Mazzo</button>
                         <button onClick={() => setShowCardModal(null)} className="col-span-2 bg-red-600 text-white font-bold py-2 rounded mt-2 shadow">❌ Annulla</button>
                      </div>
                   </div>
                </div>
             )}
             <div className="bg-black/80 text-white p-2 flex justify-between items-center border-b border-green-700 shadow-md h-[10dvh]">
                <button onClick={() => setView('playtester')} className="bg-red-600 px-3 py-1 rounded font-bold text-xs shadow">Esci</button>
                <div className="text-center"><h3 className="font-black text-sm uppercase text-yellow-500">Turno {gameState.turn}</h3></div>
                <div className="flex gap-1 overflow-x-auto">
                    <button onClick={untapAll} className="bg-emerald-600 px-2 py-1 rounded font-bold text-[10px] shadow whitespace-nowrap">Stappa</button>
                    <button onClick={mulligan} className="bg-orange-600 px-2 py-1 rounded font-bold text-[10px] shadow whitespace-nowrap">Mulligan</button>
                    <button onClick={passTurn} className="bg-blue-600 px-2 py-1 rounded font-bold text-[10px] shadow whitespace-nowrap">Passa</button>
                </div>
             </div>
             <div className="bg-black/50 p-2 flex justify-between items-center h-[12dvh] overflow-x-auto gap-2">
                <div className="flex gap-2 border-r border-green-800 pr-2 h-full items-center">
                   {gameState.commandZone.map(c => ( <img key={c.uid} src={c.proxyImage || c.image || "mtg-bg.jpg"} onClick={() => setShowCardModal({card: c, zone: 'commandZone'})} className="h-full rounded border border-yellow-500 shadow-lg cursor-pointer" /> ))}
                </div>
                <div className="flex gap-2 pl-1 overflow-x-auto h-full items-center">
                   <button onClick={drawOne} className="h-full bg-indigo-900/80 rounded border border-indigo-500 flex items-center justify-center px-3 font-black shadow shrink-0">PESCA</button>
                   <button onClick={millCards} className="h-full bg-purple-900/80 rounded border border-purple-500 flex items-center justify-center px-2 font-bold text-xs text-purple-200 shadow shrink-0">MILLA</button>

                {gameState.battlefield.length === 0 && <div className="absolute inset-0 flex items-center justify-center text-green-700/50 font-black text-2xl uppercase pointer-events-none">Tavolo di Gioco</div>}
                <div className="flex flex-wrap gap-3 content-start">

                      <div key={c.uid} className="relative w-20 sm:w-24">

                         <button onClick={(e) => { e.stopPropagation(); setShowCardModal({card: c, zone: 'battlefield'}) }} className="absolute -top-2 -right-2 bg-black/80 text-white rounded-full w-6 h-6 flex items-center justify-center text-[10px] font-bold border border-gray-500 shadow">⚙️</button>
