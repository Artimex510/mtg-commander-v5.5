                {gameState.hand.map((c, i) => ( <img key={c.uid} src={c.proxyImage || c.image || "mtg-bg.jpg"} onClick={() => setShowCardModal({card: c, zone: 'hand'})} className="h-full rounded-lg shadow-xl cursor-pointer hover:-translate-y-4 hover:z-20 transition-all border border-gray-700" style={{ marginLeft: i === 0 ? '0' : '-30px', transformOrigin: 'bottom center' }} /> ))}
             </div>
          </div>
       );
    };

    const DiceRoller = () => {
      const [numPlayers, setNumPlayers] = useState(4);
      const [results, setResults] = useState([]);
      const [winnerMessage, setWinnerMessage] = useState("");

      const rollDice = () => {
        let rolls = []; let max = 0;
        for(let i=1; i<=numPlayers; i++) { const roll = Math.floor(Math.random() * 20) + 1; rolls.push({ player: `Player ${i}`, roll: roll }); if(roll > max) max = roll; }
        setResults(rolls);
        const winners = rolls.filter(r => r.roll === max);
        if(winners.length === 1) setWinnerMessage(`🎉 Inizia: ${winners[0].player}!`); else setWinnerMessage(`Pareggio tra: ${winners.map(w=>w.player).join(', ')}. Ritirate!`);
      };

      return (
        <div className="max-w-md mx-auto bg-gray-800/90 p-6 rounded-xl border border-gray-600 mt-10 backdrop-blur-sm shadow-xl">
          <h2 className="text-3xl font-black mb-6 text-center text-purple-500 drop-shadow-md">Tira il Dado (D20)</h2>
          <label className="block text-gray-300 font-bold mb-2">Numero Giocatori</label>
          <input type="number" min="2" max="6" value={numPlayers} onChange={e => setNumPlayers(parseInt(e.target.value))} className="w-full bg-gray-900 border border-gray-600 rounded p-3 text-white text-center mb-6 font-bold text-xl outline-none" />
          <button onClick={rollDice} className="w-full bg-purple-600 hover:bg-purple-500 text-white font-black py-4 rounded-xl text-xl mb-6 shadow-[0_0_15px_rgba(147,51,234,0.5)] transition-all">TIRA IL DADO</button>
          {results.length > 0 && (
            <div className="space-y-2 animate-fade">
              {results.map((r, i) => (
                <div key={i} className="flex justify-between p-3 bg-gray-900 rounded border border-gray-700 shadow-inner">
                  <span className="font-bold text-gray-300 text-lg">{r.player}</span><span className={`font-black text-xl ${r.roll === 20 ? 'text-green-400' : (r.roll === 1 ? 'text-red-400' : 'text-white')}`}>{r.roll}</span>
                </div>
              ))}
              <div className="mt-4 p-4 bg-green-900/40 border border-green-500 rounded-lg text-center font-bold text-green-400 text-lg shadow-md">{winnerMessage}</div>
            </div>
          )}
        </div>
      );
    };

            <div className="border-t border-gray-700 pt-6 space-y-3">
               <a href="https://magic.wizards.com/en/rules" target="_blank" rel="noopener noreferrer" className="block w-full bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 rounded-lg shadow border border-gray-600 transition-colors">📖 PDF Regole Ufficiali</a>
               <a href="https://chat.magicjudges.org/mtgrules/" target="_blank" rel="noopener noreferrer" className="block w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg shadow border border-blue-500 transition-colors">💬 Chat Live Judge DCI (24/7)</a>

    const PlayOnlineView = ({navigate}) => {

           setDecks(JSON.parse(localStorage.getItem('mtg_decks') || '[]'));

          navigator.clipboard.writeText(listText);

    const TavernaChat = ({ navigate }) => {
        const user = auth.currentUser;
        const [messages, setMessages] = useState([]);
        const [newMessage, setNewMessage] = useState("");
        const [currentRoom, setCurrentRoom] = useState("global");
        const [roomInput, setRoomInput] = useState("");
        
        const [nickname, setNickname] = useState(localStorage.getItem('chat_nickname') || "");
        const messagesEndRef = useRef(null);

        useEffect(() => {
            if (user && !nickname) {
                const defaultName = user.displayName || (user.email ? user.email.split('@')[0] : "Planeswalker");
                setNickname(defaultName);
            }
        }, [user, nickname]);

        useEffect(() => {
            if (!user) return;
            const collectionPath = currentRoom === 'global' ? db.collection('global_chat') : db.collection('chat_rooms').doc(currentRoom).collection('messages');

            if (currentRoom === 'global') {
                const dueGiorniFa = Date.now() - (48 * 60 * 60 * 1000);
                try {
                    collectionPath.where('timestamp', '<', dueGiorniFa).get().then(snap => {
                        snap.forEach(doc => doc.ref.delete());
                    });
                } catch(e) { console.log("Pulizia saltata"); }
            }

            const unsubscribe = collectionPath
                .orderBy('timestamp', 'desc')
                .limit(50)
                .onSnapshot(snapshot => {
                    const msgs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).reverse();
                    setMessages(msgs);
                    setTimeout(() => { if (messagesEndRef.current) messagesEndRef.current.scrollIntoView({ behavior: "smooth" }); }, 100);
                });

            return () => unsubscribe();
        }, [user, currentRoom]);

        const changeNickname = () => {
            const newNick = window.prompt("Inserisci il tuo nuovo Nickname per la Taverna:", nickname);
            if (newNick && newNick.trim() !== "") {
                const finalNick = newNick.trim();
                setNickname(finalNick);
                localStorage.setItem('chat_nickname', finalNick);
            }
        };

        const sendMessage = async (e) => {
            e.preventDefault();
            if (!newMessage.trim() || !user) return;
            const text = newMessage.trim();
            setNewMessage(""); 
            
            try {
                const collectionPath = currentRoom === 'global' ? db.collection('global_chat') : db.collection('chat_rooms').doc(currentRoom).collection('messages');
                await collectionPath.add({
                    type: 'text',
                    text: text,
                    uid: user.uid,
                    author: nickname,
                    timestamp: Date.now()
                });
            } catch (err) { alert("Errore nell'invio."); }
        };

        const inviteUser = async (targetUid, targetName) => {
            if (targetUid === user.uid) return;
            const confirm = window.confirm(`Vuoi invitare ${targetName} in una stanza privata per uno scambio?`);
            if (!confirm) return;

            const secretRoom = `TRADE-${Math.random().toString(36).substring(2, 8).toUpperCase()}`;

            try {
                await db.collection('global_chat').add({
                    type: 'invite',
                    roomCode: secretRoom,
                    uid: user.uid,
                    author: nickname, 
                    targetUid: targetUid,
                    targetName: targetName,
                    timestamp: Date.now()
                });
                setCurrentRoom(secretRoom);
            } catch (err) { alert("Errore nell'invito."); }
        };

        const joinPrivateRoom = (e) => {
            e.preventDefault();
            if(!roomInput.trim()) return;
            setCurrentRoom(roomInput.trim().toUpperCase());
            setRoomInput("");
        };

        const sendPayPalLink = async () => {
            let pp = localStorage.getItem('my_paypal_link');
            if(!pp) {
                pp = window.prompt("Inserisci il tuo link PayPal (es. https://paypal.me/tuonome).\nVerrà salvato sul tuo dispositivo.");
                if(!pp) return;
                localStorage.setItem('my_paypal_link', pp);
            }
            await db.collection('chat_rooms').doc(currentRoom).collection('messages').add({
                type: 'text',
                text: `💸 Ciao! Ecco il mio link per il pagamento sicuro: ${pp}`,
                uid: user.uid,
                author: nickname, 
                timestamp: Date.now()
            });
        };

        const openShippingService = () => {
            alert("Verrai reindirizzato a Packlink.it per confrontare i corrieri.");
            window.open('https://www.packlink.it/', '_blank');
        };

        const renderMessageText = (text) => {
            if (!text) return ""; 
            const parts = text.split(/\[\[(.*?)\]\]/g);
            return parts.map((part, i) => {
                if (i % 2 === 1) { 
                    return (
                        <span key={i} className="block mt-2 mb-1">
                            <img src={`https://api.scryfall.com/cards/named?fuzzy=${encodeURIComponent(part)}&format=image`} alt={part} onError={(e) => { e.target.style.display = 'none'; e.target.insertAdjacentHTML('afterend', `<span class="text-red-400 font-bold italic">[Carta non trovata: ${part}]</span>`); }} className="w-48 max-w-full rounded-xl shadow-lg border-2 border-gray-500" />
                        </span>
                    );
                } else {
                    const urlRegex = /(https?:\/\/[^\s]+)/g;
                    const textParts = part.split(urlRegex);
                    return textParts.map((t, j) => {
                        if (t.match(urlRegex)) return <a key={j} href={t} target="_blank" rel="noopener noreferrer" className="text-blue-300 font-bold underline hover:text-blue-200">{t}</a>;
                        return <span key={j}>{t}</span>;
                    });
                }
            });
        };

        if (!user) return (
            <div className="flex flex-col items-center justify-center mt-20 p-6 bg-gray-800/90 rounded-xl border border-gray-600 shadow-xl max-w-md mx-auto text-center animate-fade">
                <span className="text-6xl mb-4">🍻</span>
                <h2 className="text-2xl font-black text-white mb-2">La Taverna MTG</h2>
                <button onClick={()=>navigate('backup')} className="w-full mt-4 bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-xl shadow-lg">VAI AL LOGIN</button>
            </div>
        );

        return (
            <div className="flex flex-col h-[calc(100vh-100px)] max-w-2xl mx-auto bg-gray-900 rounded-xl border border-gray-700 mt-2 overflow-hidden shadow-2xl animate-fade relative z-10">
                
                <div className="bg-gray-800 p-4 border-b border-gray-700 shadow-md z-20">
                    <div className="flex justify-between items-center mb-2">
                        {currentRoom === 'global' ? (
                            <h2 className="text-2xl font-black text-emerald-400 drop-shadow-md">🍻 Taverna Globale</h2>
                        ) : (
                            <div className="flex items-center gap-2 w-full">
                                <button onClick={() => setCurrentRoom('global')} className="bg-gray-700 hover:bg-gray-600 text-white px-3 py-1 rounded shadow text-sm font-bold">⬅ Esci</button>
                                <h2 className="text-lg font-black text-yellow-500 truncate">Stanza: {currentRoom}</h2>
                            </div>
                        )}
                        
                        <button onClick={changeNickname} className="ml-2 bg-gray-700 hover:bg-emerald-600 text-white px-3 py-1 rounded-full shadow text-[10px] font-bold border border-gray-500 truncate max-w-[120px] transition-colors" title="Cambia Nickname">
                            👤 {nickname}
                        </button>
                    </div>

                    {currentRoom === 'global' && (
                        <form onSubmit={joinPrivateRoom} className="flex gap-2 mt-2">
                            <input type="text" value={roomInput} onChange={e=>setRoomInput(e.target.value)} placeholder="Inventa un codice (es. SCAMBIO1)..." className="flex-1 bg-gray-900 border border-gray-600 rounded px-3 py-2 text-white font-bold text-sm outline-none focus:border-yellow-500" />
                            <button type="submit" disabled={!roomInput.trim()} className="bg-yellow-600 hover:bg-yellow-500 disabled:opacity-50 text-white font-bold px-4 rounded shadow transition-colors text-sm">Entra</button>
                        </form>
                    )}

                    {currentRoom !== 'global' && (
                        <div className="flex gap-2 mt-3 pt-3 border-t border-gray-700">
                            <button onClick={sendPayPalLink} className="flex-1 bg-[#003087] hover:bg-[#001c52] text-white font-black py-2 rounded shadow text-xs flex items-center justify-center border border-[#0079C1]">💸 Invia PayPal</button>
                            <button onClick={openShippingService} className="flex-1 bg-orange-600 hover:bg-orange-500 text-white font-black py-2 rounded shadow text-xs flex items-center justify-center">📦 Spedizioni</button>
                        </div>
                    )}
                </div>

                <div className="flex-1 overflow-y-auto p-4 space-y-4 flex flex-col bg-black/40 shadow-[inset_0_0_20px_rgba(0,0,0,0.5)]">
                    {messages.length === 0 && <p className="text-center text-gray-500 font-bold mt-10">Nessun messaggio.</p>}
                    
                    {messages.map(m => {
                        if (m.type === 'invite') {
                            if (m.uid !== user.uid && m.targetUid !== user.uid) return null;

                            return (
                                <div key={m.id} className="flex flex-col w-full items-center my-4 animate-fade">
                                    <div className="bg-yellow-900/90 border border-yellow-500 p-4 rounded-xl text-center w-full max-w-[90%] shadow-[0_0_15px_rgba(234,179,8,0.3)]">
                                        <span className="text-3xl block mb-2">📨</span>
                                        <p className="text-white font-bold text-sm">
                                            {m.uid === user.uid ? `Hai invitato ${m.targetName} in privato.` : `${m.author} ti ha invitato in una stanza privata!`}
                                        </p>
                                        <button onClick={() => setCurrentRoom(m.roomCode)} className="mt-3 bg-yellow-500 hover:bg-yellow-400 text-black font-black py-2 px-6 rounded-lg shadow-lg active:scale-95 transition-all">
                                            ENTRA NELLA STANZA
                                        </button>
                                    </div>
                                </div>
                            );
                        }

                        const isMe = m.uid === user.uid;
                        return (
                            <div key={m.id} className={`flex flex-col max-w-[85%] ${isMe ? 'self-end items-end' : 'self-start items-start'} animate-fade`}>
                                <span 
                                    onClick={() => (currentRoom === 'global' && !isMe) ? inviteUser(m.uid, m.author) : null}
                                    className={`text-[10px] text-gray-400 font-bold mb-1 ml-1 ${currentRoom === 'global' && !isMe ? 'cursor-pointer hover:text-yellow-400 hover:underline' : ''}`}
                                    title={currentRoom === 'global' && !isMe ? `Clicca per invitare ${m.author} in privato` : ""}
                                >
                                    {m.author || 'Anonimo'}
                                </span>
                                
                                <div className={`p-3 rounded-2xl shadow-lg font-semibold text-sm ${isMe ? 'bg-emerald-700 text-white rounded-tr-none' : 'bg-gray-800 border border-gray-700 text-gray-100 rounded-tl-none'}`}>
                                    {renderMessageText(m.text)}
                                </div>
                            </div>
                        );
                    })}
                    <div ref={messagesEndRef} />
                </div>

                <div className="bg-gray-900 border-t border-gray-700 p-2 px-4 text-center">
                    <p className="text-[10px] text-gray-400 font-bold uppercase tracking-wide">
                        ⚠️ Info Chat: Scrivi le carte tra parentesi (es. <span className="text-emerald-400">[[Sol Ring]]</span>). <br/>
                        <span className="text-yellow-400">💡 NOVITÀ: Clicca sul nome di un utente per invitarlo in privato!</span>
                    </p>
                </div>

                <form onSubmit={sendMessage} className="p-3 bg-gray-800 border-t border-gray-700 flex gap-2 z-20">
                    <input type="text" value={newMessage} onChange={e=>setNewMessage(e.target.value)} placeholder="Scrivi messaggio o [[Carta]]..." className="flex-1 bg-gray-900 border border-gray-600 rounded-full px-5 text-white font-bold outline-none focus:border-emerald-500 shadow-inner" />
                    <button type="submit" disabled={!newMessage.trim()} className="bg-emerald-600 hover:bg-emerald-500 disabled:bg-gray-600 disabled:opacity-50 w-12 h-12 rounded-full flex items-center justify-center text-white font-black shadow-lg transition-all active:scale-95">➤</button>
                </form>
            </div>
        );
    }

    const ProTools = ({ navigate }) => {
        const [targetCard, setTargetCard] = useState("");
        const [budgetResults, setBudgetResults] = useState([]);
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState("");
        
        // STATO PER LA LISTA INCOLLATA MANUALMENTE
        const [manualDeckList, setManualDeckList] = useState("");

        const findCombosManual = () => {
            if (!manualDeckList.trim()) {
                alert("Incolla una lista di carte nel riquadro prima di cercare le combo!");
                return;
            }
            navigator.clipboard.writeText(manualDeckList).then(() => {
                alert("🪄 Lista copiata negli appunti!\n\nTi sto portando su Commander Spellbook. Fai 'Incolla' nel loro box di ricerca per scoprire se in questa lista ci sono combo infinite.");
                window.open('https://commanderspellbook.com/find-my-combos/', '_blank');
            }).catch(err => alert("Errore nel copiare la lista. Riprova."));
        };

        const findCheapAlternatives = async (e) => {
            e.preventDefault();
            if (!targetCard.trim()) return;
            setLoading(true);
            setError("");
            setBudgetResults([]);

            try {
                const res = await fetch(`https://api.scryfall.com/cards/named?fuzzy=${encodeURIComponent(targetCard)}`);
                if (!res.ok) throw new Error("Carta non trovata. Scrivi il nome in inglese correttamente.");
                const cardData = await res.json();

                const typeLine = cardData.type_line || "";
                let typeQuery = "";
                if (typeLine.includes("Creature")) typeQuery = "t:creature";
                else if (typeLine.includes("Enchantment")) typeQuery = "t:enchantment";
                else if (typeLine.includes("Artifact")) typeQuery = "t:artifact";
                else if (typeLine.includes("Instant")) typeQuery = "t:instant";
                else if (typeLine.includes("Sorcery")) typeQuery = "t:sorcery";
                else if (typeLine.includes("Planeswalker")) typeQuery = "t:planeswalker";
                else typeQuery = "t:land";

                const colorQuery = cardData.colors && cardData.colors.length > 0 ? `c<=${cardData.colors.join('')}` : "c:c";

                const searchQ = `${typeQuery} ${colorQuery} eur<3 -name:"${cardData.name}" sort:edhrec`;
                const altRes = await fetch(`https://api.scryfall.com/cards/search?q=${encodeURIComponent(searchQ)}`);
                if (!altRes.ok) throw new Error("Nessuna alternativa economica trovata per questi parametri.");
                const altData = await altRes.json();
                
                setBudgetResults(altData.data.slice(0, 5));
            } catch (err) {
                setError(err.message);
            }
            setLoading(false);
        };

        return (
            <div className="flex flex-col h-[calc(100vh-100px)] max-w-2xl mx-auto bg-gray-900 rounded-xl border border-gray-700 mt-2 overflow-y-auto shadow-2xl animate-fade relative z-10 p-4 space-y-8">
                
                <div className="text-center border-b border-gray-700 pb-4">
                    <h2 className="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-emerald-500 drop-shadow-md">🛠️ Strumenti Pro</h2>
                    <p className="text-gray-400 text-sm font-bold mt-1">Sblocca il vero potenziale del tuo deckbuilding.</p>
                </div>

                {/* SEZIONE 1: COMBO FINDER MANUALE */}
                <div className="bg-gray-800 rounded-xl p-5 border border-gray-600 shadow-lg">
                    <div className="flex items-center gap-3 mb-3">
                        <span className="text-3xl">♾️</span>
                        <h3 className="text-xl font-black text-white">Combo Checker Universale</h3>
                    </div>
                    <p className="text-gray-300 text-sm font-semibold mb-4">Incolla qui una lista presa da Moxfield, Deckstats o mandata da un amico. Scopri subito se contiene combo infinite.</p>
                    
                    <textarea 
                        className="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white text-sm outline-none focus:border-purple-500 shadow-inner mb-4 resize-none h-32"
                        placeholder="Incolla qui la lista delle carte..."
                        value={manualDeckList}
                        onChange={(e) => setManualDeckList(e.target.value)}
                    />
                    
                    <button onClick={findCombosManual} disabled={!manualDeckList.trim()} className="w-full bg-purple-700 hover:bg-purple-600 disabled:opacity-50 text-white font-black py-3 rounded-lg shadow-lg flex items-center justify-center gap-2 transition-all">
                        🔍 ANALIZZA LISTA INCOLLATA
                    </button>
                </div>

                {/* SEZIONE 2: BUDGETIZZATORE */}
                <div className="bg-gray-800 rounded-xl p-5 border border-gray-600 shadow-lg mb-10">
                    <div className="flex items-center gap-3 mb-3">
                        <span className="text-3xl">📉</span>
                        <h3 className="text-xl font-black text-white">Il Budgetizzatore</h3>
                    </div>
                    <p className="text-gray-300 text-sm font-semibold mb-4">Una carta costa troppo? Scrivi il nome qui sotto. L'app cercherà le 5 alternative più usate in Commander con lo stesso colore e tipo che costano <span className="text-yellow-400">&lt; 3€</span>.</p>
                    
                    <form onSubmit={findCheapAlternatives} className="flex flex-col gap-3">
                        <input 
                            type="text" 
                            value={targetCard} 
                            onChange={e=>setTargetCard(e.target.value)} 
                            placeholder="es. Rhystic Study, Smothering Tithe..." 
                            className="w-full bg-gray-900 border border-gray-600 rounded px-4 py-3 text-white font-bold outline-none focus:border-yellow-500 shadow-inner" 
                        />
                        <button type="submit" disabled={!targetCard.trim() || loading} className="w-full bg-yellow-600 hover:bg-yellow-500 disabled:opacity-50 text-white font-black py-3 rounded-lg shadow-lg transition-all">
                            {loading ? "RICERCA IN CORSO..." : "TROVA ALTERNATIVE ECONOMICHE"}
                        </button>
                    </form>

                    {error && <p className="text-red-400 font-bold text-sm mt-4 text-center">{error}</p>}

                    {budgetResults.length > 0 && (
                        <div className="mt-6 space-y-3">
                            <h4 className="text-emerald-400 font-black mb-2 border-b border-gray-700 pb-2">Risultati Suggeriti:</h4>
                            {budgetResults.map(card => (
                                <div key={card.id} className="bg-gray-900 p-3 rounded-lg border border-gray-600 flex justify-between items-center group">
                                    <div 
                                        className="flex-1 cursor-pointer" 
                                        onClick={() => {
                                            navigator.clipboard.writeText(card.name);
                                            alert(`"${card.name}" copiato negli appunti! Ora puoi incollarlo nel Deckbuilder.`);
                                        }} 
                                        title="Clicca per copiare il nome"
                                    >
                                        <p className="text-white font-bold group-hover:text-yellow-400 transition-colors flex items-center gap-2">
                                            {card.name} <span className="text-[12px]">📋</span>
                                        </p>
                                        <p className="text-xs text-gray-400">{card.type_line}</p>
                                    </div>
                                    <div className="text-right pl-2">
                                        <span className="bg-emerald-800 text-emerald-200 px-2 py-1 rounded font-black shadow whitespace-nowrap">
                                            {card.prices && card.prices.eur ? `€${card.prices.eur}` : 'N/D'}
                                        </span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            </div>
        );
    }
    
    const CardSearchExplorer = ({navigate, printQueue, setPrintQueue, collection, setCollection, mtgSets}) => {
      const [query, setQuery] = useState("");
      const [oracleText, setOracleText] = useState("");
      const [mana, setMana] = useState([]);
      const [colorMatchType, setColorMatchType] = useState('include'); 
      const [isMulticolorOnly, setIsMulticolorOnly] = useState(false);
      const [isCommanderOnly, setIsCommanderOnly] = useState(false);

      const [superType, setSuperType] = useState(""); const [cardType, setCardType] = useState("");
      const [cardType2, setCardType2] = useState(""); const [subType, setSubType] = useState("");
      const [rarity, setRarity] = useState(""); const [cmcOp, setCmcOp] = useState("="); const [cmcVal, setCmcVal] = useState("");
      const [expFilter, setExpFilter] = useState(""); 
      
      const [allResults, setAllResults] = useState([]);
      const [localPage, setLocalPage] = useState(0);
      const [nextScryfallUrl, setNextScryfallUrl] = useState(null);
      const [loading, setLoading] = useState(false);
      
      const [isScanning, setIsScanning] = useState(false);
      const [scanProgress, setScanProgress] = useState("");

      const [viewingCard, setViewingCard] = useState(null);
      const [itaImg, setItaImg] = useState(null); const [itaImgBack, setItaImgBack] = useState(null);
      const [showIta, setShowIta] = useState(false); const [showBack, setShowBack] = useState(false);
      const [translating, setTranslating] = useState(false);
      const [printsList, setPrintsList] = useState([]); const [loadingPrints, setLoadingPrints] = useState(false);
      const [savedScroll, setSavedScroll] = useState(0);

      const ManaColors = [ { id: 'W', color: 'bg-yellow-100 text-yellow-900', label: 'W' }, { id: 'U', color: 'bg-blue-500 text-white', label: 'U' }, { id: 'B', color: 'bg-gray-800 text-white', label: 'B' }, { id: 'R', color: 'bg-red-500 text-white', label: 'R' }, { id: 'G', color: 'bg-green-500 text-white', label: 'G' }, { id: 'C', color: 'bg-gray-400 text-gray-900', label: 'C' } ];

      const toggleMana = (m) => setMana(mana.includes(m) ? mana.filter(x => x !== m) : [...mana, m]);

      const eseguiRicerca = (url, isNewSearch = false) => {
        setLoading(true);
        fetch(url).then(res => res.json()).then(data => {
            if (data.data && Array.isArray(data.data)) {
               const cards = data.data.filter(c => c.image_uris || (c.card_faces && c.card_faces.length > 0 && c.card_faces[0].image_uris)).map(c => {
                 let img = ""; let imgBack = null; let oracle_text = c.oracle_text || ""; let mana_cost = c.mana_cost || "";
                 if (c.image_uris && c.image_uris.normal) { img = c.image_uris.normal; } 
                 else if (c.card_faces && c.card_faces.length > 0) {
                     if (c.card_faces[0].image_uris && c.card_faces[0].image_uris.normal) img = c.card_faces[0].image_uris.normal;
                     if (c.card_faces.length > 1 && c.card_faces[1].image_uris && c.card_faces[1].image_uris.normal) imgBack = c.card_faces[1].image_uris.normal;
                     if (!oracle_text) oracle_text = c.card_faces.map(f=>f.oracle_text).join(' ');
                         if (!mana_cost) mana_cost = c.card_faces[0].mana_cost;
                     }
                     return { 
                         id: c.id, name: c.name, image: img, imageBack: imgBack, type: c.type_line || "", 
                         cmc: c.cmc || 0, colors: c.color_identity || [], legalities: c.legalities || {}, 
                         printsUrl: c.prints_search_uri || null, oracle_text: oracle_text, mana_cost: mana_cost, 
                         prices: c.prices || {}, rarity: c.rarity || "common", setCode: c.set || "", setName: c.set_name || "",
                         collector_number: c.collector_number || "" 
                     };
                   });
               if(isNewSearch) { setAllResults(cards); setLocalPage(0); } else { setAllResults(prev => [...prev, ...cards]); }
               setNextScryfallUrl(data.has_more ? data.next_page : null);
            } else { if(isNewSearch) { setAllResults([]); alert("Nessuna carta trovata."); } }
            setLoading(false);
          }).catch(e => { console.error("Rete", e); setLoading(false); });
      };

      const searchCard = (forceQuery = null) => {
        const q = forceQuery !== null ? forceQuery : query;
        let searchQuery = q ? `${q} ` : "";
        if (oracleText) searchQuery += `o:"${oracleText}" `; if (rarity) searchQuery += `r:${rarity} `;
        if (expFilter) searchQuery += `e:${expFilter} `; 
        if (mana.length > 0) {
           let mStr = mana.join('');
           if (colorMatchType === 'exact') searchQuery += cardType === 'land' ? `id=${mStr} ` : `c=${mStr} `; else searchQuery += cardType === 'land' ? `id>=${mStr} ` : `c>=${mStr} `;
        }
        if (isMulticolorOnly) searchQuery += `c>1 `; if (isCommanderOnly) searchQuery += `is:commander `;
        if (superType) searchQuery += `t:${superType} `; if (cardType) searchQuery += `t:${cardType} `; if (cardType2) searchQuery += `t:${cardType2} `;
        if (subType) searchQuery += `t:${subType} `; if (cmcVal !== "") searchQuery += `cmc${cmcOp}${cmcVal} `;
        if(!searchQuery.trim()) return alert("Inserisci almeno un parametro di ricerca!");
        eseguiRicerca(`https://api.scryfall.com/cards/search?q=${encodeURIComponent(searchQuery.trim())}`, true);
      };

      const handleGeminiScan = (e) => {
          const fileInput = e.target; 
          const file = fileInput.files[0];
          if (!file) return;
          let apiKey = localStorage.getItem('gemini_api_key');
          if (!apiKey) {
              apiKey = window.prompt("Per usare lo Scanner IA serve una API Key gratuita.\n\nPuoi ottenerla in 1 minuto su: https://aistudio.google.com/\n\nIncolla qui la tua API Key (verrà salvata in modo sicuro solo su questo dispositivo):");
              if (!apiKey) return;
              localStorage.setItem('gemini_api_key', apiKey);
          }

          setIsScanning(true);
          setScanProgress("IA in elaborazione...");
          const reader = new FileReader();
          
          reader.onloadend = async () => {
              const base64data = reader.result.split(',')[1];
              try {
                  const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({
                          contents: [{
                              parts: [
                                  { text: "Sei un esperto di Magic: The Gathering. Guarda questa carta. Rispondi SOLO ed ESCLUSIVAMENTE con il nome esatto della carta in INGLESE. Non aggiungere punteggiatura, spiegazioni o altro testo." },
                                  { inline_data: { mime_type: file.type, data: base64data } }
                              ]
                          }]
                      })
                  });

                  const data = await response.json();
                  if (data.error) throw new Error(data.error.message);
                  
                  const cardName = data.candidates[0].content.parts[0].text.trim();
                  setQuery(cardName);
                  searchCard(cardName);
                  
              } catch (err) {
                  console.error("Errore Gemini:", err);
                  alert("Errore durante la scansione. Controlla la API Key o riprova.");
              } finally {
                  setIsScanning(false);
                  setScanProgress("");
                  fileInput.value = ''; 
              }
          };
          reader.readAsDataURL(file);
      };
      
      const maxLocalPages = allResults.length > 0 ? Math.ceil(allResults.length / 15) : 0;
      const currentResults = allResults.length > 0 ? allResults.slice(localPage * 15, (localPage + 1) * 15) : [];
      const goToNextPage = () => { if (localPage + 1 < maxLocalPages) { setLocalPage(localPage + 1); } else if (nextScryfallUrl) { eseguiRicerca(nextScryfallUrl, false); setLocalPage(localPage + 1); } };
      const goToPrevPage = () => { if (localPage > 0) setLocalPage(localPage - 1); };

      const openViewer = (c) => { setSavedScroll(window.scrollY); setItaImg(null); setItaImgBack(null); setShowIta(false); setShowBack(false); setPrintsList([]); setViewingCard(c); window.scrollTo(0,0); };
      const closeViewer = () => { setViewingCard(null); setTimeout(() => window.scrollTo(0, savedScroll), 10); };

      const fetchOtherPrints = (card) => {
          if(!card.printsUrl) return alert("Nessun'altra stampa disponibile.");
          setLoadingPrints(true);
          fetch(card.printsUrl).then(res => res.json()).then(data => {
                if(data.data && data.data.length > 0) {
                    const mapped = data.data.filter(c => c.image_uris || (c.card_faces && c.card_faces.length > 0 && c.card_faces[0].image_uris)).map(c => {
                         let iImg = ""; let iImgBack = null;
                         if (c.image_uris && c.image_uris.normal) iImg = c.image_uris.normal;
                         else if (c.card_faces && c.card_faces.length > 0) {
                             if (c.card_faces[0].image_uris && c.card_faces[0].image_uris.normal) iImg = c.card_faces[0].image_uris.normal;
                             if (c.card_faces.length > 1 && c.card_faces[1].image_uris && c.card_faces[1].image_uris.normal) iImgBack = c.card_faces[1].image_uris.normal;
                         }
                         return { ...card, id: c.id, image: iImg, imageBack: iImgBack, rarity: c.rarity || "common", setCode: c.set || "", setName: c.set_name || "", collector_number: c.collector_number || "", prices: c.prices || {} };
                        });
                        setPrintsList(mapped);
                }
                setLoadingPrints(false);
            }).catch(e => { console.error(e); setLoadingPrints(false); });
      };

      const translateCard = (card) => {
        if (itaImg) { setShowIta(!showIta); return; } 
        setTranslating(true);
        fetch(`https://api.scryfall.com/cards/search?q=!"${card.name}"+lang:it`).then(res => res.json()).then(data => {
             if (data.data && data.data.length > 0) {
                 const itCard = data.data[0]; let iImg = null; let iImgBack = null;
                 if (itCard.image_uris && itCard.image_uris.normal) { iImg = itCard.image_uris.normal; } 
                 else if (itCard.card_faces && itCard.card_faces.length > 0) {
                     if (itCard.card_faces[0].image_uris) iImg = itCard.card_faces[0].image_uris.normal;
                     if (itCard.card_faces.length > 1 && itCard.card_faces[1].image_uris) iImgBack = itCard.card_faces[1].image_uris.normal;
                 }
                 if (iImg) { setItaImg(iImg); setItaImgBack(iImgBack); setShowIta(true); } else alert("Immagine italiana non trovata.");
             } else { alert("Traduzione ufficiale italiana non stampata."); }
             setTranslating(false);
          }).catch(e => { setTranslating(false); });
      };

      const formatEdhrec = (name) => name.toLowerCase().replace(/[^a-z0-9\s-]/g, '').trim().replace(/\s+/g, '-');
      const openEdhrec = (card) => {
          const isCmdr = card.type.toLowerCase().includes('legendary') && (card.type.toLowerCase().includes('creature') || card.type.toLowerCase().includes('planeswalker'));
          const urlType = isCmdr ? 'commanders' : 'cards';
          window.open(`https://edhrec.com/${urlType}/${formatEdhrec(card.name)}`, '_blank');
      };

      const defFront = viewingCard ? (viewingCard.image || "mtg-bg.jpg") : "";
      const defBack = viewingCard ? viewingCard.imageBack : null;
      const currentFront = showIta && itaImg ? itaImg : defFront;
      const currentBack = showIta && itaImgBack ? itaImgBack : defBack;
      const displayImg = showBack && currentBack ? currentBack : currentFront;

      return (
        <div className="max-w-2xl mx-auto relative z-10 w-full space-y-4">
          
          {viewingCard && (
             <div className="w-full flex flex-col animate-fade pb-10">
               <div className="flex items-center justify-between p-4 bg-gray-800 border-b border-gray-700 sticky top-0 z-50 shadow-md mb-6">
                 <button onClick={closeViewer} className="text-indigo-400 font-bold flex items-center gap-1 text-lg"><Icons.Back /> Indietro</button>
                 <h2 className="ml-4 font-bold text-white truncate max-w-[50%]">{viewingCard.name}</h2><div className="w-8"></div>
               </div>
               <div className="flex-1 flex flex-col items-center justify-start p-2">
                 <img src={displayImg} alt={viewingCard.name} className="w-auto max-h-[50vh] object-contain rounded-xl mb-4 shadow-2xl" />
                 
                 {(itaImgBack || viewingCard.imageBack) && (
                    <button onClick={() => setShowBack(!showBack)} className="w-full max-w-sm bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 rounded-lg shadow-md border border-gray-500 mb-4 transition-colors">🔄 {showBack ? "Vedi Fronte" : "Vedi Retro"}</button>
                 )}
                 <div className="w-full max-w-sm bg-gray-900 p-3 rounded-xl border border-gray-700 flex justify-between items-center mb-4 shadow-inner">
                    <div className="flex flex-col">
                       <span className="text-gray-400 text-[10px] font-bold uppercase">Prezzo Scryfall</span>
                       <span className="text-yellow-400 font-black text-lg">{(viewingCard.prices && viewingCard.prices.eur) ? `€ ${viewingCard.prices.eur}` : ((viewingCard.prices && viewingCard.prices.usd) ? `$ ${viewingCard.prices.usd}` : "N/D")}</span>
                    </div>
                    <div className="flex gap-2">
                       <button onClick={() => { 
                           const priceStr = (viewingCard.prices && viewingCard.prices.eur) ? viewingCard.prices.eur : "0";
                           const priceNum = parseFloat(priceStr) || 0;
                           const currentColl = collection || [];
                           
                           const existingIndex = currentColl.findIndex(c => c.scryfallId === viewingCard.id);
                           let newColl = [...currentColl];
                           
                           if(existingIndex >= 0) { 
                               newColl[existingIndex].qty += 1; 
                           } else { 
                               newColl.push({ 
                                   id: 'coll-' + Math.random(), 
                                   scryfallId: viewingCard.id,
                                   name: viewingCard.name, 
                                   img: displayImg, 
                                   colors: viewingCard.colors || [], 
                                   price: priceNum, 
                                   qty: 1, 
                                   folder: 'Generale',
                                   type: viewingCard.type || "",
                                   rarity: viewingCard.rarity || "common",
                                   setName: viewingCard.setName || "Set Base",
                                   setCode: viewingCard.setCode || ""
                               }); 
                           }
                           setCollection(newColl); 
                           alert("Aggiunta a La Mia Collezione!"); 
                       }} className="bg-emerald-600 hover:bg-emerald-500 text-white font-black px-3 py-2 rounded-lg shadow active:scale-95 text-xl" title="Aggiungi al Raccoglitore">
                           📁
                       </button>

                       <button onClick={() => {
                           let cart = JSON.parse(localStorage.getItem('mtg_cart') || '{"singles":[], "decks":[], "lastUpdated":0}');
                           cart.singles.push({ id: 'cart-' + Math.random(), name: viewingCard.name, prices: viewingCard.prices });
                           cart.lastUpdated = Date.now();
                           localStorage.setItem('mtg_cart', JSON.stringify(cart));
                           alert(`${viewingCard.name} aggiunto al Carrello!`);
                       }} className="bg-yellow-600 hover:bg-yellow-500 text-white font-black px-3 py-2 rounded-lg shadow active:scale-95 text-xl" title="Aggiungi al Carrello">
                           🛒
                       </button>

                       <button onClick={() => {
                           setPrintQueue([...(printQueue || []), { img: displayImg, name: viewingCard.name }]);
                           alert("Aggiunta alla coda di stampa!");
                       }} className="bg-cyan-600 hover:bg-cyan-500 text-white font-black px-3 py-2 rounded-lg shadow active:scale-95 text-xl" title="Stampa Proxy">
                           🖨️
                       </button>

                       <button onClick={() => openEdhrec(viewingCard)} className="bg-[#1c2127] hover:bg-[#2d3748] text-white font-black px-3 py-2 rounded-lg shadow active:scale-95 text-xl" title="Vedi su EDHREC">
                           📈
                       </button>
                    </div>
                 </div>

                 <div className="w-full max-w-sm mb-4 flex gap-2">
                    <button onClick={() => translateCard(viewingCard)} disabled={translating} className="flex-1 bg-indigo-700 hover:bg-indigo-600 text-white font-bold py-3 rounded-xl shadow-[0_0_15px_rgba(67,56,202,0.4)] border border-indigo-500 transition-all text-xs">
                      {translating ? "Traduco..." : (showIta ? "🇬🇧 Torna in Inglese" : "🇮🇹 Tenta Traduzione")}
                    </button>
                    {viewingCard.printsUrl && (
                        <button onClick={() => fetchOtherPrints(viewingCard)} disabled={loadingPrints} className="flex-1 bg-orange-600 hover:bg-orange-500 text-white font-bold py-3 rounded-xl shadow-lg border border-orange-500 transition-all text-xs">
                          {loadingPrints ? "Cerco..." : "🖼️ Altre Stampe"}
                        </button>
                    )}
                 </div>

                 {printsList.length > 0 && (
                    <div className="w-full max-w-sm mb-4 bg-gray-800 p-2 rounded-xl border border-gray-600 shadow-md animate-fade">
                       <p className="text-xs text-gray-300 font-bold mb-2">Seleziona una Stampa / Secret Lair:</p>
                       <div className="flex overflow-x-auto gap-2 pb-2">
                          {printsList.map(p => (
                             <img key={p.id} src={p.image} className="w-20 rounded cursor-pointer border-2 border-transparent hover:border-blue-500 shadow-sm shrink-0" onClick={() => { setViewingCard({...viewingCard, id: p.id, image: p.image, imageBack: p.imageBack, rarity: p.rarity, setCode: p.setCode, setName: p.setName, collector_number: p.collector_number, prices: p.prices}); setPrintsList([]); setShowIta(false); }} />
                          ))}
                       </div>
                    </div>
                 )}
                 
                 {/* REGOLE E LEGALITA */}
                 <CardDetailsTabs card={viewingCard} />

               </div>
             </div>
          )}

          <div className={viewingCard ? "hidden" : "space-y-4"}>
              <div className="bg-gray-800/90 p-4 rounded-xl border border-gray-600 shadow-md backdrop-blur-sm mt-4">
                 <h2 className="text-3xl font-black text-center text-indigo-400 drop-shadow-md mb-2">Ricerca Carte</h2>
                 <p className="text-xs text-center text-gray-300 font-bold mb-4 bg-gray-900 p-2 rounded border border-gray-700">Scannerizza una carta reale con l'IA o cerca nel database globale di MTG.</p>
                 
                 {/* BOTTONE SCANNER IA */}
                 <div className="mb-6 relative">
                     {isScanning && (
                         <div className="absolute inset-0 bg-black/80 z-10 flex items-center justify-center rounded-xl backdrop-blur-sm border border-emerald-500">
                             <p className="text-emerald-400 font-black animate-pulse">{scanProgress}</p>
                         </div>
                     )}
                     <label className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-4 rounded-xl shadow-[0_0_15px_rgba(16,185,129,0.5)] transition-all cursor-pointer flex justify-center items-center gap-2 text-lg active:scale-95">
                         📸 SCANNERIZZA CARTA (IA)
                         <input type="file" accept="image/*" capture="environment" onChange={handleGeminiScan} className="hidden" />
                     </label>
                 </div>

                 <p className="text-[10px] text-gray-400 mb-2 text-center uppercase tracking-wider font-bold">🇺🇸 Oppure cerca manualmente in Inglese</p>
                 <div className="flex gap-2 mb-2"><input type="text" placeholder="Nome della carta..." value={query} onChange={e => setQuery(e.target.value)} onKeyPress={e => e.key === 'Enter' && searchCard(null)} className="flex-1 bg-gray-900 border border-gray-600 rounded p-3 text-white outline-none focus:border-indigo-500" /></div>
                 
                 <div className="flex gap-2 mb-3">
                     <input type="text" placeholder="Testo Abilità" value={oracleText} onChange={e => setOracleText(e.target.value)} onKeyPress={e => e.key === 'Enter' && searchCard(null)} className="flex-1 bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm outline-none focus:border-indigo-500" />
                     <select value={expFilter} onChange={e => setExpFilter(e.target.value)} className="w-1/3 bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm outline-none focus:border-indigo-500 truncate">
                         <option value="">Espansione...</option>
                         {Array.isArray(mtgSets) && mtgSets.map((set, i) => (
                             <option key={set.code || i} value={set.code || ""}>{set.name || ""}</option>
                         ))}
                     </select>
                 </div>
                 
                 <div className="flex flex-col gap-2 mb-3 bg-gray-900 p-2 rounded border border-gray-700">
                    <div className="flex gap-2 overflow-x-auto pb-1 justify-center">
                      {ManaColors.map(m => (<button key={m.id} onClick={() => toggleMana(m.id)} className={`w-8 h-8 shrink-0 rounded-full flex items-center justify-center font-bold border-2 ${mana.includes(m.id) ? 'border-white scale-110' : 'border-transparent opacity-50'} ${m.color}`}>{m.label}</button>))}
                    </div>
                    <div className="flex items-center justify-center gap-2">
                       <select value={colorMatchType} onChange={e => setColorMatchType(e.target.value)} className="bg-gray-800 border border-gray-600 rounded p-1 text-white text-xs outline-none">
                          <option value="include">Contiene questi colori</option><option value="exact">Esattamente questi colori</option>
                       </select>
                       <label className="flex items-center gap-1 text-xs text-purple-300 font-bold bg-purple-900/30 px-2 py-1 rounded border border-purple-700 cursor-pointer">
                          <input type="checkbox" checked={isMulticolorOnly} onChange={e=>setIsMulticolorOnly(e.target.checked)} className="accent-purple-500" /> Solo Multi
                       </label>
                    </div>
                 </div>

                 <div className="grid grid-cols-2 gap-2 mb-3">
                   <select value={superType} onChange={e => setSuperType(e.target.value)} className="bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm outline-none"><option value="">Supertipo...</option><option value="legendary">Legendary</option><option value="basic">Basic</option><option value="snow">Snow</option></select>
                   <select value={rarity} onChange={e => setRarity(e.target.value)} className="bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm outline-none"><option value="">Rarità...</option><option value="c">Comune</option><option value="u">Non Comune</option><option value="r">Rara</option><option value="m">Mitica</option></select>
                   <select value={cardType} onChange={e => setCardType(e.target.value)} className="bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm outline-none"><option value="">Tipo 1...</option><option value="creature">Creatura</option><option value="artifact">Artefatto</option><option value="enchantment">Incantesimo</option><option value="instant">Istantaneo</option><option value="sorcery">Stregoneria</option><option value="land">Terra</option><option value="planeswalker">Planeswalker</option></select>
                   <select value={cardType2} onChange={e => setCardType2(e.target.value)} className="bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm outline-none"><option value="">Tipo 2...</option><option value="creature">Creatura</option><option value="artifact">Artefatto</option><option value="enchantment">Incantesimo</option><option value="land">Terra</option></select>
                   <input type="text" placeholder="Sottotipo (es. Goblin)" value={subType} onChange={e => setSubType(e.target.value)} className="col-span-2 bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm outline-none" />
                 </div>
                 
                 <div className="flex gap-2 mb-4 items-center">
                   <span className="text-gray-300 text-sm font-bold">Costo:</span>
                   <select value={cmcOp} onChange={e => setCmcOp(e.target.value)} className="bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm font-bold outline-none"><option value="=">=</option><option value=">">&gt;</option><option value="<">&lt;</option></select>
                   <input type="number" inputMode="numeric" min="0" value={cmcVal} onChange={e => setCmcVal(e.target.value)} className="w-16 bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm font-bold text-center outline-none" />
                   <label className="ml-auto flex items-center gap-1 text-xs text-yellow-500 font-bold bg-yellow-900/30 px-2 py-2 rounded border border-yellow-700 cursor-pointer"><input type="checkbox" checked={isCommanderOnly} onChange={e=>setIsCommanderOnly(e.target.checked)} className="accent-yellow-500" /> ⭐ Solo Cmdr</label>
                 </div>

                 <button onClick={() => searchCard(null)} disabled={loading} className="w-full bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 font-black py-4 rounded-xl text-white shadow-lg transition-colors active:scale-95 text-lg">
                   {loading ? "Cerco nel DB..." : "CERCA CARTE"}
                 </button>
              </div>

              {allResults.length > 0 && (
                <div className="bg-gray-800/90 p-4 rounded-xl border border-gray-600 backdrop-blur-sm animate-fade pb-20">
                  <div className="flex justify-between items-center mb-3 border-b border-gray-700 pb-2">
                     <h3 className="text-gray-300 text-sm font-bold">Risultati Database:</h3>
                     <div className="flex items-center gap-2 bg-gray-900 p-1 rounded-lg border border-gray-700">
                        <button onClick={goToPrevPage} disabled={localPage === 0} className={`w-8 h-8 rounded font-bold text-lg flex items-center justify-center ${localPage === 0 ? 'bg-gray-700 text-gray-500' : 'bg-indigo-600 text-white shadow transition-colors'}`}>⬅</button>
                        <span className="text-xs font-bold text-white px-2">Pag {localPage + 1} di {maxLocalPages||1}</span>
                        <button onClick={goToNextPage} disabled={localPage + 1 >= maxLocalPages && !nextScryfallUrl} className={`w-8 h-8 rounded font-bold text-lg flex items-center justify-center ${(localPage + 1 >= maxLocalPages && !nextScryfallUrl) ? 'bg-gray-700 text-gray-500' : 'bg-indigo-600 text-white shadow transition-colors'}`}>➡</button>
                     </div>
                  </div>
                  <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                    {currentResults.map((card, i) => (
                      <div key={i} className="relative cursor-pointer hover:ring-2 ring-indigo-500 rounded shadow-md group" onClick={() => openViewer(card)}>
                        <img src={card.image || "mtg-bg.jpg"} alt={card.name} className="w-full rounded" />
                        <div className="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity rounded flex items-center justify-center">
                            <span className="text-white font-bold text-sm bg-indigo-600/90 px-3 py-1 rounded-full shadow-lg">Vedi</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
          </div>
        </div>
      );
    };
    
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
