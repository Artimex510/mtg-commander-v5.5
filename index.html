                    <p className="text-xs text-gray-400 font-bold uppercase">Carte</p>
                    <p className={`text-2xl font-black ${totalCards===(String(formatName).toLowerCase()==='commander'?100:60) ? 'text-green-400':'text-red-400'}`}>{totalCards}</p>
                 </div>
                 <div className="bg-gray-900 p-2 rounded-lg border border-gray-700 shadow-inner">
                    <p className="text-xs text-gray-400 font-bold uppercase">Terre</p>
                    <p className="text-2xl font-black text-white">{typeCounts.Land}</p>
                 </div>
                 <div className="bg-gray-900 p-2 rounded-lg border border-gray-700 shadow-inner">
                    <p className="text-xs text-gray-400 font-bold uppercase">CMC Medio</p>
                    <p className="text-2xl font-black text-blue-400">{avgCMC.toFixed(2)}</p>
                 </div>
               </div>

               <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                   <div className="bg-gray-900 p-4 rounded-xl border border-gray-700 shadow-inner">
                       <h3 className="text-xs font-black text-purple-400 mb-4 uppercase tracking-widest text-center">Tipologia Magie</h3>
                       <div className="space-y-3">
                           {[
                               { label: 'Creature', count: typeCounts.Creature, color: 'bg-green-500' },
                               { label: 'Artefatti', count: typeCounts.Artifact, color: 'bg-gray-400' },
                               { label: 'Incantesimi', count: typeCounts.Enchantment, color: 'bg-yellow-500' },
                               { label: 'Istantanei', count: typeCounts.Instant, color: 'bg-blue-500' },
                               { label: 'Stregonerie', count: typeCounts.Sorcery, color: 'bg-red-500' },
                               { label: 'Planeswalker', count: typeCounts.Planeswalker, color: 'bg-purple-500' }
                           ].map(t => (
                               <div key={t.label} className="flex items-center gap-2">
                                   <span className="text-[10px] text-gray-300 font-bold w-16">{t.label}</span>
                                   <div className="flex-1 bg-gray-800 h-3 rounded-full overflow-hidden flex">
                                       <div className={`h-full ${t.color}`} style={{ width: `${typeTotalNonLand > 0 ? (t.count / typeTotalNonLand) * 100 : 0}%` }}></div>
                                   </div>
                                   <span className="text-[10px] text-white font-black w-6 text-right">{t.count}</span>
                               </div>
                           ))}
                       </div>
                   </div>

                   <div className="bg-gray-900 p-4 rounded-xl border border-gray-700 shadow-inner flex flex-col items-center justify-center">
                       <h3 className="text-xs font-black text-emerald-400 mb-4 uppercase tracking-widest text-center">Fonti di Mana (Terre+Sassi)</h3>
                       {totalSources > 0 ? (
                           <div className="w-32 h-32 rounded-full shadow-[0_0_15px_rgba(0,0,0,0.5)] border-4 border-gray-800" style={{ background: pieGradient }}></div>
                       ) : ( <p className="text-gray-500 text-xs font-bold text-center">Nessuna fonte rilevata</p> )}
                       <div className="flex flex-wrap justify-center gap-3 mt-4">
                           {ManaColors.map(m => (manaSources[m.id] > 0) ? (
                               <div key={m.id} className="flex items-center gap-1">
                                   <span className={`w-3 h-3 rounded-full ${String(m.color).split(' ')[0]} border border-gray-500`}></span>
                                   <span className="text-[10px] text-gray-300 font-bold">{manaSources[m.id]}</span>
                               </div>
                           ) : null)}
                       </div>
                   </div>
               </div>

               <div className="bg-gray-900 p-4 rounded-xl border border-gray-700 shadow-inner mb-6">
                   <h3 className="text-sm font-bold text-indigo-400 mb-3 text-center uppercase tracking-widest">Analisi Ruoli (Lettura Testo)</h3>
                   <div className="grid grid-cols-3 gap-2">
                       <div className="bg-gray-800 border border-gray-600 rounded p-2 text-center"><p className="text-[10px] text-gray-400 uppercase font-bold">Ramp/Sassi</p><p className="text-lg font-black text-green-400">{roles.ramp}</p></div>
                       <div className="bg-gray-800 border border-gray-600 rounded p-2 text-center"><p className="text-[10px] text-gray-400 uppercase font-bold">Peschini</p><p className="text-lg font-black text-blue-400">{roles.draw}</p></div>
                       <div className="bg-gray-800 border border-gray-600 rounded p-2 text-center"><p className="text-[10px] text-gray-400 uppercase font-bold">Gestione</p><p className="text-lg font-black text-purple-400">{roles.tutor}</p></div>
                       <div className="bg-gray-800 border border-gray-600 rounded p-2 text-center"><p className="text-[10px] text-gray-400 uppercase font-bold">Counter</p><p className="text-lg font-black text-blue-300">{roles.counter}</p></div>
                       <div className="bg-gray-800 border border-gray-600 rounded p-2 text-center"><p className="text-[10px] text-gray-400 uppercase font-bold">Wratte</p><p className="text-lg font-black text-red-400">{roles.wipe}</p></div>
                       <div className="bg-gray-800 border border-gray-600 rounded p-2 text-center"><p className="text-[10px] text-gray-400 uppercase font-bold">Cimitero</p><p className="text-lg font-black text-yellow-500">{roles.recursion}</p></div>
                   </div>
               </div>
               <div className="bg-gray-900 p-4 rounded-xl border border-gray-700 shadow-inner mb-6">
                 <h3 className="text-sm font-bold text-blue-400 mb-4 text-center uppercase">Curva di Mana (No Terre)</h3>
                 <div className="flex items-end gap-2 h-28">
                    {Object.keys(curve).map(k => {
                       const hPerc = maxCurve === 0 ? 0 : (curve[k] / maxCurve) * 100;
                       return (
                         <div key={k} className="flex-1 flex flex-col items-center justify-end h-full">
                           <span className="text-[10px] text-gray-300 font-bold mb-1">{curve[k]}</span>
                           <div className="w-full bg-gradient-to-t from-blue-700 to-blue-400 rounded-t-sm" style={{ height: `${hPerc}%` }}></div>

                         </div>
                       );

                 </div>
               </div>

               <div className="space-y-3">
                 <div className="grid grid-cols-2 gap-2">
                     <button onClick={copyTextList} className="bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 rounded-xl shadow text-xs">📋 COPIA LISTA TESTUALE</button>
                     <button onClick={() => setShowHyperModal(true)} className="bg-teal-700 hover:bg-teal-600 text-white font-black py-3 rounded-xl shadow text-xs">🧮 CALCOLATORE PROBABILITÀ</button>
                 </div>
                 
                 {String(formatName).toLowerCase() === 'commander' && (
                     <div className="bg-gray-800 p-4 rounded-xl border-2 border-orange-500 shadow-lg mt-6">
                         <div className="flex justify-between items-center mb-3 border-b border-gray-700 pb-2">
                             <h3 className="text-xl font-black text-white flex items-center gap-2">⚖️ Commander Bracket</h3>
                             <span className="bg-orange-600 text-white px-3 py-1 rounded-lg font-black text-xl shadow">Livello {deckBracket}</span>
                         </div>
                         <p className="text-gray-300 text-sm font-semibold mb-4">
                             {deckBracket === 2 && "Mazzo Fair/Ottimizzato. 0 Gamechanger."}
                             {deckBracket === 3 && `Mazzo High Power. Contiene ${gameChangerCards.length} Gamechanger.`}
                             {deckBracket === 4 && `Mazzo Estremo. Contiene ${gameChangerCards.length} Gamechanger.`}
                         </p>
                         
                         {gameChangerCards.length > 0 ? (
                             <div className="space-y-3 mb-4">
                                 {gameChangerCards.map((c, i) => (
                                     <div key={i} className="bg-gray-900 border border-gray-700 p-3 rounded-lg flex justify-between items-center">
                                         <p className="text-white font-bold">{c.name}</p>
                                         <button onClick={() => findAlternatives(c)} className="bg-orange-600 hover:bg-orange-500 text-white text-[10px] font-black px-3 py-2 rounded shadow">Riduci Potenza</button>
                                     </div>
                                 ))}
                             </div>
                         ) : (
                             <div className="bg-emerald-900/40 border border-emerald-500 p-3 rounded-lg mb-4">
                                 <p className="text-emerald-400 font-bold text-sm text-center">Nessuna carta Gamechanger rilevata!</p>
                             </div>
                         )}
                         <button onClick={() => setShowUpgradeModal(true)} className="w-full bg-red-700 hover:bg-red-600 text-white font-black py-3 rounded-lg shadow-lg flex items-center justify-center gap-2">🔥 AUMENTA POTENZA (Cerca Gamechanger)</button>
                     </div>
                 )}

                 <div className="bg-gray-800 p-4 rounded-xl border border-gray-600 shadow-lg mt-6">
                     <h3 className="text-xl font-black text-white mb-4 flex items-center gap-2 border-b border-gray-700 pb-2">🤖 Strumenti Intelligenza Artificiale</h3>
                     <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                         <button onClick={() => copyPrompt('general')} className="bg-blue-900 hover:bg-blue-800 border border-blue-500 text-white text-xs font-black py-3 rounded-lg shadow transition-colors col-span-1 sm:col-span-2">🤖 COPIA PROMPT ANALISI GENERICA</button>
                         <button onClick={handleComboSpellbook} className="bg-purple-700 hover:bg-purple-600 text-white text-xs font-black py-3 rounded-lg shadow transition-colors flex items-center justify-center gap-2">♾️ CERCA COMBO INFINITE</button>
                         <button onClick={() => copyPrompt('rule0')} className="bg-pink-700 hover:bg-pink-600 text-white text-xs font-black py-3 rounded-lg shadow transition-colors flex items-center justify-center gap-2">⚖️ GENERATORE "RULE 0"</button>
                         <button onClick={() => copyPrompt('synergy')} className="bg-emerald-700 hover:bg-emerald-600 text-white text-xs font-black py-3 rounded-lg shadow transition-colors flex items-center justify-center gap-2">🧩 SINERGIE NASCOSTE</button>
                         <button onClick={() => copyPrompt('curve')} className="bg-blue-700 hover:bg-blue-600 text-white text-xs font-black py-3 rounded-lg shadow transition-colors flex items-center justify-center gap-2">📉 SNELLISCI CURVA</button>
                         <button onClick={() => copyPrompt('bling')} className="bg-yellow-700 hover:bg-yellow-600 text-white text-xs font-black py-3 rounded-lg shadow transition-colors flex items-center justify-center gap-2">✨ TROVA RISTAMPE</button>
                         <button onClick={() => copyPrompt('top5')} className="bg-indigo-700 hover:bg-indigo-600 text-white text-xs font-black py-3 rounded-lg shadow transition-colors flex items-center justify-center gap-2">💸 ALTERNATIVE TOP 5</button>
                         <button onClick={() => setShowBudgetModal(true)} className="bg-indigo-900 border border-indigo-500 hover:bg-indigo-800 text-white text-xs font-black py-3 rounded-lg shadow transition-colors flex items-center justify-center gap-2 col-span-1 sm:col-span-2">💸 BUDGETIZZA INTERO MAZZO</button>
                     </div>
                 </div>

                 {showHyperModal && ReactDOM.createPortal(
                     <div className="fixed inset-0 bg-black/90 flex items-center justify-center z-[9999] p-4 animate-fade overflow-y-auto">
                         <div className="bg-gray-800 border-2 border-teal-500 rounded-xl p-6 w-full max-w-md shadow-2xl relative">
                             <button onClick={() => setShowHyperModal(false)} className="absolute top-2 right-3 text-gray-400 hover:text-white text-xl font-black">✕</button>
                             <h3 className="text-xl font-black text-white mb-1">Calcolatore Probabilità</h3>
                             <p className="text-gray-400 text-[10px] font-bold mb-4 border-b border-gray-700 pb-4">Usa la distribuzione ipergeometrica per capire quanto è affidabile il tuo mazzo.</p>
                             <div className="bg-teal-900/30 p-3 rounded-lg border border-teal-800 mb-6 text-center shadow-inner">
                                 <p className="text-teal-400 text-[10px] font-bold uppercase tracking-wider mb-1">Analisi Mano Iniziale</p>
                                 <p className="text-white text-xs font-semibold">Probabilità di avere <span className="font-black text-teal-300">da 2 a 4 Terre</span> nella mano di partenza (7 carte):</p>
                                 <p className="text-4xl font-black text-teal-400 mt-2">{probPlayableHand}%</p>
                             </div>
                             <div className="space-y-4">
                                 <div><label className="block text-gray-300 text-xs font-bold mb-1">Dimensioni del Mazzo</label><div className="bg-gray-900 text-gray-500 font-black p-3 rounded-lg border border-gray-700">{totalCards} Carte</div></div>
                                 <div className="grid grid-cols-2 gap-4">
                                     <div><label className="block text-gray-300 text-xs font-bold mb-1">Carte Bersaglio nel Mazzo</label><input type="number" value={hyperTarget} onChange={e=>setHyperTarget(parseInt(e.target.value)||0)} className="w-full bg-gray-900 text-white font-bold p-3 rounded-lg border border-gray-600 outline-none focus:border-teal-500" /></div>
                                     <div><label className="block text-gray-300 text-xs font-bold mb-1">Carte Pescate Totali</label><input type="number" value={hyperDraws} onChange={e=>setHyperDraws(parseInt(e.target.value)||0)} className="w-full bg-gray-900 text-white font-bold p-3 rounded-lg border border-gray-600 outline-none focus:border-teal-500" /></div>
                                 </div>
                                 <div><label className="block text-gray-300 text-xs font-bold mb-1">Ne vuoi trovare ALMENO:</label><input type="number" value={hyperMin} onChange={e=>setHyperMin(parseInt(e.target.value)||0)} className="w-full bg-gray-900 text-white font-bold p-3 rounded-lg border border-gray-600 outline-none focus:border-teal-500" /></div>
                             </div>
                             <div className="mt-6 bg-gray-900 p-4 rounded-xl border border-gray-700 text-center shadow-inner"><p className="text-gray-400 text-xs font-bold mb-1 uppercase tracking-widest">Probabilità di Successo</p><p className="text-5xl font-black text-white drop-shadow-[0_0_15px_rgba(20,184,166,0.8)]">{calcAtLeast(totalCards, hyperTarget, hyperDraws, hyperMin)}%</p></div>
                         </div>
                     </div>
                 , document.body)}

                 {showBudgetModal && ReactDOM.createPortal(
                     <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[9999] p-4 animate-fade">
                         <div className="bg-gray-800 border-2 border-indigo-500 rounded-xl p-6 w-full max-w-sm shadow-2xl relative">
                             <button onClick={() => setShowBudgetModal(false)} className="absolute top-2 right-3 text-gray-400 hover:text-white text-xl font-black">✕</button>
                             <h3 className="text-xl font-black text-white mb-2">Imposta il tuo Target</h3>
                             <p className="text-gray-300 text-xs font-bold mb-4">Quanto vuoi spendere al massimo per questo mazzo?</p>
                             <form onSubmit={(e) => { e.preventDefault(); copyPrompt('budget'); }} className="flex flex-col gap-4">
                                 <div className="relative"><span className="absolute left-4 top-3 text-white font-black">€</span><input type="number" value={targetBudget} onChange={e => setTargetBudget(e.target.value)} placeholder="es. 50" className="w-full bg-gray-900 border border-gray-600 rounded-lg pl-8 pr-4 py-3 text-white font-bold outline-none focus:border-indigo-500" required /></div>
                                 <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-3 rounded-lg shadow-lg transition-all active:scale-95">GENERA PROMPT & VAI SU GEMINI</button>
                             </form>
                         </div>
                     </div>
                 , document.body)}

                 {showAltModal && altTarget && ReactDOM.createPortal(
                     <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[9999] p-4 animate-fade">
                         <div className="bg-gray-800 border-2 border-orange-500 rounded-xl p-6 w-full max-w-sm shadow-2xl relative">
                             <button onClick={() => setShowAltModal(false)} className="absolute top-2 right-3 text-gray-400 hover:text-white text-xl font-black">✕</button>
                             <h3 className="text-lg font-black text-white mb-2">Alternative a {altTarget.name}</h3>
                             <p className="text-gray-300 text-xs font-bold mb-4">Ecco 5 carte simili non-gamechanger che non hai nel mazzo:</p>
                             {altLoading ? (<p className="text-yellow-400 font-bold text-center py-4">Ricerca in corso su Scryfall...</p>) : (
                                 <div className="space-y-2">
                                     {altResults.map((res, idx) => (
                                         <div key={idx} className="bg-gray-900 p-2 rounded-lg border border-gray-600 flex justify-between items-center group cursor-pointer" onClick={() => { navigator.clipboard.writeText(res.name); alert('Copiato: ' + res.name); }}>
                                             <div className="flex-1 truncate pr-2"><p className="text-white font-bold text-sm group-hover:text-orange-400 truncate">{res.name} 📋</p><p className="text-[10px] text-gray-400 truncate">{String(res.type_line)}</p></div>
                                             <span className="bg-emerald-800 text-emerald-200 px-2 py-1 rounded text-xs font-black shadow whitespace-nowrap">€{res.prices && res.prices.eur ? res.prices.eur : '-'}</span>
                                         </div>
                                     ))}
                                     {altResults.length === 0 && <p className="text-red-400 text-sm text-center">Nessuna alternativa trovata.</p>}
                                 </div>
                             )}
                         </div>
                     </div>
                 , document.body)}

                 {showUpgradeModal && ReactDOM.createPortal(
                     <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[9999] p-4 animate-fade">
                         <div className="bg-gray-800 border-2 border-red-500 rounded-xl p-6 w-full max-w-sm shadow-2xl relative flex flex-col max-h-[90vh]">
                             <button onClick={() => setShowUpgradeModal(false)} className="absolute top-2 right-3 text-gray-400 hover:text-white text-xl font-black">✕</button>
                             <h3 className="text-lg font-black text-white mb-2">Upgrade a Bracket 3 / 4</h3>
                             <p className="text-gray-300 text-xs font-bold mb-4">Gamechanger ufficiali per i tuoi colori:</p>
                             <div className="space-y-2 mb-4 overflow-y-auto flex-1 pr-1">
                                 {upgradeSuggestions.map((name, idx) => (
                                     <div key={idx} className="bg-gray-900 p-3 rounded-lg border border-gray-600 flex justify-between items-center group cursor-pointer" onClick={() => { navigator.clipboard.writeText(name); alert('Copiato: ' + name); }}>
                                         <p className="text-white font-bold text-sm group-hover:text-red-400 truncate">{name} 📋</p>
                                     </div>
                                 ))}
                                 {upgradeSuggestions.length === 0 && <p className="text-red-400 text-sm text-center font-bold">Hai già i migliori Gamechanger per i tuoi colori!</p>}
                             </div>
                             <button onClick={doUpgradePrompt} className="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-lg shadow flex items-center justify-center gap-2 mt-auto">🤖 CHIEDI A GEMINI UN PARERE</button>
                         </div>
                     </div>
                 , document.body)}
               </div>
             </div>
           </div>
        );
    };

    // --- VISUALIZZATORE MAZZI (SOLO LETTURA E TRADUZIONE) ---
    const DeckViewer = ({deck, navigate}) => {
      const [viewingCard, setViewingCard] = useState(null);
      const [itaImg, setItaImg] = useState(null);
      const [itaImgBack, setItaImgBack] = useState(null);
      const [showIta, setShowIta] = useState(false);
      const [showBack, setShowBack] = useState(false);
      const [translating, setTranslating] = useState(false);
      const [savedScroll, setSavedScroll] = useState(0);
      const [printsList, setPrintsList] = useState([]);
      const [loadingPrints, setLoadingPrints] = useState(false);

      if(!deck) return null;

      const deckMap = {};
      deck.cards.forEach(c => {
         const key = buildCardKey(c); 
         if(!deckMap[key]) { deckMap[key] = { ...c, count: 1 }; } 
         else { deckMap[key].count++; }
      });
      const groupedByCategory = { "Comandante": [], "Companion": [], "Creature": [], "Planeswalker": [], "Istantanei": [], "Stregonerie": [], "Artefatti": [], "Incantesimi": [], "Terre": [], "Altro": [], "Sideboard": [] };
      Object.values(deckMap).forEach(c => { groupedByCategory[getCardCategory(c)].push(c); });
      Object.keys(groupedByCategory).forEach(k => { groupedByCategory[k].sort((a,b) => a.name.localeCompare(b.name)); });

      const openViewer = (c) => { 
          setSavedScroll(window.scrollY);
          setItaImg(null); setItaImgBack(null); setShowIta(false); setShowBack(false); setPrintsList([]);
          setViewingCard(c); window.scrollTo(0,0); 
      };
      
      const closeViewer = () => { 
          setViewingCard(null); 
          setTimeout(() => window.scrollTo(0, savedScroll), 10);
      };

      const fetchOtherPrints = (card) => {
          if(!card.printsUrl) return alert("Questa carta non ha altre stampe disponibili sul database.");
          setLoadingPrints(true);
          fetch(card.printsUrl)
            .then(res => res.json())
            .then(data => {
                if(data.data && data.data.length > 0) {
                    const mapped = data.data.filter(c => c.image_uris || (c.card_faces && c.card_faces.length > 0 && c.card_faces[0].image_uris)).map(c => {
                         let iImg = ""; let iImgBack = null;
                         if (c.image_uris && c.image_uris.normal) iImg = c.image_uris.normal;
                         else if (c.card_faces && c.card_faces.length > 0) {
                             if (c.card_faces[0].image_uris && c.card_faces[0].image_uris.normal) iImg = c.card_faces[0].image_uris.normal;
                             if (c.card_faces.length > 1 && c.card_faces[1].image_uris && c.card_faces[1].image_uris.normal) iImgBack = c.card_faces[1].image_uris.normal;
                         }
                         return { ...card, id: c.id, image: iImg, imageBack: iImgBack };
                    });
                    setPrintsList(mapped);
                } else { alert("Nessun'altra stampa trovata."); }
                setLoadingPrints(false);
            }).catch(e => { console.error(e); setLoadingPrints(false); });
      };

      const translateCard = (card) => {
        if (card.isCustom) return alert("Le carte Proxy non possono essere tradotte dal database.");
        if (itaImg) { setShowIta(!showIta); return; } 
        setTranslating(true);
        fetch(`https://api.scryfall.com/cards/search?q=!"${card.name}"+lang:it`)
          .then(res => res.json())
          .then(data => {
             if (data.data && data.data.length > 0) {
                 const itCard = data.data[0];
                 let iImg = null; let iImgBack = null;
                 if (itCard.image_uris && itCard.image_uris.normal) { iImg = itCard.image_uris.normal; } 
                 else if (itCard.card_faces && itCard.card_faces.length > 0) {
                     if (itCard.card_faces[0].image_uris) iImg = itCard.card_faces[0].image_uris.normal;
                     if (itCard.card_faces.length > 1 && itCard.card_faces[1].image_uris) iImgBack = itCard.card_faces[1].image_uris.normal;
                 }
                 if (iImg) { setItaImg(iImg); setItaImgBack(iImgBack); setShowIta(true); }
                 else alert("Immagine italiana non trovata.");
             } else { alert("Traduzione ufficiale italiana non stampata per questa carta."); }
             setTranslating(false);
          }).catch(e => { alert("Errore di connessione."); setTranslating(false); });
      };

      const defFront = viewingCard ? (viewingCard.proxyImage || viewingCard.image || "mtg-bg.jpg") : "";
      const defBack = viewingCard ? viewingCard.imageBack : null;
      const currentFront = showIta && itaImg ? itaImg : defFront;
      const currentBack = showIta && itaImgBack ? itaImgBack : defBack;
      const displayImg = showBack && currentBack ? currentBack : currentFront;

      return (
        <div className="max-w-2xl mx-auto relative z-10 w-full space-y-4">
          
          {viewingCard && (
             <div className="w-full flex flex-col animate-fade pb-10">
               <div className="flex items-center justify-between p-4 bg-gray-800 border-b border-gray-700 sticky top-0 z-50 shadow-md mb-6">
                 <button onClick={closeViewer} className="text-indigo-400 font-bold flex items-center gap-1 text-lg"><Icons.Back /> Indietro</button>
                 <h2 className="ml-4 font-bold text-white truncate max-w-[50%]">{viewingCard.name}</h2><div className="w-8"></div>
               </div>
               <div className="flex-1 flex flex-col items-center justify-start p-2">
                 <img src={displayImg} alt={viewingCard.name} className="w-auto max-h-[50vh] object-contain rounded-xl mb-4 shadow-2xl" />
                 
                 {(itaImgBack || viewingCard.imageBack) && !viewingCard.isCustom && (
                    <button onClick={() => setShowBack(!showBack)} className="w-full max-w-sm bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 rounded-lg shadow-md border border-gray-500 mb-4 transition-colors">
                       🔄 {showBack ? "Vedi Fronte" : "Vedi Retro"}
                    </button>
                 )}

                 <div className="w-full max-w-sm mb-4 flex gap-2">
                    <button onClick={() => translateCard(viewingCard)} disabled={translating} className="flex-1 bg-indigo-700 hover:bg-indigo-600 text-white font-bold py-3 rounded-xl shadow-[0_0_15px_rgba(67,56,202,0.4)] border border-indigo-500 transition-all text-xs">
                      {translating ? "Traduco..." : (showIta ? "🇬🇧 Torna in Inglese" : "🇮🇹 Tenta Traduzione")}
                    </button>
                    {!viewingCard.isCustom && viewingCard.printsUrl && (
                        <button onClick={() => fetchOtherPrints(viewingCard)} disabled={loadingPrints} className="flex-1 bg-orange-600 hover:bg-orange-500 text-white font-bold py-3 rounded-xl shadow-lg border border-orange-500 transition-all text-xs">
                          {loadingPrints ? "Cerco..." : "🖼️ Altre Stampe"}
                        </button>
                    )}
                 </div>

                 {printsList.length > 0 && (
                    <div className="w-full max-w-sm mb-4 bg-gray-800 p-2 rounded-xl border border-gray-600 shadow-md animate-fade">
                       <p className="text-xs text-gray-300 font-bold mb-2">Seleziona una Stampa / Secret Lair:</p>
                       <div className="flex overflow-x-auto gap-2 pb-2">
                          {printsList.map(p => (
                             <div key={p.id} className="flex flex-col items-center shrink-0">
                               <img src={p.image} className="w-20 rounded cursor-pointer border-2 border-transparent hover:border-blue-500 shadow-sm" onClick={() => { setViewingCard({...viewingCard, image: p.image, imageBack: p.imageBack}); setPrintsList([]); setShowIta(false); }} />
                             </div>
                          ))}
                       </div>
                    </div>
                 )}
               </div>
             </div>
          )}

          <div className={viewingCard ? "hidden" : "space-y-4"}>
             <button onClick={() => navigate('mydecks')} className="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded font-bold mb-2 shadow transition-colors">⬅ Indietro ai Mazzi</button>
             <div className="bg-gray-800/90 p-6 rounded-xl border border-gray-600 shadow-xl backdrop-blur-sm">
                <h2 className="text-3xl font-black text-white mb-1 drop-shadow-md">{deck.name}</h2>
                <p className="text-gray-300 font-bold mb-4">Clicca su una carta per ingrandirla e tradurla!</p>
                <div className="space-y-4">
                  {categoriesOrder.map(cat => {
                     const cardsInCat = groupedByCategory[cat];
                     if(cardsInCat.length === 0) return null;
                     return (
                        <div key={cat} className="space-y-2">
                           <h4 className={`text-xs font-black border-b pb-1 uppercase ${cat === 'Sideboard' ? 'text-indigo-400 border-indigo-700' : (cat === 'Companion' ? 'text-pink-400 border-pink-700' : 'text-gray-400 border-gray-700')}`}>
                              {cat} ({cardsInCat.reduce((acc,c)=>acc+c.count,0)})
                           </h4>
                           {cardsInCat.map((card, index) => (
                             <div key={index} className={`flex gap-2 bg-gray-900 p-2 rounded-lg border ${card.isCmdrFlag ? 'border-yellow-500 shadow-[0_0_10px_rgba(234,179,8,0.3)]' : (card.isCompFlag ? 'border-pink-500 shadow-[0_0_10px_rgba(236,72,153,0.3)]' : (card.isSideboard ? 'border-indigo-500' : 'border-gray-700'))} cursor-pointer hover:bg-gray-800 transition-colors`} onClick={() => openViewer(card)}>
                               <div className="relative shrink-0">
                                   <img src={card.proxyImage || card.image || "mtg-bg.jpg"} alt={card.name} className="w-14 rounded object-cover shadow border border-gray-600" />
                                   <div className="absolute -top-2 -right-2 bg-blue-600 text-white font-black text-xs w-6 h-6 flex items-center justify-center rounded-full shadow border border-blue-400">
                                      {card.count}
                                   </div>
                               </div>
                               <div className="flex-1 text-sm flex flex-col justify-center overflow-hidden pl-2">
                                 <h4 className="font-bold text-gray-200 text-sm leading-tight truncate">{card.name}</h4>
                                 <p className="text-[10px] text-gray-500 truncate">{card.type}</p>
                               </div>
                             </div>
                           ))}
                        </div>
                     )
                  })}
                </div>
             </div>
          </div>
        </div>
      );
    };

    const CardSearchExplorer = ({navigate}) => {
      const [query, setQuery] = useState("");
      const [oracleText, setOracleText] = useState("");
      const [mana, setMana] = useState([]);
      const [colorMatchType, setColorMatchType] = useState('include'); 
      const [isMulticolorOnly, setIsMulticolorOnly] = useState(false);
      const [isCommanderOnly, setIsCommanderOnly] = useState(false);

      const [superType, setSuperType] = useState(""); const [cardType, setCardType] = useState("");
      const [cardType2, setCardType2] = useState(""); const [subType, setSubType] = useState("");
      const [rarity, setRarity] = useState(""); const [cmcOp, setCmcOp] = useState("="); const [cmcVal, setCmcVal] = useState("");
      
      const [allResults, setAllResults] = useState([]);
      const [localPage, setLocalPage] = useState(0);
      const [nextScryfallUrl, setNextScryfallUrl] = useState(null);
      const [loading, setLoading] = useState(false);
      
      const [isScanning, setIsScanning] = useState(false);
      const [scanProgress, setScanProgress] = useState("");

      const [viewingCard, setViewingCard] = useState(null);
      const [itaImg, setItaImg] = useState(null); const [itaImgBack, setItaImgBack] = useState(null);
      const [showIta, setShowIta] = useState(false); const [showBack, setShowBack] = useState(false);
      const [translating, setTranslating] = useState(false);
      const [printsList, setPrintsList] = useState([]); const [loadingPrints, setLoadingPrints] = useState(false);
      const [savedScroll, setSavedScroll] = useState(0);

      const toggleMana = (m) => setMana(mana.includes(m) ? mana.filter(x => x !== m) : [...mana, m]);

      const eseguiRicerca = (url, isNewSearch = false) => {
        setLoading(true);
        fetch(url).then(res => res.json()).then(data => {
            if (data.data && Array.isArray(data.data)) {
               const cards = data.data.filter(c => c.image_uris || (c.card_faces && c.card_faces.length > 0 && c.card_faces[0].image_uris)).map(c => {
                 let img = ""; let imgBack = null; let oracle_text = c.oracle_text || ""; let mana_cost = c.mana_cost || "";
                 if (c.image_uris && c.image_uris.normal) { img = c.image_uris.normal; } 
                 else if (c.card_faces && c.card_faces.length > 0) {
                     if (c.card_faces[0].image_uris && c.card_faces[0].image_uris.normal) img = c.card_faces[0].image_uris.normal;
                     if (c.card_faces.length > 1 && c.card_faces[1].image_uris && c.card_faces[1].image_uris.normal) imgBack = c.card_faces[1].image_uris.normal;
                     if (!oracle_text) oracle_text = c.card_faces.map(f=>f.oracle_text).join(' ');
                     if (!mana_cost) mana_cost = c.card_faces[0].mana_cost;
                 }
                 return { id: c.id, name: c.name, image: img, imageBack: imgBack, type: c.type_line || "", cmc: c.cmc || 0, colors: c.color_identity || [], legalities: c.legalities || {}, printsUrl: c.prints_search_uri || null, oracle_text: oracle_text, mana_cost: mana_cost, prices: c.prices || {} };
               });
               if(isNewSearch) { setAllResults(cards); setLocalPage(0); } else { setAllResults(prev => [...prev, ...cards]); }
               setNextScryfallUrl(data.has_more ? data.next_page : null);
            } else { if(isNewSearch) { setAllResults([]); alert("Nessuna carta trovata."); } }
            setLoading(false);
          }).catch(e => { console.error("Rete", e); setLoading(false); });
      };

      const searchCard = (forceQuery = null) => {
        const q = forceQuery !== null ? forceQuery : query;
        let searchQuery = q ? `${q} ` : "";
        if (oracleText) searchQuery += `o:"${oracleText}" `; if (rarity) searchQuery += `r:${rarity} `;
        if (mana.length > 0) {
           let mStr = mana.join('');
           if (colorMatchType === 'exact') searchQuery += cardType === 'land' ? `id=${mStr} ` : `c=${mStr} `; else searchQuery += cardType === 'land' ? `id>=${mStr} ` : `c>=${mStr} `;
        }
        if (isMulticolorOnly) searchQuery += `c>1 `; if (isCommanderOnly) searchQuery += `is:commander `;
        if (superType) searchQuery += `t:${superType} `; if (cardType) searchQuery += `t:${cardType} `; if (cardType2) searchQuery += `t:${cardType2} `;
        if (subType) searchQuery += `t:${subType} `; if (cmcVal !== "") searchQuery += `cmc${cmcOp}${cmcVal} `;
        if(!searchQuery.trim()) return alert("Inserisci almeno un parametro di ricerca!");
        eseguiRicerca(`https://api.scryfall.com/cards/search?q=${encodeURIComponent(searchQuery.trim())}`, true);
      };

      // --- SCANNER IA (GEMINI 3.6 FLASH) ---
      const handleGeminiScan = (e) => {
          const file = e.target.files[0];
          if (!file) return;

          let apiKey = localStorage.getItem('gemini_api_key');
          if (!apiKey) {
              apiKey = window.prompt("Per usare lo Scanner IA serve una API Key gratuita.\n\nPuoi ottenerla in 1 minuto su: https://aistudio.google.com/\n\nIncolla qui la tua API Key:");
              if (!apiKey) return;
              localStorage.setItem('gemini_api_key', apiKey);
          }

          setIsScanning(true);
          setScanProgress("IA in elaborazione...");
          const reader = new FileReader();
          
          reader.onloadend = async () => {
              const base64data = reader.result.split(',')[1];
              
              try {
                  const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({
                          contents: [{
                              parts: [
                                  { text: "Sei un esperto di Magic: The Gathering. Guarda questa carta. Rispondi SOLO ed ESCLUSIVAMENTE con il nome esatto della carta in INGLESE. Non aggiungere punteggiatura, spiegazioni o altro testo." },
                                  { inline_data: { mime_type: file.type, data: base64data } }
                              ]
                          }]
                      })
                  });

                  const data = await response.json();
                  if (data.error) throw new Error(data.error.message);
                  
                  const cardName = data.candidates[0].content.parts[0].text.trim();
                  setQuery(cardName);
                  searchCard(cardName);
                  
              } catch (err) {
                  console.error("Errore Gemini:", err);
                  alert("Errore durante la scansione. Controlla la API Key o riprova.");
              } finally {
                  setIsScanning(false);
                  setScanProgress("");
                  e.target.value = ''; 
              }
          };
          reader.readAsDataURL(file);
      };

      const maxLocalPages = allResults.length > 0 ? Math.ceil(allResults.length / 15) : 0;
      const currentResults = allResults.length > 0 ? allResults.slice(localPage * 15, (localPage + 1) * 15) : [];
      const goToNextPage = () => { if (localPage + 1 < maxLocalPages) { setLocalPage(localPage + 1); } else if (nextScryfallUrl) { eseguiRicerca(nextScryfallUrl, false); setLocalPage(localPage + 1); } };
      const goToPrevPage = () => { if (localPage > 0) setLocalPage(localPage - 1); };

      const openViewer = (c) => { setSavedScroll(window.scrollY); setItaImg(null); setItaImgBack(null); setShowIta(false); setShowBack(false); setPrintsList([]); setViewingCard(c); window.scrollTo(0,0); };
      const closeViewer = () => { setViewingCard(null); setTimeout(() => window.scrollTo(0, savedScroll), 10); };

      const fetchOtherPrints = (card) => {
          if(!card.printsUrl) return alert("Nessun'altra stampa disponibile.");
          setLoadingPrints(true);
          fetch(card.printsUrl).then(res => res.json()).then(data => {
                if(data.data && data.data.length > 0) {
                    const mapped = data.data.filter(c => c.image_uris || (c.card_faces && c.card_faces.length > 0 && c.card_faces[0].image_uris)).map(c => {
                         let iImg = ""; let iImgBack = null;
                         if (c.image_uris && c.image_uris.normal) iImg = c.image_uris.normal;
                         else if (c.card_faces && c.card_faces.length > 0) {
                             if (c.card_faces[0].image_uris && c.card_faces[0].image_uris.normal) iImg = c.card_faces[0].image_uris.normal;
                             if (c.card_faces.length > 1 && c.card_faces[1].image_uris && c.card_faces[1].image_uris.normal) iImgBack = c.card_faces[1].image_uris.normal;
                         }
                         return { ...card, id: c.id, image: iImg, imageBack: iImgBack };
                    });
                    setPrintsList(mapped);
                }
                setLoadingPrints(false);
            }).catch(e => { console.error(e); setLoadingPrints(false); });
      };

      const translateCard = (card) => {
        if (itaImg) { setShowIta(!showIta); return; } 
        setTranslating(true);
        fetch(`https://api.scryfall.com/cards/search?q=!"${card.name}"+lang:it`).then(res => res.json()).then(data => {
             if (data.data && data.data.length > 0) {
                 const itCard = data.data[0]; let iImg = null; let iImgBack = null;
                 if (itCard.image_uris && itCard.image_uris.normal) { iImg = itCard.image_uris.normal; } 
                 else if (itCard.card_faces && itCard.card_faces.length > 0) {
                     if (itCard.card_faces[0].image_uris) iImg = itCard.card_faces[0].image_uris.normal;
                     if (itCard.card_faces.length > 1 && itCard.card_faces[1].image_uris) iImgBack = itCard.card_faces[1].image_uris.normal;
                 }
                 if (iImg) { setItaImg(iImg); setItaImgBack(iImgBack); setShowIta(true); } else alert("Immagine italiana non trovata.");
             } else { alert("Traduzione ufficiale italiana non stampata."); }
             setTranslating(false);
          }).catch(e => { setTranslating(false); });
      };

      const formatEdhrec = (name) => name.toLowerCase().replace(/[^a-z0-9\s-]/g, '').trim().replace(/\s+/g, '-');
      const openEdhrec = (card) => {
          const isCmdr = card.type.toLowerCase().includes('legendary') && (card.type.toLowerCase().includes('creature') || card.type.toLowerCase().includes('planeswalker'));
          const urlType = isCmdr ? 'commanders' : 'cards';
          window.open(`https://edhrec.com/${urlType}/${formatEdhrec(card.name)}`, '_blank');
      };

      const defFront = viewingCard ? (viewingCard.image || "mtg-bg.jpg") : "";
      const defBack = viewingCard ? viewingCard.imageBack : null;
      const currentFront = showIta && itaImg ? itaImg : defFront;
      const currentBack = showIta && itaImgBack ? itaImgBack : defBack;
      const displayImg = showBack && currentBack ? currentBack : currentFront;

      return (
        <div className="max-w-2xl mx-auto relative z-10 w-full space-y-4">
          
          {viewingCard && (
             <div className="w-full flex flex-col animate-fade pb-10">
               <div className="flex items-center justify-between p-4 bg-gray-800 border-b border-gray-700 sticky top-0 z-50 shadow-md mb-6">
                 <button onClick={closeViewer} className="text-indigo-400 font-bold flex items-center gap-1 text-lg"><Icons.Back /> Indietro</button>
                 <h2 className="ml-4 font-bold text-white truncate max-w-[50%]">{viewingCard.name}</h2><div className="w-8"></div>
               </div>
               <div className="flex-1 flex flex-col items-center justify-start p-2">
                 <img src={displayImg} alt={viewingCard.name} className="w-auto max-h-[50vh] object-contain rounded-xl mb-4 shadow-2xl" />
                 
                 {(itaImgBack || viewingCard.imageBack) && (
                    <button onClick={() => setShowBack(!showBack)} className="w-full max-w-sm bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 rounded-lg shadow-md border border-gray-500 mb-4 transition-colors">🔄 {showBack ? "Vedi Fronte" : "Vedi Retro"}</button>
                 )}
                 <div className="w-full max-w-sm bg-gray-900 p-3 rounded-xl border border-gray-700 flex justify-between items-center mb-4 shadow-inner">
                    <div className="flex flex-col">
                       <span className="text-gray-400 text-[10px] font-bold uppercase">Prezzo Scryfall</span>
                       <span className="text-yellow-400 font-black text-lg">{(viewingCard.prices && viewingCard.prices.eur) ? `€ ${viewingCard.prices.eur}` : ((viewingCard.prices && viewingCard.prices.usd) ? `$ ${viewingCard.prices.usd}` : "N/D")}</span>
                    </div>
                    <button onClick={() => addToCart('single', viewingCard)} className="bg-yellow-600 hover:bg-yellow-500 text-white font-black px-4 py-2 rounded-lg shadow flex items-center gap-2 active:scale-95">🛒 AGGIUNGI</button>
                 </div>
                 <div className="w-full max-w-sm mb-4 flex gap-2">
                    <button onClick={() => translateCard(viewingCard)} disabled={translating} className="flex-1 bg-indigo-700 hover:bg-indigo-600 text-white font-bold py-3 rounded-xl shadow-[0_0_15px_rgba(67,56,202,0.4)] border border-indigo-500 transition-all text-xs">
                      {translating ? "Traduco..." : (showIta ? "🇬🇧 Torna in Inglese" : "🇮🇹 Traduci")}
                    </button>
                    <button onClick={() => fetchOtherPrints(viewingCard)} disabled={loadingPrints} className="flex-1 bg-orange-600 hover:bg-orange-500 text-white font-bold py-3 rounded-xl shadow-lg border border-orange-500 transition-all text-xs">
                       {loadingPrints ? "Cerco..." : "🖼️ Altre Stampe"}
                    </button>
                 </div>
                 
                 <button onClick={() => openEdhrec(viewingCard)} className="w-full max-w-sm bg-emerald-600 hover:bg-emerald-500 text-white font-black py-4 rounded-xl shadow-[0_0_15px_rgba(16,185,129,0.4)] transition-all flex items-center justify-center gap-2 mt-2">
                    🛡️ VEDI SINERGIE SU EDHREC
                 </button>

                 {printsList.length > 0 && (
                    <div className="w-full max-w-sm mt-4 bg-gray-800 p-2 rounded-xl border border-gray-600 shadow-md animate-fade">
                       <p className="text-xs text-gray-300 font-bold mb-2">Tocca un'art per vederla in grande:</p>
                       <div className="flex overflow-x-auto gap-2 pb-2">
                          {printsList.map(p => (
                             <img key={p.id} src={p.image} className="w-20 rounded cursor-pointer border-2 border-transparent hover:border-blue-500 shadow-sm shrink-0" 
                                  onClick={() => { setViewingCard({...viewingCard, image: p.image, imageBack: p.imageBack}); setPrintsList([]); setShowIta(false); }} />
                          ))}
                       </div>
                    </div>
                 )}
               </div>
             </div>
          )}

          <div className={viewingCard ? "hidden" : "space-y-4"}>
             <div className="bg-gray-800/90 p-4 rounded-xl border border-gray-600 shadow-xl backdrop-blur-sm mt-4">
                 <h2 className="text-2xl font-black text-indigo-400 mb-2 border-b border-gray-700 pb-2">Database & Scan</h2>
                 
                 <div className="bg-indigo-900/30 border border-indigo-500 p-4 rounded-xl mb-6 shadow-inner text-center">
                    <p className="text-indigo-200 text-xs font-bold mb-3">Scegli come inquadrare la carta per fargliela riconoscere all'Intelligenza Artificiale!</p>
                    <div className="flex gap-3">
                       <label className="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-black py-3 rounded-xl cursor-pointer shadow-[0_0_15px_rgba(79,70,229,0.5)] transition-all flex flex-col items-center justify-center">
                          <span className="text-2xl mb-1">📸</span>
                          <span className="text-xs">FOTOCAMERA</span>
                          <input type="file" accept="image/*" capture="environment" className="hidden" onChange={handleGeminiScan} />
                       </label>
                       
                       <label className="flex-1 bg-purple-600 hover:bg-purple-500 text-white font-black py-3 rounded-xl cursor-pointer shadow-[0_0_15px_rgba(147,51,234,0.5)] transition-all flex flex-col items-center justify-center">
                          <span className="text-2xl mb-1">🖼️</span>
                          <span className="text-xs">GALLERIA</span>
                          <input type="file" accept="image/*" className="hidden" onChange={handleGeminiScan} />
                       </label>
                    </div>
                    {isScanning && <p className="text-yellow-400 font-black text-sm mt-3 animate-pulse">{scanProgress}</p>}
                    
                    <div className="text-right mt-3 border-t border-indigo-700/50 pt-2">
                        <p className="text-[10px] text-indigo-300 font-bold">
                            * Lo Scan IA richiede una <a href="https://aistudio.google.com/" target="_blank" rel="noopener noreferrer" className="text-purple-400 hover:text-purple-300 underline">API Key gratuita su Google AI Studio</a>.
                        </p>
                    </div>
                 </div>

                 <h3 className="font-bold text-gray-300 mb-2">Ricerca Manuale:</h3>
                 <div className="flex gap-2 mb-2"><input type="text" placeholder="Nome (es. Plains)" value={query} onChange={e => setQuery(e.target.value)} onKeyPress={e => e.key === 'Enter' && searchCard(null)} className="flex-1 bg-gray-900 border border-gray-600 rounded p-3 text-white outline-none" /></div>
                 <div className="flex gap-2 mb-3"><input type="text" placeholder="Testo Abilità" value={oracleText} onChange={e => setOracleText(e.target.value)} onKeyPress={e => e.key === 'Enter' && searchCard(null)} className="flex-1 bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm outline-none" /></div>
                 
                 <div className="flex flex-col gap-2 mb-3 bg-gray-900 p-2 rounded border border-gray-700">
                    <div className="flex gap-2 overflow-x-auto pb-1 justify-center">
                      {ManaColors.map(m => (<button key={m.id} onClick={() => toggleMana(m.id)} className={`w-8 h-8 shrink-0 rounded-full flex items-center justify-center font-bold border-2 ${mana.includes(m.id) ? 'border-white scale-110' : 'border-transparent opacity-50'} ${m.color}`}>{m.label}</button>))}
                    </div>
                    <div className="flex items-center justify-center gap-2">
                       <select value={colorMatchType} onChange={e => setColorMatchType(e.target.value)} className="bg-gray-800 border border-gray-600 rounded p-1 text-white text-xs outline-none">
                          <option value="include">Contiene</option><option value="exact">Esatti</option>
                       </select>
                       <label className="flex items-center gap-1 text-xs text-purple-300 font-bold bg-purple-900/30 px-2 py-1 rounded border border-purple-700 cursor-pointer">
                          <input type="checkbox" checked={isMulticolorOnly} onChange={e=>setIsMulticolorOnly(e.target.checked)} className="accent-purple-500" /> Multi
                       </label>
                    </div>
                 </div>

                 <div className="grid grid-cols-2 gap-2 mb-3">
                   <select value={superType} onChange={e => setSuperType(e.target.value)} className="bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm outline-none"><option value="">Supertipo...</option><option value="legendary">Legendary</option><option value="basic">Basic</option><option value="snow">Snow</option></select>
                   <select value={rarity} onChange={e => setRarity(e.target.value)} className="bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm outline-none"><option value="">Rarità...</option><option value="c">Comune</option><option value="u">Non Comune</option><option value="r">Rara</option><option value="m">Mitica</option></select>
                   <select value={cardType} onChange={e => setCardType(e.target.value)} className="bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm outline-none"><option value="">Tipo 1...</option><option value="creature">Creatura</option><option value="artifact">Artefatto</option><option value="enchantment">Incantesimo</option><option value="instant">Istantaneo</option><option value="sorcery">Stregoneria</option><option value="land">Terra</option><option value="planeswalker">Planeswalker</option></select>
                   <select value={cardType2} onChange={e => setCardType2(e.target.value)} className="bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm outline-none"><option value="">Tipo 2...</option><option value="creature">Creatura</option><option value="artifact">Artefatto</option><option value="enchantment">Incantesimo</option><option value="land">Terra</option></select>
                 </div>
                 
                 <div className="flex gap-2 mb-4 items-center">
                   <span className="text-gray-300 text-sm font-bold">Costo:</span>
                   <select value={cmcOp} onChange={e => setCmcOp(e.target.value)} className="bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm font-bold outline-none"><option value="=">=</option><option value=">">&gt;</option><option value="<">&lt;</option></select>
                   <input type="number" inputMode="numeric" min="0" value={cmcVal} onChange={e => setCmcVal(e.target.value)} className="w-16 bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm font-bold text-center outline-none" />
                   <label className="ml-auto flex items-center gap-1 text-xs text-yellow-500 font-bold bg-yellow-900/30 px-2 py-2 rounded border border-yellow-700 cursor-pointer"><input type="checkbox" checked={isCommanderOnly} onChange={e=>setIsCommanderOnly(e.target.checked)} className="accent-yellow-500" /> ⭐ Solo Cmdr</label>
                 </div>

                 <button onClick={() => searchCard(null)} className="w-full bg-blue-600 hover:bg-blue-700 font-bold py-3 rounded-lg text-white shadow-lg transition-colors">
                     {loading ? "Ricerca in corso..." : "🔍 Avvia Ricerca Manuale"}
                 </button>
             </div>

             {allResults.length > 0 && (
                <div className="bg-gray-800/90 p-4 rounded-xl border border-gray-600 backdrop-blur-sm animate-fade">
                  <div className="flex justify-between items-center mb-3 border-b border-gray-700 pb-2">
                     <h3 className="text-gray-300 text-sm font-bold">Risultati Database:</h3>
                     <div className="flex items-center gap-2 bg-gray-900 p-1 rounded-lg border border-gray-700">
                        <button onClick={goToPrevPage} disabled={localPage === 0} className={`w-8 h-8 rounded font-bold text-lg flex items-center justify-center ${localPage === 0 ? 'bg-gray-700 text-gray-500' : 'bg-blue-600 text-white shadow transition-colors'}`}>⬅</button>
                        <span className="text-xs font-bold text-white px-2">Pag {localPage + 1} di {maxLocalPages||1}</span>
                        <button onClick={goToNextPage} disabled={localPage + 1 >= maxLocalPages && !nextScryfallUrl} className={`w-8 h-8 rounded font-bold text-lg flex items-center justify-center ${(localPage + 1 >= maxLocalPages && !nextScryfallUrl) ? 'bg-gray-700 text-gray-500' : 'bg-blue-600 text-white shadow transition-colors'}`}>➡</button>
                     </div>
                  </div>
                  <div className="grid grid-cols-3 gap-2">
                    {currentResults.map((card, i) => (
                      <div key={i} className="relative cursor-pointer hover:ring-2 ring-indigo-500 rounded shadow-md" onClick={() => openViewer(card)}>
                        <img src={card.image || "mtg-bg.jpg"} alt={card.name} className="w-full rounded" />
                      </div>
                    ))}
                  </div>
                </div>
             )}
          </div>
        </div>
      );
    };
    
    const DiceRoller = () => <div className="text-white text-center p-10">Dado</div>;
    const RulesAI = () => <div className="text-white text-center p-10">Regole</div>;
    const PlayOnlineView = () => <div className="text-white text-center p-10">Gioca Online</div>;
    const TavernaChat = () => <div className="text-white text-center p-10">Taverna</div>;
    const ProTools = () => <div className="text-white text-center p-10">Strumenti Pro</div>;
    const GameUtility = () => <div className="text-white text-center p-10">Life Tracker</div>;
    const PlaytesterSandbox = () => <div className="text-white text-center p-10">Playtester</div>;

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
