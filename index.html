                             <div className="mt-6 bg-gray-900 p-4 rounded-xl border border-gray-700 text-center shadow-inner"><p className="text-gray-400 text-xs font-bold mb-1 uppercase tracking-widest">Probabilità di Successo</p><p className="text-5xl font-black text-white drop-shadow-[0_0_15px_rgba(20,184,166,0.8)]">{calcAtLeast(totalCards, hyperTarget, hyperDraws, hyperMin)}%</p></div>
                         </div>
                     </div>
                 , document.body)}

                 {showBudgetModal && ReactDOM.createPortal(
                     <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[9999] p-4 animate-fade">
                         <div className="bg-gray-800 border-2 border-indigo-500 rounded-xl p-6 w-full max-w-sm shadow-2xl relative">
                             <button onClick={() => setShowBudgetModal(false)} className="absolute top-2 right-3 text-gray-400 hover:text-white text-xl font-black">✕</button>
                             <h3 className="text-xl font-black text-white mb-2">Imposta il tuo Target</h3>
                             <p className="text-gray-300 text-xs font-bold mb-4">Quanto vuoi spendere al massimo per questo mazzo?</p>
                             <form onSubmit={(e) => { e.preventDefault(); copyPrompt('budget'); }} className="flex flex-col gap-4">
                                 <div className="relative"><span className="absolute left-4 top-3 text-white font-black">€</span><input type="number" value={targetBudget} onChange={e => setTargetBudget(e.target.value)} placeholder="es. 50" className="w-full bg-gray-900 border border-gray-600 rounded-lg pl-8 pr-4 py-3 text-white font-bold outline-none focus:border-indigo-500" required /></div>
                                 <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-3 rounded-lg shadow-lg transition-all active:scale-95">GENERA PROMPT & VAI SU GEMINI</button>
                             </form>
                         </div>
                     </div>
                 , document.body)}

                 {showAltModal && altTarget && ReactDOM.createPortal(
                     <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[9999] p-4 animate-fade">
                         <div className="bg-gray-800 border-2 border-orange-500 rounded-xl p-6 w-full max-w-sm shadow-2xl relative">
                             <button onClick={() => setShowAltModal(false)} className="absolute top-2 right-3 text-gray-400 hover:text-white text-xl font-black">✕</button>
                             <h3 className="text-lg font-black text-white mb-2">Alternative a {altTarget.name}</h3>
                             <p className="text-gray-300 text-xs font-bold mb-4">Ecco 5 carte simili non-gamechanger che non hai nel mazzo:</p>
                             {altLoading ? (<p className="text-yellow-400 font-bold text-center py-4">Ricerca in corso su Scryfall...</p>) : (
                                 <div className="space-y-2">
                                     {altResults.map((res, idx) => (
                                         <div key={idx} className="bg-gray-900 p-2 rounded-lg border border-gray-600 flex justify-between items-center group cursor-pointer" onClick={() => { navigator.clipboard.writeText(res.name); alert('Copiato: ' + res.name); }}>
                                             <div className="flex-1 truncate pr-2"><p className="text-white font-bold text-sm group-hover:text-orange-400 truncate">{res.name} 📋</p><p className="text-[10px] text-gray-400 truncate">{String(res.type_line)}</p></div>
                                             <span className="bg-emerald-800 text-emerald-200 px-2 py-1 rounded text-xs font-black shadow whitespace-nowrap">€{res.prices && res.prices.eur ? res.prices.eur : '-'}</span>
                                         </div>
                                     ))}
                                     {altResults.length === 0 && <p className="text-red-400 text-sm text-center">Nessuna alternativa trovata.</p>}
                                 </div>
                             )}
                         </div>
                     </div>
                 , document.body)}

                 {showUpgradeModal && ReactDOM.createPortal(
                     <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[9999] p-4 animate-fade">
                         <div className="bg-gray-800 border-2 border-red-500 rounded-xl p-6 w-full max-w-sm shadow-2xl relative flex flex-col max-h-[90vh]">
                             <button onClick={() => setShowUpgradeModal(false)} className="absolute top-2 right-3 text-gray-400 hover:text-white text-xl font-black">✕</button>
                             <h3 className="text-lg font-black text-white mb-2">Upgrade a Bracket 3 / 4</h3>
                             <p className="text-gray-300 text-xs font-bold mb-4">Gamechanger ufficiali per i tuoi colori:</p>
                             <div className="space-y-2 mb-4 overflow-y-auto flex-1 pr-1">
                                 {upgradeSuggestions.map((name, idx) => (
                                     <div key={idx} className="bg-gray-900 p-3 rounded-lg border border-gray-600 flex justify-between items-center group cursor-pointer" onClick={() => { navigator.clipboard.writeText(name); alert('Copiato: ' + name); }}>
                                         <p className="text-white font-bold text-sm group-hover:text-red-400 truncate">{name} 📋</p>
                                     </div>
                                 ))}
                                 {upgradeSuggestions.length === 0 && <p className="text-red-400 text-sm text-center font-bold">Hai già i migliori Gamechanger per i tuoi colori!</p>}
                             </div>
                             <button onClick={doUpgradePrompt} className="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-lg shadow flex items-center justify-center gap-2 mt-auto">🤖 CHIEDI A GEMINI UN PARERE</button>
                         </div>
                     </div>
                 , document.body)}
               </div>
             </div>
           </div>
        );
    };

    // --- FINE DEL CODICE ---
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
