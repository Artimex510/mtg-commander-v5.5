<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MTG Commander Companion</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-storage-compat.js"></script>

  <style>
    body { -webkit-font-smoothing: antialiased; overflow-x: hidden; user-select: none; -webkit-touch-callout: none; background-color: #000; }
    .animate-fade { animation: fadeIn 0.2s ease-in-out; forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
    button { touch-action: manipulation; }
    
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

    @media print {
      body { background: white !important; color: black; }
      .no-print { display: none !important; }
      .print-grid { display: grid; grid-template-columns: repeat(3, 63mm); gap: 2mm; justify-content: center; }
      .print-card { width: 63mm; height: 88mm; object-fit: cover; border-radius: 3mm; margin-bottom: 2mm; page-break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyBKfSnZ7ujw5uYZ_RnlM034exD28jfMunQ",
      authDomain: "mtg-for-fun-bf36b.firebaseapp.com",
      projectId: "mtg-for-fun-bf36b",
      storageBucket: "mtg-for-fun-bf36b.firebasestorage.app",
      messagingSenderId: "742946721330",
      appId: "1:742946721330:web:3cb566ddd6c8b9ada7362b"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();

    const syncToCloud = async (uid) => {
      try {
        let rawDecks = [];
        try { rawDecks = JSON.parse(localStorage.getItem('mtg_decks')) || []; } catch(e){}
        if (!Array.isArray(rawDecks)) rawDecks = [];

        // Filtro sicuro per togliere il peso dalle proxy senza errori
        const cleanCard = (c) => { 
            if (!c) return c;
            let newC = { ...c };
            if (newC.isCustom || 
               (typeof newC.proxyImage === 'string' && newC.proxyImage.startsWith('data:image')) || 
               (typeof newC.image === 'string' && newC.image.startsWith('data:image')) ||
               (typeof newC.imageBack === 'string' && newC.imageBack.startsWith('data:image'))) { 
                newC.proxyImage = ""; 
                newC.image = ""; 
                newC.imageBack = "";
            } 
            return newC; 
        };
        
        const decksToCloud = rawDecks.map(deck => ({ ...deck, cards: (deck.cards || []).map(cleanCard) }));
        
        let rawCart = { singles: [], decks: [], lastUpdated: Date.now() };
        try { 
            const parsedCart = JSON.parse(localStorage.getItem('mtg_cart'));
            if (parsedCart && typeof parsedCart === 'object') rawCart = { ...rawCart, ...parsedCart };
        } catch(e){}
        
        const cartToCloud = { 
            ...rawCart, 
            singles: (rawCart.singles || []).map(cleanCard), 
            decks: (rawCart.decks || []).map(d => ({ ...d, cards: (d.cards || []).map(cleanCard) })) 
        };

        // SALVATAGGIO IMMEDIATO DI MAZZI E CARRELLO (Niente più blocco Storage!)
        await db.collection('users').doc(uid).set({ 
            decks: decksToCloud, 
            cart: cartToCloud, 
            lastSync: new Date().toISOString() 
        }, { merge: true });

      } catch (err) { 
          console.error("Errore salvataggio Firebase:", err);
          alert("Firebase ha bloccato il salvataggio!\nMotivo: " + err.message); 
      }
    };

    const syncFromCloud = async (uid) => {
      try {
          const doc = await db.collection('users').doc(uid).get();
          if(doc.exists) {
            const data = doc.data();
            if(data.decks) localStorage.setItem('mtg_decks', JSON.stringify(data.decks));
            if(data.cart) localStorage.setItem('mtg_cart', JSON.stringify(data.cart));
            return true;
          }
          return false;
      } catch(err) { console.error("Errore syncFromCloud:", err); return false; }
    };

    // --- FUNZIONI STORAGE DISATTIVATE ---
    // Le svuotiamo per ingannare l'app: crederà di aver salvato/eliminato 
    // la proxy nel cloud, ma l'operazione avverrà solo sul tuo telefono locale.
    
    const syncSingleProxyToCloud = async (uid, proxy) => {
        // Disattivato: Proxy 100% locali
    };

    const deleteProxyFromCloud = async (uid, proxyId) => {
        // Disattivato: Proxy 100% locali
    };

    const Icons = {
      Menu: () => <svg className="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16"/></svg>,
      Home: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 001 1m-6 0h6"/></svg>,
      Back: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
    };

    const ManaColors = [
      { id: 'W', color: 'bg-yellow-100 text-yellow-900', label: 'W' },
      { id: 'U', color: 'bg-blue-500 text-white', label: 'U' },
      { id: 'B', color: 'bg-gray-800 text-white', label: 'B' },
      { id: 'R', color: 'bg-red-500 text-white', label: 'R' },
      { id: 'G', color: 'bg-green-500 text-white', label: 'G' },
      { id: 'C', color: 'bg-gray-400 text-gray-900', label: 'C' }
    ];

    const getCardCategory = (card) => {
        if (card.isSideboard) return "Sideboard";
        if (card.isCompanion || card.isCompFlag) return "Companion"; 
        if (card.isCmdrFlag || card.isCommander) return "Comandante";
        const t = (card.type || "").toLowerCase();
        if (t.includes("creature")) return "Creature";
        if (t.includes("planeswalker")) return "Planeswalker";
        if (t.includes("instant")) return "Istantanei";
        if (t.includes("sorcery")) return "Stregonerie";
        if (t.includes("artifact")) return "Artefatti";
        if (t.includes("enchantment")) return "Incantesimi";
        if (t.includes("land")) return "Terre";
        return "Altro";
    };
    const categoriesOrder = ["Comandante", "Companion", "Creature", "Planeswalker", "Istantanei", "Stregonerie", "Artefatti", "Incantesimi", "Terre", "Altro", "Sideboard"];

    const buildCardKey = (c) => c.name + (c.isCustom ? c.proxyImage : "") + c.id + !!c.isSideboard + !!c.isCommander + !!c.isCompanion;
    
    const addToCart = (type, item) => {
        let cart = JSON.parse(localStorage.getItem('mtg_cart') || '{"singles":[], "decks":[], "lastUpdated":0}');
        if (!cart.singles) cart.singles = [];
        if (!cart.decks) cart.decks = [];
        
        if (type === 'single') {
            cart.singles.push(item);
            alert(`${item.name} aggiunto al Carrello!`);
        } else {
            cart.decks.push(item);
            alert(`Mazzo "${item.name}" aggiunto al Carrello!`);
        }
        
        cart.lastUpdated = Date.now();
        localStorage.setItem('mtg_cart', JSON.stringify(cart));
        
        const user = firebase.auth().currentUser;
        if (user) syncToCloud(user.uid).catch(e => console.error("Errore Sync Carrello:", e));
    };

    // --- TRADE EVALUATOR (BILANCIA SCAMBI) ---
    const TradeEvaluator = ({ setView }) => {
        const [leftCards, setLeftCards] = useState([]);
        const [rightCards, setRightCards] = useState([]);
        const [searchQ, setSearchQ] = useState("");
        const [searchResults, setSearchResults] = useState([]);
        const [activeSide, setActiveSide] = useState(null);

        const searchCardForTrade = (e) => {
            e.preventDefault();
            if (!searchQ.trim()) return;
            fetch(`https://api.scryfall.com/cards/search?q=${encodeURIComponent(searchQ.trim())}`)
                .then(res => res.json())
                .then(data => {
                    if (data && data.data) { setSearchResults(data.data.slice(0, 10)); } 
                    else { setSearchResults([]); }
                }).catch(() => setSearchResults([]));
        };

        const addCardToTrade = (card) => {
            let price = 0;
            if (card && card.prices && typeof card.prices === 'object' && card.prices.eur) { 
                price = parseFloat(card.prices.eur) || 0; 
            }
            
            let imgUrl = "";
            if (card && card.image_uris && card.image_uris.normal) {
                imgUrl = card.image_uris.normal;
            } else if (card && card.card_faces && card.card_faces.length > 0 && card.card_faces[0].image_uris && card.card_faces[0].image_uris.normal) {
                imgUrl = card.card_faces[0].image_uris.normal;
            }

            const tradeCard = { 
                id: (card && card.id ? card.id : 'trade') + Math.random(), 
                name: card && card.name ? card.name : "Sconosciuta", 
                price: price,
                img: imgUrl
            };

            if (activeSide === 'left') setLeftCards([...leftCards, tradeCard]);
            if (activeSide === 'right') setRightCards([...rightCards, tradeCard]);
            
            setSearchResults([]); setSearchQ(""); setActiveSide(null);
        };

        const removeCard = (id, side) => {
            if (side === 'left') setLeftCards(leftCards.filter(c => c.id !== id));
            if (side === 'right') setRightCards(rightCards.filter(c => c.id !== id));
        };

        const leftTotal = leftCards.reduce((acc, c) => acc + c.price, 0);
        const rightTotal = rightCards.reduce((acc, c) => acc + c.price, 0);
        const diff = Math.abs(leftTotal - rightTotal).toFixed(2);
        
        let verdict = "SCAMBIO EQUO ⚖️";
        let verdictColor = "text-yellow-400";
        if (leftTotal > rightTotal + 0.5) { verdict = "TU CI PERDI 📉"; verdictColor = "text-red-500"; }
        if (rightTotal > leftTotal + 0.5) { verdict = "TU CI GUADAGNI 📈"; verdictColor = "text-green-500"; }

        return (
            <div className="max-w-4xl mx-auto space-y-4 p-4 text-white animate-fade">
                <button onClick={() => setView('home')} className="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded font-bold mb-2">⬅ Torna Indietro</button>
                <div className="bg-gray-800 p-6 rounded-xl border-2 border-orange-500 shadow-2xl">
                    <h2 className="text-3xl font-black text-white text-center mb-6">⚖️ Bilancia Scambi</h2>
                    <div className="bg-gray-900 p-4 rounded-xl text-center border border-gray-600 mb-6">
                        <p className="text-gray-400 text-sm font-bold uppercase mb-1">Valutazione Scambio</p>
                        <p className={`text-3xl font-black ${verdictColor}`}>{verdict}</p>
                        {diff > 0 && <p className="text-white font-bold mt-2">Differenza di valore: <span className="text-orange-400">€{diff}</span></p>}
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="bg-gray-900 p-4 rounded-xl border border-blue-500 flex flex-col">
                            <h3 className="text-xl font-black text-blue-400 text-center mb-2">IO DO</h3>
                            <p className="text-4xl font-black text-white text-center mb-4">€{leftTotal.toFixed(2)}</p>
                            <button onClick={() => setActiveSide('left')} className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded-lg mb-4">+ Aggiungi Carta</button>
                            <div className="space-y-2 flex-1">
                                {leftCards.map(c => (
                                    <div key={c.id} className="flex justify-between items-center bg-gray-800 p-2 rounded border border-gray-600">
                                        <span className="text-white font-bold text-sm truncate flex-1">{c.name}</span>
                                        <span className="text-emerald-400 font-black mx-2">€{c.price.toFixed(2)}</span>
                                        <button onClick={() => removeCard(c.id, 'left')} className="text-red-500 font-black px-2">X</button>
                                    </div>
                                ))}
                            </div>
                        </div>
                        <div className="bg-gray-900 p-4 rounded-xl border border-red-500 flex flex-col">
                            <h3 className="text-xl font-black text-red-400 text-center mb-2">TU DAI</h3>
                            <p className="text-4xl font-black text-white text-center mb-4">€{rightTotal.toFixed(2)}</p>
                            <button onClick={() => setActiveSide('right')} className="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-2 rounded-lg mb-4">+ Aggiungi Carta</button>
                            <div className="space-y-2 flex-1">
                                {rightCards.map(c => (
                                    <div key={c.id} className="flex justify-between items-center bg-gray-800 p-2 rounded border border-gray-600">
                                        <span className="text-white font-bold text-sm truncate flex-1">{c.name}</span>
                                        <span className="text-emerald-400 font-black mx-2">€{c.price.toFixed(2)}</span>
                                        <button onClick={() => removeCard(c.id, 'right')} className="text-red-500 font-black px-2">X</button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
                {activeSide && (
                    <div className="fixed inset-0 bg-black/90 flex items-center justify-center z-[9999] p-4">
                        <div className="bg-gray-800 p-6 rounded-xl w-full max-w-md border border-gray-600 shadow-2xl">
                            <div className="flex justify-between items-center mb-4">
                                <h3 className="text-white font-bold text-xl">Cerca Carta per Scambio</h3>
                                <button onClick={() => setActiveSide(null)} className="text-gray-400 text-2xl font-black">✕</button>
                            </div>
                            <form onSubmit={searchCardForTrade} className="flex gap-2 mb-4">
                                <input type="text" value={searchQ} onChange={e=>setSearchQ(e.target.value)} placeholder="Nome carta..." className="flex-1 bg-gray-900 text-white p-3 rounded-lg outline-none border border-gray-700" autoFocus />
                                <button type="submit" className="bg-orange-600 hover:bg-orange-500 text-white font-bold px-4 rounded-lg">Cerca</button>
                            </form>
                            <div className="max-h-64 overflow-y-auto space-y-2">
                                {searchResults.map(res => {
                                    let p = (res && res.prices && typeof res.prices === 'object' && res.prices.eur) ? res.prices.eur : "0.00";
                                    return (
                                        <div key={res.id} onClick={() => addCardToTrade(res)} className="bg-gray-900 p-3 rounded border border-gray-700 flex justify-between items-center cursor-pointer hover:border-orange-500">
                                            <span className="text-white font-bold text-sm">{res.name}</span>
                                            <span className="text-emerald-400 font-black text-xs">€{p}</span>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                )}
            </div>
        );
    };

    // --- AREA STAMPA PROXY PERSONALIZZATA ---
    const ProxyPrintArea = ({ printQueue, setPrintQueue, setView }) => {
        useEffect(() => {
            const style = document.createElement('style');
            style.innerHTML = `
                @media print {
                    body * { visibility: hidden; }
                    #print-area, #print-area * { visibility: visible; }
                    #print-area { position: absolute; left: 0; top: 0; width: 210mm; margin: 0; padding: 0; }
                    .no-print { display: none !important; }
                    @page { margin: 5mm; }
                }
            `;
            document.head.appendChild(style);
            return () => document.head.removeChild(style);
        }, []);

        const removeFromQueue = (index) => {
            const newQ = [...printQueue]; newQ.splice(index, 1); setPrintQueue(newQ);
        };

        const clearQueue = () => { if(window.confirm("Vuoi svuotare tutta l'area di stampa?")) setPrintQueue([]); };

        return (
            <div className="max-w-4xl mx-auto p-4 text-white animate-fade">
                <div className="no-print flex flex-wrap justify-between items-center mb-6 bg-gray-800 p-4 rounded-xl border border-gray-600 shadow-xl">
                    <button onClick={() => setView('home')} className="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded font-bold">⬅ Torna Indietro</button>
                    <div className="text-center">
                        <h2 className="text-2xl font-black text-white">🖨️ Area di Stampa Proxy</h2>
                        <p className="text-gray-400 text-sm font-bold">{printQueue.length} carte in coda</p>
                    </div>
                    <div className="flex gap-2">
                        <button onClick={clearQueue} className="bg-red-700 hover:bg-red-600 text-white px-4 py-2 rounded font-bold">Svuota</button>
                        <button onClick={() => window.print()} className="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2 rounded-lg font-black shadow-lg">STAMPA FOGLIO A4</button>
                    </div>
                </div>
                <div id="print-area" className="bg-white mx-auto flex flex-wrap content-start p-4" style={{ width: '210mm', minHeight: '297mm' }}>
                    {printQueue.map((card, idx) => (
                        <div key={idx} className="relative group" style={{ width: '63.5mm', height: '88.9mm', margin: '1.5mm' }}>
                            <img src={card.img} alt={card.name} className="w-full h-full object-cover rounded-[3mm] border border-black" />
                            <button onClick={() => removeFromQueue(idx)} className="no-print absolute top-2 right-2 bg-red-600 text-white font-black w-8 h-8 rounded-full opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center shadow-lg">X</button>
                        </div>
                    ))}
                    {printQueue.length === 0 && (
                        <p className="no-print text-gray-500 text-xl font-bold w-full text-center mt-20">L'area di stampa è vuota.</p>
                    )}
                </div>
            </div>
        );
    };

    // --- RACCOGLITORE CARTE (ALBUM VIRTUALE) ---
    const CollectionBinder = ({ navigate, collection, setCollection, mtgSets }) => {
        const [searchQ, setSearchQ] = useState("");
        const [activeFolder, setActiveFolder] = useState("Tutte");
        const [colorFilter, setColorFilter] = useState([]);
        const [typeFilter, setTypeFilter] = useState("");
        const [rarityFilter, setRarityFilter] = useState("");
        const [expFilter, setExpFilter] = useState(""); // Filtro espansione
        const [viewMode, setViewMode] = useState("album");
        const [albumPage, setAlbumPage] = useState(0);

        const folders = ["Tutte", "Generale", "Scambi", "Di Valore", "Da Vendere"];
        const ManaColors = [ 
            { id: 'W', c: 'bg-yellow-100 text-yellow-900' }, 
            { id: 'U', c: 'bg-blue-500 text-white' }, 
            { id: 'B', c: 'bg-gray-800 text-white' }, 
            { id: 'R', c: 'bg-red-500 text-white' }, 
            { id: 'G', c: 'bg-green-500 text-white' }, 
            { id: 'C', c: 'bg-gray-400 text-gray-900' } 
        ];

        const toggleColor = (m) => setColorFilter(colorFilter.includes(m) ? colorFilter.filter(x => x !== m) : [...colorFilter, m]);

        const updateCard = (id, newQty, newFolder) => {
            if (newQty <= 0) {
                if(window.confirm("Rimuovere questa carta dal raccoglitore?")) {
                    setCollection((collection || []).filter(c => c.id !== id));
                }
            } else {
                setCollection((collection || []).map(c => c.id === id ? { ...c, qty: newQty, folder: newFolder } : c));
            }
        };

        // ORDINAMENTO MASTER: Colore > Tipo > Rarità > Espansione > Nome
        const rarityVal = { "mythic": 4, "rare": 3, "uncommon": 2, "common": 1 };
        const colorVal = (colors) => {
            if (!colors || colors.length === 0) return 6;
            if (colors.length > 1) return 7;
            const order = { 'W':1, 'U':2, 'B':3, 'R':4, 'G':5 };
            return order[colors[0]] || 8;
        };

        let processedCollection = [...(collection || [])].sort((a, b) => {
            if (colorVal(a.colors) !== colorVal(b.colors)) return colorVal(a.colors) - colorVal(b.colors);
            const tA = (a.type || "").split(' ')[0]; const tB = (b.type || "").split(' ')[0];
            if (tA !== tB) return tA.localeCompare(tB);
            const rA = rarityVal[a.rarity] || 0; const rB = rarityVal[b.rarity] || 0;
            if (rA !== rB) return rB - rA; 
            const sA = a.setName || ""; const sB = b.setName || "";
            if (sA !== sB) return sA.localeCompare(sB);
            return (a.name || "").localeCompare(b.name || "");
        });

        // FILTRI COMBINATI
        processedCollection = processedCollection.filter(c => {
            const matchName = (c.name || "").toLowerCase().includes(searchQ.toLowerCase()) || (c.setName || "").toLowerCase().includes(searchQ.toLowerCase());
            const matchFolder = activeFolder === "Tutte" || c.folder === activeFolder;
            let matchColor = true;
            if (colorFilter.length > 0) {
                if (!c.colors || c.colors.length === 0) matchColor = colorFilter.includes('C');
                else matchColor = colorFilter.some(col => c.colors.includes(col));
            }
            const matchType = typeFilter === "" || (c.type || "").toLowerCase().includes(typeFilter.toLowerCase());
            const matchRarity = rarityFilter === "" || (c.rarity || "") === rarityFilter;
            const matchExp = expFilter === "" || (c.setCode || "") === expFilter;
            return matchName && matchFolder && matchColor && matchType && matchRarity && matchExp;
        });

        useEffect(() => { setAlbumPage(0); }, [searchQ, activeFolder, colorFilter, typeFilter, rarityFilter, expFilter, viewMode]);

        // --- FUNZIONI DI BACKUP ---
        const exportCollection = () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(collection));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "mtg_collection_backup.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        };

        const importCollection = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const imported = JSON.parse(event.target.result);
                    if (Array.isArray(imported)) {
                        setCollection(imported);
                        alert("✅ Collezione importata con successo!");
                    } else { alert("❌ File non valido."); }
                } catch (err) { alert("❌ Errore nella lettura del file."); }
            };
            reader.readAsText(file);
        };

        const totalValue = processedCollection.reduce((acc, c) => acc + ((c.price || 0) * (c.qty || 1)), 0);

                    {viewMode === 'album' && (

    };

    // --- COMPONENTE TAB REGOLE E LEGALITA' ---
    const CardDetailsTabs = ({ card }) => {
        const [activeTab, setActiveTab] = useState('legalita');
        const [rulings, setRulings] = useState([]);
        const [loading, setLoading] = useState(false);

        useEffect(() => {
            if (activeTab === 'regolamento' && rulings.length === 0 && card && card.id) {
                setLoading(true);
                fetch(`https://api.scryfall.com/cards/${card.id}/rulings`)
                    .then(res => res.json())
                    .then(data => setRulings(data.data || []))
                    .catch(() => setRulings([]))
                    .finally(() => setLoading(false));
            }
        }, [activeTab, card]);

        if (!card) return null;

        return (
            <div className="w-full max-w-sm mt-4 bg-gray-900 rounded-xl border border-gray-700 overflow-hidden shadow-inner">
                <div className="flex bg-gray-950 p-1 rounded-t-xl">
                    <button onClick={() => setActiveTab('legalita')} className={`flex-1 py-2 text-sm font-black rounded-lg transition-all ${activeTab === 'legalita' ? 'bg-orange-500 text-black shadow-md' : 'text-gray-400 hover:text-white'}`}>Versioni / Legalità</button>
                    <button onClick={() => setActiveTab('regolamento')} className={`flex-1 py-2 text-sm font-black rounded-lg transition-all ${activeTab === 'regolamento' ? 'bg-orange-500 text-black shadow-md' : 'text-gray-400 hover:text-white'}`}>Regolamento</button>

                {activeTab === 'legalita' && (
                    <div className="p-4 grid grid-cols-2 gap-3 max-h-[35vh] overflow-y-auto">
                        {formatsToShow.map(fmt => {

                            return (
                                <div key={fmt} className="flex items-center gap-2 text-xs sm:text-sm">
                                    {isLegal ? (
                                        <span className="bg-green-500 text-black rounded-full w-4 h-4 flex items-center justify-center text-[10px] font-black shrink-0">✓</span>
                                    ) : (
                                        <span className="text-gray-500 font-black w-4 text-center shrink-0">-</span>

                                    <span className="text-gray-300 capitalize truncate">{fmt}</span>

                )}

                {activeTab === 'regolamento' && (
                    <div className="p-4 max-h-[35vh] overflow-y-auto space-y-4">
                        {loading ? ( <p className="text-center text-yellow-500 font-bold py-4">Ricerca regole su Scryfall...</p> ) : rulings.length > 0 ? (
                            rulings.map((r, i) => (
                                <div key={i} className="text-xs sm:text-sm border-b border-gray-800 pb-2">
                                    <p className="text-gray-200 mb-1 leading-relaxed">{r.comment}</p>

    // --- COMPONENTE STATISTICHE PARTITE ---
    const MatchStatistics = ({ navigate }) => {
        const [history, setHistory] = useState([]);
        const [loading, setLoading] = useState(true);

        useEffect(() => {
            db.collection('match_history').orderBy('date', 'desc').get()
                .then(snap => {
                    const data = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setHistory(data);
                    setLoading(false);
                }).catch(() => setLoading(false));
        }, []);

        const totalMatches = history.length;
        const winsByPlayer = {};
        const winsByCmdr = {};

        history.forEach(m => {
            winsByPlayer[m.winnerName] = (winsByPlayer[m.winnerName] || 0) + 1;
            if (m.winnerCommander) winsByCmdr[m.winnerCommander] = (winsByCmdr[m.winnerCommander] || 0) + 1;
        });

        return (
            <div className="max-w-2xl mx-auto space-y-4 p-4 animate-fade">
                <button onClick={() => navigate('game')} className="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded font-bold mb-2 shadow transition-colors">⬅ Torna al Tavolo</button>
                <div className="bg-gray-800/90 p-6 rounded-xl border border-gray-600 shadow-xl backdrop-blur-sm">
                    <h2 className="text-3xl font-black text-center text-purple-400 drop-shadow-md mb-6">📊 Hall of Fame</h2>
                    
                    {loading ? <p className="text-center text-white">Caricamento statistiche...</p> : totalMatches === 0 ? <p className="text-center text-gray-400">Nessuna partita registrata. Gioca e dichiara un vincitore!</p> : (
                        <div className="space-y-6">
                            <div className="bg-gray-900 p-4 rounded-xl border border-gray-700 text-center shadow-inner">

                                        <div key={name} className="flex justify-between items-center mb-2">

                                            <span className="bg-emerald-800 text-emerald-200 px-2 py-1 rounded text-xs font-black">{wins} Vittorie ({((wins/totalMatches)*100).toFixed(0)}%)</span>
                                        </div>
                                    ))}
                                </div>

                                <div className="bg-gray-900 p-4 rounded-xl border border-gray-700 shadow-inner">
                                    <h3 className="text-orange-400 font-black mb-3 border-b border-gray-700 pb-2">👑 Comandanti più Letali</h3>
                                    {Object.entries(winsByCmdr).filter(([name])=>name!=="Sconosciuto").sort((a,b)=>b[1]-a[1]).map(([cmdr, wins]) => (

                                </div>
                            </div>
                        </div>
                    )}
                </div>
            </div>
        );
    };

    // --- PROXY EDITOR ---
    const ProxyEditor = ({card, onClose, onSave, isStandalone}) => {
      const [baseQuery, setBaseQuery] = useState("");
      const [baseCard, setBaseCard] = useState(card ? {name: card.name, type: card.type, img: card.image, cmc: card.cmc} : null);
      const [customName, setCustomName] = useState(""); const [customImg, setCustomImg] = useState("");
      const [zoom, setZoom] = useState(1); const [posX, setPosX] = useState(50); const [posY, setPosY] = useState(50);
      const [maskTop, setMaskTop] = useState(11.5); const [maskHeight, setMaskHeight] = useState(44); 
      const [maskLeft, setMaskLeft] = useState(8.2); const [maskWidth, setMaskWidth] = useState(83.6);
      const [isGenerating, setIsGenerating] = useState(false);

      const searchBase = () => {
        if(!baseQuery.trim()) return;
        fetch(`https://api.scryfall.com/cards/named?fuzzy=${encodeURIComponent(baseQuery.trim())}`).then(res => res.json()).then(c => {
             try {
                 if(c.id) {
                   let imgUrl = "";
                   if (c.image_uris && c.image_uris.normal) imgUrl = c.image_uris.normal; else if (c.card_faces && c.card_faces.length > 0 && c.card_faces[0].image_uris) imgUrl = c.card_faces[0].image_uris.normal;
                   setBaseCard({ name: c.name || "Sconosciuta", type: c.type_line || "", img: imgUrl, cmc: c.cmc || 0 }); setCustomName(""); setCustomImg(""); setZoom(1); setPosX(50); setPosY(50); setMaskTop(11.5); setMaskHeight(44); setMaskLeft(8.2); setMaskWidth(83.6);
                 } else { alert("Carta non trovata"); }
             } catch(err) { console.error("Errore", err); }
          }).catch(e => { console.error("Rete", e); });
      };

      const handleImage = (e) => { const file = e.target.files[0]; if(file) { const r = new FileReader(); r.onload = (ev) => setCustomImg(ev.target.result); r.readAsDataURL(file); } };

      const eseguiSalvataggio = () => {
        const proxyAttuali = JSON.parse(localStorage.getItem('mtg_proxies') || '[]');
        if (proxyAttuali.length >= 20) {
            return alert("Limite raggiunto! Puoi avere al massimo 20 Proxy contemporaneamente. Eliminane qualcuna per crearne di nuove.");
        }
        if(!baseCard || !customImg) return alert("Carica un'immagine!");
        setIsGenerating(true);
        const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
        const bImg = new Image(); bImg.crossOrigin = "anonymous"; bImg.src = baseCard.img;

        bImg.onload = () => {
          canvas.width = bImg.width; canvas.height = bImg.height; ctx.drawImage(bImg, 0, 0, canvas.width, canvas.height);
          const uImg = new Image(); uImg.src = customImg;
          uImg.onload = () => {
             const artX = canvas.width * (maskLeft / 100); const artW = canvas.width * (maskWidth / 100); const artY = canvas.height * (maskTop / 100); const artH = canvas.height * (maskHeight / 100);
             ctx.save(); ctx.beginPath(); ctx.rect(artX, artY, artW, artH); ctx.clip(); 
             const boxAspect = artW / artH; const imgAspect = uImg.width / uImg.height; let baseW, baseH;
             if (imgAspect > boxAspect) { baseH = artH; baseW = uImg.width * (artH / uImg.height); } else { baseW = artW; baseH = uImg.height * (artW / uImg.width); }
             const finalW = baseW * zoom; const finalH = baseH * zoom; const offsetX = finalW * ((posX - 50) / 100); const offsetY = finalH * ((posY - 50) / 100);
             const imgX = artX + (artW / 2) - (finalW / 2) + offsetX; const imgY = artY + (artH / 2) - (finalH / 2) + offsetY;
             ctx.drawImage(uImg, imgX, imgY, finalW, finalH); ctx.restore();

             if (customName) {
                const tx = canvas.width * 0.07; const ty = canvas.height * 0.045; const tw = canvas.width * 0.65; const th = canvas.height * 0.055;
                ctx.fillStyle = "#1a1a1a"; ctx.fillRect(tx, ty, tw, th); ctx.strokeStyle = "#555"; ctx.strokeRect(tx, ty, tw, th);
                ctx.fillStyle = "white"; ctx.font = `bold ${canvas.height * 0.025}px Georgia, serif`; ctx.fillText(customName, tx + 10, ty + (th/1.8));
                ctx.fillStyle = "#aaa"; ctx.font = `italic ${canvas.height * 0.015}px Georgia, serif`; ctx.fillText(baseCard.name, tx + 10, ty + (th/1.1));
             }
             const finalDataUrl = canvas.toDataURL("image/jpeg", 0.9);
             const newProxy = { id: 'proxy-' + Date.now(), name: customName || baseCard.name, image: finalDataUrl, proxyImage: finalDataUrl, imageBack: null, type: baseCard.type, cmc: baseCard.cmc || 0, colors: card ? (card.colors || []) : [], isCommander: false, isCustom: true };
             let savedProxies = JSON.parse(localStorage.getItem('mtg_proxies') || '[]'); savedProxies.push(newProxy); localStorage.setItem('mtg_proxies', JSON.stringify(savedProxies));
             
             if (auth.currentUser) { syncSingleProxyToCloud(auth.currentUser.uid, newProxy); }

             setIsGenerating(false);
             if(isStandalone) { alert("Proxy Salvata nel Database!"); } else { onSave({...card, proxyImage: finalDataUrl, name: customName || card.name, isCustom: true}); }
          };
        };
      };

      const editorUI = (
        <div className="w-full max-w-md bg-gray-800 p-4 rounded-xl border border-gray-600 shadow-2xl space-y-4 mx-auto animate-fade">
          <div className="flex justify-between items-center mb-2 border-b border-gray-700 pb-2">
             <h2 className="text-xl font-bold text-purple-400">Proxy Creator</h2>
             {!isStandalone && <button onClick={onClose} className="bg-gray-600 px-3 py-1 rounded text-white font-bold">✖</button>}
          </div>
          {isStandalone && ( <div className="flex gap-2 mb-4"><input type="text" placeholder="Originale (es. Sol Ring)" value={baseQuery} onChange={e => setBaseQuery(e.target.value)} className="flex-1 bg-gray-900 border border-gray-600 p-2 rounded text-white outline-none" /><button onClick={searchBase} className="bg-purple-600 px-3 rounded text-white font-bold">Cerca</button></div> )}
          {baseCard && (

             <label className="block w-full bg-gray-700 hover:bg-gray-600 text-center py-2 rounded cursor-pointer font-bold text-sm text-white shadow border border-gray-500 transition-colors">📸 Carica Immagine <input type="file" accept="image/*" className="hidden" onChange={handleImage} /></label>
             {customImg && (
                 <div className="bg-gray-900 p-3 rounded-lg border border-gray-700 space-y-3">
                    <div className="space-y-1">
                      <p className="text-[10px] font-bold text-blue-400 uppercase">Cornice Riquadro</p>
                      <div className="flex items-center gap-2"><span className="text-[10px] w-10 text-white font-bold">Su</span><input type="range" min="0" max="30" step="0.5" value={maskTop} onChange={e=>setMaskTop(e.target.value)} className="w-full accent-blue-500" /></div>
                      <div className="flex items-center gap-2"><span className="text-[10px] w-10 text-white font-bold">Alt.</span><input type="range" min="20" max="100" step="0.5" value={maskHeight} onChange={e=>setMaskHeight(e.target.value)} className="w-full accent-blue-500" /></div>
                      <div className="flex items-center gap-2"><span className="text-[10px] w-10 text-white font-bold">Sx</span><input type="range" min="0" max="20" step="0.2" value={maskLeft} onChange={e=>setMaskLeft(e.target.value)} className="w-full accent-blue-500" /></div>
                      <div className="flex items-center gap-2"><span className="text-[10px] w-10 text-white font-bold">Largh.</span><input type="range" min="50" max="100" step="0.5" value={maskWidth} onChange={e=>setMaskWidth(e.target.value)} className="w-full accent-blue-500" /></div>
                    </div>
                    <div className="space-y-1 pt-2 border-t border-gray-700">
                      <p className="text-[10px] font-bold text-purple-400 uppercase">Foto Interna</p>
                      <div className="flex items-center gap-2"><span className="text-[10px] w-10 text-white font-bold">Zoom</span><input type="range" min="1" max="3" step="0.1" value={zoom} onChange={e=>setZoom(e.target.value)} className="w-full accent-purple-500" /></div>
                      <div className="flex items-center gap-2"><span className="text-[10px] w-10 text-white font-bold">Orizz</span><input type="range" min="0" max="100" value={posX} onChange={e=>setPosX(e.target.value)} className="w-full accent-purple-500" /></div>
                      <div className="flex items-center gap-2"><span className="text-[10px] w-10 text-white font-bold">Vert</span><input type="range" min="0" max="100" value={posY} onChange={e=>setPosY(e.target.value)} className="w-full accent-purple-500" /></div>

                 <img src={baseCard.img} className="absolute inset-0 w-full h-full pointer-events-none" />
                 {customImg && ( <div className="absolute bg-black z-10 overflow-hidden shadow-[inset_0_0_15px_rgba(0,0,0,0.8)] border border-black/50" style={{ top: `${maskTop}%`, left: `${maskLeft}%`, width: `${maskWidth}%`, height: `${maskHeight}%` }}><img src={customImg} style={{ position: 'absolute', top: 0, left: 0, width: '100%', height: '100%', objectFit: 'cover', transform: `translate(${posX - 50}%, ${posY - 50}%) scale(${zoom})` }} /></div> )}
                 {customName && ( <div className="absolute z-20 flex items-center px-3" style={{ top: '4.8%', left: '7.5%', width: '65%', height: '4.5%' }}><span className="text-white tracking-wider truncate" style={{ fontFamily: "Georgia, serif", fontSize: '16px', fontWeight: '900', textShadow: '2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000' }}>{customName}</span></div> )}
             </div>
             <button onClick={eseguiSalvataggio} disabled={isGenerating} className="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-4 rounded-lg shadow-[0_0_15px_rgba(22,163,74,0.5)] mt-4 transition-all">
                 {isGenerating ? 'Attendere...' : (isStandalone ? '💾 Crea & Salva Database' : '💾 Applica Proxy al Mazzo')}
             </button>
           </div>
          )}
        </div>
      );
      if (isStandalone) return <div className="max-w-md mx-auto pt-4 pb-10 relative z-20">{editorUI}</div>;
      
      return (
        <div className="fixed inset-0 bg-gray-900 z-[9999] h-[100dvh] w-full flex flex-col animate-fade overflow-y-auto">
           <div className="flex items-center justify-between p-4 bg-gray-800 border-b border-gray-700 sticky top-0 z-50 shadow-md">
             <button onClick={onClose} className="text-blue-400 font-bold flex items-center gap-1"><Icons.Back /> Indietro</button><h2 className="text-lg font-bold text-white truncate text-center">Proxy Editor</h2><div className="w-8"></div>
           </div>
           <div className="flex-1 p-4 flex flex-col items-center pb-20">{editorUI}</div>
        </div>
      );
    };

    // --- DECKBUILDER (CON AI CRAFTER INTEGRATO) ---
    const DeckBuilder = ({navigate, activeDeck, mtgSets}) => {
      const [deckName, setDeckName] = useState(activeDeck ? activeDeck.name : "");
      const [deckFormat, setDeckFormat] = useState(activeDeck ? (activeDeck.format || 'commander') : 'commander');
      const [deck, setDeck] = useState(activeDeck ? activeDeck.cards.map(c => ({...c, oracle_text: c.oracle_text || "", mana_cost: c.mana_cost || "", isCompanion: c.isCompanion || false})) : []);
      const [rulebreaker, setRulebreaker] = useState(activeDeck ? (activeDeck.rulebreaker || false) : false);
      const [addToSideboard, setAddToSideboard] = useState(false);
      
      const [query, setQuery] = useState("");
      const [oracleText, setOracleText] = useState("");
      const [mana, setMana] = useState([]);
      const [colorMatchType, setColorMatchType] = useState('include'); 
      const [isMulticolorOnly, setIsMulticolorOnly] = useState(false);
      const [isCommanderOnly, setIsCommanderOnly] = useState(false);

      const [superType, setSuperType] = useState(""); const [cardType, setCardType] = useState("");
      const [cardType2, setCardType2] = useState(""); const [subType, setSubType] = useState("");
      const [rarity, setRarity] = useState(""); const [cmcOp, setCmcOp] = useState("="); const [cmcVal, setCmcVal] = useState("");
      const [expFilter, setExpFilter] = useState(""); 
      
      const [allResults, setAllResults] = useState([]);
      const [localPage, setLocalPage] = useState(0);
      const [nextScryfallUrl, setNextScryfallUrl] = useState(null);
      const [loading, setLoading] = useState(false);
      
      const [selectedCard, setSelectedCard] = useState(null); const [addQty, setAddQty] = useState(1); 
      const [managingCard, setManagingCard] = useState(null); const [manageQty, setManageQty] = useState(0);
      const [editingProxyCard, setEditingProxyCard] = useState(null);
      const [importText, setImportText] = useState(""); const [showImport, setShowImport] = useState(false);
      
      const [savedScroll, setSavedScroll] = useState(0);
      const [itaImg, setItaImg] = useState(null); const [itaImgBack, setItaImgBack] = useState(null);
      const [showIta, setShowIta] = useState(false); const [showBack, setShowBack] = useState(false);
      const [translating, setTranslating] = useState(false);
      const [printsList, setPrintsList] = useState([]); const [loadingPrints, setLoadingPrints] = useState(false);

      // --- STATI AI CRAFTER ---
      const [showAiCrafter, setShowAiCrafter] = useState(false);
      const [aiCmdr, setAiCmdr] = useState("");
      const [aiStrategy, setAiStrategy] = useState("");
      const [aiInclude, setAiInclude] = useState("");
      const [aiBracket, setAiBracket] = useState("3");
      const [isAiDrafting, setIsAiDrafting] = useState(false);

      const generateAiDeck = async (e) => {
          e.preventDefault();
          if(!aiCmdr.trim()) return alert("Devi almeno inserire il nome del Comandante!");
          
          let apiKey = localStorage.getItem('gemini_api_key');
          if (!apiKey) {
              apiKey = window.prompt("Per generare mazzi con l'IA serve la API Key gratuita di Google.\n\nPuoi ottenerla in 1 minuto su: https://aistudio.google.com/\n\nIncolla qui la tua API Key:");
              if (!apiKey) return;
              localStorage.setItem('gemini_api_key', apiKey);
          }

          setIsAiDrafting(true);
          const promptText = `Sei un Master Deckbuilder e un giocatore professionista di Magic The Gathering. Il tuo compito è creare la lista Commander (EDH) perfetta da 100 carte esatte.
Comandante: ${aiCmdr}.
Stile di gioco desiderato: ${aiStrategy || "Bilanciato, sinergico col comandante"}.
Carte da includere assolutamente: ${aiInclude || "Nessuna specifica"}.
Power Level (Bracket): Livello ${aiBracket}.

REGOLE DI COSTRUZIONE:
1. Analizza mentalmente i dati di EDHREC, MTGGoldfish e The Forge per trovare le sinergie ottimali e le carte statisticamente più forti per questo comandante.
2. Aggiungi alcune carte "tech" (dimenticate o poco usate) che creano interazioni fortissime e inaspettate.
3. REGOLE BRACKET: Se il Bracket è 1 o 2, NON includere NESSUNA carta "Gamechanger" (niente fast mana come Mana Crypt/Jeweled Lotus, niente carte stax oppressive, niente tutori a costo 1, niente turni extra) e NESSUNA combo infinita. Se il Bracket è 3, puoi includere al massimo 2 o 3 Gamechanger universali e al massimo una combo che richieda più pezzi. Se il Bracket è 4 (cEDH/Estremo), ottimizza al massimo senza alcun limite (usa fast mana, free spells, tutori e combo letali/veloci).
4. Rispondi SOLO ed ESCLUSIVAMENTE con la lista delle carte testuale. Niente saluti, niente spiegazioni, niente formattazione markdown, niente titoli. Solo l'elenco.
5. Il formato deve essere rigorosamente: 1 Nome Carta in inglese (es. 1 Sol Ring).
6. Includi esattamente 100 carte (terre base incluse).`;

          try {
              const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
                  method: 'POST', headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
              });
              const data = await response.json();
              if (data.error) throw new Error(data.error.message);

              const decklist = data.candidates[0].content.parts[0].text.replace(/```/g, '').trim();

              setShowAiCrafter(false);
              setImportText(decklist);
              setShowImport(true);
          } catch(err) {
              alert("Errore API: " + err.message + "\n\nUsa il tasto 'Copia Prompt Esterno' se il problema persiste.");
          }
          setIsAiDrafting(false);
      };

      const copyAiPrompt = (e) => {
          e.preventDefault();
          if(!aiCmdr.trim()) return alert("Devi almeno inserire il nome del Comandante!");
          const promptText = `Sei un Master Deckbuilder e un giocatore professionista di Magic The Gathering. Il tuo compito è creare la lista Commander (EDH) perfetta da 100 carte esatte.\nComandante: ${aiCmdr}.\nStile di gioco desiderato: ${aiStrategy || "Bilanciato, sinergico col comandante"}.\nCarte da includere assolutamente: ${aiInclude || "Nessuna specifica"}.\nPower Level (Bracket): Livello ${aiBracket}.\n\nREGOLE DI COSTRUZIONE:\n1. Analizza mentalmente i dati di EDHREC, MTGGoldfish e The Forge per trovare le sinergie ottimali e le carte statisticamente più forti per questo comandante.\n2. Aggiungi alcune carte "tech" (dimenticate o poco usate) che creano interazioni fortissime e inaspettate.\n3. REGOLE BRACKET: Se il Bracket è 1 o 2, NON includere NESSUNA carta "Gamechanger" (niente fast mana come Mana Crypt/Jeweled Lotus, niente carte stax oppressive, niente tutori a costo 1, niente turni extra) e NESSUNA combo infinita. Se il Bracket è 3, puoi includere al massimo 2 o 3 Gamechanger universali e al massimo una combo che richieda più pezzi. Se il Bracket è 4 (cEDH/Estremo), ottimizza al massimo senza alcun limite (usa fast mana, free spells, tutori e combo letali/veloci).\n4. Rispondi SOLO ed ESCLUSIVAMENTE con la lista delle carte testuale. Niente saluti, niente spiegazioni, niente formattazione markdown, niente titoli. Solo l'elenco.\n5. Il formato deve essere rigorosamente: 1 Nome Carta in inglese (es. 1 Sol Ring).\n6. Includi esattamente 100 carte (terre base incluse).`;
          navigator.clipboard.writeText(promptText);
          alert("Prompt copiato!\n\nIncollalo su ChatGPT o Gemini, poi copia la lista che ti genera e incollala in 'Importa da Testo'.");
          window.open('[https://gemini.google.com/](https://gemini.google.com/)', '_blank');
      };

      const openSubView = (setter, data, qtySetter = null, qtyVal = 1) => {
         setSavedScroll(window.scrollY); 
         setter({...data, originalKey: buildCardKey(data)}); 
         if(qtySetter) qtySetter(qtyVal);
         setItaImg(null); setItaImgBack(null); setShowIta(false); setShowBack(false); setPrintsList([]); window.scrollTo(0, 0);
      };
      const closeSubView = (setter) => { setter(null); setTimeout(() => window.scrollTo(0, savedScroll), 10); };

      const fetchOtherPrints = (card) => {
          if(!card.printsUrl) return alert("Questa carta non ha altre stampe disponibili sul database.");
          setLoadingPrints(true);
          fetch(card.printsUrl).then(res => res.json()).then(data => {
                if(data.data && data.data.length > 0) {
                    const mapped = data.data.filter(c => c.image_uris || (c.card_faces && c.card_faces.length > 0 && c.card_faces[0].image_uris)).map(c => {
                         let iImg = ""; let iImgBack = null;
                         if (c.image_uris && c.image_uris.normal) iImg = c.image_uris.normal;
                         else if (c.card_faces && c.card_faces.length > 0) {
                             if (c.card_faces[0].image_uris && c.card_faces[0].image_uris.normal) iImg = c.card_faces[0].image_uris.normal;
                             if (c.card_faces.length > 1 && c.card_faces[1].image_uris && c.card_faces[1].image_uris.normal) iImgBack = c.card_faces[1].image_uris.normal;
                         }
                         return { ...card, id: c.id, image: iImg, imageBack: iImgBack, rarity: c.rarity || "common", setCode: c.set || "", setName: c.set_name || "", prices: c.prices || {} };
                        });
                        setPrintsList(mapped);
                } else { alert("Nessun'altra stampa trovata."); }
                setLoadingPrints(false);
            }).catch(e => { console.error(e); setLoadingPrints(false); });
      };

      const changeArtOfExistingCard = (p) => {
         if (!managingCard) return;
         const oldKey = managingCard.originalKey || buildCardKey(managingCard);
         setDeck(deck.map(c => {
             if (buildCardKey(c) === oldKey) return { ...c, id: p.id, image: p.image, imageBack: p.imageBack, rarity: p.rarity, setCode: p.setCode, setName: p.setName, prices: p.prices };
             return c;
         }));
         alert("Stampa e Prezzo aggiornati con successo per tutte le copie!");
         closeSubView(setManagingCard); 
      };

      const translateCard = (card) => {
        if (card.isCustom) return alert("Le carte Proxy non possono essere tradotte dal database.");
        if (itaImg) { setShowIta(!showIta); return; } 
        setTranslating(true);
        fetch(`[https://api.scryfall.com/cards/search?q=](https://api.scryfall.com/cards/search?q=)!"${card.name}"+lang:it`).then(res => res.json()).then(data => {
             if (data.data && data.data.length > 0) {
                 const itCard = data.data[0]; let iImg = null; let iImgBack = null;
                 if (itCard.image_uris && itCard.image_uris.normal) { iImg = itCard.image_uris.normal; } 
                 else if (itCard.card_faces && itCard.card_faces.length > 0) {
                     if (itCard.card_faces[0].image_uris) iImg = itCard.card_faces[0].image_uris.normal;
                     if (itCard.card_faces.length > 1 && itCard.card_faces[1].image_uris) iImgBack = itCard.card_faces[1].image_uris.normal;
                 }
                 if (iImg) { setItaImg(iImg); setItaImgBack(iImgBack); setShowIta(true); } else alert("Immagine italiana non trovata.");
             } else { alert("Traduzione ufficiale italiana non stampata per questa carta."); }
             setTranslating(false);
          }).catch(e => { alert("Errore di connessione."); setTranslating(false); });
      };

      const toggleMana = (m) => setMana(mana.includes(m) ? mana.filter(x => x !== m) : [...mana, m]);

      const eseguiRicerca = (url, isNewSearch = false) => {
        setLoading(true);
        fetch(url).then(res => res.json()).then(data => {
            try {
                if (data.data && Array.isArray(data.data)) {
                   const cards = data.data.filter(c => c.image_uris || (c.card_faces && c.card_faces.length > 0 && c.card_faces[0].image_uris)).map(c => {
                     let img = ""; let imgBack = null; let oracle_text = c.oracle_text || ""; let mana_cost = c.mana_cost || "";
                     if (c.image_uris && c.image_uris.normal) { img = c.image_uris.normal; } 
                     else if (c.card_faces && c.card_faces.length > 0) {
                         if (c.card_faces[0].image_uris && c.card_faces[0].image_uris.normal) img = c.card_faces[0].image_uris.normal;
                         if (c.card_faces.length > 1 && c.card_faces[1].image_uris && c.card_faces[1].image_uris.normal) imgBack = c.card_faces[1].image_uris.normal;
                         if (!oracle_text) oracle_text = c.card_faces.map(f=>f.oracle_text).join(' ');
                         if (!mana_cost) mana_cost = c.card_faces[0].mana_cost;
                     }
                     return { id: c.id || Math.random().toString(), name: c.name || "Sconosciuta", image: img, imageBack: imgBack, type: c.type_line || "", cmc: c.cmc || 0, colors: c.color_identity || [], legalities: c.legalities || {}, printsUrl: c.prints_search_uri || null, isCommander: false, isCompanion: false, oracle_text: oracle_text, mana_cost: mana_cost, prices: c.prices || {} };
                   });
                   if(isNewSearch) { setAllResults(cards); setLocalPage(0); } else { setAllResults(prev => [...prev, ...cards]); }
                   setNextScryfallUrl(data.has_more ? data.next_page : null);
                } else { if(isNewSearch) { setAllResults([]); alert("Nessuna carta trovata."); } }
            } catch (err) { console.error("Errore lettura", err); }
            setLoading(false);
          }).catch(e => { console.error("Rete", e); setLoading(false); });
      };

      const searchCard = () => {
        let searchQuery = query ? `${query} ` : "";
        if (oracleText) searchQuery += `o:"${oracleText}" `; if (rarity) searchQuery += `r:${rarity} `;
        if (expFilter) searchQuery += `e:${expFilter} `; 
        if (mana.length > 0) {
           let mStr = mana.join('');
           if (colorMatchType === 'exact') searchQuery += cardType === 'land' ? `id=${mStr} ` : `c=${mStr} `; else searchQuery += cardType === 'land' ? `id>=${mStr} ` : `c>=${mStr} `;
        }
        if (isMulticolorOnly) searchQuery += `c>1 `; if (isCommanderOnly) searchQuery += `is:commander `;
        if (superType) searchQuery += `t:${superType} `; if (cardType) searchQuery += `t:${cardType} `; if (cardType2) searchQuery += `t:${cardType2} `;
        if (subType) searchQuery += `t:${subType} `; if (cmcVal !== "") searchQuery += `cmc${cmcOp}${cmcVal} `;
        if(!searchQuery.trim()) return alert("Inserisci almeno un parametro di ricerca!");
        eseguiRicerca(`[https://api.scryfall.com/cards/search?q=$](https://api.scryfall.com/cards/search?q=$){encodeURIComponent(searchQuery.trim())}`, true);
      };

      const loadMyProxies = () => {
        const proxies = JSON.parse(localStorage.getItem('mtg_proxies') || '[]');
        if (proxies.length === 0) return alert("Non hai ancora creato nessuna Proxy! Vai in Proxy Lair.");
        setAllResults(proxies.map(p => ({...p, oracle_text: "", mana_cost: "", isCompanion: false})));
        setLocalPage(0); setNextScryfallUrl(null);
      };

      const maxLocalPages = allResults.length > 0 ? Math.ceil(allResults.length / 15) : 0;
      const currentResults = allResults.length > 0 ? allResults.slice(localPage * 15, (localPage + 1) * 15) : [];
      const goToNextPage = () => { if (localPage + 1 < maxLocalPages) { setLocalPage(localPage + 1); } else if (nextScryfallUrl) { eseguiRicerca(nextScryfallUrl, false); setLocalPage(localPage + 1); } };
      const goToPrevPage = () => { if (localPage > 0) setLocalPage(localPage - 1); };

      const addToDeckMulti = () => {
        let newCards = [];
        for(let i=0; i<addQty; i++) { newCards.push({...selectedCard, deckId: 'card-' + Date.now() + '-' + i + '-' + Math.random(), isCommander: false, isSideboard: addToSideboard, isCompanion: false}); }
        setDeck([...deck, ...newCards]); closeSubView(setSelectedCard);
      };

      const saveDeck = () => {
        if(!deckName) return alert("Dai un nome al mazzo!");
        let savedDecks = JSON.parse(localStorage.getItem('mtg_decks') || '[]');
        const newDeckObj = { id: activeDeck ? activeDeck.id : Date.now(), name: deckName, format: deckFormat, cards: deck, rulebreaker: rulebreaker, date: new Date().toLocaleDateString() };
        if(activeDeck) savedDecks = savedDecks.map(d => d.id === activeDeck.id ? newDeckObj : d); else savedDecks.push(newDeckObj);
        localStorage.setItem('mtg_decks', JSON.stringify(savedDecks));
        
        if (auth.currentUser) {
            syncToCloud(auth.currentUser.uid).catch(e => console.error("Errore Cloud:", e));
        }
        
        alert("Mazzo Salvato con successo!"); navigate('mydecks');
      };

      const handleImport = () => {
        if(!importText.trim()) return; setLoading(true); const lines = importText.split('\n'); let promises = [];
        for (let i = 0; i < lines.length; i++) {
          let line = lines[i].trim(); if(!line) continue;
          const match = line.match(/^(\d+)?\s*(.*)$/); let qty = match[1] ? parseInt(match[1]) : 1; let name = match[2];
          let p = fetch(`[https://api.scryfall.com/cards/named?exact=$](https://api.scryfall.com/cards/named?exact=$){encodeURIComponent(name)}`).then(res => { if(res.ok) return res.json(); throw new Error('Not found'); }).then(c => {
               let arr = [];
               for(let j=0; j<qty; j++) {
                 let img = ""; let imgBack = null; let oracle_text = c.oracle_text || ""; let mana_cost = c.mana_cost || "";
                 if (c.image_uris && c.image_uris.normal) { img = c.image_uris.normal; } 
                 else if (c.card_faces && c.card_faces.length > 0) {
                     if (c.card_faces[0].image_uris && c.card_faces[0].image_uris.normal) img = c.card_faces[0].image_uris.normal;
                     if (c.card_faces.length > 1 && c.card_faces[1].image_uris && c.card_faces[1].image_uris.normal) imgBack = c.card_faces[1].image_uris.normal;
                     if (!oracle_text) oracle_text = c.card_faces.map(f=>f.oracle_text).join(' ');
                     if (!mana_cost) mana_cost = c.card_faces[0].mana_cost;
                 }
                 arr.push({ id: c.id || Math.random().toString(), deckId: 'import-' + Date.now() + '-' + Math.random() + '-' + j, name: c.name || "Sconosciuta", image: img, imageBack: imgBack, type: c.type_line || "", cmc: c.cmc || 0, colors: c.color_identity || [], legalities: c.legalities || {}, printsUrl: c.prints_search_uri || null, isCommander: false, isSideboard: addToSideboard, isCompanion: false, oracle_text: oracle_text, mana_cost: mana_cost, prices: c.prices || {} });
               } return arr;
            }).catch(e => { return []; });
          promises.push(p);
        }
        Promise.all(promises).then(resultsArray => {
           let newCards = []; resultsArray.forEach(arr => { newCards = newCards.concat(arr); });
           setDeck(prev => prev.concat(newCards)); setShowImport(false); setImportText(""); setLoading(false);
        });
      };

      const saveInlineProxy = (updatedCard) => { setDeck(deck.map(c => c.deckId === updatedCard.deckId ? updatedCard : c)); closeSubView(setEditingProxyCard); };

      const deckMap = {};
      deck.forEach(c => {
         const key = buildCardKey(c); 
         if(!deckMap[key]) { deckMap[key] = { ...c, count: 1, isCmdrFlag: c.isCommander, isCompFlag: c.isCompanion }; } 
         else { deckMap[key].count++; if(c.isCommander) deckMap[key].isCmdrFlag = true; if(c.isCompanion) deckMap[key].isCompFlag = true; }
      });
      const groupedByCategory = { "Comandante": [], "Companion": [], "Creature": [], "Planeswalker": [], "Istantanei": [], "Stregonerie": [], "Artefatti": [], "Incantesimi": [], "Terre": [], "Altro": [], "Sideboard": [] };
      Object.values(deckMap).forEach(c => { groupedByCategory[getCardCategory(c)].push(c); });
      Object.keys(groupedByCategory).forEach(k => { groupedByCategory[k].sort((a,b) => a.name.localeCompare(b.name)); });

      const applyManageQty = () => {
         const oldKey = managingCard.originalKey || buildCardKey(managingCard);
         let newDeck = deck.filter(c => buildCardKey(c) !== oldKey);
         for(let i=0; i<manageQty; i++) { newDeck.push({...managingCard, deckId: 'card-' + Date.now() + '-' + i + '-' + Math.random(), isCommander: managingCard.isCommander || managingCard.isCmdrFlag || false, isCompanion: managingCard.isCompanion || managingCard.isCompFlag || false}); }
         setDeck(newDeck); closeSubView(setManagingCard);
      };

      const toggleGroupCommander = (cardKey) => { setDeck(deck.map(c => { if (buildCardKey(c) === cardKey) return {...c, isCommander: !c.isCommander}; return c; })); };
      const toggleGroupCompanion = (cardKey) => { setDeck(deck.map(c => { if (buildCardKey(c) === cardKey) return {...c, isCompanion: !c.isCompanion}; return c; })); };

      let warnings = [];
      const commanders = deck.filter(c => c.isCommander && !c.isSideboard && !c.isCompanion);
      const companions = deck.filter(c => c.isCompanion);
      const mainDeckCards = deck.filter(c => !c.isSideboard && !c.isCompanion);
      const sideCards = deck.filter(c => c.isSideboard || c.isCompanion);
      const cmdColors = new Set();
      commanders.forEach(c => { if (c.colors) c.colors.forEach(col => cmdColors.add(col)); });

      if (!rulebreaker) {
         if (deckFormat === 'premodern' && companions.length > 0) warnings.push("I Companion non sono ammessi nel formato PREMODERN (1995-2003).");
         if (deckFormat === 'commander') {
             if (mainDeckCards.length !== 100) warnings.push(`Commander: il mazzo deve avere 100 carte esatte (ora ${mainDeckCards.length}).`);
             if (sideCards.filter(c=>!c.isCompanion).length > 0) warnings.push(`Commander non prevede una Sideboard (eccetto il Companion).`);
             if (commanders.length === 0) warnings.push("Commander: Manca il Comandante.");
             else if (commanders.length > 2) warnings.push("Commander: Non puoi avere più di 2 Comandanti.");
             else if (commanders.length === 2) {
                 const partnerRegex = /partner|friends forever|choose a background|doctor's companion/i;
                 const bothHavePartner = commanders.every(c => c.oracle_text && partnerRegex.test(c.oracle_text));
                 if (!bothHavePartner) warnings.push("Commander: Hai 2 Comandanti, ma non hanno abilità legali per esserlo assieme (Partner, Background, ecc.).");
             }
             if (commanders.length > 0 && commanders.some(c => c.type && !c.type.toLowerCase().includes("legendary") && !c.type.toLowerCase().includes("planeswalker"))) warnings.push("Il Comandante dev'essere una Creatura Leggendaria o Planeswalker valido.");
         } else {
             if (mainDeckCards.length < 60) warnings.push(`${deckFormat.toUpperCase()}: minimo 60 carte (ora ${mainDeckCards.length}).`);
             if (sideCards.length > 15) warnings.push(`La Sideboard può avere massimo 15 carte (incluso Companion). (Ora ${sideCards.length}).`);
         }

         const validCompanions = ["gyruda", "jegantha", "kaheera", "keruga", "lurrus", "lutri", "obosh", "umori", "yorion", "zirda"];
         companions.forEach(comp => { if (!validCompanions.some(vc => comp.name.toLowerCase().includes(vc))) warnings.push(`La carta "${comp.name}" non è un Companion valido (solo i 10 di Ikoria possono esserlo).`); });

         if (companions.length > 1) warnings.push("Puoi avere al massimo 1 Companion in totale.");
         if (companions.length === 1) {
             const comp = companions[0]; const compName = comp.name.toLowerCase(); const deckToCheck = deck.filter(c => !c.isSideboard && !c.isCompanion); 
             if (deckFormat === 'commander' && commanders.length > 0) {
                 let compInvalidColor = false;
                 if (comp.colors) { comp.colors.forEach(col => { if (!cmdColors.has(col)) compInvalidColor = true; }); }
                 if (compInvalidColor) warnings.push(`Il Companion "${comp.name}" non rispetta l'identità di colore del Comandante.`);
             }
             if (compName.includes("kaheera")) { if (deckToCheck.some(c => c.type && c.type.toLowerCase().includes("creature") && !/cat|elemental|nightmare|dinosaur|beast/i.test(c.type.toLowerCase()))) warnings.push("Kaheera: Tutte le creature del mazzo devono essere Gatti, Elementali, Incubi, Dinosauri o Bestie."); }
             if (compName.includes("gyruda")) { if (deckToCheck.some(c => (c.cmc || 0) % 2 !== 0)) warnings.push("Gyruda: Tutte le carte del mazzo devono avere Costo Pari."); }
             if (compName.includes("obosh")) { if (deckToCheck.some(c => (c.cmc || 0) > 0 && (c.cmc || 0) % 2 === 0 && !c.type.toLowerCase().includes("land"))) warnings.push("Obosh: Tutte le carte non-terra del mazzo devono avere Costo Dispari."); }
             if (compName.includes("lurrus")) { if (deckToCheck.some(c => (c.cmc || 0) > 2 && !c.type.toLowerCase().includes("instant") && !c.type.toLowerCase().includes("sorcery") && !c.type.toLowerCase().includes("land"))) warnings.push("Lurrus: Tutti i permanenti devono avere Costo 2 o inferiore."); }
             if (compName.includes("keruga")) { if (deckToCheck.some(c => (c.cmc || 0) < 3 && !c.type.toLowerCase().includes("land"))) warnings.push("Keruga: Tutte le carte non-terra devono avere Costo 3 o superiore."); }
             if (compName.includes("jegantha")) {
                 if (deckToCheck.some(c => {
                    if (!c.mana_cost) return false; const matches = c.mana_cost.match(/\{[WUBRG]\}/g) || []; const counts = {}; matches.forEach(m => counts[m] = (counts[m] || 0) + 1); return Object.values(counts).some(v => v > 1);
                 })) warnings.push("Jegantha: Nessuna carta può avere simboli di mana doppi nel costo.");
             }
             if (compName.includes("yorion")) {
                 if (deckFormat === 'commander') warnings.push("Yorion non è un Companion legale in Commander.");
                 else if (mainDeckCards.length < 80) warnings.push("Yorion: Il mazzo principale deve avere almeno 80 carte.");
             }
             if (compName.includes("umori")) {
                 const nonLands = deckToCheck.filter(c => !c.type.toLowerCase().includes("land")); const types = new Set();
                 nonLands.forEach(c => { const tl = c.type.toLowerCase(); if(tl.includes("creature")) types.add("creature"); else if(tl.includes("artifact")) types.add("artifact"); else if(tl.includes("enchantment")) types.add("enchantment"); else if(tl.includes("planeswalker")) types.add("planeswalker"); else if(tl.includes("instant")) types.add("instant"); else if(tl.includes("sorcery")) types.add("sorcery"); else if(tl.includes("battle")) types.add("battle"); });
                 if (types.size > 1) warnings.push("Umori: Tutte le carte non-terra devono condividere lo stesso tipo di carta.");
             }
             if (compName.includes("zirda")) {
                 if (deckToCheck.some(c => {
                    const tl = c.type.toLowerCase(); if(tl.includes("instant") || tl.includes("sorcery") || tl.includes("basic land") || tl.includes("planeswalker")) return false; 
                    if(tl.includes("land") && !c.oracle_text) return false; 
                    return !/:|Equip|Cycling|Scavenge|Unearth|Outlast|Ninjutsu|Transfigure|Fortify|Bloodrush|Megamorph|Monstrosity|Adapt|Awaken|Exert|Embalm|Eternalize|Crew|Level Up/i.test(c.oracle_text || "");
                 })) warnings.push("Zirda: Ogni permanente nel mazzo deve avere un'abilità attivata.");
             }
             if (compName.includes("lutri") && deckFormat === 'commander') warnings.push("Lutri è BANNATO in Commander.");
         }

         let hasIllegalColor = false; let nameCounts = {};
         const multiCopyAllowed = ["relentless rats", "rat colony", "shadowborn apostle", "persistent petitioners", "dragon's approach", "slime against humanity", "nazgûl"];

         deck.forEach(c => {
            if (c.legalities && c.legalities[deckFormat] !== 'legal' && c.legalities[deckFormat] !== 'restricted') {
                if(!warnings.includes(`La carta "${c.name}" è BANNATA/ILLEGALE in ${deckFormat.toUpperCase()}.`)) warnings.push(`La carta "${c.name}" è BANNATA/ILLEGALE in ${deckFormat.toUpperCase()}.`);
            }
            if (deckFormat === 'commander' && !c.isCommander && !c.isCompanion && c.colors && c.colors.length > 0) {
               if (cmdColors.size === 0) hasIllegalColor = true; else c.colors.forEach(col => { if (!cmdColors.has(col)) hasIllegalColor = true; });
            }
            let nLower = c.name ? c.name.toLowerCase() : ""; let isBasic = c.type && c.type.toLowerCase().includes("basic"); let canBypassCount = isBasic || multiCopyAllowed.includes(nLower); nameCounts[c.name] = (nameCounts[c.name] || 0) + 1;
            
            if (!canBypassCount) {
               if (deckFormat === 'commander' && nameCounts[c.name] > 1 && !c.isCompanion) {
                  if(!warnings.includes(`Singleton violata: troppe copie di "${c.name}".`)) warnings.push(`Singleton violata: troppe copie di "${c.name}".`);
               } else if (deckFormat === 'vintage' && c.legalities && c.legalities.vintage === 'restricted' && nameCounts[c.name] > 1) {
                  if(!warnings.includes(`VINTAGE RESTRICTED: massimo 1 copia di "${c.name}".`)) warnings.push(`VINTAGE RESTRICTED: massimo 1 copia di "${c.name}".`);
               } else if (deckFormat !== 'commander' && nameCounts[c.name] > 4) {
                  if(!warnings.includes(`Massimo 4 copie superato per "${c.name}".`)) warnings.push(`Massimo 4 copie superato per "${c.name}".`);
               }
            }
         });
         if (hasIllegalColor) warnings.push("Hai inserito carte fuori dall'Identità di Colore del Comandante.");
      }

      const totalCMC = deck.filter(c => !c.isSideboard && !c.isCompanion).reduce((acc, c) => acc + (c.cmc || 0), 0);
      const avgCMC = mainDeckCards.length > 0 ? (totalCMC / mainDeckCards.length).toFixed(2) : 0;
      const isSubViewActive = selectedCard || managingCard || editingProxyCard;

      const RenderModaleCarta = ({ targetCard, setterState, qtyVal, setQtyVal, actionLabel, actionFunc, closeFunc }) => {

                      {translating ? "Traduco..." : (showIta ? "🇬🇧 Torna in Inglese" : "🇮🇹 Tenta Traduzione")}

                 <div className="bg-gray-800 rounded-xl w-full max-w-sm p-4 flex flex-col gap-4 shadow-xl border border-gray-600 mt-2">

                                 if (val !== qtyVal) setQtyVal(val);
                             }}
                             onKeyDown={e => e.key === 'Enter' && e.target.blur()}
                             className="w-16 h-12 bg-gray-900 border border-gray-600 rounded-lg text-white text-center text-2xl font-black outline-none focus:border-blue-500 transition-colors" 
                           />
                           <button onClick={()=>setQtyVal(Number(qtyVal)+1)} className="w-12 h-12 bg-green-600 hover:bg-green-500 rounded-lg font-bold text-2xl text-white shadow transition-colors">+</button>

                    <button 
                       onMouseEnter={() => {

                       }}
                       onTouchStart={() => {
                           const inp = document.querySelector('input[type="number"]');
                           if(inp && parseInt(inp.value) !== qtyVal) setQtyVal(parseInt(inp.value) || 0);
                       }}
                       onClick={actionFunc} 
                       className="w-full bg-blue-600 hover:bg-blue-500 text-white font-black text-lg py-4 rounded-xl shadow-[0_0_15px_rgba(37,99,235,0.4)] transition-all">

                    </button>

         );
      };

          {managingCard && <RenderModaleCarta actionFunc="{applyManageQty}" actionLabel="Gestisci" closeFunc="{setManagingCard}" qtyVal="{manageQty}" setQtyVal="{setManageQty}" setterState="{setManagingCard}" targetCard="{managingCard}"/>}
          
          {editingProxyCard && (

                 <div className="flex flex-col gap-2 mb-3 bg-gray-900 p-2 rounded border border-gray-700">
                    <div className="flex gap-2 overflow-x-auto pb-1 justify-center">
                      {ManaColors.map(m => (<button key={m.id} onClick={() => toggleMana(m.id)} className={`w-8 h-8 shrink-0 rounded-full flex items-center justify-center font-bold border-2 ${mana.includes(m.id) ? 'border-white scale-110' : 'border-transparent opacity-50'} ${m.color}`}>{m.label}</button>))}
                    </div>
                    <div className="flex items-center justify-center gap-2">
                       <select value={colorMatchType} onChange={e => setColorMatchType(e.target.value)} className="bg-gray-800 border border-gray-600 rounded p-1 text-white text-xs outline-none">
                          <option value="include">Contiene questi colori</option><option value="exact">Esattamente questi colori</option>
                       </select>
                       <label className="flex items-center gap-1 text-xs text-purple-300 font-bold bg-purple-900/30 px-2 py-1 rounded border border-purple-700 cursor-pointer">
                          <input type="checkbox" checked={isMulticolorOnly} onChange={e=>setIsMulticolorOnly(e.target.checked)} className="accent-purple-500" /> Solo Multi
                       </label>
                    </div>
                 </div>

                 <div className="grid grid-cols-2 gap-2 mb-3">
                   <select value={superType} onChange={e => setSuperType(e.target.value)} className="bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm outline-none"><option value="">Supertipo...</option><option value="legendary">Legendary</option><option value="basic">Basic</option><option value="snow">Snow</option></select>
                   <select value={rarity} onChange={e => setRarity(e.target.value)} className="bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm outline-none"><option value="">Rarità...</option><option value="c">Comune</option><option value="u">Non Comune</option><option value="r">Rara</option><option value="m">Mitica</option></select>
                   <select value={cardType} onChange={e => setCardType(e.target.value)} className="bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm outline-none"><option value="">Tipo 1...</option><option value="creature">Creatura</option><option value="artifact">Artefatto</option><option value="enchantment">Incantesimo</option><option value="instant">Istantaneo</option><option value="sorcery">Stregoneria</option><option value="land">Terra</option><option value="planeswalker">Planeswalker</option></select>
                   <select value={cardType2} onChange={e => setCardType2(e.target.value)} className="bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm outline-none"><option value="">Tipo 2...</option><option value="creature">Creatura</option><option value="artifact">Artefatto</option><option value="enchantment">Incantesimo</option><option value="land">Terra</option></select>
                   <input type="text" placeholder="Sottotipo (Goblin)" value={subType} onChange={e => setSubType(e.target.value)} className="col-span-2 bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm outline-none" />
                 </div>
                 
                 <div className="flex gap-2 mb-4 items-center">
                   <span className="text-gray-300 text-sm font-bold">Costo:</span>
                   <select value={cmcOp} onChange={e => setCmcOp(e.target.value)} className="bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm font-bold outline-none"><option value="=">=</option><option value=">">&gt;</option><option value="<">&lt;</option></select>
